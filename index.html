  if (s.kind === 't1') return '<div class="small">Teil 1 · Tarjeta</div><div class="w">' + esc(c[0]) + '</div><p class="small">Haz una pregunta con esta palabra y contéstala.</p>' + (s.show ? '<div class="exs" style="text-align:left">' + exRow(c[1] + ' = ' + c[3]) + exRow(c[2] + ' = ' + c[4]) + '</div>' : '') + '<div class="row" style="justify-content:center"><button class="btn sm' + (s.show ? ' ghost' : '') + '" data-act="spcshow" data-id="' + id + '">' + (s.show ? 'Ocultar' : 'Ver ejemplo') + '</button><button class="btn sm ghost" data-act="spcnext" data-id="' + id + '">Otra tarjeta</button></div>';
  return '<div class="small">Teil 2 · Tarjeta</div><div class="w" style="font-size:24px">' + esc(c.q) + '</div><div class="chips" style="justify-content:center;margin:8px 0">' + c.p.map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div><p class="small">Habla 1–2 minutos usando las cuatro ideas. Graba tu voz en el móvil o habla en voz alta.</p>' +
    (s.show ? '<div class="txt" style="text-align:left"><p class="para" data-act="sayi" data-say="' + esc(c.a) + '">' + esc(c.a) + '</p>' + (c.es ? '<p class="small">' + esc(c.es) + '</p>' : '') + '</div>' : '') + '<div class="row" style="justify-content:center"><button class="btn sm' + (s.show ? ' ghost' : '') + '" data-act="spcshow" data-id="' + id + '">' + (s.show ? 'Ocultar' : 'Ver respuesta modelo') + '</button><button class="btn sm ghost" data-act="spcnext" data-id="' + id + '">Otra tarjeta</button></div>';
}

/* ---------- router ---------- */
function go(h) { if (location.hash === h) route(); else location.hash = h; }
function route() {
  AUD.stop(); DICT.stop(); const h = (location.hash || '#inicio').slice(1); let m;
  resetReg(); PS = (h.indexOf('practica-') === 0 || h.indexOf('test-') === 0) ? PS : null; FC = null;
  if ((m = h.match(/^modulo-(m\d+)$/))) return vModule(m[1]);
  if ((m = h.match(/^leccion-(m\d+-\d+)$/))) return vLesson(m[1], 'learn');
  if ((m = h.match(/^palabras-(m\d+-\d+)$/))) return vWords(m[1]);
  if ((m = h.match(/^practica-(m\d+-\d+)$/))) return startPractice('les', m[1]);
  if (h === 'test-nivel') return startPractice('nivel');
  if ((m = h.match(/^test-(m\d+)$/))) return startPractice('test', m[1]);
  const R = {instalar: vInstall, logros: vLogros, inicio: vHome, curso: vCourse, repaso: vReview, examen: vExam, mas: vMore, ajustes: vSettings, verbos: vVerbs, diccionario: vDict, tutor: vTutor, errores: vMistakes, articulos: vArticles, perfekt: vPerfekt,
    chuleta: () => vExtra('chuleta', 'Chuleta'), 'falsos-amigos': () => vExtra('falsos', 'Falsos amigos'), metodo: () => vExtra('metodo', 'Método')};
  (R[h] || vHome)();
}

/* ---------- events ---------- */
const ACT = {
  sayi: a => AUD.say(a.dataset.say, 'de', {el: a}),
  sayt: a => AUD.say(a.dataset.say, 'de', {el: a}),
  sayes: a => AUD.say(a.dataset.say, 'es', {el: a}),
  stopa: () => AUD.stop(),
  reades: () => { const r = $('.learn'); if (r) AUD.seq(readLines(r), {scroll: true}); },
  dlg: a => { const id = a.dataset.id; const rows = REG.dlg[id] || []; AUD.seq(rows.map((r, i) => ({text: strip(r.de), lang: 'de', sp: r.s, el: document.getElementById(id + '-' + i)})), {slow: !!a.dataset.slow}); },
  tr: a => { const el = document.getElementById(a.dataset.id); if (el) el.classList.toggle('show-tr'); },
  trw: a => a.parentElement.classList.toggle('show-tr'),
  mc: a => { const k = a.dataset.k, st = REG.ex[k]; if (!st || st.done) return; const i = +a.dataset.i; const ok = i === 0; $$('#' + k + ' .opt').forEach(b => { b.disabled = true; if (+b.dataset.i === 0) b.classList.add('ok'); }); if (!ok) a.classList.add('bad'); answer(k, ok, strip(st.ex.o[i])); },
  tf: a => { const k = a.dataset.k, st = REG.ex[k]; if (!st || st.done) return; const v = a.dataset.v === '1'; const ok = v === st.ex.a; $$('#' + k + ' .opt').forEach(b => { b.disabled = true; if ((b.dataset.v === '1') === st.ex.a) b.classList.add('ok'); }); if (!ok) a.classList.add('bad'); answer(k, ok, v ? 'Richtig' : 'Falsch'); },
  chk: a => checkEx(a.dataset.k),
  kb: a => {
    const k = a.dataset.k; const root = k === 'pf' ? null : document.getElementById(k);
    const fits = x => x && !x.readOnly && (k === 'pf' ? x.id === 'pfin' : !!(root && root.contains(x)));
    let inp = fits(KB.last) ? KB.last : (k === 'pf' ? $('#pfin') : (root ? $('input:not([readonly]),textarea:not([readonly])', root) : null));
    if (!inp || inp.readOnly) return; const c = a.dataset.c;
    const s0 = inp.selectionStart != null ? inp.selectionStart : inp.value.length, e0 = inp.selectionEnd != null ? inp.selectionEnd : inp.value.length;
    inp.value = inp.value.slice(0, s0) + c + inp.value.slice(e0); try { inp.setSelectionRange(s0 + 1, s0 + 1); } catch (x) { /* */ }
    inp.focus(); inp.dispatchEvent(new Event('input', {bubbles: true}));
  },
  wd: a => { const k = a.dataset.k, st = REG.ex[k]; if (!st || st.done) return; const j = +a.dataset.j; if (a.dataset.from === 'p') st.ans.push(st.pool[j]); else st.ans.splice(j, 1); drawOrder(k); },
  mt: a => {
    const k = a.dataset.k, st = REG.ex[k]; if (!st || st.done || a.classList.contains('done')) return; const side = a.dataset.s, i = +a.dataset.i;
    if (side === 'L') { $$('#' + k + ' [data-s="L"]').forEach(b => b.classList.remove('sel')); a.classList.add('sel'); st.sel = i; AUD.say(strip(st.ex.pairs[i][0])); return; }
    if (st.sel == null) { toast('Primero toca una palabra de la izquierda.'); return; }
    const L = $('#' + k + ' [data-s="L"][data-i="' + st.sel + '"]');
    if (i === st.sel) { a.classList.add('done'); L.classList.remove('sel'); L.classList.add('done'); st.ok++; st.sel = null; if (st.ok === st.ex.pairs.length) answer(k, st.err <= 1, '', st.err ? ['Errores al unir: ' + st.err] : []); }
    else { st.err++; a.classList.add('err'); setTimeout(() => a.classList.remove('err'), 500); }
  },
  play: a => { const st = REG.ex[a.dataset.k]; if (!st) return; const ex = st.ex; AUD.say(ex.t === 'listenmc' ? ex.s : ex.a, 'de', {slow: !!a.dataset.slow}); },
  mic: a => {
    const k = a.dataset.k, st = REG.ex[k]; if (!st) return; const out = $('#' + k + '-h');
    if (a.classList.contains('on')) { DICT.stop(); return; }
    let heard = '';
    const ok = DICT.start({
      partial: t => { if (out) out.textContent = 'Oigo: ' + heard + ' ' + t; },
      final: t => { heard = (heard + ' ' + t).trim(); if (out) out.textContent = 'Oigo: ' + heard; },
      state: s => { a.classList.toggle('on', s === 'listening'); if (s === 'idle' && heard && out) { const tw = fold(st.ex.a).split(' '), hw = fold(heard).split(' '); const hit = tw.filter(w => hw.indexOf(w) >= 0).length; const pc = Math.round(hit / tw.length * 100); out.innerHTML = 'He entendido: «' + esc(heard) + '» · <b>' + pc + ' %</b> de las palabras. ' + (pc >= 80 ? '¡Muy bien pronunciado!' : 'Escucha otra vez y repite despacio.'); } }
    });
    if (!ok) toast('El micrófono no está disponible aquí. Repite en voz alta.');
  },
  spoken: a => { const k = a.dataset.k; DICT.stop(); answer(k, true, '', [], false); },
  next: () => { if (!PS) return; PS.idx++; renderPractice(true); },
  start: a => { S.set.start = a.dataset.v === 'a2' ? 'a2' : 'a1'; save(); toast(S.set.start === 'a2' ? 'Listo: empiezas con la Línea A2.' : 'Listo: empiezas desde el principio (A1).'); if (a.dataset.go) go(a.dataset.go); else route(); },
  install: () => INST.go(),
  instno: () => { S.set.instHide = 1; save(); const c = $('#instcard'); if (c) c.remove(); toast('Lo tienes siempre en «Más → Instalar».'); },
  restno: () => { S.set.restHide = 1; save(); const c = $('.inst.rest'); if (c) c.remove(); },
  instcopy: () => { copyText(JSON.stringify(S)).then(ok => { if (ok) toast('Progreso copiado. Ahora abre la app e instálala.'); }); },
  impaste: () => { try { navigator.clipboard.readText().then(t => { const a = $('#imp'); if (a) a.value = t; }, () => toast('Mantén el dedo en el recuadro y elige «Pegar».')); } catch (e) { toast('Mantén el dedo en el recuadro y elige «Pegar».'); } },
  quitp: () => { const p = practiceParent(); PS = null; go(p); flushFX(); },
  retry: () => startPractice('retry'),
  pmis: () => startPractice('mis'),
  why: a => aiWhy(a.dataset.k),
  override: a => { const k = a.dataset.k, st = REG.ex[k]; if (!st || !PS || st.mode !== 'practice') { a.remove(); return; } if (PS.bad[PS.bad.length - 1] === st.ex) { PS.bad.pop(); PS.ok++; const key = exKey(st.ex); const at = S.mis.indexOf(key); if (at >= 0) S.mis.splice(at, 1); save(); } a.textContent = 'De acuerdo, cuenta como correcta'; a.disabled = true; },
  can: a => { const m = a.dataset.m, i = +a.dataset.i; const L = S.can[m] = S.can[m] || []; const at = L.indexOf(i); if (at >= 0) L.splice(at, 1); else L.push(i); save(); vModule(m); },
  cards: a => startCards(a.dataset.f || ''),
  fcflip: () => { if (!FC) return; if (!FC.show) { FC.show = true; drawCard(false); if (S.set.auto && FC.dir === 'es') AUD.say(FC.q[FC.i].say); } },
  fcg: a => gradeCard(+a.dataset.g),
  fcdir: a => { S.set.dir = a.dataset.d; save(); vReview(); },
  art: a => { const v = ART.q[ART.i]; const ok = v.de.indexOf(a.dataset.a + ' ') === 0; if (ok) ART.ok++; else ART.bad.push(v); SFX.play(ok ? 'ok' : 'bad'); buzz(ok ? 14 : [30, 50, 30]); addXP(ok ? 3 : 1); drawArt(ok ? 'ok' : 'bad'); AUD.say(v.de); },
  artnext: () => { ART.i++; drawArt(); },
  artnew: () => vArticles(),
  pfaux: a => { PF.aux = a.dataset.a; $$('[data-act="pfaux"]').forEach(b => b.classList.toggle('on', b === a)); },
  pfchk: () => { const v = PF.q[PF.i]; const inp = $('#pfin'); const val = inp ? inp.value : ''; if (!PF.aux || !val.trim()) { toast('Elige hat o ist y escribe el participio.'); return; } const ok = PF.aux === v.aux && cmp(val, v.pp, true) > 0; if (ok) PF.ok++; else PF.bad.push(v); SFX.play(ok ? 'ok' : 'bad'); buzz(ok ? 14 : [30, 50, 30]); addXP(ok ? 10 : 2); drawPf({ok: ok, val: val}); AUD.say('er ' + v.aux + ' ' + v.pp); },
  pfnext: () => { PF.i++; PF.aux = ''; drawPf(); },
  pfnew: () => vPerfekt(),
  misclear: () => modal('<h2 style="margin-top:0">¿Vaciar la lista de errores?</h2><p>Los ejercicios no se borran, solo la lista de repaso.</p><div class="row"><button class="btn" data-act="misyes">Sí, vaciar</button><button class="btn ghost" data-act="mclose">Cancelar</button></div>'),
  misyes: () => { S.mis = []; save(); closeModal(); vMistakes(); },
  mclose: () => closeModal(),
  setv: a => { S.set[a.dataset.k] = +a.dataset.v; save(); applySettings(); vSettings(); },
  export: () => {
    const txt = JSON.stringify(S); const show = () => modal('<h2 style="margin-top:0">Tu copia de seguridad</h2><p class="small">Selecciona todo el texto, cópialo y guárdalo en una nota o un correo.</p><textarea class="tin" rows="6" readonly>' + esc(txt) + '</textarea><div class="row" style="margin-top:10px"><button class="btn" data-act="mclose">Cerrar</button></div>');
    try { navigator.clipboard.writeText(txt).then(() => toast('Copia guardada en el portapapeles. Pégala en una nota o un correo.'), show); } catch (e) { show(); }
  },
  import: () => modal('<h2 style="margin-top:0">Restaurar una copia</h2><p class="small">Pega aquí el texto de tu copia de seguridad. Sustituirá el progreso actual.</p><textarea class="tin" id="imp" rows="6"></textarea>' + (OFF ? '<div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="impaste">Pegar lo copiado</button></div>' : '') + '<div class="row" style="margin-top:10px"><button class="btn" data-act="impyes">Restaurar</button><button class="btn ghost" data-act="mclose">Cancelar</button></div>'),
  impyes: () => { try { const o = JSON.parse($('#imp').value); if (!o || typeof o !== 'object' || !o.les) throw new Error('x'); adopt(o); save(); applySettings(); closeModal(); toast('Progreso restaurado.'); go('#inicio'); } catch (e) { toast('Ese texto no es una copia válida.'); } },
  reset: () => modal('<h2 style="margin-top:0">¿Borrar todo tu progreso?</h2><p>Se borran lecciones, tarjetas, errores y racha. No se puede deshacer.</p><div class="row"><button class="btn" style="background:var(--bad);border-color:var(--bad);color:#fff" data-act="resetyes">Sí, borrar todo</button><button class="btn ghost" data-act="mclose">Cancelar</button></div>'),
  resetyes: () => { const keep = S.set; S = DEF(); S.set = keep; save(); closeModal(); toast('Progreso borrado.'); go('#inicio'); },
  scen: a => { TUT.scen = SCEN.find(s => s.id === a.dataset.id) || SCEN[0]; TUT.chat = []; vTutor(); },
  tsug: a => tutorSend(a.dataset.q),
  tsend: () => { const t = $('#tin'); if (t) { const v = t.value; t.value = ''; tutorSend(v); } },
  tnew: () => { TUT.chat = []; vTutor(); },
  tcopy: async () => {
    const sc = TUT.scen || SCEN[0]; const t = $('#tq'); const v = t ? t.value.trim() : '';
    let p = AI.sys((sc.p ? sc.p + '\n' : '') + lenaCtx(), 1) + '\n\n---\n\n';
    if (sc.id === 'corrige') p += v ? 'Corrige estas frases:\n' + v : 'Empieza tú: pídeme en una frase que te escriba frases en alemán y propón un tema sencillo.';
    else if (sc.first) p += 'Empieza tú la conversación con esta frase: ' + sc.first;
    else p += v || 'Preséntate en una frase y pregúntame qué quiero aprender hoy. Propón tres temas de mi nivel.';
    const ok = await copyText(p); const b = $('#tcopy-ok'); if (b) b.innerHTML = copiedHTML(ok);
  },
  tsay: a => { const m = a.closest('.msg'); if (!m) return; const clone = m.cloneNode(true); $$('.row', clone).forEach(x => x.remove()); const lines = clone.innerText.split(/\n+/).map(x => x.trim()).filter(Boolean); AUD.seq(lines.map(l => ({text: l.replace(/[*()]/g, ''), lang: langOf(l), el: m}))); },
  tmic: a => { const t = $('#tin'); if (a.classList.contains('on')) { DICT.stop(); return; } const base = t.value ? t.value + ' ' : ''; let fin = ''; const ok = DICT.start({partial: x => { t.value = base + fin + x; }, final: x => { fin += x + ' '; t.value = base + fin; }, state: s => a.classList.toggle('on', s === 'listening')}); if (!ok) toast('El micrófono no está disponible aquí.'); },
  corr: a => corrSend(a.dataset.id),
  model: a => { const el = $('#' + a.dataset.id + ' .model'); if (el) { el.classList.toggle('hide'); a.textContent = el.classList.contains('hide') ? 'Ver texto modelo' : 'Ocultar texto modelo'; } },
  spcshow: a => { const s = REG.spc[a.dataset.id]; s.show = !s.show; $('#' + a.dataset.id).innerHTML = spcInner(a.dataset.id); },
  spcnext: a => { const s = REG.spc[a.dataset.id]; s.i = (s.i + 1 + Math.floor(Math.random() * Math.max(1, s.data.length - 1))) % s.data.length; s.show = false; $('#' + a.dataset.id).innerHTML = spcInner(a.dataset.id); }
};
const KB = {last: null};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  const f = ACT[a.dataset.act]; if (f) { e.preventDefault(); f(a, e); }
});
document.addEventListener('pointerdown', e => { if (e.target.closest('.kbd button')) e.preventDefault(); });
document.addEventListener('focusin', e => { if (e.target.matches('input,textarea')) KB.last = e.target; });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.matches && t.matches('.gapin,input.tin')) { e.preventDefault(); if (t.id === 'pfin') { if ($('[data-act="pfchk"]')) ACT.pfchk(); else if ($('[data-act="pfnext"]')) ACT.pfnext(); } else { const k = t.dataset.k; const st = REG.ex[k]; if (st && st.done && PS) ACT.next(); else checkEx(k); } return; }
  if (e.key === 'Enter' && t.id === 'tin' && !e.shiftKey) { e.preventDefault(); ACT.tsend(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t.matches && t.matches('.de[role=button]')) { e.preventDefault(); AUD.say(t.dataset.say, 'de', {el: t}); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'vsearch') drawVerbs(t.value); else if (t.id === 'dsearch') drawDict(t.value);
  else if (t.dataset && t.dataset.corr) { const n = t.value.trim() ? t.value.trim().split(/\s+/).length : 0; const c = $('#' + t.dataset.corr + '-n'); if (c) c.textContent = n + ' palabra' + (n === 1 ? '' : 's'); }
  else if (t.id === 's-rate') { S.set.rate = +t.value; $('#ratev').textContent = Math.round(S.set.rate * 100) + ' %'; }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset || !t.dataset.set) return; const k = t.dataset.set;
  S.set[k] = t.type === 'checkbox' ? (t.checked ? 1 : 0) : (k === 'rate' ? +t.value : t.value); save(); applySettings();
});
$('#back').addEventListener('click', () => go(CUR.parent || '#inicio'));
$$('.tabs button').forEach(b => b.addEventListener('click', () => go('#' + b.dataset.tab)));
window.addEventListener('hashchange', route);

/* ---------- boot ---------- */
function start(d) {
  load(); newAch(true); applySettings(); AUD.init(); INST.init(); buildVoc();
  if (d && d.h && !location.hash) { try { history.replaceState(null, '', d.h); } catch (e) { /* */ } }
  route(); initCaps();
  window.__A2 = {md: md, parseEx: parseEx, lessonEx: lessonEx, VOC: VOC, K: K, cmp: cmp, fold: fold, solText: solText, state: () => S, reg: () => REG, ps: () => PS, act: ACT, checkEx: checkEx, readLines: readLines, inst: INST};
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({h: location.hash})); } catch (e) { /* */ }
}
const hot = window.claude && window.claude.hot;
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
}
</script>
