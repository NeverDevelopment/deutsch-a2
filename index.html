LES({t: 'Los verbos modales', de: 'Modalverben', min: 25,
goal: 'Aprenderás los verbos para decir lo que **puedes, tienes que, quieres, debes o te gustaría** hacer: **können, müssen, wollen, sollen, dürfen, möchten** (y **mögen**). Los usarás en todas las conversaciones.',
body: `
## Paso 1: Qué significa cada uno
| Modal | Significa | Ejemplo |
|---|---|---|
| [[können]] | poder (ser capaz) / saber hacer | [[Ich kann schwimmen.]] (Sé nadar.) |
| [[müssen]] | tener que | [[Ich muss arbeiten.]] (Tengo que trabajar.) |
| [[wollen]] | querer (decidido, directo) | [[Ich will Ärztin werden.]] (Quiero ser médica.) |
| [[möchten]] | quisiera, me gustaría (educado) | [[Ich möchte einen Kaffee.]] (Quisiera un café.) |
| [[dürfen]] | poder (tener permiso) | [[Darf ich hier parken?]] (¿Puedo aparcar aquí?) |
| [[sollen]] | deber (porque otra persona lo dice) | [[Der Arzt sagt, ich soll viel trinken.]] (El médico dice que debo beber mucho.) |
| [[mögen]] | gustar | [[Ich mag Schokolade.]] (Me gusta el chocolate.) |

## Paso 2: La conjugación: ich y er son iguales
Los modales tienen una particularidad: **ich** y **er/sie/es** son **iguales** y **no llevan terminación**. Además, muchos cambian la vocal en singular.

| | können | müssen | wollen | dürfen | sollen | möchten |
|---|---|---|---|---|---|---|
| ich | [[kann]] | [[muss]] | [[will]] | [[darf]] | [[soll]] | [[möchte]] |
| du | [[kannst]] | [[musst]] | [[willst]] | [[darfst]] | [[sollst]] | [[möchtest]] |
| er / sie / es | [[kann]] | [[muss]] | [[will]] | [[darf]] | [[soll]] | [[möchte]] |
| wir | können | müssen | wollen | dürfen | sollen | möchten |
| ihr | könnt | müsst | wollt | dürft | sollt | möchtet |
| sie / Sie | können | müssen | wollen | dürfen | sollen | möchten |

:::ojo ¡Nada de «er kannt»!
Con er/sie/es los modales **no** llevan -t: [[er kann]], [[sie muss]], [[es darf]]. Nunca ~~er kannt~~ ni ~~sie musst~~.
:::

## Paso 3: La estructura: modal en posición 2, infinitivo al final
Igual que los verbos separables, los modales forman una «pinza»: el **modal conjugado** va en la **posición 2** y el **otro verbo**, en **infinitivo**, va **al final**.

| Pos. 1 | Pos. 2 (modal) | … | Final (infinitivo) |
|---|---|---|---|
| Ich | [[kann]] | sehr gut | [[kochen]]. |
| Heute | [[muss]] | ich lange | [[arbeiten]]. |
| Wann | [[darfst]] | du heute Abend | [[ausgehen]]? |

## Paso 4: Las diferencias con el español
:::es Poder: können o dürfen
En español «poder» sirve para todo. En alemán:
- **können** = poder porque **eres capaz**: [[Ich kann Deutsch sprechen.]]
- **dürfen** = poder porque **te dan permiso**: [[Hier darf man nicht rauchen.]] (Aquí no se puede fumar.)
En el lenguaje de todos los días también se oye [[Kann ich…?]] para pedir permiso, pero [[Darf ich…?]] es más educado.
:::

:::es Querer: wollen o möchten
**wollen** es directo y fuerte: «quiero». **möchten** es educado: «quisiera, me gustaría». En una tienda, en un restaurante o con desconocidos, usa **siempre möchten**: [[Ich möchte ein Brötchen, bitte.]] Decir [[Ich will ein Brötchen!]] suena como un niño exigente.
:::

:::ojo La gran trampa: müssen nicht
- [[Du musst nicht kommen.]] = **No hace falta** que vengas. (No es obligatorio.)
- [[Du darfst nicht kommen.]] = **No puedes** venir. (Está prohibido.)
En español «no tienes que venir» puede sonar a prohibición, pero en alemán **musst nicht** solo significa «no es necesario». Para prohibir: **darf nicht**.
:::

## Paso 5: Modal sin otro verbo
A veces el infinitivo se sobreentiende y desaparece:
- [[Ich kann Deutsch.]] (Sé alemán.)
- [[Ich muss nach Hause.]] (Tengo que irme a casa.)
- [[Ich möchte einen Tee.]] (Quisiera un té.)

:::ejemplos
Kannst du mir helfen? = ¿Me puedes ayudar?
Ich muss morgen früh aufstehen. = Mañana tengo que levantarme temprano.
Wir wollen im Sommer nach Mexiko fliegen. = En verano queremos volar a México.
Möchten Sie etwas trinken? = ¿Quiere beber algo?
Darf ich das Fenster aufmachen? = ¿Puedo abrir la ventana?
Sie sollen bitte um 9 Uhr da sein. = Debe estar aquí a las 9, por favor (lo dice otra persona).
Mein Sohn mag keinen Fisch. = A mi hijo no le gusta el pescado.
Du musst das nicht heute machen. = No hace falta que lo hagas hoy.
:::

:::vocab Palabras de esta lección
können | er kann = poder, saber hacer
müssen | er muss = tener que
wollen | er will = querer
möchten | er möchte = quisiera, me gustaría
dürfen | er darf = poder (tener permiso)
sollen | er soll = deber (según otra persona)
mögen | er mag = gustar
schwimmen = nadar
parken = aparcar
rauchen = fumar
helfen | er hilft = ayudar
fliegen = volar
:::

:::quiz
gap: ___ du mir helfen? (können) || Kannst ## du kannst. En la pregunta, primero.
mc: En un café, ¿qué es más educado? || Ich möchte einen Tee, bitte. || Ich will einen Tee. ## En tiendas y restaurantes: möchte.
:::

:::resumen
- **können** (poder, saber), **müssen** (tener que), **wollen** (querer), **möchten** (quisiera), **dürfen** (tener permiso), **sollen** (deber según otro), **mögen** (gustar).
- **ich** = **er**, sin terminación: ich kann, er kann.
- Modal en **posición 2**, infinitivo **al final**.
- **musst nicht** = no hace falta · **darfst nicht** = está prohibido.
:::
`,

LES({t: 'El imperativo: dar instrucciones', de: 'Der Imperativ', min: 15,
goal: 'Podrás **dar instrucciones y hacer peticiones** (¡ven!, ¡espere!, ¡abrid!) de forma amable. Además entenderás las **instrucciones del examen**, que están todas en imperativo.',
body: `
## Paso 1: Tres formas, según a quién le hablas
| A quién | Cómo se forma | Ejemplo |
|---|---|---|
| **Sie** (usted/ustedes) | verbo + Sie | [[Kommen Sie bitte!]] (¡Venga, por favor!) |
| **du** (tú) | raíz del verbo, sin -st y sin «du» | [[Komm bitte!]] (¡Ven, por favor!) |
| **ihr** (vosotros/ustedes informal) | como el presente, sin «ihr» | [[Kommt bitte!]] (¡Venid, por favor!) |

## Paso 2: La forma de du, paso a paso
1. Toma la forma de presente con du: [[du kommst]].
2. Quita **du** y la terminación **-st**: [[Komm!]]

Más ejemplos: [[du machst]] → [[Mach!]] · [[du trinkst]] → [[Trink!]] · [[du wartest]] → [[Warte!]] (si la raíz termina en -t o -d, se queda la e).

:::ojo Los verbos que cambian e → i se quedan con la i
[[du sprichst]] → [[Sprich!]] · [[du gibst]] → [[Gib!]] · [[du nimmst]] → [[Nimm!]] · [[du isst]] → [[Iss!]] · [[du liest]] → [[Lies!]] · [[du hilfst]] → [[Hilf!]]

Pero los que cambian **a → ä pierden la diéresis**: [[du fährst]] → [[Fahr!]] · [[du schläfst]] → [[Schlaf!]]
:::

## Paso 3: Verbos separables y el verbo sein
- Separables: el prefijo va al final: [[Steh auf!]] (¡Levántate!) · [[Ruf mich an!]] (¡Llámame!) · [[Machen Sie bitte die Tür zu!]] (¡Cierre la puerta, por favor!)
- **sein** es irregular: [[Sei ruhig!]] (¡Cállate! / ¡Tranquilo!) · [[Seid leise!]] · [[Seien Sie bitte pünktlich!]] (¡Sea puntual, por favor!)

## Paso 4: Que suene amable
El imperativo puede sonar muy brusco. Los alemanes lo suavizan con palabritas:
- [[bitte]]: [[Warte bitte!]]
- [[mal]] (un momento, venga): [[Komm mal her!]] (¡Ven aquí un momento!)
- [[doch]] (anda, venga): [[Komm doch mit!]] (¡Anda, vente!)

Y para pedir algo muy educadamente, en vez del imperativo se usa una pregunta: [[Können Sie bitte langsamer sprechen?]] (¿Puede hablar más despacio, por favor?)

## Paso 5: Las instrucciones del examen
En el examen y en los libros verás frases como estas. ¡Todas son imperativos con Sie!

| Instrucción | Significa |
|---|---|
| [[Lesen Sie den Text.]] | Lea el texto. |
| [[Hören Sie zu.]] | Escuche. |
| [[Kreuzen Sie an.]] | Marque con una cruz. |
| [[Ergänzen Sie.]] | Complete. |
| [[Schreiben Sie eine E-Mail.]] | Escriba un correo. |
| [[Ordnen Sie zu.]] | Relacione. |
| [[Markieren Sie die richtige Lösung.]] | Marque la solución correcta. |

:::es
En español también tenemos tres formas: «ven» (tú), «venga» (usted), «venid / vengan». En alemán es más regular: la forma de **Sie** es casi igual que la pregunta, solo cambia la entonación: [[Kommen Sie?]] (¿Viene?) y [[Kommen Sie!]] (¡Venga!).
:::

:::ejemplos
Nehmen Sie bitte Platz! = ¡Siéntese, por favor!
Mach bitte das Licht aus! = ¡Apaga la luz, por favor!
Iss nicht so schnell! = ¡No comas tan rápido!
Fahr vorsichtig! = ¡Conduce con cuidado!
Sprechen Sie bitte lauter! = ¡Hable más alto, por favor!
Kinder, räumt bitte euer Zimmer auf! = ¡Niños, recoged vuestra habitación, por favor!
:::

:::vocab Palabras de esta lección
warten | er wartet = esperar
ruhig = tranquilo, silencioso
leise = bajito, en voz baja
laut = alto (volumen), ruidoso
vorsichtig = con cuidado
das Licht | die Lichter = la luz
der Platz | die Plätze = el sitio, la plaza
Platz nehmen = sentarse (formal)
ankreuzen | er kreuzt an = marcar con una cruz
ergänzen = completar
zuhören | er hört zu = escuchar (con atención)
die Lösung | die Lösungen = la solución
:::

:::quiz
mc: Imperativo de «du nimmst»: || Nimm! || Nehm! || Nimmst! ## e → i se mantiene: Nimm!
mc: Imperativo de «du fährst»: || Fahr! || Fähr! || Fährst! ## a → ä se pierde: Fahr!
:::

:::resumen
- **Sie**: [[Kommen Sie!]] · **du**: [[Komm!]] · **ihr**: [[Kommt!]]
- du: sin «du» y sin -st. e → i se queda (Nimm!); a → ä se va (Fahr!).
- Separables: [[Steh auf!]] · sein: [[Sei!]], [[Seid!]], [[Seien Sie!]]
- Suaviza con **bitte, mal, doch**.
:::
`,

mc: Imperativo de «du liest»: || Lies! || Les! || Liest! ## e → ie se mantiene: Lies!
mc: Imperativo de «du schläfst»: || Schlaf! || Schläf! || Schläfst! ## a → ä desaparece: Schlaf!
mc: Imperativo de «du gibst»: || Gib! || Geb! || Gibst! ## e → i se mantiene: Gib!

`});

MOD({id: 'm6', t: 'El acusativo', de: 'Der Akkusativ',
  desc: 'Tu primer «caso». Descubrirás por qué «der» a veces se convierte en «den», y aprenderás los pronombres mich, dich, ihn…, los posesivos (mein, dein, sein, ihr…) y las preposiciones que siempre van con acusativo.',
  can: ['Sé qué es el sujeto y qué es el objeto directo de una frase.', 'Uso den, einen, keinen con palabras masculinas en acusativo.', 'Uso los pronombres mich, dich, ihn, sie, es, uns, euch.', 'Distingo sein (de él) e ihr (de ella / de ellos) y uso bien los posesivos.', 'Uso für, ohne, durch, gegen y um.']});

LES({t: 'Nominativo y acusativo: ¿qué es un caso?', de: 'Nominativ und Akkusativ', min: 25,
goal: 'Entenderás de una vez **qué es un «caso»** y por qué el artículo **der** se convierte en **den**. Es más fácil de lo que parece: en el acusativo **solo cambia el masculino**.',
body: `
:::cuento
Imagina que las palabras de una frase son **actores en una obra de teatro**. Cada actor tiene un papel: uno es el que **hace** la acción (el protagonista) y otro es el que la **recibe**. En alemán, los actores **se cambian de ropa** según su papel. Esa «ropa» es el artículo. A cada papel con su ropa se le llama **caso**.
:::

## Paso 1: Dos papeles: el que hace y el que recibe
Mira esta frase: [[Der Mann kauft den Tisch.]] (El hombre compra la mesa.)
- **¿Quién** compra? El hombre. Es el **sujeto** → caso **nominativo** → [[m:der Mann]].
- **¿Qué** compra? La mesa. Es el **objeto directo** → caso **acusativo** → [[m:den Tisch]].

Para encontrar el acusativo, pregunta al verbo **«¿qué?»** o **«¿a quién?»**: en alemán [[Was?]] o [[Wen?]].

## Paso 2: ¡Solo cambia el masculino!
Esta es la mejor noticia de toda la gramática alemana:

| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| nominativo | [[m:der]] / [[m:ein]] / [[m:kein]] | [[f:die]] / [[f:eine]] | [[n:das]] / [[n:ein]] | [[p:die]] / [[p:keine]] |
| acusativo | [[m:==den==]] / [[m:==einen==]] / [[m:==keinen==]] | [[f:die]] / [[f:eine]] | [[n:das]] / [[n:ein]] | [[p:die]] / [[p:keine]] |

Femenino, neutro y plural **se quedan igual**. Solo el masculino añade **-n**: der → de**n**, ein → ein**en**, kein → kein**en**.

:::truco El señor que se arregla para salir
Imagina que el masculino es **un señor** que, cuando sale de casa (cuando hace de objeto), se pone una **corbata con forma de «n»**: de**n**, eine**n**, keine**n**. La señora, el niño y el grupo (femenino, neutro, plural) salen tal cual.
:::

## Paso 3: Verbos que llevan acusativo
La mayoría de los verbos con objeto directo llevan acusativo. Los más importantes:

| Verbo | Ejemplo |
|---|---|
| [[haben]] | [[Ich habe einen Bruder.]] |
| [[brauchen]] | [[Ich brauche einen Stift.]] |
| [[kaufen]] | [[Wir kaufen den Tisch.]] |
| [[suchen]] | [[Er sucht einen Job.]] |
| [[sehen]] | [[Siehst du den Bus?]] |
| [[nehmen]] | [[Ich nehme den Salat.]] |
| [[möchten]] | [[Ich möchte einen Kaffee.]] |
| [[essen]] / [[trinken]] | [[Sie trinkt einen Tee.]] |
| [[kennen]] | [[Kennst du den Film?]] |
| [[besuchen]] | [[Wir besuchen den Onkel.]] |
| [[es gibt]] | [[Hier gibt es einen Park.]] (Aquí hay un parque.) |

:::ojo Después de sein, nunca acusativo
El verbo **sein** (ser, estar) no tiene objeto: lo que va detrás es otra vez nominativo.
- [[Das ist ein Tisch.]] Nunca ~~Das ist einen Tisch~~.
- [[Er ist der Chef.]] Nunca ~~Er ist den Chef~~.
:::

:::nota es gibt = hay
La expresión [[es gibt]] significa «hay» y **siempre lleva acusativo**: [[Es gibt einen Supermarkt.]] (Hay un supermercado.) [[Gibt es hier eine Apotheke?]] (¿Hay una farmacia por aquí?)
:::

## Paso 4: Por qué el caso es tan útil
Como el artículo dice quién hace qué, el alemán puede cambiar el orden sin cambiar el significado:
- [[Der Hund sieht den Mann.]] = El perro ve al hombre.
- [[Den Mann sieht der Hund.]] = También: el perro ve al hombre (se resalta «al hombre»).

El **der** te dice quién es el que mira, aunque esté en otro sitio.

:::es ¡En español también tenemos casos!
Aunque no lo creas, el español usa casos en los pronombres: «**él** me ve» (sujeto) y «**lo** veo» (objeto). «**Yo** compro» y «**me** compran». También la «**a** personal»: «Veo **a** Juan». En alemán esa marca la lleva el artículo masculino: [[Ich sehe den Mann.]]
:::

:::ejemplos
Ich habe einen Sohn und eine Tochter. = Tengo un hijo y una hija.
Wir brauchen einen Kühlschrank. = Necesitamos una nevera.
Kennst du den neuen Kollegen? = ¿Conoces al nuevo compañero?
Ich nehme den Kuchen und einen Kaffee. = Tomo la tarta y un café.
Hast du keinen Hunger? = ¿No tienes hambre?
Gibt es hier einen Bahnhof? = ¿Hay una estación de tren por aquí?
Das Kind möchte ein Eis. = El niño quiere un helado.
:::

:::vocab Palabras de esta lección
der Sohn | die Söhne = el hijo
die Tochter | die Töchter = la hija
der Kühlschrank | die Kühlschränke = la nevera
der Stift | die Stifte = el bolígrafo, el lápiz
der Job | die Jobs = el trabajo, el empleo
der Kollege | die Kollegen = el compañero de trabajo
der Kuchen | die Kuchen = la tarta, el pastel
das Eis = el helado; el hielo
der Park | die Parks = el parque
der Bahnhof | die Bahnhöfe = la estación de tren
es gibt = hay
kennen = conocer
besuchen = visitar
:::

:::quiz
gap: Ich brauche ___ Stift. (un — der Stift) || einen ## Masculino en acusativo: einen.
gap: Ich brauche ___ Tasche. (una — die Tasche) || eine ## Femenino: no cambia.
:::

:::resumen
- **Nominativo** = el que hace (¿quién?). **Acusativo** = el que recibe (¿qué?, ¿a quién?).
- En acusativo **solo cambia el masculino**: der → **den**, ein → **einen**, kein → **keinen**.
- haben, brauchen, kaufen, möchten, es gibt… llevan acusativo. **sein** nunca.
:::
`,
ex: `
gap: Ich habe ___ Bruder. (un) || einen ## der Bruder → einen Bruder.
gap: Wir kaufen ___ Tisch. (la mesa — der Tisch) || den ## der → den.
gap: Sie möchte ___ Kaffee. (un — der Kaffee) || einen ## der Kaffee → einen Kaffee.
gap: Ich sehe ___ Frau. (la — die Frau) || die ## Femenino: no cambia.
gap: Er hat ___ Auto. (ningún — das Auto) || kein ## Neutro: no cambia.
gap: Hier gibt es ___ Supermarkt. (un) || einen ## es gibt + acusativo: einen Supermarkt.
gap: Ich habe ___ Hunger. (ningún — der Hunger) || keinen ## der Hunger → keinen Hunger.
mc: ¿Cuál es correcta? || Das ist ein Tisch. || Das ist einen Tisch. ## Después de sein: nominativo.
mc: ¿Qué palabra está en acusativo en «Der Lehrer fragt den Schüler»? || den Schüler || der Lehrer || fragt ## ¿A quién pregunta? Al alumno: den Schüler.
mc: ¿Cuál es correcta? || Kennst du den Mann? || Kennst du der Mann? || Kennst du dem Mann? ## kennen + acusativo: den Mann.
mc: ¿Qué artículos cambian en el acusativo? || solo los masculinos || todos || los femeninos y los neutros ## der → den, ein → einen. El resto se queda igual.
order: (Necesitamos una nevera nueva.) wir brauchen einen neuen Kühlschrank ## brauchen + acusativo masculino: einen.
write: ¿Hay un parque por aquí? || Gibt es hier einen Park? ## es gibt + acusativo.
speak: Ich nehme den Salat und einen Orangensaft. = Tomo la ensalada y un zumo de naranja.
`});

LES({t: 'Los pronombres: mich, dich, ihn…', de: 'Personalpronomen im Akkusativ', min: 20,
goal: 'Aprenderás a decir **me, te, lo, la, nos, os, los** en alemán: [[Ich liebe dich.]] (Te quiero.), [[Ich rufe ihn an.]] (Lo llamo.) Y verás que, para las cosas, el pronombre depende del género alemán.',
body: `
## Paso 1: La tabla
| Nominativo (sujeto) | Acusativo (objeto) | Español |
|---|---|---|
| ich | [[mich]] | me |
| du | [[dich]] | te |
| er | [[ihn]] | lo, le (a él) |
| sie | [[sie]] | la (a ella) |
| es | [[es]] | lo (cosa neutra) |
| wir | [[uns]] | nos |
| ihr | [[euch]] | os / los, las (a ustedes, informal) |
| sie | [[sie]] | los, las (a ellos) |
| Sie | [[Sie]] | lo, la, los (a usted, formal) |

:::truco Solo tres son nuevas de verdad
**sie, es, Sie** no cambian. **mich** y **dich** riman. **uns** y **euch** las conoces del curso. La única rara es **ihn** (a él): recuérdala con el **-n** del masculino, como **den** y **einen**.
:::

## Paso 2: Dónde van: detrás del verbo
En español el pronombre va **delante** del verbo: «te quiero», «lo veo». En alemán va **detrás** del verbo conjugado:
- [[Ich liebe dich.]] (Te quiero.)
- [[Ich sehe ihn.]] (Lo veo.)
- [[Kannst du mich hören?]] (¿Me oyes?)
- [[Wir besuchen euch morgen.]] (Os visitamos mañana.)

## Paso 3: Para las cosas manda el género alemán
En español decimos «la mesa → **la** compro». En alemán, como [[m:der Tisch]] es masculino, se dice **ihn**:
- [[Der Tisch ist schön. Ich kaufe ihn.]] (La mesa es bonita. **La** compro.)
- [[Die Jacke ist toll. Ich nehme sie.]] (La chaqueta es genial. **Me la** llevo.)
- [[Das Buch ist gut. Ich lese es.]] (El libro es bueno. **Lo** leo.)

:::ojo No traduzcas el género del español
Este es el error típico: pensar en «la mesa» y decir ~~Ich kaufe sie~~. Para elegir el pronombre, piensa siempre en el **artículo alemán**: der → **ihn**, die → **sie**, das → **es**, plural → **sie**.
:::

## Paso 4: Preguntar por la persona: wen?
- [[Wer ruft an?]] (¿Quién llama?) → sujeto (nominativo).
- [[Wen rufst du an?]] (¿A quién llamas?) → objeto (acusativo).

:::ejemplos
Ich vermisse dich. = Te echo de menos.
Kennst du ihn? – Ja, ich kenne ihn gut. = ¿Lo conoces? – Sí, lo conozco bien.
Rufst du mich heute Abend an? = ¿Me llamas esta noche?
Der Kaffee ist kalt. Ich trinke ihn nicht. = El café está frío. No me lo bebo.
Die Kinder sind im Garten. Siehst du sie? = Los niños están en el jardín. ¿Los ves?
Wir holen euch vom Bahnhof ab. = Os recogemos en la estación.
Ich verstehe Sie leider nicht. = Lo siento, no le entiendo.
:::

:::vocab Palabras de esta lección
lieben = querer, amar
vermissen = echar de menos
abholen | er holt ab = recoger (a alguien)
die Jacke | die Jacken = la chaqueta
toll = genial, estupendo
kalt = frío
warm = caliente, cálido
wen? = ¿a quién?
:::

:::quiz
gap: Ich liebe ___. (te) || dich ## du → dich.
mc: «Der Rock ist schön.» ¿Cómo dices «La compro»? || Ich kaufe ihn. || Ich kaufe sie. || Ich kaufe es. ## der Rock (la falda) es masculino: ihn.
:::

:::resumen
- mich, dich, **ihn**, sie, es, uns, euch, sie, Sie.
- El pronombre va **detrás** del verbo: [[Ich sehe dich.]]
- Para cosas: der → **ihn**, die → **sie**, das → **es**, plural → **sie**.
- **Wen?** = ¿a quién?
:::
`,
ex: `
gap: Kannst du ___ hören? (me) || mich ## ich → mich.
gap: Ich rufe ___ morgen an. (lo — a él) || ihn ## er → ihn.
gap: Wir besuchen ___ am Sonntag. (os) || euch ## ihr → euch.
gap: Holst du ___ ab? (nos) || uns ## wir → uns.
gap: Entschuldigung, ich verstehe ___ nicht. (le — usted) || Sie ## Sie no cambia.
gap: Der Salat ist lecker. Ich nehme ___. (der Salat) || ihn ## der Salat → ihn.
gap: Die Wohnung ist zu teuer. Wir nehmen ___ nicht. (die Wohnung) || sie ## die → sie.
gap: Das Auto ist neu. Ich fahre ___ gern. (das Auto) || es ## das → es.
mc: ¿Cuál es correcta? || Ich liebe dich. || Ich dich liebe. || Dich ich liebe. ## El pronombre va detrás del verbo.
mc: «¿A quién buscas?» || Wen suchst du? || Wer suchst du? || Wem suchst du? ## Objeto (acusativo): wen.
match: ich = mich || du = dich || er = ihn || wir = uns || ihr = euch ## Nominativo → acusativo.
order: (¿Me llamas mañana?) rufst du mich morgen an ## Pronombre detrás del verbo y prefijo «an» al final.
write: Te echo de menos. || Ich vermisse dich. ## vermissen + dich.
speak: Ich kenne ihn nicht, aber ich kenne sie. = No lo conozco a él, pero a ella sí.
`});

LES({t: 'Los posesivos: mein, dein, sein, ihr…', de: 'Possessivartikel', min: 25,
goal: 'Aprenderás a decir **mi, tu, su, nuestro…** y a resolver la gran duda de los hispanohablantes: el español dice siempre **«su»**, pero el alemán distingue **sein** (de él) e **ihr** (de ella).',
body: `
## Paso 1: Un posesivo para cada persona
| Persona | Posesivo | Español |
|---|---|---|
| ich | [[mein]] | mi |
| du | [[dein]] | tu |
| er / es | [[sein]] | su (de él / de algo masculino o neutro) |
| sie | [[ihr]] | su (de ella) |
| wir | [[unser]] | nuestro |
| ihr | [[euer]] | vuestro / su (de ustedes, informal) |
| sie | [[ihr]] | su (de ellos, de ellas) |
| Sie | [[Ihr]] | su (de usted, de ustedes formal) |

## Paso 2: El gran problema del «su»
En español «**su** coche» puede ser de él, de ella, de ellos o de usted. En alemán hay que elegir:
- [[sein Auto]] = el coche **de él**
- [[ihr Auto]] = el coche **de ella** (o **de ellos**)
- [[Ihr Auto]] = el coche **de usted** (con mayúscula)

:::truco Primero pregunta: ¿de quién es?
Para elegir el posesivo, **mira al dueño**, no a la cosa:
- Si el dueño es **él** → **sein**: [[Paul und sein Hund]]
- Si la dueña es **ella** → **ihr**: [[Anna und ihr Hund]]
Es justo al revés que en español, donde «su» no te dice nada del dueño.
:::

## Paso 3: Las terminaciones: igual que ein
Después de elegir el posesivo por el **dueño**, le pones la terminación según **la cosa** (su género y su caso). Las terminaciones son **exactamente las de ein / kein**:

| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| nominativo | [[m:mein Vater]] | [[f:mein==e== Mutter]] | [[n:mein Kind]] | [[p:mein==e== Eltern]] |
| acusativo | [[m:mein==en== Vater]] | [[f:mein==e== Mutter]] | [[n:mein Kind]] | [[p:mein==e== Eltern]] |

- Femenino y plural: **-e** → meine, deine, seine, ihre, unsere…
- Masculino en acusativo: **-en** → meinen, deinen, seinen, ihren…

:::ojo euer pierde una e
Cuando **euer** lleva terminación, desaparece la segunda e: [[eure Mutter]], [[euren Vater]] (nunca ~~euere~~).
:::

## Paso 4: Un ejemplo completo
Anna habla de su familia:
:::ejemplos
Das ist meine Familie. = Esta es mi familia.
Mein Mann heißt Jonas. = Mi marido se llama Jonas.
Seine Eltern wohnen in Bonn. = Sus padres (los de él) viven en Bonn.
Meine Schwester lebt in Lima. Ihr Sohn ist fünf. = Mi hermana vive en Lima. Su hijo (el de ella) tiene cinco años.
Wir haben eine Tochter. Unsere Tochter heißt Mila. = Tenemos una hija. Nuestra hija se llama Mila.
Ich liebe meinen Mann und meine Tochter. = Quiero a mi marido y a mi hija.
Ist das Ihr Schlüssel, Frau Roth? = ¿Es esta su llave, señora Roth?
:::

:::es
Además del «su», hay otra diferencia: en español decimos «**la** casa de mi madre» o «la casa de **ella**». En alemán es muy natural usar el posesivo: [[Das ist ihr Haus.]] Y para «el coche de Pedro» se dice [[Pedros Auto]] (con -s, sin apóstrofo) o [[das Auto von Pedro]].
:::

:::vocab La familia
die Familie | die Familien = la familia
die Eltern | (solo plural) = los padres
der Mann | die Männer = el marido; el hombre
die Frau | die Frauen = la esposa; la mujer
die Geschwister | (solo plural) = los hermanos (chicos y chicas)
der Onkel | die Onkel = el tío
die Tante | die Tanten = la tía
die Oma | die Omas = la abuela
der Opa | die Opas = el abuelo
die Großeltern | (solo plural) = los abuelos
der Cousin | die Cousins = el primo
die Cousine | die Cousinen = la prima
das Baby | die Babys = el bebé
:::

:::quiz
mc: «Laura y **su** perro» (el perro de Laura) || Laura und ihr Hund || Laura und sein Hund ## La dueña es ella: ihr.
gap: Ich besuche ___ Vater. (mi — acusativo) || meinen ## Masculino en acusativo: meinen.
:::

:::resumen
- **mein, dein, sein (él), ihr (ella), unser, euer, ihr (ellos), Ihr (usted)**.
- Primero elige por el **dueño**; después la terminación según **la cosa**.
- Terminaciones como **ein**: femenino y plural **-e**; masculino acusativo **-en**.
- **euer** → eure, euren.
:::
`,
ex: `
mc: «Pedro y su coche» (el coche de Pedro) || Pedro und sein Auto || Pedro und ihr Auto ## El dueño es él: sein.
mc: «María y su hermano» (de María) || María und ihr Bruder || María und sein Bruder ## La dueña es ella: ihr.
mc: «Los niños y su escuela» (la de ellos) || die Kinder und ihre Schule || die Kinder und seine Schule || die Kinder und ihr Schule ## Dueños: ellos → ihr. Schule es femenino → ihre.
gap: Das ist ___ Mutter. (mi) || meine ## die Mutter → meine.
gap: Wo ist ___ Handy? (tu) || dein ## das Handy → dein.
gap: ___ Eltern wohnen in Spanien. (nuestros) || Unsere ## Plural: unsere. Al principio, con mayúscula.
gap: Ich rufe ___ Bruder an. (mi — acusativo) || meinen ## der Bruder, acusativo → meinen.
gap: Ist das ___ Tasche, Frau Weber? (su — de usted) || Ihre ## Formal: Ihr con mayúscula; die Tasche → Ihre.
gap: Kinder, wo sind ___ Jacken? (vuestras) || eure ## euer + -e → eure.
gap: Tom besucht ___ Oma. (su — de Tom) || seine ## Dueño: Tom → sein. die Oma → seine.
match: ich = mein || du = dein || er = sein || sie (ella) = ihr || wir = unser ## Posesivo según la persona.
order: (Mi hija se llama Mila.) meine Tochter heißt Mila ## die Tochter → meine Tochter.
write: Su marido (el de ella) es médico. || Ihr Mann ist Arzt. ## La dueña es ella: ihr Mann.
speak: Das ist meine Familie: mein Mann, meine Tochter und unser Hund. = Esta es mi familia: mi marido, mi hija y nuestro perro.
`});

LES({t: 'Preposiciones con acusativo', de: 'Präpositionen mit Akkusativ', min: 20,
goal: 'Aprenderás las preposiciones que **siempre** van con acusativo: **für, ohne, durch, gegen, um** (y **bis**). Con un truco muy fácil para no olvidarlas.',
body: `
## Paso 1: Las cinco preposiciones
| Preposición | Significa | Ejemplo |
|---|---|---|
| [[durch]] | por, a través de | [[Wir gehen durch den Park.]] |
| [[ohne]] | sin | [[Ich trinke Kaffee ohne Zucker.]] |
| [[gegen]] | contra; hacia (hora aproximada) | [[Ich bin gegen den Plan.]] · [[Ich komme gegen acht.]] |
| [[für]] | para; por (gracias por) | [[Das Geschenk ist für dich.]] |
| [[um]] | alrededor de; a las (hora) | [[Wir sitzen um den Tisch.]] · [[um 8 Uhr]] |

Además, [[bis]] (hasta): [[bis Montag]], [[bis morgen]].

:::truco DOGFU, el perro karateca
Las iniciales forman **D-O-G-F-U**: **d**urch, **o**hne, **g**egen, **f**ür, **u**m. Imagina a un perro (*dog*) que hace kung-fu: **«¡DOGFU!»**. Cada vez que veas una de estas preposiciones, el perro te recuerda: **¡acusativo!**
:::

## Paso 2: Qué cambia
Como siempre en el acusativo, **solo el masculino** cambia:
- [[für ==den== Mann]], [[ohne ==meinen== Bruder]], [[durch ==einen== Wald]] (por un bosque)
- Femenino, neutro y plural: igual que siempre: [[für die Frau]], [[ohne das Auto]], [[für die Kinder]].
- Pronombres en acusativo: [[für mich]], [[ohne dich]], [[gegen ihn]], [[für uns]].

## Paso 3: für y «para / por»
- **für** = para (a quién va destinado algo): [[Das ist für dich.]] (Esto es para ti.)
- [[Danke für…]] = gracias por: [[Danke für die Einladung!]] (¡Gracias por la invitación!)
- **Pero cuidado**: «para + verbo» (para aprender) **no** se dice con für. Eso lo verás en el nivel B1. Por ahora: **für + persona o cosa**.

:::ojo Errores típicos
- ~~für der Kollege~~ → [[für den Kollegen]]
- ~~ohne mein Mann~~ → [[ohne meinen Mann]]
- ~~für ich~~ → [[für mich]]
:::

:::nota Formas contraídas
En la lengua hablada, a veces se juntan la preposición y el artículo **das**: [[fürs]] (für das), [[durchs]] (durch das), [[ums]] (um das). Ejemplo: [[Wir gehen durchs Zentrum.]] Basta con que las reconozcas.
:::

:::ejemplos
Ich mache das für meine Kinder. = Lo hago por mis hijos.
Kommst du ohne deinen Mann? = ¿Vienes sin tu marido?
Wir fahren durch die Stadt. = Vamos (en coche) por la ciudad.
Der Kurs beginnt um neun Uhr. = El curso empieza a las nueve.
Danke für deine Hilfe! = ¡Gracias por tu ayuda!
Ich habe nichts gegen ihn. = No tengo nada contra él.
Das Paket ist für Sie, Herr Braun. = El paquete es para usted, señor Braun.
:::

:::vocab Palabras de esta lección
durch = por, a través de
ohne = sin
gegen = contra; hacia (la hora)
für = para; por
um = alrededor de; a las (hora)
bis = hasta
das Geschenk | die Geschenke = el regalo
die Einladung | die Einladungen = la invitación
die Hilfe = la ayuda
der Zucker = el azúcar
der Wald | die Wälder = el bosque
das Paket | die Pakete = el paquete
der Plan | die Pläne = el plan
:::

:::quiz
gap: Das Geschenk ist für ___. (ti) || dich ## für + acusativo: dich.
gap: Ich komme ohne ___ Mann. (mi) || meinen ## ohne + acusativo masculino: meinen.
:::

:::resumen
- **DOGFU**: **d**urch, **o**hne, **g**egen, **f**ür, **u**m (+ bis) → siempre **acusativo**.
- Solo cambia el masculino: für **den**, ohne **meinen**. Pronombres: für **mich**, ohne **dich**.
- [[Danke für…]] = gracias por…
:::
`,
ex: `
gap: Das ist für ___ Bruder. (mi) || meinen ## für + acusativo: meinen Bruder.
gap: Ich trinke Tee ohne ___ Zucker. (el — der Zucker) || den ## ohne + acusativo: den.
gap: Wir gehen durch ___ Park. (el — der Park) || den ## durch + acusativo: den Park.
gap: Danke für ___ Hilfe! (tu) || deine ## die Hilfe → deine Hilfe.
gap: Ich komme gegen ___ Uhr. (8) || acht ## gegen + hora = más o menos a esa hora.

MOD({id: 'm7', t: 'Hablar del pasado', de: 'Perfekt und Präteritum',
  desc: 'Contar qué hiciste el fin de semana, en las vacaciones o en tu vida. En alemán hablado casi todo el pasado se dice con el Perfekt: haben o sein + participio al final.',
  can: ['Formo el Perfekt con haben y el participio de los verbos regulares (gemacht, gekauft).', 'Conozco los participios irregulares más usados (gegessen, geschrieben…).', 'Sé cuándo el Perfekt va con sein (gehen, fahren, aufstehen…).', 'Formo bien los participios de verbos separables, inseparables y en -ieren.', 'Uso war, hatte y los modales en pasado (konnte, musste…).', 'Puedo contar mi fin de semana o mis vacaciones.']});

LES({t: 'El Perfekt con haben', de: 'Das Perfekt mit haben', min: 25,
goal: 'Aprenderás a **contar el pasado** como lo hacen los alemanes al hablar: con **haben + participio**. Y una gran noticia: **no tendrás que elegir** entre «comí» y «he comido».',
body: `
## Paso 1: Una sola forma para casi todo el pasado
En español tenemos varias formas: «comí», «he comido», «comía». En alemán, **cuando se habla**, casi todo el pasado se cuenta con el **Perfekt**:
- [[Gestern habe ich Pizza gegessen.]] = Ayer **comí** pizza.
- [[Heute habe ich schon Pizza gegessen.]] = Hoy ya **he comido** pizza.

:::es Una buena noticia
El Perfekt se parece a nuestro «he comido»: **haber + participio** → **haben + Partizip**. Pero en alemán sirve **también para «comí»**. No tienes que pensar en la diferencia entre indefinido y perfecto: ¡una sola forma!
:::

## Paso 2: La estructura: otra vez la «pinza»
El Perfekt tiene dos partes:
1. **haben** conjugado, en la **posición 2**.
2. El **participio** (Partizip II), **al final** de la frase.

| Pos. 1 | Pos. 2 (haben) | … | Final (participio) |
|---|---|---|---|
| Ich | [[habe]] | gestern Pizza | [[gekocht]]. |
| Gestern | [[hat]] | er lange | [[gearbeitet]]. |
| Was | [[hast]] | du am Wochenende | [[gemacht]]? |
| | [[Habt]] | ihr den Film | [[gesehen]]? |

:::ojo El participio va AL FINAL
En español decimos «he comprado pan hoy en el supermercado». En alemán el participio espera hasta el final: [[Ich habe heute im Supermarkt Brot gekauft.]] Nunca ~~Ich habe gekauft Brot~~.
:::

## Paso 3: El participio de los verbos regulares: ge- … -t
Los verbos regulares forman el participio así: **ge- + raíz + -t**.

| Infinitivo | Raíz | Participio |
|---|---|---|
| [[machen]] | mach | [[==ge==mach==t==]] |
| [[kaufen]] | kauf | [[==ge==kauf==t==]] |
| [[spielen]] | spiel | [[==ge==spiel==t==]] |
| [[lernen]] | lern | [[==ge==lern==t==]] |
| [[kochen]] | koch | [[==ge==koch==t==]] |
| [[hören]] | hör | [[==ge==hör==t==]] |
| [[wohnen]] | wohn | [[==ge==wohn==t==]] |
| [[sagen]] | sag | [[==ge==sag==t==]] |

Si la raíz termina en **-t** o **-d** (o en -chn, -ffn), se añade una **e**: [[arbeiten]] → [[gearbeit==e==t]], [[warten]] → [[gewart==e==t]], [[kosten]] → [[gekost==e==t]], [[öffnen]] → [[geöffn==e==t]].

:::truco Un bocadillo
Imagina el participio regular como **un bocadillo**: el pan de arriba es **ge-**, el pan de abajo es **-t**, y en medio va la raíz del verbo: **ge**-kauf-**t**. ¡Siempre el mismo bocadillo!
:::

## Paso 4: Las palabras del pasado
Con el Perfekt se usan mucho estas expresiones de tiempo:
- [[gestern]] (ayer), [[vorgestern]] (anteayer), [[letzte Woche]] (la semana pasada), [[letztes Jahr]] (el año pasado), [[letzten Montag]] (el lunes pasado)
- [[vor zwei Tagen]] = **hace** dos días · [[vor einem Jahr]] = hace un año
- [[schon]] (ya) · [[noch nicht]] (todavía no) · [[früher]] (antes, en el pasado)

:::ojo «Hace» = vor
«Hace dos años» no se dice con «machen». Se dice [[vor zwei Jahren]]: **vor** + tiempo (en dativo plural, por eso «Jahren»). [[Ich habe vor drei Jahren Deutsch gelernt.]]
:::

:::dialogo El lunes en el trabajo
Nina: Hallo Carla! Was hast du am Wochenende gemacht? = ¡Hola, Carla! ¿Qué hiciste el fin de semana?
Carla: Am Samstag habe ich die Wohnung geputzt und eingekauft. = El sábado limpié el piso e hice la compra.
Nina: Und am Sonntag? = ¿Y el domingo?
Carla: Am Sonntag habe ich mit meinen Kindern im Park gespielt. Und am Abend haben wir Pizza gebacken. = El domingo jugué con mis hijos en el parque. Y por la noche hicimos pizza.
Nina: Schön! Ich habe leider nur gearbeitet. = ¡Qué bien! Yo, por desgracia, solo trabajé.
:::

:::ejemplos
Ich habe zwei Jahre in Madrid gewohnt. = Viví dos años en Madrid.
Wir haben gestern lange gewartet. = Ayer esperamos mucho.
Hast du schon das Brot gekauft? = ¿Ya has comprado el pan?
Das Ticket hat 30 Euro gekostet. = El billete costó 30 euros.
Er hat nichts gesagt. = Él no dijo nada.
Habt ihr schon gefrühstückt? = ¿Ya habéis desayunado?
:::

:::vocab Palabras de esta lección
das Perfekt = el pretérito perfecto alemán
das Partizip | die Partizipien = el participio
gestern = ayer
vorgestern = anteayer
letzte Woche = la semana pasada
letztes Jahr = el año pasado
vor zwei Tagen = hace dos días
schon = ya
früher = antes, en el pasado
putzen = limpiar
frühstücken = desayunar
backen | er backt = hornear, hacer (pan, pastel)
:::

:::quiz
gap: Ich habe gestern Fußball ___. (spielen) || gespielt ## ge + spiel + t.
order: (¿Qué hiciste ayer?) was hast du gestern gemacht ## hast en posición 2, gemacht al final.
:::

:::resumen
- En alemán hablado, el pasado se dice casi siempre con el **Perfekt**.
- **haben** (posición 2) + … + **participio** (al final).
- Participio regular: **ge- + raíz + -t** (gemacht). Raíz en -t/-d: **-et** (gearbeitet).
- «Hace dos días» = [[vor zwei Tagen]].
:::
`,
ex: `
gap: Ich habe am Samstag ___. (arbeiten) || gearbeitet ## Raíz en -t: ge + arbeit + et.
gap: Wir haben gestern Pizza ___. (kochen) || gekocht ## ge + koch + t.
gap: Was hast du im Supermarkt ___? (kaufen) || gekauft ## ge + kauf + t.
gap: Er ___ lange auf den Bus gewartet. (haben) || hat ## er hat.
gap: ___ ihr schon gefrühstückt? (haben) || Habt ## ihr habt; en la pregunta, primero.
gap: Ich habe drei Jahre in Valencia ___. (wohnen) || gewohnt ## ge + wohn + t.
mc: ¿Cuál es correcta? || Ich habe gestern Deutsch gelernt. || Ich habe gelernt gestern Deutsch. || Ich gestern habe Deutsch gelernt. ## El participio va al final.
mc: «Hace tres años» se dice… || vor drei Jahren || seit drei Jahren || drei Jahre her machen ## vor + tiempo = hace.
mc: Participio de [[warten]]: || gewartet || gewartt || gewarten ## Raíz en -t: -et.
mc: «Ayer comí pizza» y «Hoy he comido pizza». En alemán… || las dos usan el Perfekt || la primera usa otra forma || no se puede decir ## Al hablar, el Perfekt sirve para las dos.
order: (Ayer limpié la cocina.) gestern habe ich die Küche geputzt || ich habe gestern die Küche geputzt ## habe en posición 2, geputzt al final.
order: (¿Ya has comprado el pan?) hast du schon das Brot gekauft ## Pregunta de sí o no: hast primero.
write: El fin de semana jugué al fútbol. || Am Wochenende habe ich Fußball gespielt. / Ich habe am Wochenende Fußball gespielt. ## habe + gespielt al final.
speak: Am Sonntag habe ich lange geschlafen und dann gefrühstückt. = El domingo dormí mucho y luego desayuné.
`});

LES({t: 'Participios irregulares', de: 'Unregelmäßige Partizipien: ge- … -en', min: 25,
goal: 'Aprenderás los **participios irregulares** más importantes (gegessen, getrunken, geschrieben…) con un sistema de **grupos de sonido** que hace mucho más fácil memorizarlos.',
body: `
## Paso 1: El otro bocadillo: ge- … -en
Los verbos irregulares (los alemanes los llaman «fuertes») forman el participio con **ge- + raíz + -en**. Y muchas veces **cambia la vocal** de la raíz:
- [[essen]] → [[==ge==gess==en==]] (comido)
- [[trinken]] → [[==ge==tr==u==nk==en==]] (bebido)
- [[schreiben]] → [[==ge==schr==ie==b==en==]] (escrito)

:::es Esto ya lo conoces
En español también hay participios irregulares que se aprenden de memoria: **hecho**, **dicho**, **visto**, **escrito**, **puesto**. Nadie dice «hacido» ni «decido». En alemán pasa lo mismo, solo que hay más. La buena noticia: **siguen patrones de sonido**.
:::

## Paso 2: Aprenderlos por familias de sonido
Aprende los participios en grupos que **suenan igual**. Léelos en voz alta, como una canción:

### Familia 1: la vocal no cambia
| Infinitivo | Participio | Español |
|---|---|---|
| [[essen]] | [[gegessen]] | comido |
| [[lesen]] | [[gelesen]] | leído |
| [[sehen]] | [[gesehen]] | visto |
| [[geben]] | [[gegeben]] | dado |
| [[schlafen]] | [[geschlafen]] | dormido |
| [[waschen]] | [[gewaschen]] | lavado |
| [[tragen]] | [[getragen]] | llevado |
| [[fahren]] | [[gefahren]] | ido (en vehículo) |

### Familia 2: ei → ie
| Infinitivo | Participio | Español |
|---|---|---|
| [[schreiben]] | [[geschrieben]] | escrito |
| [[bleiben]] | [[geblieben]] | quedado |
| [[leihen]] | [[geliehen]] | prestado |

### Familia 3: i → u
| Infinitivo | Participio | Español |
|---|---|---|
| [[trinken]] | [[getrunken]] | bebido |
| [[finden]] | [[gefunden]] | encontrado |
| [[singen]] | [[gesungen]] | cantado |

### Familia 4: e → o (o i → o)
| Infinitivo | Participio | Español |
|---|---|---|
| [[sprechen]] | [[gesprochen]] | hablado |
| [[helfen]] | [[geholfen]] | ayudado |
| [[nehmen]] | [[genommen]] | tomado |
| [[treffen]] | [[getroffen]] | quedado con, encontrado |
| [[schwimmen]] | [[geschwommen]] | nadado |

### Familia 5: los que van por libre
| Infinitivo | Participio | Español |
|---|---|---|
| [[sitzen]] | [[gesessen]] | estado sentado |
| [[liegen]] | [[gelegen]] | estado tumbado |
| [[stehen]] | [[gestanden]] | estado de pie |
| [[tun]] | [[getan]] | hecho |
| [[rufen]] | [[gerufen]] | llamado |

## Paso 3: Los «mixtos»: cambian la vocal pero terminan en -t
Unos pocos verbos cambian la vocal **y** terminan en **-t**. Son muy usados:
- [[bringen]] → [[gebracht]] (traído)
- [[denken]] → [[gedacht]] (pensado)
- [[kennen]] → [[gekannt]] (conocido)
- [[wissen]] → [[gewusst]] (sabido)

## Paso 4: El participio de haben
El verbo **haben** también tiene participio: [[gehabt]]. [[Ich habe keine Zeit gehabt.]] (No tuve tiempo.) Aunque en la lección 7.5 verás que los alemanes prefieren decir [[Ich hatte keine Zeit.]]

:::truco Cómo memorizarlos de verdad
1. **Di las tres formas juntas**, como una canción: «trinken – trank – getrunken» o, más fácil, «trinken – getrunken».
2. **Pon cada participio en una frase sobre ti**: [[Ich habe heute Kaffee getrunken.]] Las frases personales se quedan mucho mejor.
3. Practica cada día cinco minutos con el **Entrenador del Perfekt** (en la pestaña Repaso).
:::

:::ejemplos
Ich habe heute zwei Kaffee getrunken. = Hoy me he tomado dos cafés.
Hast du meine Nachricht gelesen? = ¿Has leído mi mensaje?
Wir haben einen tollen Film gesehen. = Vimos una película genial.
Ich habe meine Schlüssel nicht gefunden. = No encontré mis llaves.
Sie hat mit dem Chef gesprochen. = Ella habló con el jefe.
Er hat mir Blumen gebracht. = Él me trajo flores.
Das habe ich nicht gewusst! = ¡Eso no lo sabía!
:::

:::vocab Participios irregulares imprescindibles
essen | hat gegessen = comer
trinken | hat getrunken = beber
schreiben | hat geschrieben = escribir
lesen | hat gelesen = leer
sehen | hat gesehen = ver
sprechen | hat gesprochen = hablar
nehmen | hat genommen = tomar, coger
finden | hat gefunden = encontrar
helfen | hat geholfen = ayudar
treffen | hat getroffen = quedar con, encontrarse
schlafen | hat geschlafen = dormir
bringen | hat gebracht = traer, llevar
denken | hat gedacht = pensar
wissen | hat gewusst = saber
die Nachricht | die Nachrichten = el mensaje; la noticia
:::

:::quiz
gap: Ich habe einen Brief ___. (schreiben) || geschrieben ## Familia ei → ie: geschrieben.
mc: Participio de [[trinken]]: || getrunken || getrinkt || getrinken ## Familia i → u: getrunken.
:::

:::resumen
- Verbos irregulares: **ge- + raíz + -en**, a menudo con **cambio de vocal**.
- Apréndelos por **familias de sonido**: igual (gegessen), ei → ie (geschrieben), i → u (getrunken), e → o (gesprochen).
- Mixtos: **gebracht, gedacht, gekannt, gewusst**. Y **gehabt**.
:::
`,
ex: `
gap: Wir haben im Restaurant ___. (essen) || gegessen ## La vocal no cambia: gegessen.
gap: Hast du den Film ___? (sehen) || gesehen ## gesehen.
gap: Ich habe meine Freundin im Café ___. (treffen) || getroffen ## Familia e → o: getroffen.
gap: Er hat mir viel ___. (helfen) || geholfen ## Familia e → o: geholfen.
gap: Sie hat ein Buch ___. (lesen) || gelesen ## gelesen.
gap: Ich habe heute schlecht ___. (schlafen) || geschlafen ## La vocal no cambia: geschlafen.
gap: Hast du meinen Schlüssel ___? (finden) || gefunden ## Familia i → u: gefunden.
gap: Wir haben Wein mit___. (bringen — traer) || gebracht ## Ojo: mitbringen → mitgebracht (mixto).
mc: Participio de [[sprechen]]: || gesprochen || gesprecht || gesprachen ## Familia e → o.
mc: Participio de [[wissen]]: || gewusst || gewissen || gewisst ## Mixto: gewusst.
mc: Participio de [[nehmen]]: || genommen || genehmt || genimmt ## genommen.
match: essen = gegessen || trinken = getrunken || schreiben = geschrieben || sprechen = gesprochen || denken = gedacht ## Cinco participios que usarás cada día.
write: ¿Has leído mi mensaje? || Hast du meine Nachricht gelesen? ## lesen → gelesen.

`});

LES({t: 'El Perfekt con sein', de: 'Das Perfekt mit sein', min: 25,
goal: 'Aprenderás qué verbos forman el Perfekt con **sein** en vez de haben. Es el error número uno de los hispanohablantes (porque en español siempre usamos «haber»), y aquí tienes un truco visual para no fallar.',
body: `
## Paso 1: Algunos verbos usan sein
La mayoría de los verbos forman el Perfekt con **haben**. Pero un grupo importante usa **sein**:
- [[Ich ==bin== nach Berlin gefahren.]] (Fui a Berlín.)
- [[Wir ==sind== um 7 Uhr aufgestanden.]] (Nos levantamos a las 7.)
- [[Er ==ist== zu Hause geblieben.]] (Se quedó en casa.)

## Paso 2: ¿Qué verbos van con sein?
Hay tres grupos:
1. **Movimiento de un sitio a otro** (de A a B): [[gehen]], [[kommen]], [[fahren]], [[fliegen]], [[laufen]], [[reisen]], [[schwimmen]], [[umziehen]] (mudarse), [[ankommen]], [[abfahren]], [[einsteigen]], [[aussteigen]].
2. **Cambio de estado** (algo empieza o termina de ser): [[aufstehen]] (levantarse), [[einschlafen]] (dormirse), [[aufwachen]] (despertarse), [[werden]] (llegar a ser), [[sterben]] (morir), [[wachsen]] (crecer).
3. **Tres verbos especiales**: [[sein]] (ser, estar), [[bleiben]] (quedarse) y [[passieren]] (pasar, ocurrir).

:::cuento La flecha y la mariposa
Imagina dos dibujos:
- **Una flecha** que va de un punto A a un punto B → **movimiento** → **sein**. «Fui a Berlín»: de casa a Berlín.
- **Una oruga que se convierte en mariposa** → **cambio de estado** → **sein**. «Me desperté»: de dormida a despierta.

Si el verbo no es una flecha ni una mariposa, usa **haben**. Y recuerda a los tres «especiales»: **sein, bleiben, passieren**.
:::

## Paso 3: La conjugación
| | Perfekt con sein |
|---|---|
| ich | [[bin gegangen]] |
| du | [[bist gekommen]] |
| er / sie / es | [[ist gefahren]] |
| wir | [[sind geflogen]] |
| ihr | [[seid aufgestanden]] |
| sie / Sie | [[sind geblieben]] |

## Paso 4: Los participios de los verbos con sein
| Infinitivo | Perfekt |
|---|---|
| [[gehen]] | [[ist gegangen]] |
| [[kommen]] | [[ist gekommen]] |
| [[fahren]] | [[ist gefahren]] |
| [[fliegen]] | [[ist geflogen]] |
| [[laufen]] | [[ist gelaufen]] |
| [[reisen]] | [[ist gereist]] |
| [[aufstehen]] | [[ist aufgestanden]] |
| [[einschlafen]] | [[ist eingeschlafen]] |
| [[umziehen]] | [[ist umgezogen]] |
| [[sein]] | [[ist gewesen]] |
| [[bleiben]] | [[ist geblieben]] |
| [[werden]] | [[ist geworden]] |
| [[sterben]] | [[ist gestorben]] |
| [[passieren]] | [[ist passiert]] |

:::es El error número uno
En español usamos **siempre** «haber»: «he ido», «he venido», «me he levantado». Por eso es facilísimo decir ~~Ich habe gegangen~~. ¡Ojo! Lo correcto es [[Ich bin gegangen.]] Cuando te pase, piensa: «¿hay una flecha?» → **sein**.
:::

:::ojo Pequeños detalles
- [[Was ist passiert?]] (¿Qué ha pasado?) Una frase muy útil, y va con **sein**.
- **schwimmen** y **laufen** casi siempre van con **sein** cuando hablas de una actividad: [[Ich bin im See geschwommen.]]
- **fahren** va con **haben** si llevas el coche (hay un objeto): [[Ich habe das Auto gefahren.]] Pero con destino: [[Ich bin nach Köln gefahren.]] No te preocupes demasiado: en el A2 casi siempre es **sein**.
:::

:::dialogo Las vacaciones
Paul: Wie war dein Urlaub? = ¿Qué tal tus vacaciones?
Sofía: Super! Ich bin nach Portugal geflogen. = ¡Genial! Volé a Portugal.
Paul: Toll! Bist du in Lissabon geblieben? = ¡Qué bien! ¿Te quedaste en Lisboa?
Sofía: Nein, ich bin mit dem Zug nach Porto gefahren. Dort bin ich jeden Tag im Meer geschwommen. = No, fui en tren a Oporto. Allí nadé en el mar todos los días.
Paul: Und wann bist du zurückgekommen? = ¿Y cuándo volviste?
Sofía: Gestern Abend. Ich bin sofort eingeschlafen! = Ayer por la noche. ¡Me dormí enseguida!
:::

:::vocab Verbos con sein
gehen | ist gegangen = ir (a pie)
kommen | ist gekommen = venir
fahren | ist gefahren = ir (en vehículo)
fliegen | ist geflogen = volar
laufen | ist gelaufen = correr, andar
reisen | ist gereist = viajar
umziehen | ist umgezogen = mudarse
aufstehen | ist aufgestanden = levantarse
einschlafen | ist eingeschlafen = dormirse
aufwachen | ist aufgewacht = despertarse
bleiben | ist geblieben = quedarse
werden | ist geworden = llegar a ser, ponerse
passieren | ist passiert = pasar, ocurrir
sterben | ist gestorben = morir
der Urlaub | die Urlaube = las vacaciones
:::

:::quiz
gap: Ich ___ nach Spanien geflogen. (sein / haben) || bin ## fliegen = movimiento de A a B → sein.
mc: ¿Cuál es correcta? || Wir sind zu Hause geblieben. || Wir haben zu Hause geblieben. ## bleiben es uno de los tres especiales: sein.
:::

:::resumen
- Con **sein**: **movimiento de A a B** (gehen, fahren, fliegen…), **cambio de estado** (aufstehen, einschlafen, werden…) y **sein, bleiben, passieren**.
- Todos los demás, con **haben**.
- ~~Ich habe gegangen~~ → [[Ich bin gegangen.]]
- [[Was ist passiert?]]
:::
`,
ex: `
gap: Ich ___ heute früh aufgestanden. (sein / haben) || bin ## aufstehen = cambio de estado → sein.
gap: Wir ___ gestern ins Kino gegangen. (sein / haben) || sind ## Movimiento → sein.
gap: Er ___ den ganzen Tag gearbeitet. (sein / haben) || hat ## arbeiten no es movimiento ni cambio → haben.
gap: ___ du schon mal in Deutschland gewesen? (sein / haben) || Bist ## sein → sein: bist… gewesen.
gap: Was ___ passiert? (sein / haben) || ist ## passieren → sein.
gap: Meine Eltern sind letzte Woche nach Mexiko ___. (fliegen) || geflogen ## fliegen → ist geflogen.
gap: Wir sind im Juli nach Leipzig ___. (umziehen — mudarse) || umgezogen ## umziehen → ist umgezogen.
gap: Das Baby ist um acht ___. (einschlafen) || eingeschlafen ## einschlafen → ist eingeschlafen.
mc: ¿Cuál es correcta? || Ich bin mit dem Bus gefahren. || Ich habe mit dem Bus gefahren. ## Movimiento con destino → sein.
mc: ¿Cuál es correcta? || Sie hat lange geschlafen. || Sie ist lange geschlafen. ## Dormir no es cambio de estado (dormirse sí): haben.
mc: «Me quedé en casa.» || Ich bin zu Hause geblieben. || Ich habe zu Hause geblieben. || Ich bin zu Hause bleiben. ## bleiben → ist geblieben.
order: (¿Cuándo volviste?) wann bist du zurückgekommen ## zurückkommen = movimiento → sein.
write: Fuimos a Berlín en tren. || Wir sind mit dem Zug nach Berlin gefahren. / Wir sind nach Berlin mit dem Zug gefahren. ## fahren con destino → sein.
speak: Ich bin um sieben aufgestanden und mit dem Fahrrad zur Arbeit gefahren. = Me levanté a las siete y fui en bici al trabajo.
`});

LES({t: 'Participios especiales', de: 'Partizip: trennbare, untrennbare Verben und -ieren', min: 20,
goal: 'Sabrás formar el participio de los **verbos separables** (eingekauft), de los **inseparables** (bezahlt, sin ge-) y de los verbos en **-ieren** (studiert). Con un esquema de tres preguntas no fallarás nunca.',
body: `
## Paso 1: Verbos separables: el ge- se mete en medio
En los verbos separables, el **ge-** va **entre el prefijo y el verbo**. Todo junto en una palabra:

| Infinitivo | Participio |
|---|---|
| [[einkaufen]] | [[ein==ge==kauft]] |
| [[aufräumen]] | [[auf==ge==räumt]] |
| [[anrufen]] | [[an==ge==rufen]] |
| [[aufstehen]] | [[auf==ge==standen]] |
| [[fernsehen]] | [[fern==ge==sehen]] |
| [[abholen]] | [[ab==ge==holt]] |
| [[einladen]] | [[ein==ge==laden]] |
| [[anfangen]] | [[an==ge==fangen]] |
| [[mitbringen]] | [[mit==ge==bracht]] |

:::cuento
Recuerda la **pinza** de los verbos separables: el prefijo y el verbo se separan. En el participio se **abren un poquito** para que quepa el **ge-** en medio: ein-**ge**-kauft.
:::

## Paso 2: Verbos inseparables: sin ge-
Los verbos con **be-, ver-, ent-, er-, ge-, zer-, emp-, miss-** **no llevan ge-** en el participio. ¡Ya tienen un prefijo y no quieren otro!

| Infinitivo | Participio |
|---|---|
| [[bezahlen]] | [[bezahlt]] |
| [[besuchen]] | [[besucht]] |
| [[bekommen]] | [[bekommen]] |
| [[verstehen]] | [[verstanden]] |
| [[vergessen]] | [[vergessen]] |
| [[verkaufen]] | [[verkauft]] |
| [[erzählen]] | [[erzählt]] |
| [[erklären]] | [[erklärt]] |
| [[gefallen]] | [[gefallen]] |
| [[empfehlen]] | [[empfohlen]] |

:::ojo bekommen no es «become»
[[bekommen]] significa **recibir**, no «convertirse». [[Ich habe ein Paket bekommen.]] (He recibido un paquete.)
:::

## Paso 3: Verbos en -ieren: sin ge- y con -t
Todos los verbos que terminan en **-ieren** (muchos vienen del latín y se parecen al español) forman el participio **sin ge-** y con **-t**:
- [[studieren]] → [[studiert]] · [[telefonieren]] → [[telefoniert]] · [[reparieren]] → [[repariert]] · [[fotografieren]] → [[fotografiert]] · [[funktionieren]] → [[funktioniert]] · [[organisieren]] → [[organisiert]] · [[passieren]] → [[passiert]]

:::truco Las tres preguntas
Antes de formar un participio, hazte tres preguntas:
1. ¿Termina en **-ieren**? → **sin ge-, con -t**: studiert.
2. ¿Empieza por **be-, ver-, er-, ent-, ge-, zer-, emp-, miss-**? → **sin ge-**: bezahlt, verstanden.
3. ¿Es **separable** (an, auf, ein, mit…)? → **ge- en medio**: eingekauft.
Si la respuesta es «no» a todo → participio normal: **ge-…-t** o **ge-…-en**.
:::

:::ejemplos
Ich habe heute eingekauft und die Küche aufgeräumt. = Hoy he hecho la compra y he recogido la cocina.
Hast du deine Mutter angerufen? = ¿Has llamado a tu madre?
Wir haben die Rechnung schon bezahlt. = Ya hemos pagado la factura.
Entschuldigung, ich habe das nicht verstanden. = Perdón, no lo he entendido.
Sie hat in Bogotá Medizin studiert. = Ella estudió medicina en Bogotá.
Der Mechaniker hat das Auto repariert. = El mecánico reparó el coche.
Was hast du zum Geburtstag bekommen? = ¿Qué te regalaron por tu cumpleaños?
:::

:::vocab Palabras de esta lección
bezahlen | hat bezahlt = pagar
besuchen | hat besucht = visitar
bekommen | hat bekommen = recibir
verstehen | hat verstanden = entender
vergessen | hat vergessen = olvidar
erzählen | hat erzählt = contar
erklären | hat erklärt = explicar
studieren | hat studiert = estudiar (en la universidad)
telefonieren | hat telefoniert = hablar por teléfono
reparieren | hat repariert = reparar
die Rechnung | die Rechnungen = la factura, la cuenta
das Paket | die Pakete = el paquete
:::

:::quiz
mc: Participio de [[einkaufen]]: || eingekauft || geeinkauft || einkauft ## Separable: ge en medio.
mc: Participio de [[bezahlen]]: || bezahlt || gebezahlt || bezahlen ## be- → sin ge-.
:::

:::resumen
- **Separables**: ge- en medio → eingekauft, angerufen, aufgestanden.
- **Inseparables** (be-, ver-, er-, ent-, ge-, zer-, emp-, miss-): **sin ge-** → bezahlt, verstanden.
- **-ieren**: **sin ge-, con -t** → studiert, telefoniert.
:::
`,
ex: `
gap: Ich habe gestern ___. (einkaufen) || eingekauft ## ein + ge + kauft.
gap: Hast du die Wohnung ___? (aufräumen) || aufgeräumt ## auf + ge + räumt.
gap: Wir haben die Kinder um vier ___. (abholen) || abgeholt ## ab + ge + holt.
gap: Er hat mich gestern ___. (anrufen) || angerufen ## an + ge + rufen.
gap: Ich habe die Rechnung schon ___. (bezahlen) || bezahlt ## be- → sin ge-.
gap: Entschuldigung, das habe ich nicht ___. (verstehen) || verstanden ## ver- → sin ge-.
gap: Sie hat zwei Jahre in Wien ___. (studieren) || studiert ## -ieren → sin ge-.
gap: Wir haben eine Stunde ___. (telefonieren) || telefoniert ## -ieren → sin ge-.
mc: Participio de [[vergessen]]: || vergessen || gevergessen || vergesst ## ver- → sin ge-; y es irregular: vergessen.
mc: Participio de [[fernsehen]]: || ferngesehen || gefernsehen || fernsehen ## Separable: fern + ge + sehen.
mc: Participio de [[erzählen]]: || erzählt || geerzählt || erzählen ## er- → sin ge-.
match: einkaufen = eingekauft || bezahlen = bezahlt || studieren = studiert || anrufen = angerufen || verstehen = verstanden ## Un ejemplo de cada tipo.
write: He recibido un paquete. || Ich habe ein Paket bekommen. ## bekommen → bekommen (sin ge-).
speak: Ich habe meine Freundin besucht und ihr alles erzählt. = Visité a mi amiga y le conté todo.
`});

LES({t: 'war, hatte y los modales en pasado', de: 'Präteritum: sein, haben, Modalverben', min: 20,
goal: 'Aprenderás las formas cortas del pasado que los alemanes usan **siempre** con **sein, haben** y los **modales**: [[Ich war krank.]] [[Ich hatte keine Zeit.]] [[Ich musste arbeiten.]]',
body: `
## Paso 1: Unos verbos que prefieren la forma corta
Con la mayoría de los verbos se usa el Perfekt. Pero con **sein**, **haben** y los **modales**, los alemanes usan casi siempre una forma más corta: el **Präteritum**.
- Mejor [[Ich war in Berlin.]] que «Ich bin in Berlin gewesen».
- Mejor [[Ich hatte Glück.]] que «Ich habe Glück gehabt».
- Mejor [[Ich musste arbeiten.]] que «Ich habe arbeiten müssen» (eso es muy complicado).

:::cuento Los verbos perezosos
Imagina que **sein**, **haben** y los **modales** son un poco **perezosos**: para hablar del pasado no quieren hacer el esfuerzo de la «pinza» (haben + participio). Prefieren una sola palabra: **war**, **hatte**, **musste**. ¡Y a ti te viene genial, porque es más corto!
:::

## Paso 2: sein → war y haben → hatte
| | sein | haben |
|---|---|---|
| ich | [[war]] | [[hatte]] |
| du | [[warst]] | [[hattest]] |
| er / sie / es | [[war]] | [[hatte]] |
| wir | [[waren]] | [[hatten]] |
| ihr | [[wart]] | [[hattet]] |
| sie / Sie | [[waren]] | [[hatten]] |

Fíjate: igual que en los modales del presente, **ich y er son iguales**.

:::es Una forma para cuatro
**war** sirve para «era», «estaba», «fui» y «estuve». [[Ich war müde.]] = Estaba cansada. [[Ich war in Madrid.]] = Estuve en Madrid. [[Das war super!]] = ¡Fue genial! El alemán no distingue ser/estar ni indefinido/imperfecto. ¡Una sola palabra!
:::

## Paso 3: Los modales en pasado
Se forman con **-te** y **sin diéresis**:

| | können | müssen | wollen | dürfen | sollen |
|---|---|---|---|---|---|
| ich | [[konnte]] | [[musste]] | [[wollte]] | [[durfte]] | [[sollte]] |
| du | [[konntest]] | [[musstest]] | [[wolltest]] | [[durftest]] | [[solltest]] |
| er / sie / es | [[konnte]] | [[musste]] | [[wollte]] | [[durfte]] | [[sollte]] |
| wir | [[konnten]] | [[mussten]] | [[wollten]] | [[durften]] | [[sollten]] |

- **möchten** no tiene pasado propio: se usa **wollte**. «Quería ir» = [[Ich wollte gehen.]]
- La estructura es la de siempre: modal en **posición 2**, infinitivo **al final**: [[Ich konnte gestern nicht kommen.]]

## Paso 4: es gab = había, hubo
El pasado de [[es gibt]] (hay) es [[es gab]] (había, hubo): [[Es gab ein Problem.]] [[Früher gab es hier einen Park.]]

:::nota El Präteritum en los textos escritos
En cuentos, novelas y noticias verás el Präteritum de muchos verbos: [[ging]] (fue), [[kam]] (vino), [[sagte]] (dijo), [[machte]] (hizo). **Tienes que reconocerlos al leer**, pero **para hablar usa el Perfekt**. Solo con sein, haben y los modales usas el Präteritum también al hablar.
:::

:::ejemplos
Wie war das Wochenende? = ¿Qué tal fue el fin de semana?
Ich war krank und musste im Bett bleiben. = Estaba enferma y tuve que quedarme en la cama.
Wir hatten keine Zeit. = No teníamos tiempo.
Als Kind wollte ich Pilotin werden. = De niña quería ser piloto.
Ich konnte die Aufgabe nicht lösen. = No pude resolver la tarea.
Früher durfte man im Zug rauchen. = Antes se podía fumar en el tren.
Gestern gab es keinen Bus. = Ayer no había autobús.
:::

:::vocab Palabras de esta lección
war = era, estaba, fue, estuvo
hatte = tenía, tuve
konnte = podía, pude
musste = tenía que, tuve que
wollte = quería, quise
durfte = podía (permiso)
sollte = debía
es gab = había, hubo
krank = enfermo
das Glück = la suerte; la felicidad
früher = antes, en el pasado
als Kind = de niño, de niña
:::

:::quiz
gap: Gestern ___ ich sehr müde. (sein) || war ## ich war.
gap: Wir ___ keine Zeit. (haben) || hatten ## wir hatten.
:::

:::resumen
- Con **sein, haben y modales** se usa la forma corta: **war, hatte, konnte, musste, wollte, durfte, sollte**.
- **ich = er**: ich war, er war; ich musste, er musste.
- Modales: **-te** y **sin diéresis**. möchten → **wollte**.
- [[es gibt]] → [[es gab]].
:::
`,
ex: `
gap: Wie ___ dein Urlaub? (sein) || war ## dein Urlaub = er → war.
gap: ___ du gestern krank? (sein) || Warst ## du warst.
gap: Ihr ___ letzte Woche in Rom. (sein) || wart ## ihr wart.
gap: Ich ___ Kopfschmerzen. (haben) || hatte ## ich hatte.
gap: Ich ___ gestern lange arbeiten. (müssen) || musste ## ich musste (sin diéresis).
gap: Sie ___ nicht kommen, sie war krank. (können) || konnte ## sie konnte.
gap: Wir ___ ins Kino gehen, aber es war zu spät. (wollen) || wollten ## wir wollten.
gap: Früher ___ es hier ein Kino. (es gibt) || gab ## es gibt → es gab.
mc: «Estuve en Madrid» se dice… || Ich war in Madrid. || Ich hatte in Madrid. || Ich bin in Madrid. ## war = fui, estuve, era, estaba.
mc: «Quería ir al médico» se dice… || Ich wollte zum Arzt gehen. || Ich möchtete zum Arzt gehen. || Ich wollte zum Arzt gegangen. ## möchten → wollte. El infinitivo al final.
mc: ¿Qué es más natural al hablar? || Ich hatte keine Zeit. || Ich habe keine Zeit gehabt. ## Con haben, los alemanes prefieren hatte.
order: (No pude venir ayer.) ich konnte gestern nicht kommen || gestern konnte ich nicht kommen ## konnte en posición 2, kommen al final.
write: Estaba enferma. || Ich war krank. ## war = estaba.
speak: Letzte Woche war ich krank und musste zu Hause bleiben. = La semana pasada estuve enferma y tuve que quedarme en casa.
`});

LES({t: '¿Qué es el dativo?', de: 'Der Dativ: Artikel', min: 25,
goal: 'Entenderás el **tercer papel** de la frase: la persona que **recibe** algo. Y aprenderás las formas del dativo con un truco de tres letras: **m – r – m – n**.',
body: `
:::cuento Vuelve el teatro
¿Recuerdas los actores que se cambian de ropa? Ya conoces dos papeles: el que **hace** (nominativo) y lo que **recibe la acción** (acusativo). Ahora entra un tercer actor: **la persona que recibe algo**, el **destinatario**. En «Le doy **el libro** a **mi madre**», el libro es el acusativo y **mi madre** es el **dativo**.
:::

## Paso 1: Tres papeles en una frase
[[Der Vater gibt dem Kind einen Apfel.]] (El padre le da una manzana al niño.)
- **¿Quién** da? → [[m:der Vater]] → **nominativo**
- **¿Qué** da? → [[m:einen Apfel]] → **acusativo**
- **¿A quién** se lo da? → [[n:dem Kind]] → **dativo**

La pregunta del dativo es **«¿a quién?»** en el sentido de «¿quién recibe?»: en alemán [[Wem?]]

## Paso 2: Las formas del dativo
Aquí **cambian todos**, no solo el masculino:

| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| nominativo | der / ein | die / eine | das / ein | die / – |
| acusativo | den / einen | die / eine | das / ein | die / – |
| **dativo** | [[m:de==m==]] / [[m:eine==m==]] | [[f:de==r==]] / [[f:eine==r==]] | [[n:de==m==]] / [[n:eine==m==]] | [[p:de==n==]] + **-n** |

Lo mismo con **kein** y los **posesivos**: [[keinem]], [[keiner]], [[meinem]], [[meiner]], [[meinen]]…

:::truco Las tres letras: m, r, n
Mira solo **la última letra** del artículo en dativo:
- **m** para el masculino y el neutro: de**m**, eine**m**, meine**m**. Piensa: «**m** de **m**ismo», masculino y neutro van **igual**.
- **r** para el femenino: de**r**, eine**r**, meine**r**. Piensa: «muje**r**».
- **n** para el plural: de**n**, meine**n**… ¡y el sustantivo también lleva **-n**!
:::

## Paso 3: El plural lleva doble n
En dativo plural, el **sustantivo** también añade **-n** (si no termina ya en -n o en -s):
- [[p:die Kinder]] → [[p:mit den Kinder==n==]]
- [[p:die Freunde]] → [[p:mit meinen Freunde==n==]]
- Pero: [[p:den Frauen]] (ya termina en -n), [[p:den Autos]] (termina en -s).

:::ojo La trampa del femenino
En dativo, el artículo femenino es **der**. ¡El mismo que el masculino en nominativo! No te asustes: [[Ich helfe der Frau.]] es dativo femenino (ayudo **a la** mujer). El verbo y el contexto te dirán qué caso es.
:::

## Paso 4: Algunas palabras masculinas añaden -n
Un grupito de palabras masculinas (sobre todo personas) añaden **-n** o **-en** en acusativo y dativo: [[m:der Herr]] → [[dem Herrn]], [[m:der Kollege]] → [[dem Kollegen]], [[m:der Junge]] → [[dem Jungen]], [[m:der Student]] → [[dem Studenten]], [[m:der Nachbar]] → [[dem Nachbarn]]. Por ejemplo, en una carta: [[Sehr geehrter Herr Braun]], pero [[Ich schreibe Herrn Braun.]]

:::es
En español el dativo existe: es el **objeto indirecto**, el que va con «**le**» o con «**a**»: «**Le** doy el libro **a** Pedro». En alemán no hay «a»: el artículo cambia de forma. [[Ich gebe dem Mann das Buch.]] = (Le) doy el libro **al** hombre.
:::

:::ejemplos
Ich schenke meiner Mutter Blumen. = Le regalo flores a mi madre.
Der Lehrer erklärt dem Schüler die Aufgabe. = El profesor le explica la tarea al alumno.
Wir zeigen den Gästen die Stadt. = Les enseñamos la ciudad a los invitados.
Sie gibt dem Baby die Flasche. = Ella le da el biberón al bebé.
Ich schreibe meinem Bruder eine Nachricht. = Le escribo un mensaje a mi hermano.
Das Auto gehört meinen Eltern. = El coche es de mis padres.
:::

:::vocab Palabras de esta lección
geben | er gibt = dar
schenken = regalar
zeigen = enseñar, mostrar
erklären = explicar
schicken = enviar
der Gast | die Gäste = el invitado, el huésped
der Nachbar | die Nachbarn = el vecino
die Nachbarin | die Nachbarinnen = la vecina
die Blume | die Blumen = la flor
die Aufgabe | die Aufgaben = la tarea, el ejercicio
der Schüler | die Schüler = el alumno
die Flasche | die Flaschen = la botella; el biberón
wem? = ¿a quién? (dativo)
:::

:::quiz
gap: Ich gebe ___ Mann das Buch. (el — der Mann) || dem ## Masculino en dativo: dem.
gap: Ich helfe ___ Frau. (la — die Frau) || der ## Femenino en dativo: der.
:::

:::resumen
- **Dativo** = el que **recibe** algo (objeto indirecto). Pregunta: **Wem?**
- Masculino y neutro: **dem / einem / meinem** (m). Femenino: **der / einer / meiner** (r). Plural: **den / meinen** + **-n** en el sustantivo.
- Algunas palabras masculinas añaden -n: dem Herrn, dem Kollegen.
:::
`,
ex: `
gap: Ich schenke ___ Vater eine Uhr. (mi — der Vater) || meinem ## Masculino dativo: meinem.
gap: Er erklärt ___ Kollegin das Problem. (la — die Kollegin) || der ## Femenino dativo: der.
gap: Wir geben ___ Kind ein Eis. (al — das Kind) || dem ## Neutro dativo: dem.
gap: Ich schreibe ___ Freundin eine Karte. (una — die Freundin) || einer ## Femenino dativo: einer.
gap: Sie zeigt ___ Kindern das Museum. (los — die Kinder) || den ## Plural dativo: den + Kindern.
gap: Das Fahrrad gehört ___ Sohn. (mi — der Sohn) || meinem ## gehören + dativo: meinem Sohn.
mc: ¿Qué palabra está en dativo? «Die Frau gibt dem Hund das Futter.» || dem Hund || die Frau || das Futter ## ¿Quién recibe la comida? El perro: dem Hund.
mc: Dativo plural de [[die Freunde]]: || den Freunden || den Freunde || dem Freunden ## Plural: den + -n en el sustantivo.
mc: ¿Cuál es correcta? || Ich helfe dem Nachbarn. || Ich helfe dem Nachbar. || Ich helfe den Nachbar. ## der Nachbar añade -n: dem Nachbarn.
match: der Mann = dem Mann || die Frau = der Frau || das Kind = dem Kind || die Kinder = den Kindern ## Nominativo → dativo.
order: (Le regalo flores a mi madre.) ich schenke meiner Mutter Blumen ## Dativo (persona) y luego acusativo (cosa).
write: Le doy el libro al profesor. || Ich gebe dem Lehrer das Buch. ## dem Lehrer (dativo) + das Buch (acusativo).
listen: Wir zeigen unseren Gästen die Stadt. = Les enseñamos la ciudad a nuestros invitados. ## unseren Gästen: dativo plural.
speak: Ich schreibe meiner Schwester eine Nachricht. = Le escribo un mensaje a mi hermana.
`});

LES({t: 'Pronombres en dativo: mir, dir, ihm…', de: 'Personalpronomen im Dativ', min: 20,
goal: 'Aprenderás **mir, dir, ihm, ihr…** y un montón de frases muy frecuentes que los usan: [[Wie geht es dir?]], [[Das gefällt mir.]], [[Es tut mir leid.]]',
body: `
## Paso 1: La tabla completa (nominativo, acusativo, dativo)
| Nominativo | Acusativo | Dativo | Español (dativo) |
|---|---|---|---|
| ich | mich | [[mir]] | me, a mí |
| du | dich | [[dir]] | te, a ti |
| er | ihn | [[ihm]] | le, a él |
| sie | sie | [[ihr]] | le, a ella |
| es | es | [[ihm]] | le |
| wir | uns | [[uns]] | nos |
| ihr | euch | [[euch]] | os / les (a ustedes, informal) |
| sie | sie | [[ihnen]] | les, a ellos |
| Sie | Sie | [[Ihnen]] | le, a usted |

:::truco Fíjate en las terminaciones
El dativo «suena» a **-m** y a **-r**, como los artículos: **ih==m==** (como de**m**), **ih==r==** y **mi==r==**, **di==r==** (como de**r**), **ihne==n==** (como de**n**). ¡Es el mismo sistema de la lección anterior!
:::

## Paso 2: Frases que ya conoces… y que llevan dativo
Muchas expresiones del día a día usan el dativo:

| Alemán | Español |
|---|---|
| [[Wie geht es dir?]] / [[Wie geht es Ihnen?]] | ¿Cómo estás? / ¿Cómo está? |
| [[Mir geht es gut.]] | Estoy bien. |
| [[Es tut mir leid.]] | Lo siento. |
| [[Das gefällt mir.]] | Me gusta. |
| [[Das schmeckt mir.]] | Me gusta (la comida). |
| [[Mir ist kalt.]] / [[Mir ist warm.]] | Tengo frío. / Tengo calor. |
| [[Mir ist schlecht.]] | Me encuentro mal (con náuseas). |
| [[Das ist mir egal.]] | Me da igual. |
| [[Kannst du mir helfen?]] | ¿Me puedes ayudar? |
| [[Gib mir bitte das Salz.]] | Dame la sal, por favor. |

:::es ¡El dativo es como «me gusta»!
En español no decimos «yo gusto el chocolate», sino «**me** gusta el chocolate»: la cosa es el sujeto y la persona es el **objeto indirecto**. En alemán, con [[gefallen]] pasa lo mismo: [[Die Stadt gefällt mir.]] = La ciudad **me** gusta. ¡Ese **mir** es el «me» de «me gusta»!

Y «tengo frío» se dice al estilo de «**me** da frío»: [[Mir ist kalt.]] Nunca ~~Ich bin kalt~~ (¡eso significaría «soy una persona fría»!).
:::

## Paso 3: Dónde va el pronombre
Igual que en el acusativo, el pronombre va **detrás del verbo**:
- [[Ich helfe dir.]] (Te ayudo.)
- [[Er schreibt ihr eine Nachricht.]] (Él le escribe un mensaje a ella.)
- [[Wir danken Ihnen.]] (Le damos las gracias.)

:::ojo Errores típicos
- ~~Ich helfe dich.~~ → [[Ich helfe dir.]] (helfen siempre lleva dativo; lo verás en la lección siguiente).
- ~~Ich bin kalt.~~ → [[Mir ist kalt.]]
- ~~Wie geht es du?~~ → [[Wie geht es dir?]]
:::

:::dialogo En casa de una amiga
Lisa: Möchtest du noch Kuchen? = ¿Quieres más tarta?
Marta: Ja, gern! Der Kuchen schmeckt mir sehr gut. = ¡Sí, con gusto! La tarta me gusta mucho.
Lisa: Danke! Ist dir kalt? Ich kann das Fenster zumachen. = ¡Gracias! ¿Tienes frío? Puedo cerrar la ventana.
Marta: Ja, ein bisschen. Danke! Deine Wohnung gefällt mir übrigens sehr. = Sí, un poco. ¡Gracias! Por cierto, tu piso me gusta mucho.
Lisa: Wirklich? Mir gefällt sie auch, aber sie ist ein bisschen klein. = ¿De verdad? A mí también me gusta, pero es un poco pequeño.
:::

:::vocab Palabras de esta lección

LES({t: 'Verbos con dativo', de: 'Verben mit Dativ · Dativ und Akkusativ', min: 25,
goal: 'Aprenderás los **verbos que siempre llevan dativo** (helfen, gefallen, gehören, danken…) y los verbos de **dar y regalar**, que llevan **dativo y acusativo** a la vez. Y sabrás en qué orden van.',
body: `
## Paso 1: Verbos que solo llevan dativo
Estos verbos tienen un solo objeto, y está en **dativo**. Hay que aprenderlos de memoria:

| Verbo | Ejemplo | Español |
|---|---|---|
| [[helfen]] | [[Ich helfe dir.]] | Te ayudo. |
| [[danken]] | [[Ich danke Ihnen.]] | Le doy las gracias. |
| [[gefallen]] | [[Der Film gefällt mir.]] | Me gusta la película. |
| [[gehören]] | [[Das Buch gehört mir.]] | El libro es mío. |
| [[schmecken]] | [[Die Suppe schmeckt mir.]] | Me gusta la sopa. |
| [[passen]] | [[Die Hose passt mir nicht.]] | El pantalón no me queda bien (de talla). |
| [[stehen]] | [[Die Farbe steht dir gut.]] | Ese color te queda bien. |
| [[gratulieren]] | [[Wir gratulieren dir!]] | ¡Te felicitamos! |
| [[antworten]] | [[Antworte mir bitte!]] | ¡Contéstame, por favor! |
| [[zuhören]] | [[Hör mir zu!]] | ¡Escúchame! |
| [[wehtun]] | [[Der Rücken tut mir weh.]] | Me duele la espalda. |
| [[fehlen]] | [[Du fehlst mir.]] | Te echo de menos. |

:::ojo helfen: el error más típico
En español «ayudar» lleva objeto directo: «**la** ayudo», «**lo** ayudo». Por eso es facilísimo decir ~~Ich helfe dich~~. En alemán **helfen siempre lleva dativo**: [[Ich helfe dir.]] [[Ich helfe meiner Mutter.]] [[Kann ich Ihnen helfen?]]
:::

:::truco Una frase para recordarlos
Memoriza esta frase con cinco verbos con dativo: [[Ich danke dir, du hilfst mir, das gefällt mir, und es gehört dir!]] (Te doy las gracias, me ayudas, me gusta, ¡y es tuyo!) Repítela tres veces en voz alta.
:::

## Paso 2: Verbos de «dar»: dativo + acusativo
Muchos verbos tienen **dos objetos**: una **persona** que recibe (dativo) y una **cosa** (acusativo):
[[geben]] (dar), [[schenken]] (regalar), [[zeigen]] (enseñar), [[bringen]] (traer), [[schicken]] (enviar), [[erklären]] (explicar), [[empfehlen]] (recomendar), [[leihen]] (prestar), [[kaufen]] (comprar a alguien), [[sagen]] (decir), [[wünschen]] (desear).

:::truco Persona = dativo, cosa = acusativo
Casi siempre: **la persona va en dativo** y **la cosa en acusativo**.
[[Ich schenke ==meiner Mutter== (dativo) ==einen Schal== (acusativo).]] = Le regalo una bufanda a mi madre.
:::

## Paso 3: ¿En qué orden?
1. **Dos sustantivos**: primero el **dativo**, después el **acusativo**: [[Ich gebe dem Kind den Ball.]]
2. **Un pronombre**: el **pronombre va primero**: [[Ich gebe ihm den Ball.]] · [[Ich gebe ihn dem Kind.]]
3. **Dos pronombres**: primero el **acusativo**, después el dativo: [[Ich gebe ihn ihm.]]

:::cuento
Piensa que los pronombres son **cortitos y rápidos**: siempre se cuelan los primeros. Si los dos son pronombres, el acusativo (la cosa) es el más rápido.
:::

:::ejemplos
Kannst du mir das Salz geben? = ¿Me puedes pasar la sal?
Ich zeige dir die Fotos. = Te enseño las fotos.
Der Arzt hat mir Tabletten gegeben. = El médico me dio pastillas.
Was schenkst du deinem Mann zum Geburtstag? = ¿Qué le regalas a tu marido por su cumpleaños?
Können Sie mir ein Restaurant empfehlen? = ¿Me puede recomendar un restaurante?
Ich wünsche dir alles Gute! = ¡Te deseo todo lo mejor!
Wem gehört der Schlüssel? – Er gehört mir. = ¿De quién es la llave? – Es mía.
:::

:::vocab Verbos con dativo
helfen | er hilft = ayudar (a alguien)
danken = dar las gracias
gehören = pertenecer, ser de
passen = quedar bien (talla); venir bien
stehen | es steht = quedar bien (ropa, color)
gratulieren = felicitar
antworten | er antwortet = contestar
zuhören | er hört zu = escuchar (a alguien)
wehtun | es tut weh = doler
fehlen = faltar; echar de menos (Du fehlst mir)
empfehlen | er empfiehlt = recomendar
leihen = prestar
wünschen = desear
der Schal | die Schals = la bufanda
die Tablette | die Tabletten = la pastilla
:::

:::quiz
gap: Kann ich ___ helfen? (le — usted) || Ihnen ## helfen + dativo: Ihnen.
mc: ¿Cuál es correcta? || Ich gebe dem Kind den Ball. || Ich gebe den Ball dem Kind dem. || Ich gebe das Kind den Ball. ## Dos sustantivos: dativo (dem Kind) + acusativo (den Ball).

:::resumen
- Solo dativo: **helfen, danken, gefallen, gehören, schmecken, passen, stehen, gratulieren, antworten, zuhören, wehtun, fehlen**.
- Dar, regalar, enseñar…: **persona en dativo + cosa en acusativo**.
- Orden: dos sustantivos → **dativo, acusativo**. Con pronombres → **el pronombre primero**.
- [[Ich helfe dir.]] Nunca «dich».
:::
`,

mc: «Ese color te queda bien.» || Die Farbe steht dir gut. || Die Farbe passt dich gut. || Die Farbe steht dich gut. ## Ropa/colores que quedan bien: stehen + dativo.

`});

LES({t: 'Preposiciones con dativo', de: 'Präpositionen mit Dativ', min: 25,
goal: 'Aprenderás las preposiciones que **siempre** llevan dativo: **aus, bei, mit, nach, seit, von, zu** (y gegenüber). Las usarás en casi cada frase: con el autobús, en casa de tu madre, desde hace un año, al médico…',
body: `
## Paso 1: La canción del dativo
Los alemanes aprenden estas preposiciones con una cancioncita. Te la enseñamos tal cual, porque es pegadiza:

:::ejemplos
Aus, bei, mit, nach, seit, von, zu – fährst immer mit dem Dativ du. = Aus, bei, mit, nach, seit, von, zu: siempre vas con el dativo.
:::

Además, [[gegenüber]] (enfrente de) y [[ab]] (a partir de) también llevan dativo.

## Paso 2: Qué significa cada una
| Preposición | Significa | Ejemplos |
|---|---|---|
| [[aus]] | de (origen), de dentro de | [[Ich komme aus Peru.]] · [[Er kommt aus dem Haus.]] |
| [[bei]] | en casa de, en (un sitio de trabajo), cerca de | [[Ich wohne bei meiner Tante.]] · [[Ich arbeite bei Siemens.]] · [[beim Arzt]] |
| [[mit]] | con; en (medio de transporte) | [[mit meiner Freundin]] · [[mit dem Bus]] |
| [[nach]] | después de; a (ciudades y países) | [[nach dem Essen]] · [[nach Berlin]] · [[nach Hause]] |
| [[seit]] | desde, desde hace | [[seit zwei Jahren]] · [[seit Montag]] |
| [[von]] | de (procedencia, de quién); desde | [[ein Geschenk von meiner Mutter]] · [[von 9 bis 17 Uhr]] |
| [[zu]] | a (personas, sitios, eventos) | [[zum Arzt]] · [[zur Schule]] · [[zu meiner Oma]] |
| [[gegenüber]] | enfrente de | [[gegenüber dem Bahnhof]] |

## Paso 3: Las formas contraídas
Algunas preposiciones se juntan con el artículo. ¡Se usan muchísimo!
- [[zu dem]] → [[zum]] · [[zu der]] → [[zur]]
- [[bei dem]] → [[beim]] · [[von dem]] → [[vom]]

Ejemplos: [[Ich gehe zum Arzt.]] [[Sie fährt zur Arbeit.]] [[Ich bin beim Friseur.]] (Estoy en la peluquería.) [[Ich komme gerade vom Supermarkt.]]

## Paso 4: seit = «desde hace», con presente
:::es Una diferencia muy importante
En español: «**Vivo** en Alemania **desde hace** tres años». En alemán es igual: **presente** + [[seit]]: [[Ich wohne seit drei Jahren in Deutschland.]]
No uses el Perfekt (~~Ich habe drei Jahre in Deutschland gewohnt~~ significa que **ya no** vives allí) ni «für» (~~für drei Jahre~~).
:::

## Paso 5: mit y los medios de transporte
Para decir cómo vas a un sitio: **mit + dativo**:
[[mit dem Bus]], [[mit dem Zug]], [[mit dem Auto]], [[mit dem Fahrrad]], [[mit der U-Bahn]], [[mit der Straßenbahn]] (tranvía). ¡Pero a pie es [[zu Fuß]]!

:::truco nach o zu
- [[nach]] + **ciudades y países** sin artículo: [[nach Madrid]], [[nach Spanien]]. Y la expresión fija [[nach Hause]] (a casa).
- [[zu]] + **personas y sitios** de la ciudad: [[zu Anna]], [[zum Bahnhof]], [[zur Post]].
¡Y no confundas [[nach Hause]] (a casa, con movimiento) con [[zu Hause]] (en casa, sin movimiento)! Lo verás con más detalle en el módulo 9.
:::

:::ojo Errores típicos
- ~~mit der Bus~~ → [[mit dem Bus]] (der Bus es masculino → dem)
- ~~Ich gehe zu Arzt.~~ → [[Ich gehe zum Arzt.]]
- ~~Ich wohne hier für zwei Jahre.~~ → [[Ich wohne seit zwei Jahren hier.]]
- ~~von mein Bruder~~ → [[von meinem Bruder]]
:::

:::ejemplos
Ich fahre mit dem Fahrrad zur Arbeit. = Voy en bici al trabajo.
Nach der Arbeit gehe ich zum Sport. = Después del trabajo voy a hacer deporte.
Wir wohnen seit 2022 in Frankfurt. = Vivimos en Fráncfort desde 2022.
Die Bäckerei ist gegenüber dem Bahnhof. = La panadería está enfrente de la estación.
Das ist ein Brief von meinem Vermieter. = Es una carta de mi casero.
Ich bin heute bei meiner Freundin. = Hoy estoy en casa de mi amiga.
Woher kommt der Zug? – Aus München. = ¿De dónde viene el tren? – De Múnich.
:::

:::vocab Palabras de esta lección
aus = de (origen), de dentro de
bei = en casa de; en (empresa); cerca de
mit = con; en (transporte)
nach = después de; a (ciudad, país)
seit = desde, desde hace
von = de, desde
zu = a (personas, sitios)
gegenüber = enfrente de
zu Fuß = a pie
die U-Bahn | die U-Bahnen = el metro
die Straßenbahn | die Straßenbahnen = el tranvía
der Friseur | die Friseure = el peluquero, la peluquería
der Vermieter | die Vermieter = el casero, el arrendador
:::

gap: Ich wohne ___ drei Jahren in Köln. (desde hace) || seit ## seit + presente.

:::resumen
- **aus, bei, mit, nach, seit, von, zu** (+ gegenüber, ab) → **siempre dativo**.
- Contracciones: **zum, zur, beim, vom**.
- **seit + presente** = desde hace: [[Ich lerne seit einem Jahr Deutsch.]]
- **mit dem** Bus / Zug / Auto, pero **zu Fuß**.
:::
`,
