--rule:light-dark(#e5e8ee,#262c36);--rule2:light-dark(#d5dae3,#323946);--card:light-dark(#f4f6f9,#161a21);--card2:light-dark(#eaeef3,#1f242d);
--go:light-dark(#16a34a,#22c55e);--go-d:light-dark(#0f7a37,#15803d);--go-ink:light-dark(#0f7a37,#4ade80);
--bad:light-dark(#e5484d,#ff6b70);--bad-d:light-dark(#b4282d,#c9353a);
--xp:light-dark(#f5a300,#ffc23d);--flame:light-dark(#f26b0f,#ff8a3d);--lvl:light-dark(#2f6bff,#6b9bff);
--m:light-dark(#1d5ad6,#8fb3ff);--f:light-dark(#d02a3e,#ff909c);--n:light-dark(#12804a,#63d695);--p:light-dark(#b25f00,#f2b45a);
--ok:var(--go-ink);--okbg:light-dark(#e9f9ef,#0f2a1a);--badbg:light-dark(#fff0f0,#2d1416);
--mark:light-dark(#fff2a8,#4d4100);--shade:light-dark(rgba(18,21,28,.08),rgba(0,0,0,.5));
--glass:light-dark(rgba(255,255,255,.82),rgba(20,24,31,.82));--glassline:light-dark(rgba(18,21,28,.07),rgba(255,255,255,.08));
--bubr:light-dark(#e8f0ff,#182540);
--fs:17px;--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Nunito','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--spring:cubic-bezier(.34,1.56,.64,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
@supports not (color:light-dark(#fff,#000)){:root{--bg:#fff;--ink:#12151c;--mut:#5a6170;--faint:#8b92a0;--rule:#e5e8ee;--rule2:#d5dae3;--card:#f4f6f9;--card2:#eaeef3;--go:#16a34a;--go-d:#0f7a37;--go-ink:#0f7a37;--bad:#e5484d;--bad-d:#b4282d;--xp:#f5a300;--flame:#f26b0f;--lvl:#2f6bff;--m:#1d5ad6;--f:#d02a3e;--n:#12804a;--p:#b25f00;--okbg:#e9f9ef;--badbg:#fff0f0;--mark:#fff2a8;--shade:rgba(18,21,28,.08);--glass:rgba(255,255,255,.82);--glassline:rgba(18,21,28,.07);--bubr:#e8f0ff}}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(72px + env(safe-area-inset-top))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.6 var(--font);font-feature-settings:'cv11','ss03';overflow-x:clip;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--lvl);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}

/* chrome */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);box-shadow:0 1px 0 var(--glassline)}
.top .back{width:44px;height:44px;border:0;background:none;border-radius:14px;display:grid;place-items:center}
.top .back:active{background:var(--card)}
.top .back svg.i{width:24px;height:24px;stroke-width:2.4}
.brand{display:flex;align-items:center;gap:10px;font:800 18px/1.2 var(--disp);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;padding-left:2px}
.brand .u{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(140deg,#16a34a,#0e9f9a);color:#fff;font:900 14px/1 var(--disp);flex:none;box-shadow:0 2px 0 #0f7a37}
#tr{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 11px;border-radius:99px;background:var(--card);font:800 15px/1 var(--disp);white-space:nowrap;text-decoration:none}
.pill svg.i{width:17px;height:17px;stroke-width:2.2}
.pill.fire{color:var(--flame);background:color-mix(in srgb,var(--flame) 12%,var(--bg))}
.pill.fire.cold{color:var(--faint);background:var(--card)}
.pill.lvl{color:var(--lvl);background:color-mix(in srgb,var(--lvl) 11%,var(--bg))}
main{display:block;max-width:760px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-right)) calc(112px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
main.in>*{animation:vin .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabs{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;height:68px;padding:6px;border-radius:28px;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);box-shadow:0 14px 34px -14px rgba(0,0,0,.35),inset 0 0 0 1px var(--glassline)}
.tabs button{position:relative;border:0;background:none;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 11.5px/1 var(--disp);color:var(--faint);transition:background .2s,color .2s}
.tabs button svg.i{width:23px;height:23px;transition:transform .25s var(--spring)}
.tabs button.on{color:var(--go-ink);background:color-mix(in srgb,var(--go) 13%,transparent)}
.tabs button.on svg.i{stroke-width:2.4;transform:translateY(-1px) scale(1.06)}
.tabs button .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--flame);color:#fff;font:900 11px/18px var(--disp);box-shadow:0 0 0 2px var(--bg)}
body.focus .tabs{display:none}
body.focus main{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
@media(min-width:900px){
 .tabs{top:calc(74px + env(safe-area-inset-top));bottom:auto;left:16px;right:auto;width:86px;height:auto;grid-template-columns:1fr;grid-auto-rows:70px;gap:4px}
 main{padding-left:max(132px,calc((100vw - 760px)/2));padding-right:32px;max-width:none;padding-bottom:64px}
 main>*{max-width:760px}
 body.focus .tabs{display:grid}
}

/* type */
h1,h2,h3,h4{line-height:1.15;margin:0;letter-spacing:-.015em;font-family:var(--disp);font-weight:900}
h1{font-size:clamp(30px,7.4vw,38px);text-wrap:balance}
h2{font-size:23px;margin:32px 0 12px;font-weight:800}
.learn h3{font-size:23px;font-weight:800;margin:40px 0 10px;padding-top:24px;border-top:2px dashed var(--rule)}
.learn h3:first-child{border-top:0;padding-top:0;margin-top:8px}
.learn h4{font-size:19px;font-weight:800;margin:24px 0 6px}
.learn p{margin:12px 0;max-width:66ch}
.learn ul,.learn ol{margin:10px 0 14px;padding-left:22px;max-width:66ch}
.learn li{margin:6px 0;padding-left:2px}
.learn li::marker{color:var(--faint);font-weight:700}
.sub{color:var(--mut);font-size:15.5px;line-height:1.5}
.small{font-size:14px;color:var(--mut);line-height:1.45}
mark{background:var(--mark);color:inherit;border-radius:5px;padding:0 3px}
s.no{color:var(--bad);text-decoration-thickness:2px}
.de{font-weight:600;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-decoration-color:var(--faint);text-underline-offset:.24em;cursor:pointer;border-radius:5px}
.de:hover{background:var(--card)}
.gm{color:var(--m)}.gf{color:var(--f)}.gn{color:var(--n)}.gp{color:var(--p)}
.speaking,.reading{background:var(--mark)!important;box-shadow:0 0 0 4px var(--mark);border-radius:6px}
.lnk{color:var(--lvl);font-weight:700;text-decoration:none}
.lnk:hover{text-decoration:underline}

/* buttons, chips: tactile 3D */
.btn{--b:var(--go);--bs:var(--go-d);--bi:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;border:0;background:var(--b);color:var(--bi);font:800 17px/1.1 var(--disp);letter-spacing:.005em;text-decoration:none;white-space:nowrap;box-shadow:0 4px 0 var(--bs);transform:translateY(0);transition:transform .09s ease,box-shadow .09s ease,filter .15s;margin-bottom:4px}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bs)}
.btn.ghost{--b:var(--bg);--bs:var(--rule2);--bi:var(--ink);box-shadow:0 0 0 2px var(--rule2) inset,0 4px 0 var(--rule2)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--rule2) inset,0 1px 0 var(--rule2)}
.btn.red{--b:var(--bad);--bs:var(--bad-d)}
.btn.blue{--b:var(--lvl);--bs:color-mix(in srgb,var(--lvl) 70%,#000)}
.btn.sm{min-height:42px;padding:0 15px;font-size:15.5px;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn svg.i{width:20px;height:20px;stroke-width:2.3}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.spk{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:color-mix(in srgb,var(--lvl) 12%,var(--bg));display:grid;place-items:center;color:var(--lvl)}
.spk svg.i{width:18px;height:18px}
.chip{display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:99px;border:2px solid var(--rule);background:var(--bg);font:700 14.5px/1.2 var(--disp);white-space:nowrap}
.chip.on{background:color-mix(in srgb,var(--go) 12%,var(--bg));border-color:var(--go);color:var(--go-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--card);border-radius:22px;padding:18px}
.lpill{display:inline-grid;place-items:center;min-width:36px;height:24px;padding:0 8px;border-radius:8px;background:var(--lc,#12151c);color:var(--bi,#fff);font:900 13px/1 var(--disp);letter-spacing:.02em;flex:none}

/* page header (module, lesson) */
.phd{margin:6px 0 18px}
.phd .k{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mut);margin-bottom:10px}
.phd .de2{font-size:17px;color:var(--mut);margin-top:6px;font-weight:500}
.phd p{margin:12px 0 0;color:var(--mut);font-size:16px;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.meta span{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:99px;background:var(--card);font:700 13.5px/1 var(--disp);color:var(--mut)}
.prog{height:12px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:14px}
.prog i{position:relative;display:block;height:100%;border-radius:99px;background:var(--lc,var(--go))}
.prog i::after,.pbar i::after,.lvbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}

/* home */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.hello h1 .de{display:block;font:700 .5em/1.3 var(--font);color:var(--mut);text-decoration:none;margin-top:6px;letter-spacing:-.01em}
.ring{--v:0;position:relative;width:78px;height:78px;border-radius:50%;background:conic-gradient(var(--xp) calc(var(--v)*1%),var(--card2) 0);display:grid;place-items:center;flex:none;transition:--v .6s}
.ring.full{background:conic-gradient(var(--go) 100%,var(--card2) 0)}
.ring b{display:grid;place-items:center;align-content:center;width:62px;height:62px;border-radius:50%;background:var(--bg);font:900 19px/1 var(--disp);text-align:center}
.ring b small{display:block;font:700 10.5px/1.2 var(--font);color:var(--mut);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 16px}
.kpi{display:grid;gap:2px;padding:12px 12px 11px;border-radius:20px;background:var(--card);text-decoration:none;color:inherit;box-shadow:0 3px 0 var(--rule)}
.kpi .ic{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;color:#fff;margin-bottom:4px}
.kpi .ic svg.i{width:18px;height:18px;stroke-width:2.4}
.kpi b{font:900 21px/1.1 var(--disp);font-variant-numeric:tabular-nums}
.kpi small{font:700 12.5px/1.25 var(--font);color:var(--mut)}
.kpi.k1 .ic{background:var(--flame)}.kpi.k2 .ic{background:var(--lvl)}.kpi.k3 .ic{background:var(--xp)}
.lvbar{position:relative;height:8px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:5px}
.lvbar i{position:relative;display:block;height:100%;border-radius:99px;background:var(--lvl)}
.lvbar i::after{top:2px;height:2px}
.inst{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;margin:0 0 14px;padding:14px 40px 14px 14px;border-radius:22px;background:color-mix(in srgb,var(--go) 10%,var(--bg));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--go) 35%,transparent)}
.inst.rest{background:color-mix(in srgb,var(--lvl) 9%,var(--bg));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--lvl) 30%,transparent)}
.inst .ii{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--go);color:#fff;box-shadow:0 3px 0 var(--go-d)}
.inst.rest .ii{background:var(--lvl);box-shadow:0 3px 0 color-mix(in srgb,var(--lvl) 65%,#000)}
.inst .ii svg.i{width:22px;height:22px;stroke-width:2.4}
.inst b{display:block;font:800 16px/1.25 var(--disp)}
.inst span{display:block;font-size:13.5px;color:var(--mut);line-height:1.35}
.inst .btn{margin:0}
.inst .x{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;background:none;color:var(--faint);display:grid;place-items:center}
.inst .x svg.i{width:16px;height:16px}
.ev .ei{font:900 18px/1 var(--disp)}
.phd~.evs .ev,.modal .ev{background:var(--card)}
.pick{margin:0 0 14px;padding:20px;border-radius:26px;background:var(--card)}
.pick h2{margin:0 0 4px;font-size:23px;line-height:1.2}
.pickb{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:3px;align-items:start;width:100%;margin-top:12px;padding:15px;border:2px solid var(--rule);border-radius:20px;background:var(--bg);color:var(--ink);font:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--rule);transition:transform .09s,box-shadow .09s,border-color .15s;-webkit-tap-highlight-color:transparent}
.pickb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rule)}
.pickb .lpill{grid-row:1 / span 2;margin-top:1px}
.pickb b{font:800 17px/1.3 var(--disp)}
.pickb small{grid-column:2;color:var(--mut);font-size:14.5px;line-height:1.45}
.pickb:hover{border-color:var(--lc)}
.pickb:focus-visible{outline:3px solid var(--lc);outline-offset:2px}
.pickt{display:inline-block;margin-top:14px;font-size:15px}
.ticket{position:relative;overflow:hidden;padding:22px 20px 18px;border-radius:28px;background:linear-gradient(140deg,var(--lc,#16a34a),color-mix(in srgb,var(--lc,#16a34a) 72%,#000));color:#fff;margin-bottom:14px;box-shadow:0 6px 0 color-mix(in srgb,var(--lc,#16a34a) 60%,#000)}
.ticket::before{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.12)}
.ticket::after{content:"";position:absolute;right:40px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.ticket>*{position:relative;z-index:1}
.ticket .k{display:flex;align-items:center;gap:8px;font:800 14px/1 var(--disp);color:rgba(255,255,255,.88)}
.ticket .lpill{background:#fff;color:var(--lc,#16a34a)}
.ticket h2{margin:14px 0 4px;font-size:27px;color:#fff}
.ticket .de2{font-size:15.5px;color:rgba(255,255,255,.85)}
.ticket .go{--b:#fff;--bi:var(--lc,#16a34a);--bs:rgba(0,0,0,.22);margin-top:18px;width:100%;font-size:18px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 10px}
.sec-h b{font:800 17px/1.2 var(--disp);color:var(--ink)}
.list{border-radius:22px;background:var(--card);overflow:hidden}
.list a,.list button{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px;border:0;background:none;text-decoration:none;text-align:left}
.list>*+*{box-shadow:0 -1px 0 var(--rule)}
.list a:hover,.list button:hover{background:var(--card2)}
.list .n{display:grid;place-items:center;min-width:42px;height:42px;padding:0 6px;border-radius:14px;background:var(--bg);font:900 17px/1 var(--disp);box-shadow:0 2px 0 var(--rule)}
.list .t{flex:1;font-weight:700;line-height:1.3}
.list .t small{display:block;font-weight:400;color:var(--mut);font-size:14px;margin-top:2px}
.chev{color:var(--faint);display:grid;place-items:center}

/* route */
.route{margin:4px 0 6px}
.line-h{display:flex;align-items:center;gap:10px;margin:28px 0 6px;font:800 16.5px/1.25 var(--disp)}
.line-h .sub{display:block;font:400 14px/1.45 var(--font)}
.st{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;min-height:66px;text-decoration:none;padding:6px 10px 6px 0;border-radius:18px}
.st:hover{background:var(--card)}
.st::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:6px;border-radius:3px;background:var(--lc)}
.st.first::before{top:50%}.st.last::before{bottom:50%}
.st .dotw{position:relative;z-index:1;width:44px;display:grid;place-items:center}
.st .dt{width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--lc)}
.st.done .dt{background:var(--lc);box-shadow:0 0 0 3px var(--bg)}
.st.now .dt{width:28px;height:28px;border:5px solid var(--lc);background:var(--bg);box-shadow:0 0 0 4px var(--bg),0 0 0 7px color-mix(in srgb,var(--lc) 35%,transparent);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--bg),0 0 0 11px color-mix(in srgb,var(--lc) 15%,transparent)}}
.st .nm{font:800 17px/1.25 var(--disp)}
.st .nm small{display:block;font:400 14px/1.4 var(--font);color:var(--mut);margin-top:1px}
.st .pr{font:800 14px/1 var(--disp);color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.st.done .pr{color:var(--lc)}
.here{display:inline-flex;align-items:center;margin-top:6px;height:22px;padding:0 9px;border-radius:8px;background:var(--lc);color:var(--bi,#fff);font:900 11.5px/1 var(--disp);vertical-align:2px}

/* module + lessons */
.cando{display:grid;gap:8px;margin:6px 0 18px}
.cando button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:13px 14px;border-radius:18px;border:0;background:var(--card);line-height:1.4;font-size:16px}
.cando button .bx{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);display:grid;place-items:center;margin-top:1px}
.cando button.on .bx{background:var(--go);border-color:var(--go);color:#fff;animation:popin .35s var(--spring)}
.lessons{display:grid;margin:8px 0 18px;border-radius:22px;background:var(--card);overflow:hidden}
.les{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px 12px 14px;text-decoration:none}
.les+.les{box-shadow:0 -1px 0 var(--rule)}
.les:hover{background:var(--card2)}
.les .no{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--bg);font:900 15px/1 var(--disp);box-shadow:inset 0 0 0 3px var(--lc);font-variant-numeric:tabular-nums}
.les.done .no{background:var(--lc);color:var(--bi,#fff);box-shadow:0 3px 0 color-mix(in srgb,var(--lc) 65%,#000)}
.les .tt{font:800 17px/1.25 var(--disp)}
.les .tt small{display:block;font:400 14px/1.4 var(--font);color:var(--mut);margin-top:2px}
.stars{display:inline-flex;gap:1px;color:var(--xp)}
.stars svg{width:16px;height:16px;fill:currentColor;stroke:none}
.stars .off{color:var(--card2)}
.les .side{text-align:right;font:700 13.5px/1.2 var(--disp);color:var(--faint);white-space:nowrap}

/* lesson */
.seg{position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:20;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;margin:0 0 20px;border-radius:18px;background:var(--card);box-shadow:0 8px 16px -14px var(--shade)}
.seg::before{content:"";position:absolute;left:-18px;right:-18px;bottom:100%;height:9px;background:var(--bg)}
.seg a{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:14px;text-decoration:none;font:800 14.5px/1 var(--disp);color:var(--mut)}
.seg a svg.i{width:18px;height:18px}
.seg a.on{background:var(--bg);color:var(--ink);box-shadow:0 2px 0 var(--rule)}
.goal{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:20px;background:color-mix(in srgb,var(--lc,var(--go)) 9%,var(--bg));margin:0 0 14px;font-size:16px;line-height:1.5}
.goal svg.i{margin-top:2px;color:var(--lc,var(--go))}
.goal .gl{display:block;font:800 13px/1.3 var(--disp);color:var(--lc,var(--go));margin-bottom:2px}
.readbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 8px}
.readbar .small{flex-basis:100%;margin-top:2px}
.lesnav{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:36px 0 8px}

/* callouts */
.box{--c:#5a6170;margin:18px 0;padding:16px;border-radius:20px;background:color-mix(in srgb,var(--c) 8%,var(--bg));border-left:5px solid color-mix(in srgb,var(--c) 70%,var(--bg))}
.box-h{display:flex;align-items:center;gap:10px;font:800 16px/1.3 var(--disp);color:color-mix(in srgb,var(--c) 85%,var(--ink))}
.box-h svg.i{width:19px;height:19px}
.box-b>:first-child{margin-top:8px}.box-b>:last-child{margin-bottom:0}
.box-b p,.box-b li{font-size:16.5px}
.b-truco{--c:#d99a00}.b-ojo{--c:#e5484d}.b-es{--c:#2f6bff}.b-cuento{--c:#8b5cf6}.b-resumen{--c:#16a34a}.b-info{--c:#5a6170}.b-nota{--c:#5a6170}

/* tables */
.tbl{overflow-x:auto;margin:14px 0;border-radius:18px;border:2px solid var(--rule)}
.tbl table{border-collapse:collapse;width:100%;font-size:15.5px}
.tbl th{font:800 14px/1.3 var(--disp);color:var(--mut);text-align:left;background:var(--card);padding:10px 12px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--rule);vertical-align:top;line-height:1.45}
.tbl tbody tr:first-child td{border-top:0}
.tbl thead+tbody tr:first-child td{border-top:1px solid var(--rule)}
@media(max-width:600px){.tbl table{font-size:14.5px}.tbl th,.tbl td{padding:8px 8px}.tbl th{white-space:normal}}
@media(max-width:420px){.tbl table{font-size:13.5px}.tbl th{font-size:13px}.tbl th,.tbl td{padding:7px 5px}}

/* examples */
.exs{display:grid;margin:14px 0;border-radius:20px;overflow:hidden;border:2px solid var(--rule)}
.exr{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:var(--bg);cursor:pointer}
.exr+.exr{border-top:1px solid var(--rule)}
.exr:hover{background:var(--card)}
.exr .spk{width:34px;height:34px;margin-top:-2px}
.exde{font-weight:600;line-height:1.45}
.exes{color:var(--mut);font-size:.93em;line-height:1.45;margin-top:2px}

/* vocab */
.voc{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:12px 0}
.vc{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--card);cursor:pointer;text-align:left;border:0;box-shadow:0 3px 0 var(--rule)}
.vc:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rule)}
.vc .spk{background:var(--bg);width:34px;height:34px}
.vc .w,.vc .x,.vc .s{display:block}
.vc .w{font-weight:700;line-height:1.3}
.vc .x{font-size:13.5px;color:var(--mut);line-height:1.3;margin-top:1px}
.vc .s{font-size:15px;line-height:1.35;margin-top:4px}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:22px}
.vh b{font:800 17px/1.2 var(--disp)}

/* dialog, text, audio */
.dlg,.txt,.aud{margin:18px 0;padding:16px;border-radius:22px;background:var(--card)}
.dlg-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dlg-h b{font:800 16.5px/1.2 var(--disp)}
.bub{max-width:88%;margin:8px 0;padding:10px 14px;border-radius:20px 20px 20px 6px;background:var(--bg);cursor:pointer;box-shadow:0 2px 0 var(--rule)}
.bub.r{margin-left:auto;border-radius:20px 20px 6px 20px;background:var(--bubr)}
.bub .sp{font:800 12.5px/1.2 var(--disp);color:var(--mut);margin-bottom:3px}
.bub .tx{font-weight:500;line-height:1.45}
.tr{display:none;font-size:14.5px;color:var(--mut);line-height:1.4;margin-top:4px}
.show-tr .tr{display:block}
.txt .para{margin:8px 0;line-height:1.65;cursor:pointer;font-weight:500}
.trans{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule);color:var(--mut);font-size:16px}
.show-tr .trans{display:block}
.trw{margin:8px 0 18px}
.aud .big{width:60px;height:60px;border-radius:50%;border:0;background:var(--lvl);color:#fff;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--lvl) 65%,#000)}
.aud .big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--lvl) 65%,#000)}
.aud .big svg.i{width:26px;height:26px}
.aud .script{display:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);font-size:16px}
.aud.show-tr .script{display:block}
.aud .script p{margin:6px 0}

/* exercises */
.phead{display:flex;align-items:center;gap:12px;margin:0 0 20px}
.phead .btn.sm{width:42px;padding:0}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--card2);overflow:hidden}
.pbar i{position:relative;display:block;height:100%;background:var(--go);border-radius:99px;transition:width .45s var(--spring)}
.pbar i::after{top:4px;height:4px}
.pcount{font:800 14px/1 var(--disp);color:var(--mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.combo{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 10px;border-radius:99px;background:color-mix(in srgb,var(--flame) 14%,var(--bg));color:var(--flame);font:900 15px/1 var(--disp);animation:popin .4s var(--spring)}
.combo svg.i{width:17px;height:17px;stroke-width:2.4}
.exc{padding:4px 0}
.ins{font:800 15px/1.3 var(--disp);color:var(--mut);margin-bottom:10px}
.exq{font-size:1.2em;line-height:1.5;margin:0 0 20px;font-weight:600}
.exq .de{text-decoration-color:var(--rule2)}
.opts{display:grid;gap:12px}
.opt{text-align:left;min-height:58px;padding:13px 16px;border-radius:18px;border:2px solid var(--rule2);background:var(--bg);font-weight:600;line-height:1.35;box-shadow:0 4px 0 var(--rule2);transition:transform .09s,box-shadow .09s,border-color .12s,background .12s}
.opt:hover{border-color:color-mix(in srgb,var(--lvl) 45%,var(--rule2))}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rule2)}
.opt.ok{border-color:var(--go);background:var(--okbg);color:var(--go-ink);box-shadow:0 4px 0 var(--go);animation:popin .35s var(--spring)}
.opt.bad{border-color:var(--bad);background:var(--badbg);color:var(--bad);box-shadow:0 4px 0 var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
.opt:disabled:active{transform:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-weight:800;font-family:var(--disp);font-size:18px}
.gapin{display:inline-block;width:8.5em;max-width:100%;height:44px;padding:0 10px;margin:2px 2px;border-radius:12px;border:2px solid var(--rule2);border-bottom-width:4px;background:var(--bg);font-size:17px;font-weight:700;vertical-align:middle}
.gapin:focus{border-color:var(--lvl);outline:0}
.gapin.ok{border-color:var(--go);color:var(--go-ink);background:var(--okbg)}
.gapin.bad{border-color:var(--bad);color:var(--bad);background:var(--badbg);animation:shake .35s}
.tin{width:100%;min-height:56px;padding:13px 14px;border-radius:18px;border:2px solid var(--rule2);border-bottom-width:4px;background:var(--bg);font-size:17px;font-weight:600;resize:vertical}
.tin:focus{border-color:var(--lvl);outline:0}
.tin.ok{border-color:var(--go);background:var(--okbg)}.tin.bad{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.kbd{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.kbd button{min-width:44px;height:42px;border-radius:12px;border:2px solid var(--rule);background:var(--bg);font-size:17px;font-weight:700;box-shadow:0 3px 0 var(--rule)}
.kbd button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rule)}
.ord-ans{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:10px;border-radius:18px;border:2px dashed var(--rule2);margin-bottom:14px;background:var(--bg)}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.wd{min-height:46px;padding:0 15px;border-radius:14px;border:2px solid var(--rule2);background:var(--bg);font-weight:700;font-size:17px;box-shadow:0 3px 0 var(--rule2)}
.wd:active{transform:translateY(2px);box-shadow:0 1px 0 var(--rule2)}
.ord-ans .wd{background:color-mix(in srgb,var(--lvl) 10%,var(--bg));border-color:var(--lvl);color:var(--ink);box-shadow:0 3px 0 var(--lvl);animation:popin .25s var(--spring)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:grid;gap:10px;align-content:start}
.mt button{min-height:56px;padding:8px 12px;border-radius:16px;border:2px solid var(--rule2);background:var(--bg);font-weight:600;line-height:1.3;text-align:left;box-shadow:0 3px 0 var(--rule2)}
.mt button.sel{border-color:var(--lvl);background:color-mix(in srgb,var(--lvl) 9%,var(--bg));box-shadow:0 3px 0 var(--lvl)}
.mt button.done{border-color:transparent;background:var(--okbg);color:var(--go-ink);cursor:default;box-shadow:none;animation:popin .3s var(--spring)}
.mt button.err{border-color:var(--bad);background:var(--badbg);animation:shake .35s}
.lbtn{display:flex;gap:8px;align-items:center;margin:0 0 16px;flex-wrap:wrap}
.chkrow{margin-top:18px}
.chkrow .btn{width:100%}
.fb{margin-top:16px;padding:14px 16px;border-radius:18px;line-height:1.5;font-size:16px}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.fb .h{display:flex;align-items:center;gap:8px;font:900 18px/1.2 var(--disp)}
.fb.ok .h{color:var(--go-ink)}.fb.bad .h{color:var(--bad)}
.fb .sol{margin-top:6px;font-weight:700}
.fb .why{margin-top:6px;color:var(--ink)}
.fb .why p{margin:4px 0}
.quiz{margin:22px 0;padding:16px;border-radius:22px;border:2px solid var(--rule)}
.quiz>.qh{display:flex;align-items:center;gap:8px;font:800 16px/1.3 var(--disp);margin-bottom:6px}
.quiz .exc{padding:10px 0 14px;border-bottom:1px solid var(--rule)}
.quiz .exc:last-child{border-bottom:0;padding-bottom:0}
.quiz .exq{font-size:1.05em;margin-bottom:12px}

/* bottom sheet: practice feedback */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px max(18px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));border-radius:28px 28px 0 0;background:var(--bg);box-shadow:0 -14px 34px -18px rgba(0,0,0,.3);animation:up .3s var(--spring)}
.sheet.ok{background:var(--okbg)}.sheet.bad{background:var(--badbg)}
.sheet .in{max-width:760px;margin:0 auto}
.sheet .fb{margin:0;padding:0;background:none}
.sheet .fb .h{font-size:23px;gap:10px}
.sheet .fb .h .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:#fff;flex:none;animation:popin .45s var(--spring)}
.sheet .fb .h .ico svg.i{width:22px;height:22px;stroke-width:3}
.sheet .fb.ok .h .ico{background:var(--go)}.sheet .fb.bad .h .ico{background:var(--bad)}
.sheet .fb .h .xpchip{margin-left:auto}
.sheet .fb .why{max-height:24vh;overflow:auto;font-size:15.5px}
.sheet .btn.wide{margin-top:12px}
.sheet.bad .btn.wide{--b:var(--bad);--bs:var(--bad-d)}
.xpchip{display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 11px;border-radius:99px;background:var(--xp);color:#3b2600;box-shadow:0 2px 0 color-mix(in srgb,var(--xp) 60%,#000);font:900 15px/1 var(--disp);white-space:nowrap;animation:floatin .5s var(--spring) .1s both}
.cmb{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:800 15px/1.2 var(--disp);color:var(--flame)}
.cmb svg.i{width:17px;height:17px;stroke-width:2.4}
body.has-sheet main{padding-bottom:62vh}
@media(min-width:900px){.sheet{left:118px;right:16px;bottom:16px;border-radius:28px}}
@keyframes up{from{transform:translateY(40px);opacity:.2}to{transform:none;opacity:1}}
@keyframes popin{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes floatin{0%{transform:translateY(10px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* results & rewards */
.res{text-align:center;padding:28px 18px 22px;border-radius:30px;background:var(--card)}
.res .medal{width:118px;height:118px;margin:0 auto 6px;animation:popin .6s var(--spring)}
.res .rt-h{font:900 28px/1.15 var(--disp);margin:6px 0 4px;text-wrap:balance}
.res .big{font:900 56px/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.res .stars svg{width:38px;height:38px;filter:drop-shadow(0 3px 0 color-mix(in srgb,var(--xp) 55%,#000))}
.res .stars .off{filter:none}
.res .stars svg{animation:starin .5s var(--spring) both}
.res .stars svg:nth-child(2){animation-delay:.15s}.res .stars svg:nth-child(3){animation-delay:.3s}
@keyframes starin{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
.rtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 6px;text-align:left}
.rt{padding:12px 14px;border-radius:20px;background:var(--bg);border:2px solid var(--c);box-shadow:0 4px 0 var(--c);animation:floatin .5s var(--spring) both}
.rt:nth-child(2){animation-delay:.08s}.rt:nth-child(3){animation-delay:.16s}.rt:nth-child(4){animation-delay:.24s}
.rt small{display:block;font:900 12px/1.2 var(--disp);letter-spacing:.04em;color:var(--c);text-transform:uppercase}
.rt b{display:block;font:900 26px/1.15 var(--disp);font-variant-numeric:tabular-nums;margin-top:2px}
.res .rt .big{font:900 26px/1.15 var(--disp);letter-spacing:0}
.rt.x{--c:var(--xp)}.rt.a{--c:var(--go)}.rt.c{--c:var(--flame)}.rt.t{--c:var(--lvl)}
.evs{display:grid;gap:8px;margin:14px 0 4px;text-align:left}
.ev{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;background:var(--bg);animation:floatin .5s var(--spring) both;animation-delay:.35s}
.ev .ei{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;color:#fff;flex:none;background:var(--c,var(--go));box-shadow:0 3px 0 color-mix(in srgb,var(--c,var(--go)) 60%,#000)}
.ev .ei svg.i{width:22px;height:22px;stroke-width:2.4}
.ev b{display:block;font:800 16.5px/1.25 var(--disp)}
.ev span{font-size:14px;color:var(--mut);line-height:1.35}
.wrong-list{display:grid;gap:6px;margin:16px 0;text-align:left}
.wrong-list div{padding:10px 12px;border-radius:14px;background:var(--bg);font-size:15px}
.res .row{justify-content:center}
.ai{margin-top:10px;padding:12px 14px;border-radius:18px;background:var(--bg);font-size:15.5px;line-height:1.5;box-shadow:inset 0 0 0 2px var(--rule)}
.ai .who{font:800 13px/1.2 var(--disp);color:var(--lvl);display:block;margin-bottom:4px}
.ai p{margin:6px 0}.ai ul{margin:6px 0;padding-left:20px}
.heard{margin-top:8px;min-height:1em}

/* celebrations (never block taps) */
.burst{position:fixed;left:50%;top:34%;z-index:80;pointer-events:none;display:grid;justify-items:center;gap:6px;transform:translate(-50%,-50%);animation:burst 1.7s var(--spring) both}
.burst .bi{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd36b,var(--flame));color:#fff;box-shadow:0 6px 0 color-mix(in srgb,var(--flame) 60%,#000),0 20px 40px -10px rgba(242,107,15,.6)}
.burst .bi svg.i{width:46px;height:46px;stroke-width:2.2}
.burst b{font:900 30px/1.1 var(--disp);color:var(--flame);text-shadow:0 3px 0 var(--bg),0 -2px 0 var(--bg),2px 0 0 var(--bg),-2px 0 0 var(--bg);white-space:nowrap}
.burst span{font:800 16px/1.2 var(--disp);color:var(--ink);background:var(--bg);padding:4px 12px;border-radius:99px;box-shadow:0 4px 14px -6px rgba(0,0,0,.3)}
@keyframes burst{0%{opacity:0;transform:translate(-50%,-40%) scale(.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-52%) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) scale(.96)}}
.cele{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));z-index:80;pointer-events:none;display:flex;align-items:center;gap:12px;width:min(92vw,420px);padding:12px 16px;border-radius:24px;background:var(--bg);box-shadow:0 18px 40px -14px rgba(0,0,0,.35),inset 0 0 0 2px var(--c);transform:translateX(-50%);animation:cele 2.9s var(--spring) both}
.cele .ei{display:grid;place-items:center;width:46px;height:46px;border-radius:16px;background:var(--c);color:#fff;flex:none}
.cele .ei svg.i{width:24px;height:24px;stroke-width:2.4}
.cele b{display:block;font:900 18px/1.2 var(--disp)}
.cele span{font-size:14px;color:var(--mut);line-height:1.35}
@keyframes cele{0%{opacity:0;transform:translate(-50%,-30px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-16px)}}
.confetti{position:fixed;inset:0;z-index:79;pointer-events:none;width:100vw;height:100vh}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.badge{display:grid;justify-items:center;gap:6px;padding:16px 10px 14px;border-radius:24px;background:var(--card);text-align:center}
.badge .bdg{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c));color:#fff;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000)}
.badge .bdg svg.i{width:30px;height:30px;stroke-width:2.3}
.badge b{font:800 15.5px/1.2 var(--disp)}
.badge span{font-size:13px;color:var(--mut);line-height:1.35}
.badge em{font:700 12px/1 var(--disp);font-style:normal;color:var(--go-ink)}
.badge.off .bdg{background:var(--card2);color:var(--faint);box-shadow:0 5px 0 var(--rule2)}
.badge.off b{color:var(--mut)}

/* flashcards & tools */
.fc{position:relative;min-height:310px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:28px 20px;border-radius:30px;background:var(--card);text-align:center;cursor:pointer;border:2px solid var(--rule);width:100%;box-shadow:0 6px 0 var(--rule)}
.fc.flip{animation:flip .38s ease-out}
@keyframes flip{0%{transform:perspective(900px) rotateY(-80deg);opacity:.3}100%{transform:none;opacity:1}}
.fc .w{font:900 clamp(30px,8.4vw,42px)/1.12 var(--disp);letter-spacing:-.01em}
.fc .x{color:var(--mut);font-size:15.5px}
.fc .s{font:800 22px/1.3 var(--disp);margin-top:6px}
.fc .hint{position:absolute;bottom:16px;font-size:13.5px;color:var(--faint)}
.fc .sep{width:56px;height:4px;border-radius:2px;background:var(--rule2);margin:14px 0 8px}
.grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.grade .btn{padding:0 8px}

PART({id: 'a1', badge: 'A1', c: '#0e7c7b', t: 'Línea A1 · Fundamentos', d: 'Lo básico que necesitas antes del A2: sonidos, frases, artículos, verbos y el acusativo.'});

MOD({id: 'm1', t: 'Los sonidos del alemán', de: 'Alphabet und Aussprache',
  desc: 'El alemán se lee casi siempre como se escribe. Si aprendes bien estas reglas al principio, podrás leer en voz alta cualquier palabra, aunque no la conozcas.',
  can: ['Puedo decir el alfabeto alemán y deletrear mi nombre por teléfono.', 'Sé pronunciar ä, ö, ü y distingo vocales largas y cortas.', 'Sé leer bien ei, ie, eu, sch, ch, sp, st, z, w y v.', 'Entiendo cuando alguien me deletrea una palabra.']});

LES({t: 'El alfabeto y cómo deletrear', de: 'Das Alphabet · buchstabieren', min: 15,
goal: 'Podrás decir las letras en alemán, **deletrear tu nombre** y entender cuando alguien te deletrea algo. En Alemania esto pasa muchísimo: por teléfono, en el médico, en el banco o en cualquier oficina.',
body: `
:::cuento
Llamas a la consulta del médico para pedir una cita. La recepcionista pregunta: [[Wie ist Ihr Name, bitte?]] (¿Cuál es su nombre, por favor?). Le dices tu apellido… y contesta: [[Können Sie das bitte buchstabieren?]] (¿Puede deletrearlo, por favor?).

Para los alemanes tu nombre es extranjero, así que **te pedirán deletrearlo muchas veces**. Si conoces el alfabeto alemán, lo resuelves en diez segundos.
:::

## Una buena noticia antes de empezar
El alemán tiene fama de difícil, pero tiene una gran ventaja para ti: **se lee casi siempre igual que se escribe**, como el español. No pasa como en inglés, donde cada palabra es una sorpresa. En este módulo aprendes las reglas una vez y después podrás leer cualquier palabra en voz alta.

Toca cualquier palabra marcada (por ejemplo [[Hallo]]) para oírla. Escucha, repite en voz alta y vuelve a escuchar. Repetir en voz alta es lo que de verdad entrena la boca.

## Paso 1: Las 26 letras, una por una
Muchas letras se llaman casi igual que en español. Las importantes son las que **cambian de nombre**: están marcadas con ==amarillo==.

| Letra | Se dice | Pista en español |
|---|---|---|
| A | [[A]] | «a», como en casa |
| B | [[B]] | «be» |
| C | [[==C==]] | «tse» |
| D | [[D]] | «de» |
| E | [[E]] | «e» larga: «ee» |
| F | [[F]] | «ef» |
| G | [[==G==]] | «gue», como en guerra |
| H | [[==H==]] | «ha» con una «h» que es solo aire, como un suspiro |
| I | [[I]] | «i» larga: «ii» |
| J | [[==J==]] | «yot» |
| K | [[K]] | «ka» |
| L | [[L]] | «el» |
| M | [[M]] | «em» |
| N | [[N]] | «en» |
| O | [[O]] | «o» larga |
| P | [[P]] | «pe» |
| Q | [[Q]] | «ku» |
| R | [[R]] | «er», con la r al fondo de la garganta |
| S | [[S]] | «es» |
| T | [[T]] | «te» |
| U | [[U]] | «u» larga |
| V | [[==V==]] | «fau» |
| W | [[==W==]] | «ve», con los dientes sobre el labio |
| X | [[X]] | «iks» |
| Y | [[==Y==]] | «ípsilon» |
| Z | [[==Z==]] | «tset» |

:::truco
¿Conoces la marca de coches **VW**? En Alemania nadie dice «uve doble». Dicen [[VW]]: **«fau-ve»**. Así recuerdas de una vez las dos letras más traicioneras: **V = fau** y **W = ve**.
:::

## Paso 2: Cuatro letras que no tiene el español
Además de las 26 letras, el alemán tiene tres vocales con **dos puntitos** encima (se llaman *Umlaut*) y una letra especial para la s:

| Letra | Se dice al deletrear | Ejemplo |
|---|---|---|
| Ä ä | [[A-Umlaut]] | [[Käse]] (queso) |
| Ö ö | [[O-Umlaut]] | [[schön]] (bonito) |
| Ü ü | [[U-Umlaut]] | [[Tür]] (puerta) |
| ß | [[Eszett]] | [[Straße]] (calle) |

La **ß** suena exactamente como una «s» normal (nunca como «b»). Se usa sobre todo detrás de una vocal larga: [[groß]] (grande), [[heißen]] (llamarse), [[Fuß]] (pie). Si no la tienes en el teclado, puedes escribir «ss»: «Strasse». En la próxima lección aprenderás cómo suenan ä, ö y ü.

:::nota ¿Y la ñ, la ll y los acentos?
La ñ y la ll no existen en alemán, y el alemán no usa tildes (á, é…). En los formularios alemanes es normal que tu nombre aparezca **sin tilde**: «Sanchez» en vez de «Sánchez». No es un error de la oficina; simplemente no tienen esa letra. Si quieres, puedes decir [[mit Akzent]] (con tilde) al deletrear.
:::

## Paso 3: Cómo se deletrea una palabra
Deletrear es decir las letras una detrás de otra. Hay tres trucos que usan los alemanes:
1. Para dos letras iguales seguidas dicen [[Doppel-L]] (doble ele), [[Doppel-S]]… o «dos veces»: [[zweimal T]].
2. Para una mayúscula dicen [[großes M]] (eme mayúscula); para una minúscula, [[kleines m]].
3. Para que no haya confusión, añaden una palabra conocida: [[B wie Berlin]] (B de Berlín), [[M wie München]] (M de Múnich). Mucha gente dice nombres de personas: [[A wie Anton]], [[B wie Berta]].

:::es
En español decimos «**B de** Barcelona». En alemán se dice «[[B wie Berlin]]»: **wie** significa «como». Es la misma idea, solo cambia la palabrita.
:::

:::ejemplos
Wie heißen Sie? = ¿Cómo se llama usted?
Ich heiße Lucía Peña. = Me llamo Lucía Peña.
Wie schreibt man das? = ¿Cómo se escribe eso?
Können Sie das bitte buchstabieren? = ¿Puede deletrearlo, por favor?
P – E – N – A. Peña, ohne Akzent. = P-E-N-A. Peña, sin tilde.
Mit W oder mit V? = ¿Con W o con V?
Mit V wie Viktor. = Con V de Víctor.
Noch einmal, bitte. = Otra vez, por favor.
Langsamer, bitte. = Más despacio, por favor.
:::

:::dialogo Por teléfono, en la consulta
Rezeption: Praxis Dr. Klein, guten Tag! = Consulta del Dr. Klein, ¡buenos días!
Lucía: Guten Tag! Ich möchte einen Termin, bitte. = ¡Buenos días! Quisiera una cita, por favor.
Rezeption: Gerne. Wie ist Ihr Name? = Con gusto. ¿Cuál es su nombre?
Lucía: Peña. Lucía Peña. = Peña. Lucía Peña.
Rezeption: Können Sie das bitte buchstabieren? = ¿Puede deletrearlo, por favor?
Lucía: P – E – N – A. = P-E-N-A.
Rezeption: Danke. Und der Vorname? = Gracias. ¿Y el nombre?
Lucía: L – U – C – I – A. = L-U-C-I-A.
:::

:::ojo Los errores típicos al deletrear
Los hispanohablantes suelen decir el nombre español de la letra. Estas son las que más se confunden:
- La **J** no es «jota»: es [[J]] («yot»).
- La **G** no es «ge»: es [[G]] («gue»). Y la **H** no es «hache»: es [[H]] («ha»).
- La **V** no es «uve»: es [[V]] («fau»). La **W** es [[W]] («ve»).
- La **Z** no es «zeta»: es [[Z]] («tset»). La **C** es [[C]] («tse»).
- La **Y** no es «i griega»: es [[Y]] («ípsilon»).
:::

:::vocab Palabras de esta lección
das Alphabet = el alfabeto
der Buchstabe | die Buchstaben = la letra
buchstabieren | er buchstabiert = deletrear
der Name | die Namen = el nombre
der Vorname | die Vornamen = el nombre de pila
der Nachname | die Nachnamen = el apellido
heißen | er heißt = llamarse
schreiben | er schreibt = escribir
Wie bitte? = ¿Cómo dice? / ¿Perdón? (cuando no entiendes)
Noch einmal, bitte. = Otra vez, por favor.
langsam = despacio, lento
groß = grande; también «mayúscula»
klein = pequeño; también «minúscula»
:::

:::quiz
mc: ¿Cómo se dice la letra **V** en alemán? || fau || uve || ve ## Recuerda VW = «fau-ve».
mc: ¿Cómo se dice la letra **J**? || yot || jota || ye ## La J alemana se llama «yot», y suena como la «y» de «yo».
:::

:::resumen
- El alfabeto alemán tiene 26 letras más **ä, ö, ü** y **ß**.
- Las letras que cambian de nombre: **C** tse, **G** gue, **H** ha, **J** yot, **V** fau, **W** ve, **Y** ípsilon, **Z** tset.
- Para pedir que deletreen: [[Können Sie das bitte buchstabieren?]] Para que repitan: [[Noch einmal, bitte.]]
- Para aclarar una letra: [[B wie Berlin]] = «B de Berlín».
:::
`,
ex: `
mc: ¿Cómo se dice la letra **W**? || ve || uve doble || fau ## La W alemana se dice «ve». La V se dice «fau».
mc: ¿Cómo se dice la letra **Z**? || tset || zeta || tse ## Z = «tset». La C es «tse».
mc: ¿Cómo se dice la letra **H**? || ha || hache || a ## La H se dice «ha», con un poco de aire al principio.
mc: ¿Cómo se llama la letra **ß**? || Eszett || doble ese || beta ## Se llama «Eszett» y suena como una s normal: Straße, groß.
mc: La **G** alemana se dice… || gue || ge || je ## G = «gue», como el principio de «guerra».
listenmc: W – A – S – S – E – R || ¿Qué palabra se ha deletreado? || Wasser || Vasser || Waser ## «ve, a, es, es, e, er»: Wasser (agua). Doble s: Doppel-S.
listenmc: Mit V wie Viktor. || ¿Qué letra dicen? || V || W || B ## «fau» es la V. «Viktor» empieza con V.
mc: No has entendido lo que te dicen. ¿Qué preguntas? || Wie bitte? || Wie heißen Sie? || Danke schön! ## «Wie bitte?» es la forma educada de decir «¿cómo?, ¿perdón?».
mc: Quieres que alguien deletree una palabra. ¿Qué le dices? || Können Sie das bitte buchstabieren? || Können Sie das bitte schreiben? || Wie ist Ihr Name? ## buchstabieren = deletrear. schreiben = escribir.
match: V = fau || W = ve || J = yot || Z = tset || H = ha || Y = ípsilon ## Estas seis letras son las que más se confunden.
gap: Wie ___ man das? (escribir) || schreibt ## «Wie schreibt man das?» = ¿Cómo se escribe eso? Con «man» el verbo termina en -t.
order: (¿Puede deletrearlo, por favor?) können Sie das bitte buchstabieren ## En las preguntas de sí/no, el verbo va primero: «Können Sie…?».
listen: Noch einmal, bitte. ## «Noch einmal, bitte» = otra vez, por favor. ¡Úsala sin miedo!
speak: Ich heiße Ana. A – N – A. = Me llamo Ana. A-N-A.
`});

LES({t: 'Las vocales: largas, cortas y con puntitos', de: 'Vokale und Umlaute', min: 20,
goal: 'Aprenderás a **distinguir vocales largas y cortas**, a pronunciar **ä, ö, ü** y a leer bien **ei, ie, eu y au**. Así te entenderán mejor y entenderás mejor a los demás.',
body: `
## Paso 1: Las mismas vocales… pero con dos «velocidades»
En español una vocal dura siempre lo mismo. En alemán, cada vocal puede ser **larga** (la estiras) o **corta** (la cortas rápido). Y eso **cambia el significado** de la palabra. Escucha estos pares, toca cada palabra:

| Larga | Significa | Corta | Significa |
|---|---|---|---|
| [[Staat]] | estado (país) | [[Stadt]] | ciudad |
| [[Miete]] | alquiler | [[Mitte]] | centro, mitad |
| [[Ofen]] | horno | [[offen]] | abierto |
| [[Hüte]] | sombreros | [[Hütte]] | cabaña |

:::cuento
Imagina que las vocales son gomas elásticas. Una vocal **larga** es una goma estirada: «Staaaat». Una vocal **corta** es una goma suelta que rebota rápido: «Stat». En alemán tienes que decidir cada vez: ¿la estiro o no?
:::

## Paso 2: Cinco reglas para saber si es larga o corta
No hace falta adivinar: la propia palabra te avisa.
1. **Vocal doble** = larga: [[Tee]] (té), [[Boot]] (barco), [[Haar]] (pelo), [[Meer]] (mar).
2. **Vocal + h** = larga. Esa h **no suena**, solo sirve para estirar: [[sehen]] (ver), [[fahren]] (ir en coche), [[Uhr]] (reloj), [[Kuh]] (vaca).
3. **ie** = i larga. La e no se pronuncia, solo dice «estira la i»: [[die]], [[vier]] (cuatro), [[spielen]] (jugar), [[Liebe]] (amor).
4. **Vocal + una sola consonante** = normalmente larga: [[Name]], [[gut]] (bien), [[Brot]] (pan), [[Tag]] (día).
5. **Vocal + dos consonantes** (o consonante doble) = corta: [[Bett]] (cama), [[Mann]] (hombre), [[kommen]] (venir), [[Hund]] (perro), [[Stadt]].

:::truco
La consonante doble es como **una puerta que se cierra de golpe**: la vocal no tiene tiempo de estirarse. [[Mitte]]: la doble t cierra la i rápido. [[Miete]]: la i está libre y se estira.
:::

## Paso 3: La e del final sí se pronuncia… y el truco de «-er»
- La **-e** del final **siempre suena**, pero suave y corta: [[Name]] (naa-me), [[danke]], [[bitte]]. No la comas como en francés.
- La terminación **-er** suena casi como una **«a»** corta. ¡Es una de las claves para sonar alemana! [[Vater]] (padre) suena «faa-ta», [[Lehrer]] (profesor) suena «lee-ra», [[aber]] (pero) suena «aa-ba».
- La terminación **-en** se dice muy rápido, la e casi desaparece: [[machen]] (hacer), [[kommen]], [[gehen]].

:::ojo No pronuncies la r de «-er» como en español
Decir «fa-TER» con una r fuerte es el error más típico de los hispanohablantes. Escucha [[Vater]], [[Mutter]], [[Lehrer]], [[besser]]: el final suena como una «a» suave.
:::

## Paso 4: ä, ö, ü, las vocales con dos puntitos
Los puntitos (el *Umlaut*) cambian el sonido de la vocal. Vamos con calma, una por una:
- **ä** suena como nuestra **e**, un poco más abierta: [[Käse]] (queso), [[spät]] (tarde), [[Mädchen]] (chica).
- **ö**: pon la boca como para decir **«o»** (redondita, como para dar un beso) y, **sin mover los labios**, intenta decir **«e»**. Sale el sonido ö: [[schön]] (bonito), [[hören]] (oír), [[zwölf]] (doce), [[Köln]] (Colonia).
- **ü**: pon la boca como para decir **«u»** (como si fueras a silbar) y, **sin mover los labios**, di **«i»**. Ese es el sonido ü: [[über]] (sobre), [[Tür]] (puerta), [[grün]] (verde), [[fünf]] (cinco), [[München]] (Múnich).

Los puntitos **cambian el significado**. No son un adorno:

:::ejemplos
schon – schön = ya – bonito
Mutter – Mütter = madre – madres
zahlen – zählen = pagar – contar
Bruder – Brüder = hermano – hermanos
:::

:::nota Si no puedes escribir los puntitos
Se pueden sustituir así: **ä = ae, ö = oe, ü = ue**. Por eso el apellido «Müller» a veces aparece como «Mueller». En el móvil, **mantén pulsada la letra a, o, u** y aparecerá la versión con puntitos. En esta app también tienes botones con ä, ö, ü y ß.
:::

## Paso 5: Las parejas de vocales (diptongos)
Aquí está la trampa más grande para los hispanohablantes, porque se escriben con letras que conocemos… pero suenan distinto.

| Se escribe | Suena | Ejemplos |
|---|---|---|
| ei (y ai) | «ai» | [[nein]] (no), [[eins]] (uno), [[Wein]] (vino), [[Mai]] (mayo) |
| ie | «ii» larga | [[die]], [[Bier]] (cerveza), [[Wien]] (Viena) |
| eu y äu | «oi» | [[neu]] (nuevo), [[heute]] (hoy), [[Deutsch]] (alemán), [[Häuser]] (casas) |
| au | «au», como en español | [[Haus]] (casa), [[Frau]] (mujer), [[auch]] (también) |

:::truco
- **ei**: suena «ai», como cuando dices «¡ay!»: [[mein]] = «main».
- **ie**: la e es muda, solo alarga la i: [[Bier]] = «biir».
- **eu**: suena «oi», como «hoy»: el dinero en Alemania es el [[Euro]] y se dice **«oi-ro»**.
:::

:::ojo Cuidado con Wein y Wien
[[Wein]] (vino) y [[Wien]] (Viena) solo se diferencian en el orden de la e y la i… ¡y suenan totalmente distinto! «vain» y «viin». Si dices «Ich trinke Wien», ¡estarías bebiendo Viena!
:::

:::vocab Palabras de esta lección
der Tee = el té
das Haus | die Häuser = la casa
die Frau | die Frauen = la mujer; también «señora»
der Mann | die Männer = el hombre
die Stadt | die Städte = la ciudad
die Miete | die Mieten = el alquiler
die Uhr | die Uhren = el reloj; también «hora» (um 8 Uhr)
neu = nuevo
heute = hoy
schön = bonito
grün = verde
müde = cansado
spät = tarde
die Tür | die Türen = la puerta
der Käse = el queso
:::

:::quiz
listenmc: schön || ¿Qué palabra oyes? || schön || schon || Schuh ## schön (bonito) tiene ö: labios de «o», sonido de «e».
mc: ¿Cómo suena **ei** en [[mein]]? || «ai» || «ei» || «i» ## ei = «ai»: mein suena «main».
:::

:::resumen
- Vocal doble, vocal + h, ie → **larga**. Vocal + dos consonantes → **corta**.
- La -e final suena suave; la terminación **-er** suena como una **a** corta.
- **ö** = labios de o + sonido e. **ü** = labios de u + sonido i. **ä** = e abierta.
- **ei = ai**, **ie = ii**, **eu/äu = oi**, **au = au**.
:::
`,
ex: `
mc: ¿Cómo se pronuncia **ie** en [[Bier]]? || como una i larga || como «ie» en «pie» || como «ai» ## En ie la e no suena: solo alarga la i.
mc: ¿Cómo se pronuncia **eu** en [[heute]]? || «oi» || «eu» || «e» ## eu = «oi». heute suena «hoi-te».
mc: ¿Cuál tiene la vocal **corta**? || Mitte || Miete || Tee ## La doble t de Mitte cierra la i: es corta.
mc: ¿Cuál tiene la vocal **larga**? || Staat || Stadt || Bett ## Staat tiene doble a: es larga.
mc: La terminación **-er** de [[Lehrer]] suena casi como… || una «a» suave || «er» con r fuerte || una «e» muda ## Lehrer suena «lee-ra».
listenmc: Wein || ¿Qué palabra oyes? || Wein || Wien || wenn ## Wein (vino) suena «vain». Wien (Viena) suena «viin».
listenmc: zählen || ¿Qué palabra oyes? || zählen || zahlen || Zahl ## zählen (contar) tiene ä, que suena como una e.
listenmc: Brüder || ¿Qué palabra oyes? || Brüder || Bruder || Brote ## Brüder (hermanos) tiene ü: labios de u, sonido de i.
tf: En [[sehen]], la h no se pronuncia. || r ## La h detrás de una vocal es muda: solo alarga la vocal.
tf: Si no tienes ü en el teclado puedes escribir «ue». || r ## Müller = Mueller. Pero mejor usa la ü cuando puedas.
match: ei = ai || ie = ii || eu = oi || au = au ## Repite: nein, die, neu, Haus.
listen: Heute ist es schön. = Hoy hace bueno. ## heute = «hoi-te», schön con ö.
listen: Ich trinke Tee. = Bebo té. ## Tee con e larga, ich con el sonido suave de «ich».
speak: Mein Bruder wohnt in Wien. = Mi hermano vive en Viena.
`});

LES({t: 'Consonantes que suenan distinto', de: 'Konsonanten: ch, sch, sp, st, z, w, v…', min: 20,
goal: 'Aprenderás a leer los sonidos que no existen o se escriben distinto en español: **w, v, z, s, sch, sp/st, ch, h, r** y el final de palabra. Con esto ya podrás leer en voz alta cualquier texto.',
body: `
## Paso 1: Las letras que «se disfrazan»
Algunas letras alemanas parecen españolas, pero suenan diferente. Míralas como si llevaran un disfraz:

| Se escribe | Suena como | Ejemplos |
|---|---|---|
| w | una «v» de verdad (dientes sobre el labio) | [[Wasser]] (agua), [[wo]] (dónde), [[Wein]] (vino) |
| v | «f» (casi siempre) | [[Vater]] (padre), [[viel]] (mucho), [[vier]] (cuatro) |
| j | «y», como en «yo» | [[ja]] (sí), [[Jahr]] (año), [[Juli]] (julio) |
| z | «ts» | [[Zeit]] (tiempo), [[zehn]] (diez), [[Zug]] (tren) |
| s + vocal | «s» zumbada, como una abeja: zzz | [[Sonne]] (sol), [[sehen]] (ver), [[Reise]] (viaje) |
| s final, ss, ß | «s» normal | [[Haus]], [[Wasser]], [[Straße]] |
| qu | «kv» | [[Quark]] (requesón), [[bequem]] (cómodo) |

:::truco La W y la V
- **W**: muerde suavemente el labio de abajo con los dientes de arriba y haz ruido de motor: «vvvv». En español no distinguimos b y v, pero en alemán [[Wein]] (vino) empieza con ese sonido de «motor».
- **V**: casi siempre suena **f**: [[Vater]] = «faa-ta», [[Volkswagen]] = «folks-vaa-guen». Solo en palabras extranjeras suena v: [[Video]], [[Klavier]].
:::

## Paso 2: sch, sp y st, el sonido del silencio
- **sch** suena como cuando pides silencio: **«shhh»**. [[Schule]] (escuela), [[schön]], [[Tisch]] (mesa), [[Englisch]].
- **sp** y **st al principio** de palabra suenan **«shp»** y **«sht»**: [[sprechen]] (hablar) = «shpre-jen», [[Sport]], [[Straße]] = «shtraa-se», [[stehen]] (estar de pie).
- En medio o al final suenan normal: [[ist]], [[Fenster]] (ventana), [[Wespe]] (avispa).
- **tsch** suena como nuestra **ch**: [[Deutsch]], [[tschüss]] (adiós).

## Paso 3: Los dos sonidos de «ch»
El grupo **ch** tiene dos sonidos, y la vocal de delante decide cuál:
- Después de **a, o, u, au** suena como la **j española** (de «jamón»), al fondo de la garganta: [[Buch]] (libro), [[acht]] (ocho), [[auch]] (también), [[Nacht]] (noche).
- Después de **e, i, ä, ö, ü, ei, eu** o de una consonante suena **suave**, delante en la boca. Es el famoso sonido de [[ich]] (yo): [[nicht]] (no), [[Milch]] (leche), [[Mädchen]] (chica), [[sprechen]].
- **-ig** al final de palabra suena como «ich»: [[zwanzig]] (veinte), [[richtig]] (correcto), [[billig]] (barato).
- **chs** suena «ks»: [[sechs]] (seis).

:::truco Cómo hacer el sonido de «ich»
Di «**yyyy**» como en «yo» y luego **quítale la voz**: solo deja salir el aire, con la lengua en la misma posición. Ese soplido suave es el sonido de [[ich]]. Practica: [[ich]], [[mich]], [[nicht]], [[richtig]].
:::

## Paso 4: La h, la r y el final de las palabras
- **h al principio** es solo aire, como un suspiro suave (nunca una j fuerte): [[Hallo]], [[Haus]], [[heute]]. **h después de vocal** es muda: [[sehen]], [[Uhr]].
- **r al principio** o entre vocales se hace **al fondo de la garganta**, como unas gárgaras muy suaves: [[rot]] (rojo), [[Reis]] (arroz), [[Bruder]].
- **r al final** (o antes de consonante) casi desaparece y suena como una «a» suave: [[der]] (dea), [[vier]] (fia), [[Uhr]] (ua).
- **b, d, g al final** de palabra se endurecen y suenan **p, t, k**: [[gelb]] (amarillo) = «gelp», [[Kind]] (niño) = «kint», [[Tag]] (día) = «taak», [[Hund]] = «hunt».
- **ng** es una n nasal, sin «g» fuerte: [[lang]] (largo), [[Zeitung]] (periódico), [[Hunger]] (hambre).
- **pf** junta p y f a la vez: [[Apfel]] (manzana), [[Kopf]] (cabeza).

## Paso 5: ¿Dónde va el acento?
En la mayoría de las palabras alemanas, la fuerza va en la **primera sílaba**: VA-ter, MUT-ter, AR-beit (trabajo), EIN-kaufen (hacer la compra). Excepciones importantes:
- Palabras que empiezan por **be-, ge-, ver-, er-, ent-**: la fuerza va después. be-ZAH-len (pagar), ver-STE-hen (entender).
- Palabras extranjeras: Stu-DENT, Mu-SIK, Res-tau-RANT, y los verbos en **-ieren**: stu-DIE-ren.

:::es
El español tiene sonidos que el alemán **no** tiene (como la r vibrante de «perro» o la ñ) y el alemán tiene sonidos que el español no tiene (ö, ü, la s zumbada, la w, el sonido «ich»). Es normal que al principio te cueste: **tu boca tiene que aprender movimientos nuevos**, como cuando aprendes a bailar. Con 5 minutos diarios de repetir en voz alta, en pocas semanas sale solo.
:::

:::ojo Errores típicos de los hispanohablantes
- Pronunciar la **z** como en España (zeta) o como s: [[Zeit]] es «tsait».
- Decir **«es-tra-se»** en vez de [[Straße]] («shtraa-se»). El alemán no pone una e delante de sp/st.
- Pronunciar la **v** como b: [[viel]] es «fiil».
- Pronunciar la **h** inicial como una j fuerte: [[Hallo]] es solo aire suave.
- Decir **ch** como en «chocolate»: [[ich]] nunca suena «ich» con ch española.
:::

:::ejemplos
Ich spreche ein bisschen Deutsch. = Hablo un poco de alemán.
Wo ist die Straße? = ¿Dónde está la calle?
Das Wasser ist sehr gut. = El agua está muy buena.
Mein Vater heißt Jorge. = Mi padre se llama Jorge.
Das ist richtig! = ¡Eso es correcto!
Ich habe Hunger. = Tengo hambre.
:::

:::vocab Palabras de esta lección
das Wasser = el agua
der Vater | die Väter = el padre
die Mutter | die Mütter = la madre
die Zeit | die Zeiten = el tiempo (el que pasa)
die Schule | die Schulen = la escuela
die Straße | die Straßen = la calle
sprechen | er spricht = hablar
das Buch | die Bücher = el libro
die Milch = la leche
das Kind | die Kinder = el niño, la niña
der Tag | die Tage = el día
der Hund | die Hunde = el perro
richtig = correcto, bien
ein bisschen = un poco
:::

:::quiz
mc: ¿Cómo suena **sp** en [[sprechen]]? || «shp» || «esp» || «sp» como en español ## sp y st al principio suenan «shp» y «sht».
listenmc: acht || ¿Qué palabra oyes? || acht || ich || echt ## Después de a, el ch suena como la j de «jamón».
:::

:::resumen
- **w** = v de verdad, **v** = f, **z** = ts, **j** = y, **s** + vocal = s zumbada.
- **sch** = «sh»; **sp/st** al principio = «shp/sht»; **tsch** = ch.
- **ch** después de a, o, u, au = j española; en los demás casos, el sonido suave de [[ich]].
- r final casi «a»; **b, d, g** finales = **p, t, k**. Acento casi siempre en la primera sílaba.
:::
`,
ex: `
mc: ¿Cómo suena la **v** en [[Vater]]? || como f || como b || como w ## La v alemana casi siempre suena f: Vater = «faa-ta».
mc: ¿Cómo suena la **z** en [[Zeit]]? || «ts» || «z» española || «s» ## z = ts: Zeit = «tsait».
mc: ¿Cómo suena **st** en [[Straße]]? || «sht» || «est» || «st» ## st al principio = «sht». Nunca añadas una e delante.
mc: ¿En qué palabra el **ch** suena como la **j** española? || Buch || ich || Milch ## Después de u: Buch. En ich y Milch el ch es suave.
mc: ¿Cómo suena la **d** final de [[Kind]]? || como t || como d || no suena ## b, d, g finales suenan p, t, k: Kind = «kint».
mc: ¿Dónde va el acento en [[Arbeit]]? || en la primera sílaba: AR-beit || en la segunda: ar-BEIT || en las dos igual ## La mayoría de palabras alemanas llevan el acento en la primera sílaba.
listenmc: Wasser || ¿Qué palabra oyes? || Wasser || Vase || Messer ## Wasser empieza con la w de «motor».
listenmc: sechs || ¿Qué número oyes? || sechs (seis) || acht (ocho) || zehn (diez) ## chs suena «ks»: sechs.
listenmc: richtig || ¿Qué palabra oyes? || richtig || wichtig || ruhig ## -ig al final suena como ich: richtig.
match: w = v || v = f || z = ts || sch = sh || j = y ## Las letras «disfrazadas».
listen: Ich spreche ein bisschen Deutsch. = Hablo un poco de alemán. ## spreche con «shp», ich y bisschen.
listen: Wo ist die Straße? = ¿Dónde está la calle? ## wo con w de motor, Straße con «sht».
speak: Zehn Zitronen und sechs Äpfel. = Diez limones y seis manzanas.
speak: Ich habe heute keine Zeit. = Hoy no tengo tiempo.
`});

  desc: 'Saludar, presentarte, decir de dónde eres y hacer preguntas. Al terminar este módulo puedes tener tu primera conversación de verdad en alemán.',

LES({t: 'Saludar, despedirse y du o Sie', de: 'Begrüßung, Abschied · du oder Sie?', min: 15,
goal: 'Sabrás **saludar y despedirte** en cualquier momento del día, preguntar «¿qué tal?» y, sobre todo, decidir si hablas a alguien de **du** (tú) o de **Sie** (usted). En Alemania esto es muy importante.',
body: `
## Paso 1: Saludar según la hora
En español decimos «buenos días» hasta el mediodía y «buenas tardes» después. En alemán hay un saludo para cada parte del día:

| Saludo | Cuándo | En español |
|---|---|---|
| [[Guten Morgen!]] | por la mañana, hasta las 10 u 11 | ¡Buenos días! |
| [[Guten Tag!]] | durante el día, formal | ¡Buenos días! / ¡Buenas tardes! |
| [[Guten Abend!]] | a partir de las 18 h más o menos | ¡Buenas tardes! / ¡Buenas noches! |
| [[Gute Nacht!]] | **solo** cuando alguien se va a dormir | ¡Que descanses! |
| [[Hallo!]] | a cualquier hora, informal pero muy normal | ¡Hola! |

:::ojo «Gute Nacht» no es un saludo
Si llegas a una fiesta a las 21 h, di [[Guten Abend!]] o [[Hallo!]]. [[Gute Nacht!]] solo se dice al despedirse antes de dormir. Decirlo al llegar suena como si quisieras irte a la cama.
:::

:::nota Saludos regionales
En el norte de Alemania oirás [[Moin!]] a todas horas. En el sur y en Austria, [[Grüß Gott!]] y [[Servus!]]. En Suiza, [[Grüezi!]]. Todos significan «hola». No hace falta que los uses, pero es bueno reconocerlos.
:::

## Paso 2: Despedirse
| Despedida | Cuándo | En español |
|---|---|---|
| [[Auf Wiedersehen!]] | formal | ¡Adiós! / ¡Hasta la vista! |
| [[Tschüss!]] | informal, pero también en tiendas | ¡Adiós! / ¡Chao! |
| [[Bis morgen!]] | si os veis mañana | ¡Hasta mañana! |
| [[Bis später!]] / [[Bis bald!]] | si os veis pronto | ¡Hasta luego! / ¡Hasta pronto! |
| [[Schönen Tag noch!]] | muy amable, en tiendas | ¡Que tenga un buen día! |
| [[Schönes Wochenende!]] | los viernes | ¡Buen fin de semana! |
| [[Auf Wiederhören!]] | **solo por teléfono** | ¡Adiós! (por teléfono) |

:::truco
[[Auf Wiedersehen]] significa literalmente «hasta volver a vernos» (*sehen* = ver). Por teléfono no os veis, solo os oís (*hören* = oír): por eso se dice [[Auf Wiederhören]].
:::

## Paso 3: ¿Qué tal?
- Formal: [[Wie geht es Ihnen?]] (¿Cómo está usted?)
- Informal: [[Wie geht es dir?]] o, más corto, [[Wie geht's?]] (¿Qué tal? ¿Cómo estás?)

Respuestas, de mejor a peor: [[Sehr gut, danke!]] · [[Gut, danke.]] · [[Es geht.]] (regular, más o menos) · [[Nicht so gut.]] · [[Schlecht.]] Y después devuelves la pregunta: [[Und Ihnen?]] (formal) o [[Und dir?]] (informal).

:::es Una diferencia cultural
En español «¿qué tal?» es casi un saludo y nadie espera una respuesta larga. En Alemania [[Wie geht's?]] es una **pregunta de verdad**, y se la haces a gente que conoces. A la cajera del supermercado no se le pregunta: con [[Hallo!]] o [[Guten Tag!]] es suficiente.
:::

## Paso 4: ¿du o Sie? La gran pregunta
En alemán hay dos formas de decir «tú»:
- **du** = tú. Es informal y cercano.
- **Sie** = usted / ustedes. Es formal y respetuoso. **Siempre se escribe con S mayúscula.**

| Usa **du** con… | Usa **Sie** con… |
|---|---|
| familia y amigos | adultos que no conoces |
| niños y adolescentes | en oficinas, el banco, el ayuntamiento |
| compañeros jóvenes, de clase o de deporte | médicos, policía, dependientes |
| muchos compañeros de trabajo, si ellos lo usan | tu jefe o jefa (casi siempre) |

:::cuento
Piensa en el **Sie** como una chaqueta elegante: con desconocidos te la pones siempre. Si después alguien te dice [[Wir können uns duzen.]] (podemos tutearnos) o [[Sag doch du!]] (¡tutéame!), ya te la puedes quitar. Normalmente lo propone la persona mayor o con más rango.
:::

:::es
En España se tutea mucho más que en Alemania. En muchos países de Latinoamérica el «usted» es más frecuente, y eso se parece más a Alemania. Regla de oro: **si dudas, usa Sie**. Usar **du** con un desconocido adulto (por ejemplo, con un policía) puede parecer una falta de respeto.
:::

## Paso 5: Tres palabras mágicas
- [[Danke!]] / [[Danke schön!]] / [[Vielen Dank!]] = ¡Gracias! / ¡Muchas gracias!
- [[Bitte!]] tiene **tres significados**: «por favor», «de nada» y «aquí tiene». [[Ein Wasser, bitte.]] (Un agua, por favor.) · [[Danke! – Bitte!]] (¡Gracias! – ¡De nada!) · [[Bitte schön!]] (Aquí tiene.)
- [[Entschuldigung!]] = ¡Perdón! / ¡Disculpe! (para pedir perdón y también para llamar la atención). [[Es tut mir leid.]] = Lo siento.

:::dialogo Formal: en la oficina
Frau Weber: Guten Tag, Herr López! = ¡Buenos días, señor López!
Herr López: Guten Tag, Frau Weber! Wie geht es Ihnen? = ¡Buenos días, señora Weber! ¿Cómo está usted?
Frau Weber: Danke, sehr gut. Und Ihnen? = Gracias, muy bien. ¿Y usted?
Herr López: Auch gut, danke. = También bien, gracias.
Frau Weber: Schönen Tag noch! = ¡Que tenga un buen día!
Herr López: Danke, Ihnen auch. Auf Wiedersehen! = Gracias, igualmente. ¡Adiós!
:::

:::dialogo Informal: entre amigas
Sara: Hallo Lena! Wie geht's? = ¡Hola, Lena! ¿Qué tal?
Lena: Hi Sara! Es geht. Ich bin ein bisschen müde. Und dir? = ¡Hola, Sara! Regular. Estoy un poco cansada. ¿Y tú?
Sara: Mir geht es super! = ¡Yo estoy genial!
Lena: Schön! Bis morgen! = ¡Qué bien! ¡Hasta mañana!
Sara: Tschüss! = ¡Chao!
:::

:::nota Herr y Frau
Con **Sie** se usa el apellido: [[Herr]] + apellido (señor) y [[Frau]] + apellido (señora). **Frau** se usa para todas las mujeres adultas, casadas o no. La palabra «Fräulein» (señorita) ya no se usa.
:::

:::vocab Palabras y frases de esta lección
Guten Morgen! = ¡Buenos días! (por la mañana)
Guten Tag! = ¡Buenos días! / ¡Buenas tardes!
Guten Abend! = ¡Buenas tardes! / ¡Buenas noches! (al llegar)
Gute Nacht! = ¡Buenas noches! (al ir a dormir)
Auf Wiedersehen! = ¡Adiós! (formal)
Tschüss! = ¡Adiós! / ¡Chao!
Bis morgen! = ¡Hasta mañana!
Wie geht es Ihnen? = ¿Cómo está usted?
Wie geht's? = ¿Qué tal?
Es geht. = Regular, más o menos.
Danke schön! = ¡Muchas gracias!
Bitte! = Por favor / De nada / Aquí tiene
Entschuldigung! = ¡Perdón! / ¡Disculpe!
Es tut mir leid. = Lo siento.
der Herr | die Herren = el señor
die Frau | die Frauen = la señora; la mujer
:::

:::quiz
mc: Son las 20:00 y llegas a casa de unos vecinos. ¿Qué dices? || Guten Abend! || Gute Nacht! || Guten Morgen! ## «Gute Nacht» solo se dice al ir a dormir.
mc: Hablas con la doctora por primera vez. ¿Qué usas? || Sie || du ## Con adultos desconocidos y en situaciones formales: Sie.
:::

:::resumen
- Saludos: [[Guten Morgen]], [[Guten Tag]], [[Guten Abend]], [[Hallo]]. **Gute Nacht** solo al ir a dormir.
- Despedidas: [[Auf Wiedersehen]] (formal), [[Tschüss]] (informal), [[Auf Wiederhören]] (teléfono).
- **Sie** (con mayúscula) = usted, formal. **du** = tú, informal. Si dudas: **Sie**.
- [[Bitte]] = por favor, de nada y aquí tiene.
:::
`,

tf: [[Sie]] (usted) siempre se escribe con mayúscula. || r ## Sie con S mayúscula = usted. sie con minúscula = ella o ellos.
