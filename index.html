LES({t: 'Verbos reflexivos', de: 'Reflexive Verben', min: 20,
goal: 'Aprenderás los verbos que llevan **sich** (sich freuen, sich anziehen, sich treffen…). Para ti será fácil: el español también tiene verbos reflexivos (me lavo, me visto).',
body: `
## Paso 1: El pronombre reflexivo
Un verbo reflexivo es aquel en el que la acción **vuelve a la misma persona**: «yo **me** lavo». En alemán el pronombre es **sich** en el infinitivo: [[sich waschen]] (lavarse).

| Persona | Pronombre | Ejemplo |
|---|---|---|
| ich | [[mich]] | [[Ich wasche mich.]] |
| du | [[dich]] | [[Du wäschst dich.]] |
| er / sie / es | [[sich]] | [[Er wäscht sich.]] |
| wir | [[uns]] | [[Wir waschen uns.]] |
| ihr | [[euch]] | [[Ihr wascht euch.]] |
| sie / Sie | [[sich]] | [[Sie waschen sich.]] |

:::es ¡Casi igual que en español!
«Me lavo, te lavas, **se** lava, nos lavamos, os laváis, **se** lavan». En alemán: mich, dich, **sich**, uns, euch, **sich**. La única diferencia de posición: en español el pronombre va **delante** del verbo y en alemán **detrás**: [[Ich wasche mich.]] = **Me** lavo.
:::

## Paso 2: Los reflexivos más útiles
| Alemán | Español |
|---|---|
| [[sich anziehen]] / [[sich ausziehen]] | vestirse / desvestirse |
| [[sich duschen]] | ducharse |
| [[sich beeilen]] | darse prisa |
| [[sich ausruhen]] | descansar |
| [[sich fühlen]] | sentirse |
| [[sich erkälten]] | resfriarse |
| [[sich setzen]] | sentarse |
| [[sich treffen]] | quedar, verse |
| [[sich freuen]] | alegrarse |
| [[sich ärgern]] | enfadarse |
| [[sich interessieren für]] | interesarse por |
| [[sich vorstellen]] | presentarse |
| [[sich entschuldigen]] | disculparse |
| [[sich verabreden]] | quedar (citarse) |

:::ojo No siempre coinciden con el español
Algunos verbos son reflexivos en un idioma y no en el otro:
- «Me levanto» = [[Ich stehe auf.]] (¡sin sich!)
- «Me voy» = [[Ich gehe.]]
- «Me acuerdo» = [[Ich erinnere mich.]] (sí, con sich)
- «Descanso» = [[Ich ruhe mich aus.]] (con sich en alemán)
Apréndelos siempre con o sin **sich**, tal como aparecen en el vocabulario.
:::

## Paso 3: El pronombre en el orden de la frase
El pronombre reflexivo va **justo detrás del verbo conjugado** (o detrás del sujeto si hay inversión):
- [[Ich ziehe mich schnell an.]] (Me visto rápido.)
- [[Heute fühle ich mich gut.]] (Hoy me siento bien.)
- [[Wir treffen uns um acht.]] (Quedamos a las ocho.)
- Con modal: [[Ich muss mich beeilen.]] (Tengo que darme prisa.)
- En Perfekt, con **haben**: [[Ich habe mich erkältet.]] (Me he resfriado.)

## Paso 4: Cuando hay otro objeto: mir y dir
Si además del pronombre hay **otra cosa** (en acusativo), el reflexivo pasa a **dativo** en ich y du:
- [[Ich wasche mich.]] → [[Ich wasche ==mir== die Hände.]] (Me lavo las manos.)
- [[Du putzt ==dir== die Zähne.]] (Te cepillas los dientes.)
- Con er, sie, wir, ihr no cambia: [[Er kämmt sich die Haare.]] (Se peina.)

:::truco
Solo cambian **dos**: **mich → mir** y **dich → dir**. Todos los demás se quedan igual. Y la pista es muy clara: si hay **una parte del cuerpo o una prenda** (die Hände, die Zähne, die Jacke), usa mir / dir.
:::

:::ejemplos
Ich freue mich auf das Wochenende. = Tengo muchas ganas de que llegue el fin de semana.
Wie fühlst du dich heute? = ¿Cómo te sientes hoy?
Setzen Sie sich bitte! = ¡Siéntese, por favor!
Wir treffen uns vor dem Kino. = Quedamos delante del cine.
Ich habe mich erkältet. = Me he resfriado.
Beeil dich! Der Bus kommt! = ¡Date prisa! ¡Viene el autobús!
Ich putze mir die Zähne und ziehe mich an. = Me cepillo los dientes y me visto.
:::

:::vocab Verbos reflexivos
sich anziehen | er zieht sich an = vestirse
sich ausziehen | er zieht sich aus = desvestirse
sich duschen = ducharse
sich beeilen = darse prisa
sich ausruhen | er ruht sich aus = descansar
sich fühlen = sentirse
sich erkälten = resfriarse
sich setzen = sentarse
sich treffen | er trifft sich = quedar, verse
sich freuen = alegrarse
sich ärgern = enfadarse
sich erinnern an = acordarse de
sich die Zähne putzen = cepillarse los dientes
die Hand | die Hände = la mano
der Zahn | die Zähne = el diente
das Haar | die Haare = el pelo
:::

:::quiz
gap: Ich fühle ___ heute nicht gut. (me) || mich ## ich → mich.
gap: Wir treffen ___ um acht. (nos) || uns ## wir → uns.
:::

:::resumen
- Pronombres: **mich, dich, sich, uns, euch, sich**. Van **detrás** del verbo.
- Muchos coinciden con el español (sich waschen, sich setzen), pero no todos (aufstehen, sin sich).
- Perfekt con **haben**: [[Ich habe mich erkältet.]]
- Con otra cosa en acusativo: **mir, dir**: [[Ich wasche mir die Hände.]]
:::
`,
ex: `
gap: Ich ziehe ___ schnell an. (me) || mich ## ich → mich.
gap: Beeil ___! (te — du) || dich ## du → dich.
gap: Er ärgert ___ über den Lärm. (se) || sich ## er → sich.
gap: Kinder, wascht ___ die Hände! (os) || euch ## ihr → euch.
gap: Ich putze ___ die Zähne. (me — con otro objeto) || mir ## Hay otro objeto (die Zähne): mir.
gap: Setzen Sie ___ bitte! (se — usted) || sich ## Sie → sich.
mc: «Me levanto a las siete» || Ich stehe um sieben auf. || Ich stehe mich um sieben auf. || Ich mich stehe um sieben auf. ## aufstehen no es reflexivo en alemán.
mc: «Me he resfriado» || Ich habe mich erkältet. || Ich bin mich erkältet. || Ich habe erkältet. ## Los reflexivos forman el Perfekt con haben.
mc: ¿Cuál es correcta? || Heute fühle ich mich gut. || Heute ich fühle mich gut. || Heute fühle mich ich gut. ## Verbo en posición 2, luego sujeto y pronombre.
order: (Quedamos delante del cine.) wir treffen uns vor dem Kino ## sich treffen: wir treffen uns.
order: (Tengo que darme prisa.) ich muss mich beeilen ## Con modal: muss + mich + infinitivo al final.
write: ¿Cómo te sientes? || Wie fühlst du dich? ## sich fühlen: du fühlst dich.
listen: Ich dusche mich und ziehe mich schnell an. = Me ducho y me visto rápido. ## Dos verbos reflexivos.
speak: Am Wochenende ruhe ich mich aus und treffe mich mit Freunden. = El fin de semana descanso y quedo con amigos.
`});

LES({t: 'Verbos con preposición', de: 'Verben mit Präpositionen · worauf? darauf', min: 25,
goal: 'Aprenderás los verbos que siempre van con **la misma preposición** (warten **auf**, sich freuen **auf**, denken **an**…) y a preguntar y responder con **worauf, darauf, wofür, dafür**.',
body: `
## Paso 1: Verbo + preposición = un bloque
Algunos verbos **siempre** llevan la misma preposición, igual que en español «pensar **en**», «soñar **con**», «tener miedo **de**». El problema: **la preposición alemana casi nunca es la que esperas**. Por eso hay que aprender el **bloque completo**: verbo + preposición + caso.

| Alemán | Caso | Español |
|---|---|---|
| [[warten auf]] | + acusativo | esperar (a) |
| [[sich freuen auf]] | + acusativo | tener ganas de (algo futuro) |
| [[sich freuen über]] | + acusativo | alegrarse de (algo presente o pasado) |
| [[denken an]] | + acusativo | pensar en |
| [[sich erinnern an]] | + acusativo | acordarse de |
| [[sich interessieren für]] | + acusativo | interesarse por |
| [[sich kümmern um]] | + acusativo | ocuparse de, cuidar de |
| [[sprechen über]] | + acusativo | hablar sobre |
| [[sich ärgern über]] | + acusativo | enfadarse por |
| [[Lust haben auf]] | + acusativo | tener ganas de |
| [[sprechen mit]] | + dativo | hablar con |
| [[telefonieren mit]] | + dativo | hablar por teléfono con |
| [[Angst haben vor]] | + dativo | tener miedo de |
| [[träumen von]] | + dativo | soñar con |
| [[teilnehmen an]] | + dativo | participar en |
| [[fragen nach]] | + dativo | preguntar por |

:::es Las preposiciones no se traducen
- «Pensar **en**» → [[denken ==an==]] (no ~~denken in~~)
- «Soñar **con**» → [[träumen ==von==]] (no ~~träumen mit~~)
- «Esperar **a** alguien» → [[warten ==auf==]] (no ~~warten zu~~)
- «Interesarse **por**» → [[sich interessieren ==für==]]
Apréndelos como **frases enteras**, por ejemplo: [[Ich warte auf den Bus.]]
:::

:::truco auf + acusativo casi siempre
Una pista: con estos verbos, **über** y **auf** van casi siempre con **acusativo**. Y **mit, von, vor, nach** llevan **dativo** (como siempre: mit y von son preposiciones de dativo).
:::

## Paso 2: freuen auf y freuen über
- [[Ich freue mich ==auf== den Urlaub.]] → el viaje **todavía no ha llegado**: tengo ganas.
- [[Ich freue mich ==über== das Geschenk.]] → el regalo **ya lo tengo**: me alegro.

## Paso 3: Preguntar: wo(r) + preposición
Para preguntar por una **cosa**, se une **wo-** con la preposición. Si la preposición empieza por vocal, se pone una **r** en medio: **wor-**.
- [[Worauf wartest du?]] – [[Auf den Bus.]] (¿A qué esperas? – Al autobús.)
- [[Wofür interessierst du dich?]] – [[Für Musik.]] (¿Qué te interesa? – La música.)
- [[Woran denkst du?]] – [[An den Urlaub.]] (¿En qué piensas? – En las vacaciones.)
- [[Worüber sprecht ihr?]] – [[Über den Film.]]

Para preguntar por una **persona**, preposición + **wen** o **wem**:
- [[Auf wen wartest du?]] – [[Auf meine Schwester.]]
- [[Mit wem sprichst du?]] – [[Mit dem Chef.]]

## Paso 4: Responder sin repetir: da(r) + preposición
Para no repetir una **cosa**, se usa **da-** (o **dar-** delante de vocal) + preposición:
- [[Freust du dich auf den Urlaub?]] – [[Ja, ich freue mich ==darauf==.]] (Sí, tengo muchas ganas.)
- [[Denkst du an den Termin?]] – [[Ja, ich denke ==daran==.]] (Sí, me acuerdo.)
- [[Interessierst du dich für Fußball?]] – [[Nein, dafür interessiere ich mich nicht.]]

Para **personas**, preposición + pronombre: [[Wartest du auf Anna? – Ja, ich warte auf sie.]]

:::ejemplos
Ich warte schon seit 20 Minuten auf den Bus. = Llevo 20 minutos esperando el autobús.
Wir freuen uns sehr auf deinen Besuch! = ¡Tenemos muchas ganas de tu visita!
Sie kümmert sich um ihre Mutter. = Ella cuida de su madre.
Hast du Lust auf ein Eis? = ¿Te apetece un helado?
Mein Sohn hat Angst vor Hunden. = Mi hijo tiene miedo a los perros.
Ich denke oft an meine Familie in Bolivien. = Pienso a menudo en mi familia en Bolivia.
Worüber habt ihr gesprochen? = ¿De qué habéis hablado?
:::

:::vocab Verbos con preposición
warten auf = esperar a/por
sich freuen auf = tener ganas de (algo futuro)
sich freuen über = alegrarse de
denken an = pensar en
sich interessieren für = interesarse por
sich kümmern um = ocuparse de, cuidar de
sprechen über = hablar de/sobre
Lust haben auf = tener ganas de, apetecer
Angst haben vor = tener miedo de
träumen von = soñar con
teilnehmen an | er nimmt teil = participar en
der Besuch | die Besuche = la visita
:::

:::quiz
gap: Ich warte ___ den Bus. (a) || auf ## warten auf + acusativo.
mc: «¿En qué piensas?» || Woran denkst du? || Worauf denkst du? || Was denkst du an? ## denken an → woran.
:::

:::resumen
- Aprende **verbo + preposición + caso** como un bloque: warten **auf** + A, denken **an** + A, Angst haben **vor** + D…
- freuen **auf** (futuro) / freuen **über** (presente o pasado).
- Preguntar por cosas: **wo(r) + preposición** (worauf, wofür, woran). Por personas: auf **wen**, mit **wem**.
- Responder por cosas: **da(r) + preposición** (darauf, dafür, daran).
:::
`,
ex: `
gap: Ich freue mich ___ die Ferien. (tengo ganas de — futuro) || auf ## Algo que va a llegar: freuen auf.
gap: Wir haben uns sehr ___ das Geschenk gefreut. (nos alegramos de) || über ## Algo que ya tenemos: freuen über.
gap: Ich denke oft ___ dich. (en) || an ## denken an.
gap: Interessierst du dich ___ Politik? (por) || für ## sich interessieren für.
gap: Mein Sohn hat Angst ___ dem Hund. (de) || vor ## Angst haben vor + dativo.
gap: Ich telefoniere jeden Tag ___ meiner Mutter. (con) || mit ## telefonieren mit + dativo.
gap: Wer kümmert sich ___ die Kinder? (de) || um ## sich kümmern um.
gap: Hast du Lust ___ einen Spaziergang? (de) || auf ## Lust haben auf.
mc: «¿A qué esperas?» || Worauf wartest du? || Wofür wartest du? || Was wartest du auf? ## warten auf → worauf.
mc: «¿Con quién hablas?» || Mit wem sprichst du? || Womit sprichst du? || Mit wen sprichst du? ## Persona + dativo: mit wem.
mc: Freust du dich auf die Party? – Ja, ich freue mich… || darauf. || dafür. || daran. ## freuen auf → darauf.
match: warten = auf || denken = an || träumen = von || Angst haben = vor || sich interessieren = für ## Verbo + preposición.
write: Espero el autobús. || Ich warte auf den Bus. ## warten auf + acusativo.
speak: Ich freue mich schon auf das Wochenende. = Ya tengo ganas de que llegue el fin de semana.
`});

LES({t: 'werden: llegar a ser y el futuro', de: 'Das Verb werden', min: 15,
goal: 'Aprenderás el verbo **werden**, que sirve para **cambios** (hacerse, ponerse, volverse, cumplir años) y para hablar del **futuro**.',
body: `
## Paso 1: La conjugación
| | werden |
|---|---|
| ich | [[werde]] |
| du | [[wirst]] |
| er / sie / es | [[wird]] |
| wir | [[werden]] |
| ihr | [[werdet]] |
| sie / Sie | [[werden]] |

Pasado: [[wurde]] (Präteritum) y [[ist geworden]] (Perfekt, ¡con sein!, porque es un cambio de estado).

## Paso 2: werden = cambiar, llegar a ser
En español tenemos muchos verbos para el cambio: **hacerse, ponerse, volverse, convertirse, llegar a ser**. En alemán todos son **werden**:
- [[Ich will Ärztin werden.]] (Quiero ser médica.)
- [[Es wird kalt.]] (Empieza a hacer frío / Se pone frío.)
- [[Er wird schnell rot.]] (Se pone rojo enseguida.)
- [[Meine Tochter wird morgen zehn.]] (Mi hija cumple diez años mañana.)
- [[Das Wetter wird besser.]] (El tiempo mejora.)
- [[Sie ist Mutter geworden.]] (Se ha hecho madre / Ha sido madre.)

:::es
«¿Qué quieres **ser** de mayor?» → [[Was willst du werden?]] Aquí el alemán usa **werden**, no sein, porque es un **cambio**: todavía no lo eres.
:::

## Paso 3: werden + infinitivo = futuro
Con **werden + infinitivo al final** se forma el futuro: [[Ich werde dich anrufen.]] (Te llamaré.)

:::truco En la vida diaria, el presente basta
Los alemanes usan **poco** el futuro con werden. Normalmente dicen el **presente + una palabra de tiempo**: [[Morgen rufe ich dich an.]] (Mañana te llamo.) Usa **werden** sobre todo para:
- **promesas**: [[Ich werde pünktlich sein!]] (¡Seré puntual!)
- **suposiciones**: [[Er wird krank sein.]] (Estará enfermo.)
- **planes importantes**: [[Nächstes Jahr werde ich die Prüfung machen.]]
:::

:::ojo No confundas werden y wollen
- [[Ich werde nach Spanien fliegen.]] = **Volaré** a España (futuro).
- [[Ich will nach Spanien fliegen.]] = **Quiero** volar a España.
Si sabes inglés: el alemán **will** no es futuro, ¡es «quiero»!
:::

:::ejemplos
Im Herbst werden die Tage kürzer. = En otoño los días se hacen más cortos.
Was möchtest du werden? – Krankenpfleger. = ¿Qué te gustaría ser? – Enfermero.
Es wird bald dunkel. = Pronto se hará de noche.
Ich bin gestern 40 geworden. = Ayer cumplí 40 años.
Keine Sorge, alles wird gut! = No te preocupes, ¡todo irá bien!
Ich werde dir morgen eine E-Mail schreiben. = Mañana te escribiré un correo.
:::

:::vocab Palabras de esta lección
werden | er wird · ist geworden = llegar a ser, ponerse, hacerse
dunkel = oscuro
rot werden = ponerse rojo
die Sorge | die Sorgen = la preocupación
Keine Sorge! = ¡No te preocupes!
bald = pronto
nächstes Jahr = el año que viene
:::

:::quiz
gap: Mein Sohn ___ morgen fünf. (cumplir — werden) || wird ## er wird.
mc: «Quiero ser profesora» || Ich will Lehrerin werden. || Ich will Lehrerin sein werden. || Ich werde Lehrerin wollen. ## Cambio futuro: werden (al final con el modal).
:::

:::resumen
- **werden**: werde, wirst, wird, werden, werdet, werden. Perfekt: **ist geworden**.
- Cambio: hacerse, ponerse, cumplir años: [[Es wird kalt.]] [[Sie wird 30.]]
- Futuro: **werden + infinitivo** (para promesas y suposiciones). En general basta el presente.
- **will** ≠ futuro: will = quiero.
:::
`,
ex: `
gap: Im Winter ___ es früh dunkel. (werden) || wird ## es wird.
gap: Was ___ du von Beruf werden? (querer) || willst ## wollen + werden al final.
gap: Ich ___ dich morgen anrufen. (futuro — werden) || werde ## ich werde + infinitivo.
gap: Wir sind Eltern ___. (werden — Perfekt) || geworden ## werden → ist geworden.
gap: ___ du wirklich Pilotin werden? (wollen) || Willst ## Pregunta: Willst du… werden?
mc: «Se ha hecho tarde» || Es ist spät geworden. || Es hat spät geworden. || Es ist spät gewordet. ## werden → ist geworden.
mc: ¿Qué significa «Ich werde kommen»? || Vendré. || Quiero venir. || Vengo. ## werden + infinitivo = futuro.
mc: «Todo irá bien» || Alles wird gut. || Alles ist gut werden. || Alles will gut. ## werden = cambio/futuro.
mc: «Mi abuela cumple 80 años» || Meine Oma wird 80. || Meine Oma hat 80. || Meine Oma ist 80 geworden werden. ## Cumplir años = werden.
order: (Quiero ser enfermera.) ich möchte Krankenpflegerin werden ## Modal + werden al final.
write: Hace frío. (empieza a hacer frío) || Es wird kalt. ## Cambio: werden.
listen: Keine Sorge, alles wird gut! = ¡No te preocupes, todo irá bien! ## Una frase para animar.
speak: Nächstes Jahr werde ich die A2-Prüfung machen. = El año que viene haré el examen A2.
`});

LES({t: 'Ser educada: würde, hätte, könnte', de: 'Konjunktiv II: Höflichkeit, Wünsche, Ratschläge', min: 25,
goal: 'Aprenderás a pedir cosas **con mucha educación**, a expresar **deseos** y a dar **consejos**, como con el condicional español: me gustaría, podría, tendría, debería.',
body: `
## Paso 1: El «condicional» alemán
En español usamos el condicional para ser educados: «¿**Podría** ayudarme?», «Me **gustaría** un café», «**Deberías** descansar». En alemán existe lo mismo: el **Konjunktiv II**. Para el A2 necesitas solo **cinco formas**:

| | würde | hätte | wäre | könnte | sollte |
|---|---|---|---|---|---|
| ich | [[würde]] | [[hätte]] | [[wäre]] | [[könnte]] | [[sollte]] |
| du | [[würdest]] | [[hättest]] | [[wärst]] | [[könntest]] | [[solltest]] |
| er / sie / es | [[würde]] | [[hätte]] | [[wäre]] | [[könnte]] | [[sollte]] |
| wir | [[würden]] | [[hätten]] | [[wären]] | [[könnten]] | [[sollten]] |
| ihr | [[würdet]] | [[hättet]] | [[wärt]] | [[könntet]] | [[solltet]] |
| sie / Sie | [[würden]] | [[hätten]] | [[wären]] | [[könnten]] | [[sollten]] |

:::truco Los puntitos de la educación
Fíjate: **würde, hätte, wäre, könnte** tienen **diéresis** (puntitos). Puedes imaginar que los puntitos son **dos ojitos amables** que miran con educación. Sin puntitos (wurde, hatte, war, konnte) son pasado; **con puntitos son corteses**.
:::

## Paso 2: Pedir cosas con educación
| Directo (un poco brusco) | Educado | Español |
|---|---|---|
| [[Helfen Sie mir!]] | [[Könnten Sie mir bitte helfen?]] | ¿Podría ayudarme, por favor? |
| [[Machen Sie das Fenster zu!]] | [[Würden Sie bitte das Fenster zumachen?]] | ¿Le importaría cerrar la ventana? |
| [[Ich will einen Kaffee.]] | [[Ich hätte gern einen Kaffee.]] | Querría un café. |
| [[Haben Sie Zeit?]] | [[Hätten Sie kurz Zeit?]] | ¿Tendría un momento? |

:::nota «Ich hätte gern…»
En tiendas, panaderías y restaurantes, [[Ich hätte gern…]] es la fórmula más elegante para pedir: [[Ich hätte gern zwei Brötchen, bitte.]] Significa lo mismo que [[Ich möchte…]] y suena igual de bien.
:::

## Paso 3: Deseos y sueños
- [[Ich würde gern nach Italien fahren.]] (Me gustaría ir a Italia.)
- [[Ich wäre gern reich.]] (Me gustaría ser rica.)
- [[Ich hätte gern mehr Zeit.]] (Me gustaría tener más tiempo.)

**würde + gern + infinitivo al final** es la forma más fácil para cualquier deseo.

## Paso 4: Consejos y propuestas
- **Consejo**: [[Du solltest mehr schlafen.]] (Deberías dormir más.) · [[Sie sollten zum Arzt gehen.]]
- **Consejo personal**: [[An deiner Stelle würde ich das Angebot annehmen.]] (Yo, en tu lugar, aceptaría la oferta.)
- **Propuesta**: [[Wir könnten ins Kino gehen.]] (Podríamos ir al cine.) · [[Wie wäre es mit Samstag?]] (¿Qué tal el sábado?)

:::truco Para el examen oral (Sprechen, parte 3)
En la parte en la que tienes que **planear algo** con tu compañera, estas frases te salvan:
- [[Wir könnten…]] (Podríamos…)
- [[Wie wäre es mit…?]] (¿Qué tal…?)
- [[Hättest du am Freitag Zeit?]] (¿Tendrías tiempo el viernes?)
- [[Ich würde lieber… ]] (Yo preferiría…)
:::

## Paso 5: Un adelanto: si yo tuviera…
Con **wenn** y el Konjunktiv II se habla de cosas **imaginarias**: [[Wenn ich Zeit hätte, würde ich mehr lesen.]] (Si tuviera tiempo, leería más.) Es del nivel B1, pero ya lo puedes entender.

:::ejemplos
Könnten Sie das bitte wiederholen? = ¿Podría repetirlo, por favor?
Ich hätte gern ein Kilo Tomaten. = Querría un kilo de tomates.
Würdest du mir bitte helfen? = ¿Me ayudarías, por favor?
Du solltest nicht so viel arbeiten. = No deberías trabajar tanto.
Wir könnten am Sonntag grillen. = Podríamos hacer una barbacoa el domingo.
Es wäre schön, wenn du kommen könntest. = Sería bonito que pudieras venir.
:::

:::vocab Palabras de esta lección
würde = (forma educada de werden) haría
hätte = tendría
wäre = sería, estaría
könnte = podría
sollte = debería
Ich hätte gern… = Querría… (para pedir)
gern = con gusto
reich = rico
das Angebot | die Angebote = la oferta
annehmen | er nimmt an = aceptar
wiederholen = repetir
an deiner Stelle = en tu lugar
:::

:::quiz
gap: ___ Sie mir bitte helfen? (podría) || Könnten ## Petición educada: Könnten Sie…?
mc: Consejo: «Deberías ir al médico.» || Du solltest zum Arzt gehen. || Du sollst zum Arzt gehen. || Du würdest zum Arzt gehen. ## Consejo: solltest.
:::

:::resumen
- Cortesía: [[Könnten Sie…?]] [[Würden Sie…?]] [[Ich hätte gern…]]
- Deseos: **würde gern + infinitivo**: [[Ich würde gern reisen.]]
- Consejos: [[Du solltest…]] · Propuestas: [[Wir könnten…]] · [[Wie wäre es mit…?]]
- Con diéresis = educado (würde, hätte, wäre, könnte); sin diéresis = pasado.
:::
`,
ex: `
gap: ___ Sie bitte das Fenster zumachen? (würde — Sie) || Würden ## Würden Sie bitte…?
gap: Ich ___ gern zwei Brötchen. (querría — haben en forma educada) || hätte ## Ich hätte gern… = Querría…
gap: Du ___ mehr Wasser trinken. (deberías) || solltest ## Consejo: du solltest.
gap: Wir ___ am Samstag ins Museum gehen. (podríamos) || könnten ## Propuesta: wir könnten.
gap: Ich ___ gern in Spanien leben. (me gustaría — werden en forma educada) || würde ## Deseo: würde gern + infinitivo.
gap: Wie ___ es mit Freitag? (sería — sein) || wäre ## Wie wäre es mit…? = ¿Qué tal…?
mc: ¿Cuál es más educada? || Könnten Sie mir bitte helfen? || Helfen Sie mir! || Sie helfen mir. ## Konjunktiv II + bitte = muy educado.
mc: «Me gustaría viajar a Japón» || Ich würde gern nach Japan reisen. || Ich werde gern nach Japan reisen. || Ich wurde gern nach Japan reisen. ## würde + gern + infinitivo.
mc: «Si tuviera dinero…» || Wenn ich Geld hätte, … || Wenn ich Geld hatte, … || Wenn ich Geld habe würde, … ## Algo imaginario: hätte.
order: (¿Podría repetirlo, por favor?) könnten Sie das bitte wiederholen ## Könnten Sie… + infinitivo al final.
order: (Yo, en tu lugar, llamaría al médico.) an deiner Stelle würde ich den Arzt anrufen ## würde + infinitivo al final.
write: Querría un café, por favor. || Ich hätte gern einen Kaffee, bitte. / Ich möchte einen Kaffee, bitte. / Ich hätte gerne einen Kaffee, bitte. ## Ich hätte gern… o Ich möchte…
listen: Wir könnten am Sonntag zusammen kochen. = Podríamos cocinar juntas el domingo. ## Propuesta con könnten.
speak: Entschuldigung, könnten Sie mir bitte sagen, wo die Toiletten sind? = Disculpe, ¿podría decirme dónde están los servicios?
`});

LES({t: 'man, es, jemand, etwas, einer…', de: 'man · es · Indefinitpronomen', min: 20,
goal: 'Aprenderás palabras pequeñas pero muy frecuentes: **man** (se, uno), los usos de **es**, **jemand / niemand**, **etwas / nichts / alles** y cómo decir **«tengo uno»** o **«no tengo ninguno»**.',
body: `
## Paso 1: man = «se» impersonal
[[man]] se usa para hablar de la gente en general, como el «**se**» o el «**uno**» español. El verbo va en **tercera persona del singular** (como con er):
- [[Hier spricht man Deutsch.]] (Aquí se habla alemán.)
- [[Wie schreibt man das?]] (¿Cómo se escribe eso?)
- [[Im Museum darf man nicht fotografieren.]] (En el museo no se puede hacer fotos.)
- [[Was macht man in Berlin am Wochenende?]] (¿Qué se hace en Berlín el fin de semana?)

:::ojo man y der Mann
[[man]] (con una n y minúscula) = «se», «uno». [[der Mann]] (doble n y mayúscula) = el hombre. Suenan igual, pero no tienen nada que ver.
:::

## Paso 2: es, la palabra comodín
Como en alemán **siempre** tiene que haber sujeto, se usa [[es]] en frases que en español no llevan sujeto:
- **El tiempo**: [[Es regnet.]] (Llueve.) [[Es schneit.]] (Nieva.) [[Es ist kalt.]] (Hace frío.)
- **La hora**: [[Es ist acht Uhr.]] [[Es ist spät.]]
- **hay**: [[Es gibt ein Problem.]]
- **cómo estás**: [[Wie geht es dir?]] [[Es geht mir gut.]]
- **Expresiones**: [[Es tut mir leid.]] [[Es klingelt.]] (Llaman a la puerta.) [[Es ist schön hier.]]

## Paso 3: Alguien, nadie, algo, nada, todo
| Alemán | Español | Ejemplo |
|---|---|---|
| [[jemand]] | alguien | [[Ist jemand da?]] |
| [[niemand]] | nadie | [[Niemand hat angerufen.]] |
| [[etwas]] (o [[was]]) | algo | [[Möchtest du etwas trinken?]] |
| [[nichts]] | nada | [[Ich habe nichts gehört.]] |
| [[alles]] | todo | [[Alles ist gut.]] |
| [[alle]] | todos | [[Alle sind da.]] |
| [[viel]] / [[viele]] | mucho / muchos | [[Ich habe viel Arbeit.]] |
| [[wenig]] / [[wenige]] | poco / pocos | [[Wir haben wenig Zeit.]] |

## Paso 4: «Tengo uno», «no tengo ninguno», «tengo algunos»
Para no repetir un sustantivo, el alemán usa **einer / keiner / welche** como pronombres:

| Pregunta | Sí | No |
|---|---|---|
| [[Hast du einen Stift?]] (der) | [[Ja, ich habe einen.]] | [[Nein, ich habe keinen.]] |
| [[Hast du eine Tasche?]] (die) | [[Ja, ich habe eine.]] | [[Nein, ich habe keine.]] |
| [[Hast du ein Handy?]] (das) | [[Ja, ich habe eins.]] | [[Nein, ich habe keins.]] |
| [[Hast du Briefmarken?]] (plural) | [[Ja, ich habe welche.]] | [[Nein, ich habe keine.]] |

:::es
En español decimos «sí, tengo **uno**» o «no, no tengo **ninguno**». En alemán es igual, pero el pronombre cambia según el **género** y el **caso**: **einen** (der, acusativo), **eine** (die), **eins** (das). Y para el plural se usa **welche** («algunos»): [[Brauchst du Eier? – Nein, ich habe noch welche.]] (¿Necesitas huevos? – No, todavía me quedan.)
:::

:::ejemplos
In Deutschland trennt man den Müll. = En Alemania se separa la basura.
Es klingelt! Kannst du aufmachen? = ¡Llaman a la puerta! ¿Puedes abrir?
Hat jemand meinen Schlüssel gesehen? = ¿Alguien ha visto mi llave?
Ich habe heute noch nichts gegessen. = Hoy todavía no he comido nada.
Gibt es hier einen Geldautomaten? – Ja, da vorne ist einer. = ¿Hay un cajero por aquí? – Sí, ahí delante hay uno.
Ich brauche Kartoffeln. Hast du welche? = Necesito patatas. ¿Tienes?
:::

:::vocab Palabras de esta lección
man = se, uno (impersonal)
jemand = alguien
niemand = nadie
etwas = algo
nichts = nada
alles = todo
alle = todos
wenig = poco
einer, eine, eins = uno, una
keiner, keine, keins = ninguno, ninguna
welche = algunos, algunas (plural)
schneien | es schneit = nevar
klingeln = sonar el timbre
der Müll = la basura
trennen = separar
die Briefmarke | die Briefmarken = el sello
die Kartoffel | die Kartoffeln = la patata
:::

:::quiz
gap: Wie schreibt ___ das? (se) || man ## man = se (impersonal).
mc: Hast du einen Kuli? – Ja, ich habe… || einen. || eins. || welche. ## der Kuli (acusativo) → einen.
:::

:::resumen
- **man** + verbo en 3.ª persona = «se»: [[Hier spricht man Deutsch.]]
- **es** para el tiempo, la hora, «hay» y expresiones: [[Es regnet.]] [[Es gibt…]]
- **jemand / niemand, etwas / nichts, alles / alle**.
- «Tengo uno»: **einen / eine / eins**; «ninguno»: **keinen / keine / keins**; plural: **welche / keine**.
:::
`,
ex: `
gap: Im Kino darf ___ nicht telefonieren. (se) || man ## man + darf (3.ª persona).
gap: ___ regnet schon wieder! || Es ## El tiempo: es regnet.
gap: Ist ___ zu Hause? (alguien) || jemand ## jemand = alguien.
gap: ___ hat mich angerufen. (nadie) || Niemand ## niemand = nadie.
gap: Möchtest du ___ essen? (algo) || etwas ## etwas = algo.
gap: Brauchst du einen Regenschirm? – Nein, ich habe ___. (uno — der Regenschirm) || einen ## Acusativo masculino: einen.
gap: Hast du ein Auto? – Nein, ich habe ___. (ninguno — das Auto) || keins ## das → keins.
gap: Wir brauchen Eier. Hast du ___? (algunos) || welche ## Plural: welche.
mc: «En Alemania se come mucho pan» || In Deutschland isst man viel Brot. || In Deutschland man isst viel Brot. || In Deutschland isst der Mann viel Brot. ## man es el sujeto: va detrás del verbo.
mc: «No he oído nada» || Ich habe nichts gehört. || Ich habe nicht nichts gehört. || Ich habe nicht etwas gehört. ## Una sola negación: nichts.
mc: «Hace frío» || Es ist kalt. || Ist kalt. || Ich bin kalt. ## Siempre con sujeto: es.
write: ¿Cómo se dice eso en alemán? || Wie sagt man das auf Deutsch? / Wie heißt das auf Deutsch? ## man = se.
listen: Es klingelt! Ist da jemand? = ¡Llaman a la puerta! ¿Hay alguien? ## es klingelt; jemand.
speak: Hier darf man nicht parken, aber da vorne gibt es einen Parkplatz. = Aquí no se puede aparcar, pero ahí delante hay un aparcamiento.
`});

LES({t: 'Familia y personas', de: 'Familie und Menschen beschreiben', min: 20,
goal: 'Podrás **hablar de tu familia** y **describir a una persona**: cómo es por fuera (alta, morena, con gafas…) y por dentro (simpática, tranquila…). Es un tema fijo del examen oral.',
body: `
## Paso 1: La familia
:::vocab La familia
die Eltern | (solo plural) = los padres
die Mutter | die Mütter = la madre
der Vater | die Väter = el padre
die Geschwister | (solo plural) = los hermanos
die Schwester | die Schwestern = la hermana
der Bruder | die Brüder = el hermano
die Großeltern | (solo plural) = los abuelos
das Kind | die Kinder = el hijo, la hija; el niño
der Sohn | die Söhne = el hijo
die Tochter | die Töchter = la hija
der Enkel | die Enkel = el nieto
die Enkelin | die Enkelinnen = la nieta
der Neffe | die Neffen = el sobrino
die Nichte | die Nichten = la sobrina
der Schwager | die Schwäger = el cuñado
die Schwägerin | die Schwägerinnen = la cuñada
der Partner | die Partner = la pareja (hombre)
die Partnerin | die Partnerinnen = la pareja (mujer)
verheiratet = casado/a
ledig = soltero/a
geschieden = divorciado/a
:::

:::es Una palabra muy práctica
En español «hermanos» puede incluir chicos y chicas. En alemán existe una palabra especial para eso: [[p:die Geschwister]]. [[Hast du Geschwister?]] = ¿Tienes hermanos? Y para la familia del marido o de la esposa se añade **Schwieger-**: [[f:die Schwiegermutter]] (la suegra), [[m:der Schwiegervater]] (el suegro).
:::

## Paso 2: Describir el aspecto (Aussehen)
| Pregunta | Respuestas |
|---|---|
| [[Wie sieht er aus?]] (¿Cómo es físicamente?) | [[Er ist groß und schlank.]] (Es alto y delgado.) |
| ¿Cómo es su pelo? | [[Sie hat lange, dunkle Haare.]] · [[Er hat kurze, blonde Haare.]] · [[Er hat eine Glatze.]] (Es calvo.) |
| ¿Y los ojos? | [[Sie hat blaue Augen.]] · [[braune Augen]] · [[grüne Augen]] |
| ¿Algo especial? | [[Er trägt eine Brille.]] (Lleva gafas.) · [[Er hat einen Bart.]] (Tiene barba.) |

Adjetivos útiles: [[groß]] (alto), [[klein]] (bajo), [[schlank]] (delgado), [[dick]] (gordo, mejor no usarlo para personas), [[jung]], [[alt]], [[hübsch]] (guapa), [[blond]] (rubio), [[dunkel]] (moreno, oscuro), [[lockig]] (rizado).

:::ojo «Haare» va en plural
En español decimos «tiene **el pelo** largo» (singular). En alemán casi siempre se dice en plural: [[Sie hat lange Haare.]] Y cuidado: «alto» para una persona es [[groß]], no ~~hoch~~ (hoch es para edificios y montañas).
:::

## Paso 3: Describir el carácter (Charakter)
| Positivo | Contrario |
|---|---|
| [[nett]] / [[freundlich]] (simpático, amable) | [[unfreundlich]] (antipático) |
| [[lustig]] (divertido) | [[ernst]] (serio) |
| [[ruhig]] (tranquilo) | [[nervös]] (nervioso) |
| [[fleißig]] (trabajador) | [[faul]] (vago) |
| [[geduldig]] (paciente) | [[ungeduldig]] (impaciente) |
| [[hilfsbereit]] (servicial) | [[egoistisch]] (egoísta) |
| [[pünktlich]] (puntual) | [[unpünktlich]] (impuntual) |
| [[offen]] (abierto) | [[schüchtern]] (tímido) |

:::truco El prefijo un-
Muchos adjetivos se vuelven contrarios con **un-**, como en español con «in-» o «des-»: [[freundlich]] → [[unfreundlich]], [[pünktlich]] → [[unpünktlich]], [[geduldig]] → [[ungeduldig]]. ¡Con una sílaba duplicas tu vocabulario!
:::

## Paso 4: Hablar de tu familia
:::ejemplos
Ich habe einen Bruder und zwei Schwestern. = Tengo un hermano y dos hermanas.
Meine Mutter ist 65 und wohnt in Quito. = Mi madre tiene 65 años y vive en Quito.
Mein Bruder ist älter als ich. Er ist Ingenieur. = Mi hermano es mayor que yo. Es ingeniero.
Meine Schwester sieht mir sehr ähnlich. = Mi hermana se parece mucho a mí.
Mein Mann ist sehr geduldig und lustig. = Mi marido es muy paciente y divertido.
Wir sind eine große Familie. = Somos una familia grande.
Meine Großeltern leben nicht mehr. = Mis abuelos ya no viven.
:::

:::dialogo Fotos de familia
Jana: Wer ist das auf dem Foto? = ¿Quién es ese de la foto?
Rosa: Das ist mein Bruder Diego mit seiner Frau. = Es mi hermano Diego con su mujer.
Jana: Er sieht sympathisch aus! Wie ist er? = ¡Parece simpático! ¿Cómo es?
Rosa: Er ist sehr lustig und hilfsbereit, aber ein bisschen unpünktlich. = Es muy divertido y servicial, pero un poco impuntual.
Jana: Und die Frau mit den langen Haaren? = ¿Y la mujer del pelo largo?
Rosa: Das ist meine Schwägerin Lucía. Sie ist Lehrerin und sehr geduldig. = Es mi cuñada Lucía. Es profesora y muy paciente.
:::

:::vocab El cuerpo y el aspecto
das Haar | die Haare = el pelo
das Auge | die Augen = el ojo
die Brille | die Brillen = las gafas
der Bart | die Bärte = la barba
schlank = delgado
lockig = rizado
hübsch = guapo, bonito
aussehen | er sieht aus = parecer, tener aspecto
nett = simpático, amable
lustig = divertido
fleißig = trabajador
faul = vago
geduldig = paciente
schüchtern = tímido
hilfsbereit = servicial
:::

:::quiz
mc: «¿Cómo es físicamente?» || Wie sieht er aus? || Wie ist er? || Wie geht es ihm? ## aussehen = tener aspecto. «Wie ist er?» pregunta por el carácter.
mc: «Mi hermana es alta.» || Meine Schwester ist groß. || Meine Schwester ist hoch. || Meine Schwester hat groß. ## Para personas: groß.
:::

:::resumen
- Familia: Eltern, Geschwister, Großeltern, Sohn, Tochter… **Schwieger-** = familia política.
- Aspecto: [[Wie sieht sie aus?]] → groß/klein, lange/kurze Haare, blaue Augen, Brille, Bart.
- Carácter: nett, lustig, ruhig, fleißig, geduldig… El prefijo **un-** forma contrarios.
:::
`,
ex: `
mc: ¿Qué significa [[die Geschwister]]? || los hermanos y hermanas || los abuelos || los primos ## Geschwister = hermanos (de los dos sexos).
mc: ¿Qué significa [[die Schwiegermutter]]? || la suegra || la madrastra || la abuela ## Schwieger- = familia política.
mc: El contrario de [[geduldig]] es… || ungeduldig || faul || nervös ## un- forma el contrario: ungeduldig = impaciente.
mc: «Lleva gafas» || Er trägt eine Brille. || Er hat Brillen an. || Er nimmt eine Brille. ## Ropa y gafas: tragen.
gap: Sie hat lange, dunkle ___. (pelo) || Haare ## En alemán el pelo suele ir en plural: Haare.
gap: Mein Vater hat blaue ___. (ojos) || Augen ## das Auge → die Augen.
gap: Wie ___ deine Schwester aus? (aussehen) || sieht ## aussehen: sie sieht… aus.
match: nett = simpático || fleißig = trabajador || faul = vago || schüchtern = tímido || lustig = divertido ## Adjetivos de carácter.
listenmc: Mein Bruder ist groß und schlank und hat kurze, blonde Haare. || ¿Cómo es el hermano? || alto, delgado, pelo corto y rubio || bajo, delgado, pelo largo y rubio || alto, fuerte, pelo corto y moreno ## groß = alto; schlank = delgado; kurz = corto; blond = rubio.
order: (Mi hermano es mayor que yo.) mein Bruder ist älter als ich ## Comparativo: älter als.
write: ¿Tienes hermanos? || Hast du Geschwister? ## Geschwister = hermanos.
listen: Meine Mutter ist sehr geduldig und hilfsbereit. = Mi madre es muy paciente y servicial. ## Dos adjetivos de carácter.
speak: Mein Mann ist groß, hat dunkle Haare und ist sehr lustig. = Mi marido es alto, tiene el pelo oscuro y es muy divertido.

LES({t: 'La vivienda', de: 'Wohnen: Wohnungssuche, Möbel, Hausordnung', min: 25,

## Paso 2: Leer un anuncio de piso (Wohnungsanzeige)
Los anuncios alemanes usan muchas **abreviaturas**. Si las conoces, entiendes el anuncio en un minuto:

| Abreviatura | Significa | En español |
|---|---|---|
| 3-Zi.-Whg. | Drei-Zimmer-Wohnung | piso de 3 habitaciones (sin contar cocina ni baño) |

| Blk. | Balkon | balcón |
| ab sofort | ab sofort | disponible ya |

:::truco Kaltmiete y Warmmiete
**Kaltmiete** («alquiler frío») es solo el piso. **Warmmiete** («alquiler caliente») = Kaltmiete + **Nebenkosten** (gastos como la calefacción, el agua o la basura). Cuando compares pisos, **compara siempre la Warmmiete**. La luz (Strom) y el internet casi siempre se pagan aparte.
:::

:::texto Anzeige
Schöne 3-Zi.-Whg. in Köln-Ehrenfeld, 72 m², 2. OG, mit Balkon und EBK. Ruhige Lage, 5 Minuten zur U-Bahn. KM 890 €, NK 210 €, Kaution 3 KM. Ab 1. März frei. Haustiere nicht erlaubt. Tel. 0221 4589 32 (ab 18 Uhr).
:::

## Paso 3: Llamar por un piso
:::ejemplos

:::

## Paso 4: La Hausordnung, las normas de la comunidad
En casi todos los edificios alemanes hay una **Hausordnung** (normas de la casa). Las más típicas:
- **Ruhezeiten** (horas de silencio): normalmente por la noche, más o menos de 22 a 6 h, y muchas veces también al mediodía y los domingos. En ese tiempo no hagas ruido fuerte.
- **Mülltrennung** (separar la basura): papel en el contenedor azul, envases en el amarillo, restos orgánicos en el marrón (Bio) y el resto en el negro o gris (Restmüll). El vidrio se lleva a contenedores en la calle (blanco, verde y marrón).
- **Pfand**: muchas botellas y latas tienen un depósito (*Pfand*). Las devuelves en el supermercado y te dan dinero.
- A veces hay un **turno de limpieza** de la escalera (*Treppenhausreinigung*).

:::nota Cuando te mudas
En Alemania tienes que **registrar tu nueva dirección** (*sich anmelden*) en la oficina del ciudadano (*Bürgeramt*) **en las dos semanas** siguientes a la mudanza. Necesitas un papel del casero llamado *Wohnungsgeberbestätigung*. Lo verás en la lección 14.4.
:::

LES({t: 'Salud y médico', de: 'Gesundheit: Körper, Arztbesuch, Apotheke', min: 25,
goal: 'Podrás **decir qué te duele**, **pedir cita** en el médico, entender lo que te dice y saber cómo funcionan la **receta**, la **farmacia** y la **baja médica** en Alemania.',
body: `
## Paso 1: El cuerpo
:::vocab El cuerpo
der Kopf | die Köpfe = la cabeza
das Gesicht | die Gesichter = la cara
das Auge | die Augen = el ojo
das Ohr | die Ohren = la oreja, el oído
die Nase | die Nasen = la nariz
der Mund | die Münder = la boca
der Zahn | die Zähne = el diente
der Hals | die Hälse = el cuello; la garganta
der Rücken | die Rücken = la espalda
der Bauch | die Bäuche = la barriga, el vientre
der Arm | die Arme = el brazo
die Hand | die Hände = la mano
der Finger | die Finger = el dedo
das Bein | die Beine = la pierna
das Knie | die Knie = la rodilla
der Fuß | die Füße = el pie
:::

## Paso 2: Decir qué te pasa
Hay tres formas muy útiles:
1. **…schmerzen** (dolor de…): [[Ich habe Kopfschmerzen.]] (Me duele la cabeza.) · [[Bauchschmerzen]] · [[Rückenschmerzen]] · [[Halsschmerzen]] · [[Zahnschmerzen]]
2. **wehtun** + dativo: [[Mein Bein tut mir weh.]] (Me duele la pierna.) · [[Die Augen tun mir weh.]]
3. **Síntomas**: [[Ich habe Fieber.]] (Tengo fiebre.) · [[Ich habe Husten.]] (Tengo tos.) · [[Ich habe Schnupfen.]] (Tengo mocos, estoy resfriada.) · [[Ich bin erkältet.]] (Estoy resfriada.) · [[Mir ist schlecht.]] (Tengo náuseas.) · [[Ich habe Durchfall.]] (Tengo diarrea.)

:::truco Palabra + Schmerzen
Para casi cualquier dolor, junta la parte del cuerpo con **-schmerzen**: Kopf → [[Kopfschmerzen]], Bauch → [[Bauchschmerzen]], Rücken → [[Rückenschmerzen]]. Siempre en plural y con **haben**: [[Ich habe Kopfschmerzen.]]
:::

## Paso 3: Pedir cita por teléfono
:::dialogo Llamada a la consulta
Praxis: Praxis Dr. Becker, Schulz am Apparat. = Consulta del Dr. Becker, al habla Schulz.
Patientin: Guten Tag, hier ist Marta Ruiz. Ich hätte gern einen Termin. = Buenos días, soy Marta Ruiz. Quería una cita.
Praxis: Was haben Sie denn? = ¿Qué le pasa?
Patientin: Ich habe seit drei Tagen Fieber und Halsschmerzen. = Tengo fiebre y dolor de garganta desde hace tres días.
Praxis: Können Sie heute um 11 Uhr kommen? = ¿Puede venir hoy a las 11?
Patientin: Ja, das passt gut. = Sí, me va bien.
Praxis: Bringen Sie bitte Ihre Versichertenkarte mit. = Traiga, por favor, su tarjeta del seguro.
Patientin: Gut, danke. Bis später! = Vale, gracias. ¡Hasta luego!
:::

## Paso 4: En la consulta
Lo que te puede decir el médico:
:::ejemplos
Was fehlt Ihnen? = ¿Qué le pasa?
Wo tut es weh? = ¿Dónde le duele?
Seit wann haben Sie die Schmerzen? = ¿Desde cuándo tiene los dolores?
Machen Sie bitte den Mund auf. = Abra la boca, por favor.
Ich schreibe Ihnen ein Rezept. = Le hago una receta.
Nehmen Sie die Tabletten dreimal täglich nach dem Essen. = Tome las pastillas tres veces al día después de comer.
Sie müssen im Bett bleiben und viel trinken. = Tiene que quedarse en la cama y beber mucho.
Ich schreibe Sie bis Freitag krank. = Le doy la baja hasta el viernes.
Gute Besserung! = ¡Que se mejore!
:::

## Paso 5: Cómo funciona en Alemania
:::nota El sistema de salud, en breve
- Normalmente vas primero al **médico de cabecera** (*Hausarzt*). Si hace falta, te manda a un especialista (*Facharzt*) con un volante (*Überweisung*).
- Lleva siempre tu **tarjeta del seguro médico** (*Versichertenkarte* o *Gesundheitskarte*) de tu *Krankenkasse*.
- Con la **receta** (*Rezept*) compras los medicamentos en la **farmacia** (*Apotheke*). Por la noche y los fines de semana siempre hay una farmacia de guardia (*Notdienst*).
- Si estás enferma y no puedes trabajar, **avisa enseguida a tu empresa**. Si la baja dura más de tres días necesitas un certificado médico (*Krankschreibung*); algunas empresas lo piden desde el primer día. Hoy el médico lo envía digitalmente a la Krankenkasse.
- Números importantes: **112** (urgencias y ambulancia), **110** (policía) y **116 117** (médico de guardia cuando la consulta está cerrada y no es una emergencia).
:::

LES({t: 'El trabajo', de: 'Arbeit und Beruf', min: 25,
goal: 'Podrás **hablar de tu trabajo**: qué haces, dónde, en qué horario y qué te gusta. También sabrás **avisar de que estás enferma** y hablar por teléfono en el trabajo.',
body: `
## Paso 1: Las profesiones
Recuerda: para las mujeres casi siempre se añade **-in**, y la profesión va **sin artículo**: [[Ich bin Verkäuferin.]]

:::vocab Profesiones
der Arzt / die Ärztin = el médico / la médica
der Krankenpfleger / die Krankenpflegerin = el enfermero / la enfermera
der Altenpfleger / die Altenpflegerin = el cuidador / la cuidadora de mayores
der Lehrer / die Lehrerin = el profesor / la profesora
der Erzieher / die Erzieherin = el educador / la educadora (guardería)
der Verkäufer / die Verkäuferin = el dependiente / la dependienta
der Koch / die Köchin = el cocinero / la cocinera
der Kellner / die Kellnerin = el camarero / la camarera
der Ingenieur / die Ingenieurin = el ingeniero / la ingeniera
der Fahrer / die Fahrerin = el conductor / la conductora
der Friseur / die Friseurin = el peluquero / la peluquera
die Reinigungskraft | die Reinigungskräfte = el personal de limpieza
der Handwerker / die Handwerkerin = el artesano, el obrero
der Angestellte / die Angestellte = el empleado / la empleada
:::

## Paso 2: Hablar de tu trabajo
:::ejemplos
Was sind Sie von Beruf? – Ich bin Köchin. = ¿A qué se dedica? – Soy cocinera.
Ich arbeite als Krankenpflegerin in einem Krankenhaus. = Trabajo de enfermera en un hospital.
Ich arbeite bei einer Firma in Stuttgart. = Trabajo en una empresa de Stuttgart.
Ich arbeite Vollzeit, 40 Stunden pro Woche. = Trabajo a jornada completa, 40 horas a la semana.
Ich arbeite Teilzeit, nur vormittags. = Trabajo a media jornada, solo por las mañanas.
Ich habe Schichtdienst. = Trabajo por turnos.
Meine Kollegen sind sehr nett. = Mis compañeros son muy simpáticos.
Ich suche eine Stelle als Erzieherin. = Busco un puesto de educadora.
Ich bin zurzeit arbeitslos. = Ahora mismo estoy en paro.
:::

:::ojo als y bei
- **als** + profesión: [[Ich arbeite als Kellnerin.]] (de camarera)
- **bei** + empresa: [[Ich arbeite bei Bosch.]] (en Bosch)
- **in** + lugar: [[Ich arbeite in einem Hotel.]] (en un hotel)
Y recuerda: [[die Firma]] es **la empresa**, no «la firma».
:::

## Paso 3: Avisar de que estás enferma
:::dialogo Llamada al trabajo
Lara: Guten Morgen, Frau Kaiser. Hier ist Lara Gómez. = Buenos días, señora Kaiser. Soy Lara Gómez.
Chefin: Guten Morgen, Frau Gómez. Was gibt's? = Buenos días, señora Gómez. ¿Qué pasa?
Lara: Es tut mir leid, ich bin krank. Ich habe hohes Fieber und kann heute nicht kommen. = Lo siento, estoy enferma. Tengo fiebre alta y hoy no puedo ir.
Chefin: Oh, gute Besserung! Gehen Sie zum Arzt? = ¡Vaya, que se mejore! ¿Va a ir al médico?
Lara: Ja, ich habe um zehn einen Termin. Ich melde mich danach wieder. = Sí, tengo cita a las diez. Después la vuelvo a llamar.
Chefin: Gut, danke für den Anruf. = Bien, gracias por llamar.
:::

## Paso 4: Por teléfono en el trabajo
:::ejemplos
Firma Lenz, Sie sprechen mit Ana Ruiz. = Empresa Lenz, habla con Ana Ruiz.
Kann ich bitte Herrn Wolf sprechen? = ¿Puedo hablar con el señor Wolf, por favor?
Einen Moment, bitte. Ich verbinde. = Un momento, por favor. Le paso.
Herr Wolf ist leider nicht da. = Lo siento, el señor Wolf no está.
Kann ich etwas ausrichten? = ¿Quiere dejar algún recado?
Können Sie mich bitte zurückrufen? = ¿Puede devolverme la llamada, por favor?
:::

:::nota Lo que es normal en el trabajo en Alemania
- La **puntualidad** es muy importante: llegar cinco minutos tarde ya se nota.
- A los compañeros se les suele tratar de **Sie**, salvo que propongan el **du**. En muchas empresas jóvenes se usa du desde el principio.
- Cuando alguien cumple años, a menudo es **quien cumple** el que trae una tarta o algo de comer para los compañeros.
:::

:::vocab Palabras del trabajo
die Arbeit | die Arbeiten = el trabajo
der Beruf | die Berufe = la profesión
die Stelle | die Stellen = el puesto (de trabajo)
die Firma | die Firmen = la empresa
der Kollege / die Kollegin = el compañero / la compañera
der Chef / die Chefin = el jefe / la jefa
die Arbeitszeit | die Arbeitszeiten = el horario de trabajo

der Urlaub = las vacaciones
arbeitslos = en paro
sich bewerben | er bewirbt sich = presentarse a un puesto
der Lebenslauf | die Lebensläufe = el currículum

:::resumen
- [[Ich bin…]] (profesión, sin artículo) · [[Ich arbeite als… / bei… / in…]]
- Horario: **Vollzeit, Teilzeit, Schichtdienst**.
- Enferma: [[Ich bin krank und kann heute nicht kommen.]]
- Teléfono: [[Kann ich bitte Herrn… sprechen?]] · [[Können Sie mich bitte zurückrufen?]]

body: `
## Paso 1: Los medios de transporte
:::vocab Transporte
der Zug | die Züge = el tren
die S-Bahn | die S-Bahnen = el tren de cercanías

der Hauptbahnhof | die Hauptbahnhöfe = la estación central
das Gleis | die Gleise = la vía, el andén
die Haltestelle | die Haltestellen = la parada
der Flughafen | die Flughäfen = el aeropuerto
:::

## Paso 2: El billete
:::vocab Billetes y horarios
die Fahrkarte | die Fahrkarten = el billete
das Ticket | die Tickets = el billete
der Fahrplan | die Fahrpläne = el horario
die Abfahrt | die Abfahrten = la salida
die Ankunft | die Ankünfte = la llegada
einfach = de ida
hin und zurück = de ida y vuelta
die Verspätung | die Verspätungen = el retraso
pünktlich = puntual
umsteigen | er steigt um = hacer transbordo
der Anschluss | die Anschlüsse = el enlace, la conexión
der Platz | die Plätze = el asiento
reservieren = reservar
:::

:::dialogo En la taquilla de la estación
Reisende: Guten Tag, eine Fahrkarte nach Hamburg, bitte. = Buenos días, un billete a Hamburgo, por favor.
Mitarbeiter: Einfach oder hin und zurück? = ¿Solo ida o ida y vuelta?
Reisende: Hin und zurück, bitte. Wann fährt der nächste Zug? = Ida y vuelta, por favor. ¿Cuándo sale el próximo tren?
Mitarbeiter: Um 10:15 Uhr von Gleis 7. Sie müssen in Hannover umsteigen. = A las 10:15 desde la vía 7. Tiene que hacer transbordo en Hannover.
Reisende: Wann komme ich in Hamburg an? = ¿Cuándo llego a Hamburgo?
Mitarbeiter: Um 13:40 Uhr. Möchten Sie einen Platz reservieren? = A las 13:40. ¿Quiere reservar asiento?
Reisende: Ja, gern. Was kostet das? = Sí, por favor. ¿Cuánto cuesta?
:::

:::nota El Deutschlandticket
En Alemania existe el **Deutschlandticket**: un abono mensual con el que puedes usar **todo el transporte local y regional** de Alemania (autobús, metro, tranvía, S-Bahn y trenes regionales). No vale para los trenes rápidos de larga distancia (ICE, IC). Se compra como suscripción, por ejemplo en la app de tu empresa de transporte o en la de la Deutsche Bahn.
:::

## Paso 3: Los avisos (Durchsagen)
En las estaciones y en los trenes oirás avisos como estos. Fíjate en las **palabras clave**: número de tren, andén, minutos de retraso, cambio.

:::audio Aviso en la estación

LES({t: 'Tiempo libre, clima y fiestas', de: 'Freizeit, Wetter, Feste', min: 25,
goal: 'Podrás hablar de tus **aficiones**, del **tiempo** que hace, de las **fiestas** alemanas y **aceptar o rechazar una invitación** con educación.',
body: `
## Paso 1: Las aficiones
:::ejemplos
Was machst du in deiner Freizeit? = ¿Qué haces en tu tiempo libre?
Ich lese gern. = Me gusta leer.
Ich koche gern und ich tanze gern Salsa. = Me gusta cocinar y bailar salsa.
Ich gehe gern ins Kino. = Me gusta ir al cine.
Ich mache Yoga und gehe schwimmen. = Hago yoga y voy a nadar.
Am Wochenende gehe ich oft spazieren oder wandern. = Los fines de semana a menudo voy a pasear o de senderismo.
Ich spiele Gitarre. = Toco la guitarra.
Ich treffe mich gern mit Freunden. = Me gusta quedar con amigos.
:::

:::truco gern = «me gusta» con verbos
Para decir que te gusta **hacer** algo, pon [[gern]] **detrás del verbo**: [[Ich schwimme gern.]] (Me gusta nadar.) Para lo que **no** te gusta: [[Ich jogge nicht gern.]] Y recuerda: **gern – lieber – am liebsten**.
:::

## Paso 2: El tiempo (das Wetter)
| Alemán | Español |
|---|---|
| [[Wie ist das Wetter?]] | ¿Qué tiempo hace? |
| [[Die Sonne scheint.]] / [[Es ist sonnig.]] | Hace sol. |
| [[Es regnet.]] | Llueve. |
| [[Es schneit.]] | Nieva. |
| [[Es ist windig.]] | Hace viento. |
| [[Es ist bewölkt.]] | Está nublado. |
| [[Es ist warm / heiß / kalt.]] | Hace calor / mucho calor / frío. |
| [[Es gibt ein Gewitter.]] | Hay tormenta. |
| [[Es sind 25 Grad.]] | Hace 25 grados. |
| [[Es sind minus 3 Grad.]] | Hace 3 grados bajo cero. |

:::es
En español decimos «**hace** frío», «**hace** sol». En alemán se usa **es ist** o **es** + verbo: [[Es ist kalt.]] [[Es regnet.]] ¡Nunca «es macht kalt»!
:::

## Paso 3: Las fiestas
:::vocab Fiestas y celebraciones
der Geburtstag | die Geburtstage = el cumpleaños
das Fest | die Feste = la fiesta
die Party | die Partys = la fiesta (privada)
Weihnachten = la Navidad
der Heiligabend = la Nochebuena (24 de diciembre)
Silvester = Nochevieja
Neujahr = Año Nuevo
Ostern = Semana Santa, Pascua
die Hochzeit | die Hochzeiten = la boda
das Geschenk | die Geschenke = el regalo
feiern = celebrar
gratulieren = felicitar
einladen | er lädt ein = invitar
:::

:::ejemplos
Herzlichen Glückwunsch zum Geburtstag! = ¡Feliz cumpleaños!
Alles Gute! = ¡Todo lo mejor!
Frohe Weihnachten! = ¡Feliz Navidad!
Frohe Ostern! = ¡Felices Pascuas!
Guten Rutsch ins neue Jahr! = ¡Feliz salida de año! (antes de Nochevieja)
Frohes neues Jahr! = ¡Feliz año nuevo!
:::

:::nota Costumbres alemanas
- **No felicites antes de tiempo**: muchos alemanes creen que felicitar un cumpleaños antes del día trae mala suerte.
- En Navidad, el día más importante es **Nochebuena, el 24 de diciembre**: ese día se dan los regalos en muchas familias.
- **Guten Rutsch!** se dice **antes** de Nochevieja; a partir del 1 de enero se dice **Frohes neues Jahr!**
:::

## Paso 4: Invitar, aceptar y rechazar
:::dialogo Una invitación
Ben: Hallo Clara! Ich mache am Samstag eine Party. Hast du Lust zu kommen? = ¡Hola, Clara! El sábado hago una fiesta. ¿Te apetece venir?
Clara: Ja, gern! Um wie viel Uhr? = ¡Sí, me encantaría! ¿A qué hora?
Ben: Ab acht Uhr, bei mir zu Hause. = A partir de las ocho, en mi casa.
Clara: Super! Soll ich etwas mitbringen? = ¡Genial! ¿Llevo algo?
Ben: Vielleicht einen Salat? = ¿Quizás una ensalada?
Clara: Klar, mache ich. Bis Samstag! = Claro, la hago. ¡Hasta el sábado!
:::

:::ejemplos
Danke für die Einladung, ich komme gern! = Gracias por la invitación, ¡iré con mucho gusto!
Tut mir leid, am Samstag kann ich leider nicht. = Lo siento, el sábado no puedo.
Schade, da habe ich schon etwas vor. = Qué pena, ya tengo planes.
Vielleicht ein anderes Mal? = ¿Quizás otro día?
:::

:::resumen
- Aficiones: verbo + **gern**: [[Ich koche gern.]]
- Tiempo: [[Es regnet.]] [[Es ist kalt.]] [[Die Sonne scheint.]] [[Es sind 20 Grad.]]
- Fiestas: [[Herzlichen Glückwunsch!]] · [[Frohe Weihnachten!]] · [[Guten Rutsch!]]
- Invitación: [[Hast du Lust…?]] · [[Ja, gern!]] · [[Tut mir leid, ich kann leider nicht.]]
:::
`,
ex: `
mc: «Me gusta leer» || Ich lese gern. || Ich gern lese. || Ich mag lesen gern. ## gern va detrás del verbo.
mc: «Hace frío» || Es ist kalt. || Es macht kalt. || Ich bin kalt. ## El tiempo: es ist + adjetivo.
mc: ¿Qué se dice el 31 de diciembre por la tarde? || Guten Rutsch! || Frohe Ostern! || Gute Besserung! ## Guten Rutsch = feliz salida de año.
mc: Rechazas una invitación con educación: || Tut mir leid, da habe ich schon etwas vor. || Nein, ich will nicht. || Ich habe keine Lust auf dich. ## etwas vorhaben = tener planes.
mc: ¿Qué significa [[bewölkt]]? || nublado || soleado || lluvioso ## die Wolke = la nube.
gap: Heute ___ es den ganzen Tag. (llover) || regnet ## es regnet.
gap: Herzlichen ___ zum Geburtstag! || Glückwunsch ## Herzlichen Glückwunsch = ¡felicidades!
gap: Hast du ___, am Samstag ins Kino zu gehen? (ganas) || Lust ## Lust haben = tener ganas.
gap: Danke für die ___! (invitación) || Einladung ## die Einladung.
match: Es regnet = llueve || Es schneit = nieva || Es ist windig = hace viento || Die Sonne scheint = hace sol || Es ist heiß = hace mucho calor ## El tiempo.
listenmc: Morgen wird es sonnig und warm, bis zu 26 Grad. || ¿Qué tiempo hará mañana? || sol y calor, hasta 26 grados || lluvia y 16 grados || nublado y 26 grados ## sonnig = soleado; bis zu 26 Grad.
write: ¡Feliz cumpleaños! || Herzlichen Glückwunsch zum Geburtstag! / Alles Gute zum Geburtstag! ## Dos fórmulas muy usadas.
speak: Danke für die Einladung! Ich komme gern. Soll ich etwas mitbringen? = ¡Gracias por la invitación! Iré con gusto. ¿Llevo algo?
`});

LES({t: 'Trámites y servicios', de: 'Behörden, Bank, Post, Umtausch', min: 25,

body: `

unterschreiben | hat unterschrieben = firmar

:::nota La Anmeldung (empadronamiento)
Cuando te mudas a un piso en Alemania, tienes que **registrar tu dirección** en el *Bürgeramt* **en un plazo de dos semanas**. Normalmente necesitas:
1. Una **cita** (*Termin*), que muchas veces se pide por internet.
2. Tu **pasaporte** o documento de identidad.
3. La *Wohnungsgeberbestätigung*: un papel firmado por tu casero que confirma que vives allí.
Después te dan la *Meldebescheinigung* (certificado de empadronamiento). ¡La necesitarás para el banco, el trabajo y muchas cosas más!
:::

|---|---|

| Staatsangehörigkeit | nacionalidad |

| Straße, Hausnummer | calle y número |
| PLZ (Postleitzahl), Ort | código postal y ciudad |
| Unterschrift | tu firma |

LES({t: 'Hören: escuchar', de: 'Prüfungsteil Hören', min: 30,

body: `
## Cómo es la prueba
Dura unos **30 minutos** y tiene **cuatro partes**. Escuchas avisos de radio y de megafonía, mensajes en el contestador, conversaciones cortas y una entrevista. En algunas partes escuchas el texto **dos veces** y en otras **solo una**: la instrucción siempre te lo dice.

| Parte | Qué escuchas | Qué haces |
|---|---|---|
| Teil 1 | textos cortos: radio, avisos, mensajes de teléfono | eliges a, b o c |
| Teil 2 | una conversación más larga | relacionas personas o días con información |
| Teil 3 | cinco conversaciones cortas | eliges la respuesta correcta (a veces con dibujos) |
| Teil 4 | una entrevista de radio | decides si es verdad o no |

## Las cinco estrategias de oro
1. **Lee las preguntas antes de escuchar.** Así sabes **qué** buscar: ¿una hora?, ¿un lugar?, ¿un precio?
2. **Subraya las palabras clave** de cada pregunta (Wann? Wo? Was kostet?).
3. **No intentes entenderlo todo.** Busca solo la información que te piden.
4. **Cuidado con los cambios de plan.** En el examen son muy típicas las trampas como «eigentlich…, aber…» (en realidad…, pero…) o «doch nicht» (al final no).
5. **Responde siempre.** No se restan puntos por los errores: si dudas, elige la opción más probable.

:::ojo La trampa favorita del examen
Muchas veces se mencionan **las tres opciones**, pero solo una es la correcta. Escucha este ejemplo:
[[Wir wollten eigentlich am Samstag fahren, aber da regnet es. Jetzt fahren wir am Sonntag.]]
Se dice «Samstag» y «Sonntag», pero el viaje es el **domingo**. Las palabras **eigentlich, aber, doch, lieber, nicht mehr** te avisan de que algo cambia.
:::

## Práctica 1: Avisos y radio
:::audio El tiempo en la radio
Sprecher: Und nun das Wetter für morgen: Im Norden ist es bewölkt und es regnet am Nachmittag. Im Süden scheint den ganzen Tag die Sonne. Die Temperaturen liegen zwischen 15 und 22 Grad.
:::

:::quiz
mc: ¿Qué tiempo hará mañana en el sur? || sol todo el día || lluvia por la tarde || nublado ## «Im Süden scheint den ganzen Tag die Sonne».
mc: ¿Qué temperaturas habrá? || entre 15 y 22 grados || entre 5 y 12 grados || unos 25 grados ## zwischen 15 und 22 Grad.
:::

:::audio Mensaje en el contestador
Praxis: Guten Tag, Frau Martínez, hier ist die Praxis Dr. Hoffmann. Ihr Termin am Mittwoch um 9 Uhr muss leider ausfallen. Die Ärztin ist krank. Können Sie am Donnerstag um 14 Uhr kommen? Bitte rufen Sie uns kurz zurück. Vielen Dank!
:::

:::quiz
mc: ¿Por qué llaman de la consulta? || la cita del miércoles se cancela || la señora Martínez llega tarde || tiene que traer la tarjeta del seguro ## «Ihr Termin am Mittwoch… muss leider ausfallen».
mc: ¿Qué nueva cita proponen? || jueves a las 14 h || miércoles a las 14 h || jueves a las 9 h ## am Donnerstag um 14 Uhr.
:::

## Práctica 2: Una conversación con cambio de plan
:::audio En el pasillo
Leo: Hallo Nora! Was hast du am Wochenende gemacht?
Nora: Am Samstag war ich mit meiner Schwester im Zoo. Am Sonntag wollten wir eigentlich schwimmen gehen, aber es hat den ganzen Tag geregnet.
Leo: Und was habt ihr dann gemacht?
Nora: Wir sind ins Museum gegangen. Das war auch sehr schön.
:::

:::quiz
mc: ¿Qué hizo Nora el domingo? || fue al museo || fue a nadar || fue al zoo ## «wollten eigentlich schwimmen gehen, aber…» → al final, el museo.
:::

:::resumen
- Lee las preguntas **antes** de escuchar y busca solo lo que te piden.
- Ojo con **eigentlich, aber, doch, lieber**: anuncian un cambio.
- Contesta todas las preguntas: los errores no restan.
:::

body: `
## Cómo es la prueba
Dura unos **30 minutos** y tiene **cuatro partes**, con **20 preguntas** en total.

| Parte | Texto | Qué haces |

| Teil 3 | un correo o una carta | eliges a, b o c |

## Las estrategias
1. **Primero la pregunta, después el texto.** Lee la pregunta y busca en el texto la parte que habla de eso.
2. **Busca sinónimos.** El texto casi nunca repite las palabras de la pregunta: «online» en la pregunta puede ser «im Internet» en el texto.

4. **No traduzcas todo.** Las palabras desconocidas casi nunca importan.
5. **Controla el tiempo**: unos 7 minutos por parte.

LES({t: 'Schreiben: el mensaje corto', de: 'Prüfungsteil Schreiben, Teil 1: SMS', min: 25,
goal: 'Aprenderás a escribir la **primera tarea** de la prueba de escritura: un **mensaje corto (SMS)** a un amigo o amiga, de unas **20–30 palabras**, respondiendo a **tres puntos**.',
body: `
## Cómo es la tarea
La prueba de escritura dura **unos 30 minutos** y tiene **dos textos**. El primero es un **mensaje corto** a una persona que conoces (amiga, compañero…). Por eso escribes de **du**. La tarea siempre tiene **tres puntos** que **tienes que tratar todos**. La longitud es de **unas 20–30 palabras**; la instrucción del examen te lo dice.

:::ojo Lo que más puntos quita
1. **Olvidar un punto** de la tarea. Cada punto cuenta.
2. **Escribir demasiado poco.** Cuenta las palabras.
3. **Mezclar du y Sie.** A una amiga: siempre **du, dich, dir, dein**.
:::

## La estructura: cinco piezas
1. **Saludo**: [[Hallo Maria,]] / [[Liebe Maria,]] / [[Lieber Tom,]]
2. **Punto 1**
3. **Punto 2**
4. **Punto 3**
5. **Despedida**: [[Liebe Grüße]] / [[Viele Grüße]] / [[Bis bald!]] + tu nombre.

## Frases listas para usar
:::ejemplos
Es tut mir leid, ich komme etwas später. = Lo siento, llego un poco más tarde.
Leider kann ich heute nicht kommen, weil … = Por desgracia hoy no puedo ir porque…
Der Bus hat Verspätung. = El autobús lleva retraso.
Wollen wir uns um 15 Uhr treffen? = ¿Quedamos a las 15 h?
Können wir uns vor dem Kino treffen? = ¿Podemos vernos delante del cine?
Hast du Lust, am Samstag … ? = ¿Te apetece… el sábado?
Kannst du mir bitte … mitbringen? = ¿Me puedes traer…?
Bitte schreib mir kurz. / Ruf mich bitte an. = Escríbeme, por favor. / Llámame, por favor.
:::

:::truco La lista de control
Antes de entregar, revisa:
- ¿Están **los tres puntos**? Márcalos en tu texto con un 1, 2, 3.
- ¿Hay **saludo** y **despedida**?
- ¿Unas **20–30 palabras**?
- ¿El **verbo** en la posición 2? ¿Con **weil**, al final?
- ¿Siempre **du**?
:::

## Practica: escribe tu SMS
:::corrector SMS (Teil 1)
**Tarea:** Estás en el autobús y vas a llegar tarde a una cita con tu amiga **Maria**. Escríbele un SMS:
- Discúlpate.
- Explica por qué llegas tarde.
- Propón un nuevo lugar o una nueva hora.

(Escribe unas 20–30 palabras.)
---
**Texto modelo:**

[[Hallo Maria, es tut mir leid, ich komme etwa 20 Minuten später. Der Bus hat Verspätung. Wollen wir uns um 15:30 Uhr direkt im Café treffen? Liebe Grüße, Ana]]

(29 palabras · punto 1: «es tut mir leid» · punto 2: «Der Bus hat Verspätung» · punto 3: «um 15:30 Uhr direkt im Café»)
:::

:::corrector SMS (Teil 1)
**Tarea:** Tu amigo **Paul** te ha invitado a cenar el viernes. Escríbele un SMS:
- Dale las gracias.
- Dile que vas.
- Pregunta qué puedes llevar.

LES({t: 'Sprechen: hablar', de: 'Prüfungsteil Sprechen', min: 30,
goal: 'Conocerás las **tres partes del examen oral** y practicarás cada una con **tarjetas**, **frases listas para usar** y **respuestas modelo**. Si Lena está disponible, podrás practicar con ella las conversaciones.',
body: `
## Cómo es la prueba
El examen oral se hace **en parejas** y dura unos **15 minutos**. Hay dos examinadores. No tienes tiempo de preparación.

| Parte | Qué haces |
|---|---|
| Teil 1 | Con unas tarjetas con palabras (por ejemplo «Wohnort?») **preguntas** a tu compañera y **respondes** a sus preguntas. |
| Teil 2 | Recibes una tarjeta con una pregunta y cuatro ideas y **hablas de tu vida** (por ejemplo, de tu fin de semana). Después te hacen alguna pregunta. |
| Teil 3 | Con tu compañera **planeas algo juntas**: encontrar un día y una hora en vuestras agendas para hacer algo. |

## Teil 1: Preguntar y responder
En la tarjeta solo hay una palabra con interrogación, por ejemplo **Geburtstag?** Tú formas la pregunta completa ([[Wann hast du Geburtstag?]]) y tu compañera responde. Después, al revés.

:::truco Responde con frases completas
Una sola palabra («Im Mai») da pocos puntos. Mejor una frase y un detalle más: [[Ich habe im Mai Geburtstag. Dann feiere ich immer mit meiner Familie.]]
:::

:::sprechkarten t1
:::

## Teil 2: Hablar de ti
Recibes una tarjeta con una pregunta y **cuatro ideas**. Habla de **las cuatro**, con frases completas, durante **uno o dos minutos**. Usa conectores: **zuerst, dann, danach, außerdem, aber, weil**.

:::sprechkarten t2
:::

## Teil 3: Planear algo juntas
Cada una tiene una **agenda distinta** y tenéis que encontrar un momento libre para hacer algo (comprar un regalo, visitar a una compañera…). Propón, reacciona y decidid juntas.

:::ejemplos
Wann hast du Zeit? = ¿Cuándo tienes tiempo?
Wie wäre es am Samstag um zehn? = ¿Qué tal el sábado a las diez?
Am Samstagvormittag kann ich leider nicht, da gehe ich zum Sport. = El sábado por la mañana no puedo, voy a hacer deporte.
Geht es bei dir um 14 Uhr? = ¿Te va bien a las 14 h?
Ja, das passt mir gut. = Sí, me va bien.
Gute Idee! / Einverstanden. = ¡Buena idea! / De acuerdo.
Dann treffen wir uns um 14 Uhr vor dem Kaufhaus. = Entonces quedamos a las 14 h delante de los grandes almacenes.
:::

:::dialogo Modelo de Teil 3: un regalo para una compañera
A: Wir möchten zusammen ein Geschenk für Sandra kaufen. Wann hast du am Samstag Zeit? = Queremos comprar juntas un regalo para Sandra. ¿Cuándo tienes tiempo el sábado?
B: Am Vormittag kann ich leider nicht, da gehe ich mit meinen Kindern schwimmen. Geht es bei dir um 12 Uhr? = Por la mañana no puedo, voy a nadar con mis hijos. ¿Te va bien a las 12?
A: Um 12 Uhr esse ich mit meiner Schwester. Wie wäre es um 14 Uhr? = A las 12 como con mi hermana. ¿Qué tal a las 14 h?
B: Ja, um 14 Uhr passt es mir gut. Was wollen wir kaufen? = Sí, a las 14 h me va bien. ¿Qué compramos?
A: Sandra liest gern. Wir könnten ein Buch kaufen. = A Sandra le gusta leer. Podríamos comprar un libro.
B: Gute Idee! Dann treffen wir uns um 14 Uhr vor der Buchhandlung. = ¡Buena idea! Entonces quedamos a las 14 h delante de la librería.
:::

:::nota Si no entiendes algo
Pedir aclaraciones **es parte de la comunicación** y no te quita puntos: [[Wie bitte?]] · [[Können Sie das bitte wiederholen?]] · [[Was bedeutet …?]] · [[Meinst du …?]]
:::

:::resumen
- Teil 1: forma **preguntas completas** con la palabra de la tarjeta y responde con detalles.
- Teil 2: habla de **las cuatro ideas** con conectores (zuerst, dann, außerdem, weil).
- Teil 3: **propón** ([[Wie wäre es…?]]), **reacciona** ([[Das passt mir gut.]] / [[Da kann ich leider nicht.]]) y **decidid** juntas.
:::

EXTRA('metodo', `
## Cómo aprender con esta app
Esta app está pensada para que aprendas **como funciona tu memoria**, no como en un libro que se lee una vez y se olvida. Aquí tienes el método, la rutina diaria y un plan hasta el examen.

:::cuento El secreto de la memoria
Tu cerebro olvida casi todo lo que aprende… **salvo lo que necesita una y otra vez**. Si repasas una palabra justo cuando estás a punto de olvidarla, tu cerebro piensa: «¡Esto es importante!» y la guarda más tiempo. Cada repaso la guarda **más fuerte** y **más tiempo**: un día, tres días, una semana, un mes… Eso es la **repetición espaciada**, y es lo que hacen las tarjetas de la pestaña **Repaso**.
:::

## Los seis principios
1. **Poco cada día gana a mucho de vez en cuando.** 20–30 minutos diarios funcionan mejor que tres horas el domingo.
2. **Recordar es mejor que releer.** Por eso cada lección termina con ejercicios: al intentar recordar, el cerebro aprende de verdad.
3. **Oír y decir en voz alta.** Toca las palabras para oírlas y **repítelas en voz alta**, aunque estés sola. Tu boca también tiene que aprender.
4. **Equivocarse es aprender.** Cada error se guarda en **Mis errores** para repetirlo hasta que salga bien.
5. **Palabras con su artículo y su plural.** Nunca «Tisch», siempre **der Tisch, die Tische**.
6. **Frases, no palabras sueltas.** «Ich hätte gern einen Kaffee» te sirve más que «Kaffee».

## Tu rutina diaria (20–40 minutos)
1. **Repaso** (5–10 min): haz las tarjetas que tocan hoy. Primero siempre esto.
2. **Lección** (10–20 min): lee la explicación (o pulsa «Escuchar la explicación»), toca los ejemplos y repítelos, y haz el mini-test de comprobación.
3. **Práctica** (5–10 min): haz los ejercicios de la lección. Si fallas alguno, pulsa «Repetir los errores».
4. **Extra** (2 min): una ronda del **juego de artículos** o del **entrenador del Perfekt**.

## Cómo funcionan las tarjetas
- Mira la palabra e **intenta recordar** la respuesta **antes** de darle la vuelta.
- Después sé honesta: **Otra vez** (no lo sabía o dudé), **Bien** (lo sabía) o **Fácil** (lo sabía sin pensar).
- La app decide cuándo vuelve cada palabra: las difíciles vuelven pronto y las fáciles, más tarde.
- Las palabras se desbloquean cuando abres una lección.

## Un plan hasta el A2
Con unos 30–45 minutos al día:

| Semanas | Qué hacer |
|---|---|
| 1–4 | Línea A1: módulos 1–3 (sonidos, primeros pasos, números) |
| 5–8 | Línea A1: módulos 4–6 (artículos, verbos, acusativo) |
| 9–12 | Línea A2: módulos 7–8 (pasado y dativo) |
| 13–16 | Línea A2: módulos 9–10 (lugares y frases largas) |
| 17–20 | Línea A2: módulos 11–12 (adjetivos y verbos especiales) |
| 21–24 | Vida en Alemania (módulos 13–14) y entrenamiento del examen (módulo 15) |

Si ya sabes algo de alemán, **empieza donde quieras**. Con el [test de nivel](#test-nivel) ves en unos 10 minutos si puedes empezar directamente con la Línea A2 (lo eliges en «Curso» o en «Ajustes»). Dentro de cada línea, haz el **Test del módulo** y, si sacas más de un 80 %, pasa al siguiente.

:::ojo Sé realista
Esta app te da la gramática, el vocabulario y mucha práctica. Pero para hablar con soltura necesitas además **escuchar alemán real** y **hablar con personas**. El Goethe-Institut calcula entre 200 y 350 clases de 45 minutos para llegar al A2.
:::

## Fuera de la app (muy recomendado)
- **Escuchar**: el curso gratuito *Nicos Weg* de la Deutsche Welle tiene vídeos cortos para A1–B1 y explicaciones también en español: [learngerman.dw.com](https://learngerman.dw.com). En YouTube, *Easy German* tiene entrevistas en la calle con subtítulos.
- **Leer**: noticias en alemán fácil en [nachrichtenleicht.de](https://www.nachrichtenleicht.de).
- **Hablar**: un curso, un tándem, tus vecinos, la panadería… Cada conversación cuenta. Usa las frases de la app sin miedo.

## Las herramientas de la app
- **Audio**: toca cualquier palabra en alemán para oírla. En cada lección puedes escuchar toda la explicación en español con los ejemplos en alemán.
- **Repaso**: tarjetas, juego de artículos, entrenador del Perfekt y tus errores.
- **Examen**: cómo es el examen A2 y entrenamiento de las cuatro partes.
- **Más**: diccionario, verbos, chuleta de gramática y falsos amigos.
- **Lena**: si está disponible, una profe virtual que te explica dudas en español, corrige tus textos y practica conversaciones contigo.

## El orden de la frase
| Tipo de frase | Dónde va el verbo | Ejemplo |
|---|---|---|
| Frase principal | posición 2 | [[Heute ==gehe== ich ins Kino.]] |
| Pregunta W | posición 2 | [[Wann ==kommst== du?]] |
| Pregunta sí/no | posición 1 | [[==Kommst== du morgen?]] |
| Modal / Perfekt / separable | posición 2 + final | [[Ich ==muss== heute ==arbeiten==.]] |
| Subordinada (weil, dass, wenn, ob) | al final | [[…, weil ich krank ==bin==.]] |

Conectores: **und, aber, oder, denn, sondern** (posición 0, orden normal) · **deshalb, trotzdem, dann, außerdem** (posición 1, verbo + sujeto) · **weil, dass, wenn, ob** (verbo al final).

## El Perfekt
- **haben / sein** (posición 2) + **participio** (final).
- **sein** con movimiento (gehen, fahren…), cambio de estado (aufstehen, einschlafen…) y sein, bleiben, passieren.
- Participio: **ge-…-t** (gemacht), **ge-…-en** (gegessen), separables **ein-ge-kauft**, sin ge-: **be-, ver-, er-…** (bezahlt) y **-ieren** (studiert).
- Con sein, haben y modales, mejor el Präteritum: **war, hatte, konnte, musste, wollte**.

| dativo | dem / einem neuen | der / einer neuen | dem / einem neuen | den / keinen neuen |

## Tiempo

|---|---|---|
| **um** + hora | **am** + día, fecha, parte del día | **im** + mes, estación |

**wer** (quién) · **was** (qué) · **wo** (dónde) · **woher** (de dónde) · **wohin** (adónde) · **wann** (cuándo) · **wie** (cómo) · **wie viel** (cuánto) · **warum** (por qué) · **welcher** (cuál) · **wen** (a quién, acusativo) · **wem** (a quién, dativo).

function readLines(root) {
  const out = [];
  $$('h3,h4,p,li,.box-h,.exr', root).forEach(el => {
    if (el.closest('.dlg,.tbl,.voc,.quiz,.aud,.txt,.trw,.corr,.spc')) return;
    if (el.classList.contains('exr')) { out.push({text: el.dataset.say, lang: 'de', el: el}); const es = $('.exes', el); if (es) out.push({text: es.textContent, lang: 'es', el: el}); return; }
    if (el.closest('.exr')) return;
    const segs = []; const push = (t, lang) => { t = t.replace(/[→=|]/g, ', ').replace(/\s+/g, ' '); if (!t.trim()) return; const l = segs[segs.length - 1]; if (l && l.lang === lang) l.text += t; else segs.push({text: t, lang: lang, el: el}); };
    const walk = n => { n.childNodes.forEach(c => { if (c.nodeType === 3) push(c.textContent, 'es'); else if (c.nodeType === 1) { if (c.tagName === 'svg') return; if (c.classList.contains('de') || c.classList.contains('gm') || c.classList.contains('gf') || c.classList.contains('gn') || c.classList.contains('gp')) push(c.textContent, 'de'); else walk(c); } }); };
    walk(el); segs.forEach(s => { if (/[a-záéíóúñü0-9]/i.test(s.text)) out.push(s); });
  });
  return out;
}
