LES({t: 'Preposiciones de doble vía', de: 'Wechselpräpositionen: Wo? und Wohin?', min: 25,
goal: 'Aprenderás las nueve preposiciones de lugar que pueden ir con **dativo o acusativo**, y la regla sencilla para elegir: **¿foto o vídeo?**',
body: `
## Paso 1: Las nueve preposiciones
| Preposición | Significa | |
|---|---|---|
| [[in]] | en, dentro de | [[in der Tasche]] |
| [[an]] | en, junto a, pegado a (una superficie vertical o un borde) | [[an der Wand]] (en la pared), [[am Meer]] |
| [[auf]] | sobre, encima de (tocando, superficie horizontal) | [[auf dem Tisch]] |
| [[über]] | por encima de (sin tocar) | [[über dem Sofa]] |
| [[unter]] | debajo de | [[unter dem Bett]] |
| [[vor]] | delante de | [[vor dem Haus]] |
| [[hinter]] | detrás de | [[hinter der Tür]] |
| [[neben]] | al lado de | [[neben dem Fenster]] |
| [[zwischen]] | entre | [[zwischen dem Sofa und dem Regal]] |

:::es Una palabra española, tres alemanas
En español «en» sirve para casi todo: «en la caja», «en la pared», «en la mesa». En alemán depende de **cómo** está la cosa:
- **dentro** → [[in]]: [[in der Kiste]] (en la caja)
- **pegado a algo vertical** o **en el borde** → [[an]]: [[an der Wand]] (en la pared), [[an der Tür]], [[am Fenster]]
- **encima de una superficie horizontal** → [[auf]]: [[auf dem Tisch]] (en la mesa)
:::

## Paso 2: La regla: ¿foto o vídeo?
Estas preposiciones llevan **dos casos** distintos según la pregunta:
- [[Wo?]] (¿dónde está?) → **no hay movimiento** → **dativo**.
- [[Wohin?]] (¿adónde va? ¿dónde lo pones?) → **hay movimiento hacia un destino** → **acusativo**.

:::cuento Foto o vídeo
Imagina que **haces una foto**: todo está quieto. El gato **está** encima del sofá. → **Wo?** → **dativo**: [[Die Katze liegt auf dem Sofa.]]

Ahora imagina que **grabas un vídeo**: el gato **salta** al sofá. Hay una flecha hacia un destino. → **Wohin?** → **acusativo**: [[Die Katze springt auf das Sofa.]]

Cuando dudes, pregúntate: **¿es una foto o un vídeo?**
:::

| Wo? (foto) → dativo | Wohin? (vídeo) → acusativo |
|---|---|
| [[Ich bin ==im== Kino.]] | [[Ich gehe ==ins== Kino.]] |
| [[Das Buch liegt ==auf dem== Tisch.]] | [[Ich lege das Buch ==auf den== Tisch.]] |
| [[Das Bild hängt ==an der== Wand.]] | [[Ich hänge das Bild ==an die== Wand.]] |
| [[Das Auto steht ==vor dem== Haus.]] | [[Ich fahre das Auto ==vor das== Haus.]] |

## Paso 3: Las contracciones
- **Dativo**: [[in dem]] → [[im]] · [[an dem]] → [[am]]
- **Acusativo**: [[in das]] → [[ins]] · [[an das]] → [[ans]]

Ejemplos: [[im Büro]] (en la oficina) / [[ins Büro]] (a la oficina) · [[am Strand]] (en la playa) / [[an den Strand]] (a la playa) · [[ans Meer]] (al mar).

:::ojo «Moverse» no siempre es «Wohin»
Lo que cuenta es si hay un **destino** (de fuera hacia dentro, de un sitio a otro). Si te mueves **dentro del mismo sitio**, es **Wo** → dativo:
- [[Wir tanzen im Wohnzimmer.]] (Bailamos en el salón: nos movemos, pero no cambiamos de sitio.)
- [[Ich gehe in das Wohnzimmer.]] (Entro en el salón: hay destino.)
:::

## Paso 4: Recuerda los otros grupos
- **Siempre dativo**: aus, bei, mit, nach, seit, von, zu (módulo 8).
- **Siempre acusativo**: durch, ohne, gegen, für, um (DOGFU, módulo 6).
- **Dativo o acusativo**: in, an, auf, über, unter, vor, hinter, neben, zwischen (¡esta lección!).

:::ejemplos
Mein Handy ist in der Tasche. = Mi móvil está en el bolso.
Ich stecke das Handy in die Tasche. = Meto el móvil en el bolso.
Wir wohnen im dritten Stock. = Vivimos en el tercer piso.
Am Wochenende fahren wir an den See. = El fin de semana vamos al lago.
Die Katze schläft unter dem Tisch. = El gato duerme debajo de la mesa.
Die Lampe hängt über dem Esstisch. = La lámpara cuelga encima de la mesa del comedor.
Der Supermarkt ist zwischen der Bank und der Apotheke. = El supermercado está entre el banco y la farmacia.
:::

:::vocab Palabras de esta lección
in = en, dentro de
an = en, junto a, pegado a
auf = sobre, encima de
über = por encima de
unter = debajo de
vor = delante de
hinter = detrás de
neben = al lado de
zwischen = entre
die Wand | die Wände = la pared
das Regal | die Regale = la estantería
die Kiste | die Kisten = la caja
der See | die Seen = el lago
das Meer | die Meere = el mar
der Strand | die Strände = la playa
der Stock | die Stockwerke = el piso, la planta (im dritten Stock)
das Wohnzimmer | die Wohnzimmer = el salón
:::

:::quiz
gap: Ich gehe ___ Kino. (al — in + das) || ins ## Wohin? → acusativo: in das = ins.
gap: Ich bin ___ Kino. (en el — in + dem) || im ## Wo? → dativo: in dem = im.
:::

:::resumen
- in, an, auf, über, unter, vor, hinter, neben, zwischen: **dativo o acusativo**.
- **Wo?** (foto, sin destino) → **dativo**. **Wohin?** (vídeo, con destino) → **acusativo**.
- im / am (dativo) · ins / ans (acusativo).
- **in** = dentro, **an** = pegado/borde, **auf** = encima.
:::
`,
ex: `
gap: Das Buch liegt auf ___ Tisch. (el — der Tisch) || dem ## Wo? → dativo: dem.
gap: Ich lege das Buch auf ___ Tisch. (el — der Tisch) || den ## Wohin? → acusativo: den.
gap: Das Bild hängt an ___ Wand. (la — die Wand) || der ## Wo? → dativo femenino: der.
gap: Ich hänge das Bild an ___ Wand. (la — die Wand) || die ## Wohin? → acusativo femenino: die.
gap: Wir fahren am Sonntag ___ Meer. (al — an + das) || ans ## Wohin? → an das = ans.
gap: Die Kinder spielen ___ Garten. (en el — in + dem) || im ## Wo? → in dem = im.
gap: Der Hund schläft unter ___ Bett. (la — das Bett) || dem ## Wo? → dativo neutro: dem.
gap: Stell das Fahrrad bitte hinter ___ Haus! (la — das Haus) || das ## Wohin? → acusativo neutro: das.
mc: «Estoy en la playa» || Ich bin am Strand. || Ich bin an den Strand. || Ich bin auf dem Strand. ## Wo? → dativo: am Strand.

LES({t: 'stellen y stehen, legen y liegen…', de: 'stellen/stehen · legen/liegen · setzen/sitzen · hängen', min: 20,
goal: 'Aprenderás los verbos que dicen **cómo** está o se pone una cosa: **de pie, tumbada, sentada o colgada**. En español decimos «poner» y «estar» para todo; en alemán hay que elegir.',
body: `
## Paso 1: Dos verbos para cada posición
Para cada posición hay **un verbo de acción** (poner = movimiento = **Wohin?** = acusativo) y **un verbo de resultado** (estar = sin movimiento = **Wo?** = dativo):

| Posición | Acción (Wohin? + acusativo) | Resultado (Wo? + dativo) |
|---|---|---|
| **de pie** (vertical) | [[stellen]] = poner (de pie) | [[stehen]] = estar (de pie) |
| **tumbado** (horizontal) | [[legen]] = poner (tumbado) | [[liegen]] = estar (tumbado) |
| **sentado** | [[setzen]] = sentar | [[sitzen]] = estar sentado |
| **colgado** | [[hängen]] = colgar | [[hängen]] = estar colgado |

## Paso 2: Ejemplos, en parejas
:::ejemplos
Ich stelle die Flasche in den Kühlschrank. = Pongo la botella en la nevera (de pie).
Die Flasche steht im Kühlschrank. = La botella está en la nevera (de pie).
Ich lege das Handy auf den Tisch. = Pongo el móvil en la mesa (tumbado).
Das Handy liegt auf dem Tisch. = El móvil está en la mesa (tumbado).
Ich setze das Baby auf den Stuhl. = Siento al bebé en la silla.
Das Baby sitzt auf dem Stuhl. = El bebé está sentado en la silla.
Ich hänge die Jacke an den Haken. = Cuelgo la chaqueta en el perchero.
Die Jacke hängt am Haken. = La chaqueta está colgada en el perchero.
:::

:::truco ¿Está de pie o tumbado?
- Las cosas que se sostienen **solas en vertical** (botellas, vasos, sillas, muebles, coches, libros en la estantería) → [[stellen]] / [[stehen]].
- Las cosas **planas o acostadas** (el móvil, las llaves, papeles, un libro sobre la mesa, una persona en la cama) → [[legen]] / [[liegen]].
- Pista de sonido: los verbos de **acción** (stellen, legen, setzen) son **regulares** y llevan **acusativo**. Los de **estado** (stehen, liegen, sitzen) son **irregulares** y llevan **dativo**.
:::

## Paso 3: sich setzen = sentarse
Si te sientas tú, el verbo es reflexivo: [[Ich setze mich auf das Sofa.]] (Me siento en el sofá.) Y después: [[Ich sitze auf dem Sofa.]] (Estoy sentada en el sofá.) Formal: [[Setzen Sie sich, bitte!]] o [[Nehmen Sie Platz!]]

## Paso 4: Las ciudades «están tumbadas»
Para decir dónde está una ciudad o un país se usa [[liegen]]: [[Hamburg liegt im Norden.]] (Hamburgo está en el norte.) [[Die Wohnung liegt zentral.]] (El piso está céntrico.) Es muy típico en anuncios de pisos.

:::es
En español «poner» y «estar» sirven para todo. El alemán es más **visual**: siempre te dice si la cosa está de pie, tumbada, sentada o colgada. Al principio parece mucho, pero en la vida real con [[stehen]] y [[liegen]] ya lo resuelves casi todo.
:::

:::ojo Errores típicos
- ~~Das Handy steht auf dem Tisch.~~ (el móvil no se sostiene de pie) → [[Das Handy liegt auf dem Tisch.]]
- ~~Ich stehe die Flasche auf den Tisch.~~ (stehen no tiene objeto) → [[Ich stelle die Flasche auf den Tisch.]]
- ~~Ich lege das Buch auf dem Tisch.~~ (acción → acusativo) → [[Ich lege das Buch auf den Tisch.]]
:::

:::dialogo Ordenando después de la mudanza
Jonas: Wohin stelle ich das Regal? = ¿Dónde pongo la estantería?
Elena: Stell es bitte neben das Fenster. = Ponla al lado de la ventana, por favor.
Jonas: Und die Bücher? = ¿Y los libros?
Elena: Die Bücher stellen wir ins Regal. Die Zeitschriften kannst du auf den Tisch legen. = Los libros los ponemos en la estantería. Las revistas las puedes dejar en la mesa.
Jonas: Wo ist eigentlich der Hammer? = ¿Dónde está el martillo, por cierto?
Elena: Er liegt in der Kiste unter dem Fenster. = Está en la caja, debajo de la ventana.
:::

:::vocab Palabras de esta lección
stellen = poner (de pie)
stehen | hat gestanden = estar (de pie)
legen = poner (tumbado)
liegen | hat gelegen = estar (tumbado); estar situado
setzen = sentar; sich setzen = sentarse
sitzen | hat gesessen = estar sentado
hängen = colgar; estar colgado
der Haken | die Haken = el gancho, el perchero
die Zeitschrift | die Zeitschriften = la revista
der Schrank | die Schränke = el armario
das Sofa | die Sofas = el sofá
zentral = céntrico
eigentlich = en realidad; por cierto (en preguntas)
:::

:::quiz
mc: El móvil ___ auf dem Tisch. || liegt || steht || legt ## Está plano y quieto: liegt (+ dativo).
mc: Ich ___ den Teller auf den Tisch. (poner un plato plano) || lege || liege || stelle ## Acción + objeto plano: legen + acusativo.
:::

:::resumen
- Acción (+ acusativo): **stellen, legen, setzen, hängen**. Estado (+ dativo): **stehen, liegen, sitzen, hängen**.
- De pie → stellen/stehen. Tumbado/plano → legen/liegen.
- [[Ich setze mich.]] = me siento. Las ciudades **liegen**.
:::
`,
ex: `

mc: Das Kind ___ auf dem Stuhl. || sitzt || setzt || steht ## Estado: sitzt.

LES({t: 'Ir a sitios: nach, zu, in, bei, aus, von', de: 'Wohin? Wo? Woher?', min: 25,
goal: 'Aprenderás a decir **adónde vas, dónde estás y de dónde vienes** para cada tipo de lugar. Con **una sola tabla** resolverás una de las dudas más frecuentes del alemán.',
body: `
## Paso 1: El problema
En español usamos «a», «en» y «de» para casi todo: voy **a** Madrid, voy **al** médico, voy **a** casa. En alemán, la preposición cambia según **el tipo de lugar**. Pero hay un sistema muy claro.

## Paso 2: La gran tabla
| Tipo de lugar | Wohin? (adónde) | Wo? (dónde) | Woher? (de dónde) |
|---|---|---|---|
| ciudades y países sin artículo | [[nach Berlin]] | [[in Berlin]] | [[aus Berlin]] |
| países con artículo | [[in die Schweiz]] | [[in der Schweiz]] | [[aus der Schweiz]] |
| personas (y profesionales) | [[zu meiner Oma]] · [[zum Arzt]] | [[bei meiner Oma]] · [[beim Arzt]] | [[von meiner Oma]] · [[vom Arzt]] |
| edificios y sitios donde **entras** | [[ins Kino]] · [[in die Schule]] | [[im Kino]] · [[in der Schule]] | [[aus dem Kino]] · [[aus der Schule]] |
| sitios de la ciudad (como destino) | [[zum Bahnhof]] · [[zur Post]] | [[am Bahnhof]] · [[bei der Post]] | [[vom Bahnhof]] · [[von der Post]] |
| superficies y eventos | [[auf den Markt]] · [[auf eine Party]] | [[auf dem Markt]] · [[auf der Party]] | [[vom Markt]] · [[von der Party]] |
| agua (mar, lago, playa) | [[ans Meer]] · [[an den See]] | [[am Meer]] · [[am See]] | [[vom Meer]] · [[vom See]] |
| casa | [[nach Hause]] | [[zu Hause]] | [[von zu Hause]] |

:::truco Tres reglas que resuelven el 80 %
1. **Ciudades y países** → [[nach]] (adónde) · [[in]] (dónde) · [[aus]] (de dónde).
2. **Personas** → [[zu]] (adónde) · [[bei]] (dónde) · [[von]] (de dónde). [[Ich gehe zu Anna.]] [[Ich bin bei Anna.]] [[Ich komme von Anna.]]
3. **Casa** → [[nach Hause]] (adónde) · [[zu Hause]] (dónde).
:::

## Paso 3: zum Supermarkt o in den Supermarkt
Las dos formas son correctas, con un matiz:
- [[Ich gehe zum Supermarkt.]] → voy **hasta** el supermercado (el destino).
- [[Ich gehe in den Supermarkt.]] → **entro** en el supermercado.
En la vida diaria, con edificios de la ciudad (Bahnhof, Post, Bank, Apotheke, Supermarkt), [[zum]] / [[zur]] es lo más normal.

## Paso 4: nach Hause y zu Hause
:::ojo El par más confundido
- [[nach Hause]] = **a casa** (hay movimiento): [[Ich gehe jetzt nach Hause.]]
- [[zu Hause]] = **en casa** (no hay movimiento): [[Ich bin zu Hause.]]
Nunca ~~Ich gehe zu Hause~~ ni ~~Ich bin nach Hause~~.
:::

:::es
Observa que **zu** puede ser «a» (zu Anna = a casa de Anna) **y** formar parte de «en casa» (zu Hause). Es una excepción histórica: apréndete [[zu Hause]] como una sola palabra.
:::

:::ejemplos
Im Sommer fliegen wir nach Spanien. = En verano volamos a España.
Meine Schwester wohnt in den USA. = Mi hermana vive en Estados Unidos.
Ich muss heute zum Zahnarzt. = Hoy tengo que ir al dentista.
Die Kinder sind bei ihrer Oma. = Los niños están en casa de su abuela.
Wir gehen am Samstag auf den Flohmarkt. = El sábado vamos al mercadillo.
Ich komme gerade aus dem Büro. = Vengo ahora mismo de la oficina.
Wann kommst du nach Hause? = ¿Cuándo vuelves a casa?
:::

:::vocab Lugares de la ciudad
der Bahnhof | die Bahnhöfe = la estación de tren
die Post = Correos, la oficina de correos
die Apotheke | die Apotheken = la farmacia
der Supermarkt | die Supermärkte = el supermercado
die Bäckerei | die Bäckereien = la panadería
das Rathaus | die Rathäuser = el ayuntamiento
das Krankenhaus | die Krankenhäuser = el hospital
der Zahnarzt | die Zahnärzte = el dentista
der Markt | die Märkte = el mercado
der Flohmarkt | die Flohmärkte = el mercadillo, el rastro
das Büro | die Büros = la oficina
nach Hause = a casa
zu Hause = en casa
:::

:::quiz
gap: Ich gehe jetzt ___ Hause. (a casa) || nach ## Movimiento: nach Hause.
gap: Heute bleibe ich ___ Hause. (en casa) || zu ## Sin movimiento: zu Hause.
:::

:::resumen
- Ciudades/países: **nach – in – aus**. Personas: **zu – bei – von**. Edificios donde entras: **in + acusativo – in + dativo – aus**.
- Agua: **an** (ans Meer, am Meer). Eventos y superficies: **auf** (auf eine Party).
- **nach Hause** = a casa · **zu Hause** = en casa.
:::
`,
ex: `
gap: Im August fahren wir ___ Italien. (a) || nach ## País sin artículo: nach.
gap: Mein Bruder wohnt ___ der Schweiz. (en) || in ## País con artículo: in der Schweiz.
gap: Ich gehe morgen ___ Friseur. (a la — zu + dem) || zum ## Persona/profesional: zum Friseur.
gap: Ich war gestern ___ Arzt. (en el — bei + dem) || beim ## Wo? + persona: beim Arzt.
gap: Wir fahren am Wochenende ___ Meer. (al — an + das) || ans ## Agua: ans Meer.
gap: Kommst du ___ der Arbeit? (de) || von ## Woher? + sitio: von der Arbeit.
gap: Am Samstag gehen wir ___ eine Party. (a) || auf ## Eventos: auf eine Party.
gap: Ich bin ___ Hause. (en casa) || zu ## zu Hause = en casa.
mc: «Voy a casa de mi amiga» || Ich gehe zu meiner Freundin. || Ich gehe bei meiner Freundin. || Ich gehe nach meiner Freundin. ## Personas, adónde: zu.
mc: «Estoy en casa de mis padres» || Ich bin bei meinen Eltern. || Ich bin zu meinen Eltern. || Ich bin von meinen Eltern. ## Personas, dónde: bei.
mc: «Vengo de Colombia» || Ich komme aus Kolumbien. || Ich komme von Kolumbien. || Ich komme nach Kolumbien. ## País, de dónde: aus.
match: nach Berlin = a Berlín || in Berlin = en Berlín || zu Anna = a casa de Anna || bei Anna = en casa de Anna || nach Hause = a casa ## La tabla en cinco ejemplos.
write: Voy al médico. || Ich gehe zum Arzt. ## Personas/profesionales: zum.
speak: Nach dem Kurs gehe ich zum Supermarkt und dann nach Hause. = Después del curso voy al supermercado y luego a casa.
`});

LES({t: 'Preguntar e indicar el camino', de: 'Nach dem Weg fragen · Wegbeschreibung', min: 20,
goal: 'Podrás **preguntar cómo llegar** a un sitio y **entender las indicaciones**: todo recto, la segunda a la izquierda, en el semáforo, cruzar el puente…',
body: `
## Paso 1: Preguntar
Empieza siempre con [[Entschuldigung!]] y después:
- [[Wie komme ich zum Bahnhof?]] (¿Cómo llego a la estación?)
- [[Wo ist hier eine Apotheke?]] (¿Dónde hay una farmacia por aquí?)
- [[Gibt es hier in der Nähe einen Supermarkt?]] (¿Hay un supermercado cerca?)
- [[Ist das weit?]] (¿Está lejos?) · [[Kann ich zu Fuß gehen?]] (¿Puedo ir a pie?)

## Paso 2: Las indicaciones
| Alemán | Español |
|---|---|
| [[geradeaus]] | todo recto |
| [[links]] / [[rechts]] | a la izquierda / a la derecha |
| [[Gehen Sie die erste Straße links.]] | Coja la primera calle a la izquierda. |
| [[Biegen Sie rechts ab.]] | Gire a la derecha. |
| [[an der Ampel]] | en el semáforo |
| [[an der Kreuzung]] | en el cruce |
| [[über die Brücke]] | por el puente (cruzando) |
| [[über die Straße]] | cruzando la calle |
| [[um die Ecke]] | a la vuelta de la esquina |
| [[bis zur Kirche]] | hasta la iglesia |
| [[am Park vorbei]] | pasando por delante del parque |
| [[nach 200 Metern]] | después de 200 metros |
| [[gegenüber von der Bank]] | enfrente del banco |

:::truco links y rechts
**links** = izquierda, **rechts** = derecha. Truco: «**R**echts» y «de**r**echa» tienen la **r**. Y «**l**inks» suena a «**l**ado izquierdo».
:::

## Paso 3: Las palabras de lugar (adverbios)
[[hier]] (aquí), [[da]] / [[dort]] (ahí, allí), [[oben]] (arriba), [[unten]] (abajo), [[vorne]] (delante), [[hinten]] (detrás, al fondo), [[drinnen]] (dentro), [[draußen]] (fuera), [[in der Nähe]] (cerca), [[weit weg]] (lejos).

## Paso 4: Con transporte público
- [[Nehmen Sie die U-Bahn, Linie 3.]] (Coja el metro, línea 3.)
- [[Fahren Sie bis zur Haltestelle Marktplatz.]] (Vaya hasta la parada Marktplatz.)
- [[Steigen Sie am Hauptbahnhof um.]] (Haga transbordo en la estación central.)
- [[Steigen Sie an der dritten Haltestelle aus.]] (Bájese en la tercera parada.)

:::dialogo En la calle
Frau: Entschuldigung, wie komme ich zum Rathaus? = Disculpe, ¿cómo llego al ayuntamiento?
Mann: Zum Rathaus? Das ist nicht weit. Gehen Sie hier geradeaus bis zur Ampel. = ¿Al ayuntamiento? No está lejos. Siga todo recto hasta el semáforo.
Frau: Bis zur Ampel, ja. = Hasta el semáforo, sí.
Mann: An der Ampel gehen Sie links und dann die zweite Straße rechts. = En el semáforo gire a la izquierda y luego coja la segunda calle a la derecha.
Frau: Links und dann die zweite rechts. Und dann? = A la izquierda y luego la segunda a la derecha. ¿Y después?
Mann: Dann sehen Sie das Rathaus schon. Es ist gegenüber vom Park. = Entonces ya verá el ayuntamiento. Está enfrente del parque.
Frau: Vielen Dank! = ¡Muchas gracias!
Mann: Gern geschehen! = ¡De nada!
:::

:::nota Repetir para estar segura
Cuando te expliquen el camino, **repite** en voz alta las partes importantes, como hace la señora del diálogo: [[Also geradeaus und dann links?]] Así la otra persona te corrige si te has equivocado. Es una estrategia muy útil también en el examen oral.
:::

:::vocab Palabras de esta lección
der Weg | die Wege = el camino
geradeaus = todo recto
links = a la izquierda
rechts = a la derecha
abbiegen | er biegt ab = girar
die Ampel | die Ampeln = el semáforo

aussteigen | er steigt aus = bajarse (del transporte)
in der Nähe = cerca
weit = lejos
Gern geschehen! = ¡De nada!

LES({t: 'und, aber, oder, denn, sondern', de: 'Konnektoren auf Position 0', min: 20,
goal: 'Aprenderás los cinco conectores **más fáciles** del alemán: no cambian nada en el orden de la frase. Con ellos ya puedes hablar con frases más largas.',
body: `
## Paso 1: Los cinco conectores
| Conector | Significa | Ejemplo |
|---|---|---|
| [[und]] | y | [[Ich koche und mein Mann spült.]] |
| [[aber]] | pero | [[Das Kleid ist schön, aber es ist teuer.]] |
| [[oder]] | o | [[Trinkst du Tee oder möchtest du Kaffee?]] |
| [[denn]] | porque | [[Ich bleibe zu Hause, denn ich bin krank.]] |
| [[sondern]] | sino | [[Ich komme nicht heute, sondern morgen.]] |

## Paso 2: Posición 0: no cuentan
Estos conectores están en la **posición 0**: van **entre** las dos frases, pero **no ocupan ningún sitio**. Después de ellos, la segunda frase empieza normal: **posición 1, verbo en posición 2**.

| Frase 1 | Pos. 0 | Pos. 1 | Pos. 2 (verbo) | Resto |
|---|---|---|---|---|
| Ich bin müde, | [[aber]] | ich | [[gehe]] | noch nicht ins Bett. |
| Ich bin müde, | [[aber]] | heute | [[gehe]] | ich nicht früh ins Bett. |
| Ich lerne Deutsch, | [[denn]] | ich | [[möchte]] | in Deutschland arbeiten. |

:::truco ADUSO
Recuerda los cinco con la palabra **ADUSO**: **A**ber, **D**enn, **U**nd, **S**ondern, **O**der. Imagina a un señor que se llama **don Aduso** y que es muy tranquilo: cuando aparece, **no mueve nada de sitio**.
:::

## Paso 3: aber o sondern
Los dos se traducen a veces igual, pero se usan distinto:
- [[aber]] = **pero**: añade algo, a veces contrario: [[Die Wohnung ist klein, aber schön.]]
- [[sondern]] = **sino**: **corrige** después de una negación (nicht o kein): [[Das ist nicht mein Handy, sondern dein Handy.]] · [[Ich trinke keinen Kaffee, sondern Tee.]]

:::es
Es exactamente igual que en español: «no es mío, **sino** tuyo» → [[sondern]]; «es pequeño, **pero** bonito» → [[aber]].
:::

## Paso 4: Las comas
- Delante de [[aber]], [[denn]] y [[sondern]]: **siempre coma**.
- Delante de [[und]] y [[oder]]: **normalmente no** hay coma.

## Paso 5: Cuando el sujeto es el mismo
Con **und**, **aber**, **oder** y **sondern**, si el sujeto es el mismo puedes no repetirlo: [[Ich stehe auf und dusche.]] (Me levanto y me ducho.) Con [[denn]] siempre se repite: [[Ich esse, denn ich habe Hunger.]]

:::ejemplos
Ich arbeite in einem Krankenhaus und meine Frau ist Lehrerin. = Trabajo en un hospital y mi mujer es profesora.
Ich möchte kommen, aber ich habe keine Zeit. = Me gustaría ir, pero no tengo tiempo.
Wir gehen ins Kino oder wir bleiben zu Hause. = Vamos al cine o nos quedamos en casa.
Sie nimmt den Bus, denn ihr Auto ist kaputt. = Ella coge el autobús, porque su coche está estropeado.
Er wohnt nicht in Köln, sondern in Bonn. = No vive en Colonia, sino en Bonn.
:::

:::vocab Palabras de esta lección
und = y
aber = pero
oder = o
denn = porque
sondern = sino
spülen = fregar (los platos)
kaputt = roto, estropeado
krank = enfermo
das Kleid | die Kleider = el vestido
:::

:::quiz
gap: Ich trinke keinen Kaffee, ___ Tee. (sino) || sondern ## Corrección después de kein: sondern.
order: (Me quedo en casa, porque estoy cansada.) ich bleibe zu Hause, denn ich bin müde ## denn no cambia el orden: ich bin.
:::

:::resumen
- **ADUSO**: aber, denn, und, sondern, oder → **posición 0**, no cambian el orden.
- **aber** = pero; **sondern** = sino (después de nicht/kein).
- Coma delante de aber, denn y sondern.
:::
`,
ex: `

mc: ¿Cuál es correcta? || Wir haben keinen Hund, sondern eine Katze. || Wir haben keinen Hund, aber eine Katze sondern. || Wir haben keinen Hund, oder eine Katze. ## Corrección después de kein: sondern.

LES({t: 'weil: dar razones', de: 'Nebensätze mit weil', min: 25,
goal: 'Aprenderás tu primera **oración subordinada**: con **weil** (porque) el verbo se va **al final**. Es una de las estructuras más importantes del examen A2.',
body: `
## Paso 1: weil manda el verbo al final
Con [[weil]] (porque), la frase cambia: el **verbo conjugado** se va **al final de la frase**.
- [[Ich bleibe zu Hause, ==weil== ich krank ==bin==.]]
- [[Ich lerne Deutsch, ==weil== ich in Deutschland ==arbeite==.]]

:::cuento El verbo que se esconde
Imagina que **weil** es un imán muy fuerte que está al principio de la frase y que **empuja** al verbo hasta el final, como si el verbo se escondiera detrás de todo. Siempre que veas **weil** (y más tarde dass, wenn, ob…), busca el verbo **al final**.
:::

## Paso 2: Oración principal y oración subordinada
- La **oración principal** puede vivir sola: [[Ich bleibe zu Hause.]] El verbo está en la posición 2.
- La **oración subordinada** no puede vivir sola: «porque estoy enferma…» necesita la otra. Empieza con **weil** y el verbo va **al final**.
- Entre las dos va **siempre una coma**.

| Oración principal | , | Conector | Sujeto | … | Verbo (final) |
|---|---|---|---|---|---|
| Ich bleibe zu Hause | , | [[weil]] | ich | krank | [[bin]]. |
| Wir nehmen ein Taxi | , | [[weil]] | es | stark | [[regnet]]. |

## Paso 3: weil con verbos separables, modales y Perfekt
- **Separables**: el verbo vuelve a juntarse **al final**: [[Ich bin müde, weil ich früh ==aufstehe==.]]
- **Modales**: el modal conjugado va **el último**, detrás del infinitivo: [[Ich komme nicht, weil ich ==arbeiten muss==.]]
- **Perfekt**: haben o sein van **los últimos**: [[Ich bin müde, weil ich schlecht ==geschlafen habe==.]]

:::truco La regla del último vagón
En una oración con **weil**, el **verbo conjugado** (el que cambia según la persona: bin, muss, habe…) es **el último vagón del tren**. Todo lo demás va antes.
:::

## Paso 4: weil y denn: lo mismo con distinto orden
Los dos significan «porque», pero:
- [[denn]] (posición 0) → orden **normal**: [[Ich komme nicht, denn ich bin krank.]]
- [[weil]] (subordinada) → verbo **al final**: [[Ich komme nicht, weil ich krank bin.]]
Al hablar, los alemanes usan mucho más **weil**.

## Paso 5: Responder a «Warum?»
A la pregunta [[Warum?]] (¿por qué?) se puede contestar solo con la oración de weil: [[Warum lernst du Deutsch? – Weil ich hier lebe.]]

## Paso 6: La oración con weil puede ir delante
Si empiezas con la oración de **weil**, toda ella cuenta como la **posición 1**, y la principal empieza **con el verbo**: [[Weil ich krank bin, ==bleibe== ich zu Hause.]] Se forma un «**verbo, verbo**» en el centro: bin, bleibe.

:::ojo Errores típicos
- ~~…, weil ich bin krank.~~ → [[…, weil ich krank bin.]]
- ~~…, weil ich muss arbeiten.~~ → [[…, weil ich arbeiten muss.]]
- ~~…, weil ich stehe früh auf.~~ → [[…, weil ich früh aufstehe.]]
Al hablar rápido, muchos alemanes también dicen «weil ich bin krank», pero **en el examen escríbelo siempre con el verbo al final**.
:::

:::es
En español el orden no cambia: «porque **estoy** enferma». En alemán **sí cambia**. Es una de las cosas que más practicar: al principio, cuando digas «weil», **haz una pausa mental** y guarda el verbo para el final.
:::

:::ejemplos
Ich gehe zum Arzt, weil ich Fieber habe. = Voy al médico porque tengo fiebre.
Wir ziehen um, weil die Wohnung zu klein ist. = Nos mudamos porque el piso es demasiado pequeño.
Sie ist glücklich, weil sie die Prüfung bestanden hat. = Está contenta porque ha aprobado el examen.
Ich kann nicht kommen, weil ich auf meine Kinder aufpassen muss. = No puedo ir porque tengo que cuidar de mis hijos.
Weil es heute regnet, fahren wir mit dem Bus. = Como hoy llueve, vamos en autobús.
:::

:::vocab Palabras de esta lección
weil = porque
warum? = ¿por qué?
regnen | es regnet = llover
das Fieber = la fiebre
glücklich = feliz, contento
die Prüfung | die Prüfungen = el examen
bestehen | hat bestanden = aprobar (un examen)
aufpassen auf | er passt auf = cuidar de; prestar atención
umziehen | ist umgezogen = mudarse
:::

:::quiz
order: (Me quedo en casa porque estoy enferma.) ich bleibe zu Hause, weil ich krank bin ## weil manda el verbo (bin) al final.
mc: ¿Cuál es correcta? || …, weil ich arbeiten muss. || …, weil ich muss arbeiten. || …, weil muss ich arbeiten. ## El modal conjugado va el último.
:::

:::resumen
- **weil** = porque → verbo conjugado **al final**. Siempre **coma**.
- Separables se juntan: weil ich früh **aufstehe**. Modal: weil ich arbeiten **muss**. Perfekt: weil ich geschlafen **habe**.
- **denn** = porque, pero con orden normal.
- Si **weil** va delante: [[Weil ich krank bin, bleibe ich zu Hause.]]
:::
`,
ex: `
order: (Voy al médico porque tengo fiebre.) ich gehe zum Arzt, weil ich Fieber habe ## weil + … + verbo al final (habe).
order: (Nos mudamos porque el piso es demasiado caro.) wir ziehen um, weil die Wohnung zu teuer ist ## ist al final.
order: (No puedo ir porque tengo que trabajar.) ich kann nicht kommen, weil ich arbeiten muss ## El modal conjugado (muss) es el último.
order: (Estoy cansada porque me levanto temprano.) ich bin müde, weil ich früh aufstehe ## El separable se junta al final: aufstehe.
order: (Estoy cansada porque he dormido mal.) ich bin müde, weil ich schlecht geschlafen habe ## Perfekt: habe al final.
mc: ¿Cuál es correcta? || Ich lerne Deutsch, weil ich in Berlin wohne. || Ich lerne Deutsch, weil ich wohne in Berlin. || Ich lerne Deutsch, weil wohne ich in Berlin. ## Verbo al final.
mc: ¿Cuál es correcta? || Weil es regnet, nehmen wir den Bus. || Weil es regnet, wir nehmen den Bus. || Weil regnet es, nehmen wir den Bus. ## Si weil va delante: «verbo, verbo» (regnet, nehmen).
mc: «Ich komme nicht, denn ich bin krank» significa lo mismo que… || Ich komme nicht, weil ich krank bin. || Ich komme nicht, weil ich bin krank. || Ich komme nicht, denn ich krank bin. ## denn = orden normal; weil = verbo al final.
gap: Ich trinke Kaffee, weil ich müde ___. (sein) || bin ## Verbo al final.
gap: Sie lernt viel, weil sie die Prüfung bestehen ___. (wollen) || will ## Modal al final: will.
gap: Warum bist du so glücklich? – ___ ich einen neuen Job habe! || Weil ## Respuesta corta a Warum: Weil…
write: Voy en autobús porque llueve. || Ich fahre mit dem Bus, weil es regnet. / Ich nehme den Bus, weil es regnet. ## weil + es regnet (verbo al final).
listen: Ich kann heute nicht kommen, weil mein Sohn krank ist. = Hoy no puedo ir porque mi hijo está enfermo. ## ist al final.
speak: Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte. = Aprendo alemán porque quiero trabajar en Alemania.
`});

LES({t: 'dass y ob: opiniones y preguntas indirectas', de: 'Nebensätze mit dass und ob · indirekte Fragen', min: 25,
goal: 'Podrás **dar tu opinión** ([[Ich finde, dass…]]), decir lo que sabes o crees, y hacer **preguntas educadas** ([[Können Sie mir sagen, wo…?]]). En todas, el verbo va al final.',
body: `
## Paso 1: dass = que
Con [[dass]] cuentas una opinión, algo que sabes, crees o esperas. Como con weil, el **verbo va al final**:
- [[Ich finde, ==dass== Deutsch schön ==ist==.]] (Me parece que el alemán es bonito.)
- [[Ich glaube, ==dass== er morgen ==kommt==.]] (Creo que él viene mañana.)
- [[Ich hoffe, ==dass== du bald gesund ==bist==.]] (Espero que te recuperes pronto.)

Frases muy útiles para empezar:
| Alemán | Español |
|---|---|
| [[Ich finde, dass…]] | Me parece que… / Opino que… |
| [[Ich glaube, dass…]] | Creo que… |
| [[Ich denke, dass…]] | Pienso que… |
| [[Ich weiß, dass…]] | Sé que… |
| [[Ich hoffe, dass…]] | Espero que… |
| [[Es ist wichtig, dass…]] | Es importante que… |
| [[Schade, dass…]] | Qué pena que… |
| [[Ich freue mich, dass…]] | Me alegro de que… |

:::es dass no es das
[[dass]] (con doble s) es la conjunción «que». [[das]] (con una s) es el artículo o «eso». Truco: si en español puedes decir «**que**» uniendo dos frases, es **dass**.
:::

:::nota Una tranquilidad
Después de [[Ich glaube]], [[Ich denke]] o [[Ich finde]] también puedes decir la frase **sin dass** y con orden normal: [[Ich glaube, er kommt morgen.]] Es muy común al hablar. Pero **con dass, el verbo siempre al final**.
:::

## Paso 2: ob = si (en preguntas indirectas)
Cuando quieres hacer una pregunta de **sí o no** de forma indirecta, usas [[ob]] = **si**:
- Pregunta directa: [[Kommt er morgen?]] (¿Viene mañana?)
- Indirecta: [[Ich weiß nicht, ==ob== er morgen ==kommt==.]] (No sé **si** viene mañana.)
- [[Weißt du, ob der Supermarkt heute offen ist?]] (¿Sabes si el súper está abierto hoy?)

:::ojo ob y wenn: dos «si» distintos
En español «si» sirve para dos cosas. En alemán no:
- **ob** = si **de pregunta** (no sé si…, pregunto si…): [[Ich frage, ob du Zeit hast.]]
- **wenn** = si **de condición** (si tengo tiempo, voy): [[Wenn ich Zeit habe, komme ich.]] (Lo verás en la siguiente lección.)
Truco: si puedes poner «**si… o no**», es **ob**: «No sé si viene (o no)».
:::

## Paso 3: Preguntas indirectas con W-Wörter
Las preguntas con **wo, wann, wie, was, warum…** también pueden ser indirectas. La palabra W hace de conector y el **verbo va al final**:
- [[Wo ist der Bahnhof?]] → [[Können Sie mir sagen, wo der Bahnhof ist?]]
- [[Wann beginnt der Kurs?]] → [[Wissen Sie, wann der Kurs beginnt?]]
- [[Was kostet das?]] → [[Ich möchte wissen, was das kostet.]]

:::truco Preguntas más educadas
Una pregunta indirecta suena **mucho más amable**, como en español «¿Me podría decir dónde está…?». Es perfecta para hablar con desconocidos, por teléfono y en el examen oral:
- [[Können Sie mir sagen, wann der Zug fährt?]]
- [[Wissen Sie, ob hier ein Geldautomat ist?]] (¿Sabe si hay un cajero por aquí?)
:::

:::ejemplos
Ich finde, dass die Miete zu hoch ist. = Me parece que el alquiler es demasiado alto.
Ich weiß nicht, ob ich am Freitag Zeit habe. = No sé si el viernes tengo tiempo.
Kannst du mir sagen, wie spät es ist? = ¿Me puedes decir qué hora es?
Es ist wichtig, dass du jeden Tag übst. = Es importante que practiques cada día.
Schade, dass du nicht kommen kannst! = ¡Qué pena que no puedas venir!
Wissen Sie, wo die Toiletten sind? = ¿Sabe dónde están los servicios?
:::

:::vocab Palabras de esta lección
dass = que (conjunción)
ob = si (en preguntas indirectas)
finden | er findet = opinar, parecer; encontrar
glauben = creer
denken | er denkt = pensar
hoffen = esperar (tener esperanza)
wichtig = importante
schade = qué pena
gesund = sano
die Miete | die Mieten = el alquiler
der Geldautomat | die Geldautomaten = el cajero automático
die Toilette | die Toiletten = el baño, el servicio
üben = practicar
:::

:::quiz
order: (Creo que el curso es bueno.) ich glaube, dass der Kurs gut ist ## dass + … + verbo al final (ist).
gap: Ich weiß nicht, ___ er heute kommt. (si) || ob ## Pregunta indirecta de sí o no: ob.
:::

:::resumen
- **dass** = que: [[Ich finde, dass…]] · verbo **al final**.
- **ob** = si (pregunta indirecta). **wenn** = si (condición).
- Preguntas indirectas: [[Können Sie mir sagen, wo der Bahnhof ist?]] · verbo **al final**.
:::
`,
ex: `
order: (Me parece que el alquiler es demasiado alto.) ich finde, dass die Miete zu hoch ist ## dass + verbo al final.
order: (Espero que vengas mañana.) ich hoffe, dass du morgen kommst ## kommst al final.
order: (No sé si tiene tiempo.) ich weiß nicht, ob er Zeit hat ## ob + verbo al final.
order: (¿Puede decirme dónde está la estación?) können Sie mir sagen, wo der Bahnhof ist ## Pregunta indirecta: verbo al final.
gap: Ich glaube, ___ das richtig ist. (que) || dass ## dass con doble s.
gap: Weißt du, ___ der Laden heute geöffnet ist? (si) || ob ## Pregunta de sí o no indirecta: ob.
gap: Kannst du mir sagen, ___ der Film beginnt? (cuándo) || wann ## Palabra W como conector.
gap: Es ist wichtig, dass du viel Wasser ___. (trinken) || trinkst ## Verbo al final: trinkst.
mc: ¿Cuál es correcta? || Wissen Sie, wo die Post ist? || Wissen Sie, wo ist die Post? || Wissen Sie, wo die Post sein? ## Pregunta indirecta: verbo al final.
mc: «No sé si llueve mañana» || Ich weiß nicht, ob es morgen regnet. || Ich weiß nicht, wenn es morgen regnet. || Ich weiß nicht, dass es morgen regnet. ## si de pregunta = ob.
mc: ¿Dónde se escribe «dass»? || Ich hoffe, ___ es dir gut geht. || ___ ist mein Auto. || Wo ist ___ Buch? ## dass = que (conjunción). das = artículo o «eso».
write: Creo que tienes razón. || Ich glaube, dass du recht hast. / Ich glaube, du hast recht. ## Con dass, verbo al final; sin dass, orden normal.
listen: Schade, dass du am Samstag nicht kommen kannst. = Qué pena que no puedas venir el sábado. ## Verbo modal al final: kannst.
speak: Entschuldigung, können Sie mir sagen, wann der nächste Bus kommt? = Disculpe, ¿me puede decir cuándo viene el próximo autobús?
`});

LES({t: 'wenn: condiciones y costumbres', de: 'Nebensätze mit wenn', min: 20,
goal: 'Aprenderás a decir **«si pasa esto, hago aquello»** y **«cuando…»** para cosas que se repiten. Y practicarás el famoso **«verbo, verbo»** del alemán.',
body: `
## Paso 1: wenn = si (condición)
- [[Wenn ich Zeit habe, komme ich.]] (Si tengo tiempo, voy.)
- [[Wenn es regnet, bleiben wir zu Hause.]] (Si llueve, nos quedamos en casa.)
- [[Ich rufe dich an, wenn ich ankomme.]] (Te llamo cuando llegue.)

Como con **weil** y **dass**, en la oración con **wenn** el verbo va **al final**.

## Paso 2: wenn = cuando (cada vez que)
**wenn** también significa «cuando», para el **presente y el futuro**, y para cosas que **se repiten**:
- [[Wenn ich müde bin, trinke ich Kaffee.]] (Cuando estoy cansada, tomo café.)
- [[Immer wenn ich Oma besuche, backt sie Kuchen.]] (Siempre que visito a la abuela, hace tarta.)

:::nota ¿Y «cuando» en pasado?
Para un momento **único del pasado** («cuando era niña», «cuando llegué a Alemania») el alemán usa otra palabra: [[als]]. [[Als ich ein Kind war, wohnte ich in Lima.]] Es del nivel B1, pero es bueno que la reconozcas. Para hablar del presente y del futuro, usa siempre **wenn**.
:::

## Paso 3: Verbo, verbo
Cuando la oración con **wenn** va **delante**, ocupa toda la **posición 1**. Por eso la oración principal empieza **directamente con su verbo**. En el centro aparecen **dos verbos juntos**, separados por una coma:

| Posición 1 (toda la oración con wenn) | Pos. 2 (verbo) | Resto |
|---|---|---|
| Wenn ich Zeit ==habe==, | [[komme]] | ich. |
| Wenn es morgen ==regnet==, | [[fahren]] | wir mit dem Bus. |
| Wenn du Hilfe ==brauchst==, | [[ruf]] | mich an! |

:::truco El sándwich de verbos
Busca siempre el **«verbo, verbo»** en el medio: «…habe, komme…», «…regnet, fahren…». Si no lo tienes, revisa la frase. Es la marca de un alemán correcto.
:::

## Paso 4: Repaso de los tres «si»
| Español | Alemán | Ejemplo |
|---|---|---|
| si (condición) | [[wenn]] | [[Wenn du willst, helfe ich dir.]] |
| si (pregunta indirecta) | [[ob]] | [[Ich weiß nicht, ob er kommt.]] |
| cuando (presente/futuro, repetido) | [[wenn]] | [[Wenn ich nach Hause komme, koche ich.]] |
| cuando (una vez, en el pasado) | [[als]] | [[Als ich 18 war, …]] |

:::ojo Errores típicos
- ~~Wenn ich habe Zeit, …~~ → [[Wenn ich Zeit habe, …]]
- ~~Wenn ich Zeit habe, ich komme.~~ → [[Wenn ich Zeit habe, komme ich.]]
- ~~Ich weiß nicht, wenn er kommt.~~ → [[Ich weiß nicht, ob er kommt.]]
:::

:::ejemplos
Wenn ich krank bin, gehe ich zum Arzt. = Cuando estoy enferma, voy al médico.
Wenn das Wetter schön ist, grillen wir im Garten. = Si hace buen tiempo, hacemos barbacoa en el jardín.
Was machst du, wenn du nicht schlafen kannst? = ¿Qué haces cuando no puedes dormir?
Wenn du Fragen hast, schreib mir eine Nachricht. = Si tienes preguntas, escríbeme un mensaje.
Ich bin glücklich, wenn meine Familie zusammen ist. = Soy feliz cuando mi familia está junta.
:::

:::vocab Palabras de esta lección
wenn = si; cuando (presente, futuro, repetido)
als = cuando (una vez, en el pasado)
immer wenn = siempre que
das Wetter = el tiempo (meteorológico)
grillen = hacer barbacoa
die Hilfe = la ayuda
brauchen = necesitar
:::

:::quiz
order: (Si tengo tiempo, voy.) wenn ich Zeit habe, komme ich ## Verbo, verbo: habe, komme.
mc: ¿Cuál es correcta? || Wenn es regnet, bleibe ich zu Hause. || Wenn es regnet, ich bleibe zu Hause. || Wenn regnet es, bleibe ich zu Hause. ## Verbo, verbo: regnet, bleibe.
:::

:::resumen
- **wenn** = si (condición) y cuando (presente, futuro, cosas repetidas). Verbo **al final**.
- Si la oración con wenn va delante → **verbo, verbo**: [[Wenn ich Zeit habe, komme ich.]]
- **ob** = si de pregunta. **als** = cuando (una vez en el pasado).
:::
`,
ex: `
order: (Si llueve, nos quedamos en casa.) wenn es regnet, bleiben wir zu Hause ## regnet, bleiben: verbo, verbo.
order: (Cuando estoy cansada, tomo café.) wenn ich müde bin, trinke ich Kaffee ## bin, trinke.
order: (Te llamo cuando llegue.) ich rufe dich an, wenn ich ankomme ## Separable junto al final: ankomme.
gap: Wenn du Hunger ___, koche ich etwas. (haben) || hast ## Verbo al final de la oración con wenn.
gap: Wenn ich Zeit habe, ___ ich ins Kino. (gehen) || gehe ## Verbo, verbo: habe, gehe.
gap: Ich weiß nicht, ___ ich am Montag Zeit habe. (si — pregunta) || ob ## Pregunta indirecta: ob.
gap: ___ du Hilfe brauchst, ruf mich an! (si) || Wenn ## Condición: wenn.
mc: ¿Cuál es correcta? || Wenn ich nach Hause komme, koche ich. || Wenn ich komme nach Hause, koche ich. || Wenn ich nach Hause komme, ich koche. ## Verbo al final en la de wenn; luego verbo, verbo.
mc: «Cuando era niña…» (una vez, en el pasado) || Als ich ein Kind war, … || Wenn ich ein Kind war, … || Ob ich ein Kind war, … ## Pasado, una vez: als.
mc: «Si quieres, te ayudo» || Wenn du willst, helfe ich dir. || Ob du willst, helfe ich dir. || Wenn du willst, ich helfe dir. ## Condición: wenn + verbo, verbo.
write: Si hace buen tiempo, vamos al parque. || Wenn das Wetter schön ist, gehen wir in den Park. / Wenn das Wetter gut ist, gehen wir in den Park. ## ist, gehen: verbo, verbo.
listen: Wenn du Fragen hast, schreib mir eine Nachricht. = Si tienes preguntas, escríbeme un mensaje. ## hast, schreib: verbo, verbo.
speak: Wenn ich am Wochenende Zeit habe, besuche ich meine Freundin. = Si el fin de semana tengo tiempo, visito a mi amiga.
`});

LES({t: 'deshalb, trotzdem, dann', de: 'Adverbien als Konnektoren', min: 20,
goal: 'Aprenderás los conectores que van en la **posición 1** y obligan a poner el **verbo justo después**: **deshalb** (por eso), **trotzdem** (aun así), **dann** (luego), **außerdem** (además). Y harás un resumen de los tres tipos de conectores.',
body: `
## Paso 1: Unos conectores que ocupan la posición 1
Estas palabras unen frases, pero **ocupan la posición 1**. Por eso el **verbo va justo detrás** y el sujeto después (inversión), como con [[heute]] o [[morgen]]:

| Conector | Significa | Ejemplo |
|---|---|---|
| [[deshalb]] | por eso | [[Ich bin krank, deshalb ==bleibe== ich zu Hause.]] |
| [[trotzdem]] | aun así, a pesar de eso | [[Es regnet, trotzdem ==gehen== wir spazieren.]] |
| [[dann]] | luego, entonces | [[Ich dusche, dann ==frühstücke== ich.]] |
| [[danach]] | después | [[Danach ==gehe== ich zur Arbeit.]] |
| [[außerdem]] | además | [[Die Wohnung ist groß. Außerdem ==ist== sie billig.]] |
| [[sonst]] | si no, de lo contrario | [[Beeil dich, sonst ==verpassen== wir den Zug!]] |

## Paso 2: weil o deshalb: causa y consecuencia
Las dos frases dicen lo mismo, pero desde lados distintos:
- [[weil]] presenta la **causa**: [[Ich bleibe zu Hause, weil ich krank bin.]]
- [[deshalb]] presenta la **consecuencia**: [[Ich bin krank, deshalb bleibe ich zu Hause.]]

:::cuento
Imagina una fila de fichas de dominó. **weil** señala la ficha que **empujó** (la causa). **deshalb** señala la ficha que **cayó** (la consecuencia). Misma historia, distinta flecha.
:::

## Paso 3: trotzdem: lo contrario de lo esperado
[[trotzdem]] dice que algo pasa **aunque** lo lógico sería otra cosa:
- [[Ich bin müde. Trotzdem gehe ich zum Sport.]] (Estoy cansada. Aun así, voy a hacer deporte.)
- [[Das Essen war teuer, trotzdem war es nicht gut.]]

## Paso 4: El gran resumen de los conectores
| Tipo | Conectores | Orden | Ejemplo |
|---|---|---|---|
| **Posición 0** | und, aber, oder, denn, sondern | normal | [[…, denn ich bin krank.]] |
| **Posición 1** | deshalb, trotzdem, dann, danach, außerdem, sonst | verbo + sujeto | [[…, deshalb bin ich zu Hause.]] |
| **Subordinada** | weil, dass, ob, wenn (y wo, wann, wie…) | verbo **al final** | [[…, weil ich krank bin.]] |

:::truco Los tres colores del semáforo
- **Verde** (posición 0: ADUSO): pasa sin cambiar nada.
- **Amarillo** (posición 1: deshalb, trotzdem…): el verbo se pone **delante del sujeto**.
- **Rojo** (subordinada: weil, dass, wenn, ob): el verbo se **para al final**.
:::

:::ejemplos
Mein Auto ist kaputt, deshalb fahre ich mit dem Fahrrad. = Mi coche está estropeado, por eso voy en bici.
Die Prüfung war schwer, trotzdem habe ich bestanden. = El examen era difícil, aun así aprobé.
Zuerst kaufe ich ein, dann koche ich. = Primero hago la compra, luego cocino.
Die Wohnung hat einen Balkon. Außerdem liegt sie zentral. = El piso tiene balcón. Además está céntrico.
Nimm einen Regenschirm mit, sonst wirst du nass! = Llévate un paraguas, ¡si no, te mojarás!
:::

:::vocab Palabras de esta lección
deshalb = por eso
trotzdem = aun así, a pesar de todo
dann = luego, entonces
danach = después
zuerst = primero
außerdem = además
sonst = si no, de lo contrario
spazieren gehen = ir a pasear
sich beeilen = darse prisa
verpassen = perder (el tren, el autobús)
der Regenschirm | die Regenschirme = el paraguas
nass = mojado
schwer = difícil; pesado
:::

:::quiz
order: (Estoy enferma, por eso me quedo en casa.) ich bin krank, deshalb bleibe ich zu Hause ## deshalb + verbo + sujeto.
mc: ¿Cuál es correcta? || Es regnet, trotzdem gehen wir spazieren. || Es regnet, trotzdem wir gehen spazieren. || Es regnet, trotzdem wir spazieren gehen. ## trotzdem ocupa la posición 1: verbo detrás.
:::

:::resumen
- **deshalb, trotzdem, dann, danach, außerdem, sonst** → **posición 1** → **verbo + sujeto**.
- **weil** = causa · **deshalb** = consecuencia · **trotzdem** = aun así.
- Semáforo: **verde** ADUSO (normal), **amarillo** deshalb… (verbo delante), **rojo** weil, dass, wenn, ob (verbo al final).
:::
`,
ex: `
order: (Mi coche está estropeado, por eso voy en bici.) mein Auto ist kaputt, deshalb fahre ich mit dem Fahrrad ## deshalb + fahre + ich.
order: (Estoy cansada, aun así voy a hacer deporte.) ich bin müde, trotzdem gehe ich zum Sport ## trotzdem + gehe + ich.
order: (Primero me ducho, luego desayuno.) zuerst dusche ich, dann frühstücke ich ## zuerst y dann en posición 1.
gap: Es ist spät, deshalb ___ ich ein Taxi. (nehmen) || nehme ## deshalb + verbo + sujeto.
gap: Ich habe wenig Geld, ___ fahre ich in den Urlaub. (aun así) || trotzdem ## Lo contrario de lo esperado: trotzdem.
gap: Beeil dich, ___ kommen wir zu spät! (si no) || sonst ## sonst = si no.
mc: ¿Cuál es correcta? || Ich habe Hunger, deshalb esse ich ein Brot. || Ich habe Hunger, deshalb ich esse ein Brot. || Ich habe Hunger, deshalb ich ein Brot esse. ## deshalb: verbo + sujeto.
mc: ¿Qué conector manda el verbo al final? || weil || deshalb || denn ## weil es subordinante: verbo al final.
mc: «Ich bleibe zu Hause, weil ich krank bin» significa lo mismo que… || Ich bin krank, deshalb bleibe ich zu Hause. || Ich bin krank, trotzdem bleibe ich zu Hause. || Ich bin krank, sonst bleibe ich zu Hause. ## weil = causa; deshalb = consecuencia.
match: deshalb = por eso || trotzdem = aun así || außerdem = además || sonst = si no || danach = después ## Conectores de posición 1.
write: Llueve, por eso cojo el autobús. || Es regnet, deshalb nehme ich den Bus. / Es regnet, deshalb fahre ich mit dem Bus. ## deshalb + verbo + sujeto.
listen: Die Wohnung ist schön. Außerdem ist sie nicht so teuer. = El piso es bonito. Además no es tan caro. ## außerdem + ist + sie.
speak: Ich habe morgen eine Prüfung, deshalb lerne ich heute Abend. = Mañana tengo un examen, por eso estudio esta noche.
`});

MOD({id: 'm11', t: 'Describir y comparar', de: 'Adjektive und Vergleiche',
  desc: 'Para describir personas, ropa, pisos o ciudades, los adjetivos alemanes llevan terminaciones cuando van delante del sustantivo. Aquí tienes un sistema sencillo para acertar casi siempre, y además aprenderás a comparar: más grande que, el más grande.',
  can: ['Sé cuándo el adjetivo lleva terminación (der neue Tisch) y cuándo no (der Tisch ist neu).', 'Uso las terminaciones después de der, die, das, dieser y welcher.', 'Uso las terminaciones después de ein, kein y mein (ein neuer Tisch, ein neues Bett).', 'Comparo con -er als y so… wie, y uso el superlativo am …sten.', 'Uso gut, besser, am besten y gern, lieber, am liebsten.']});

LES({t: 'Adjetivos después de der, die, das', de: 'Adjektivdeklination nach dem bestimmten Artikel', min: 25,
goal: 'Aprenderás **cuándo** un adjetivo lleva terminación y **cuál** lleva después de **der, die, das**. Solo hay dos terminaciones: **-e** y **-en**, y una regla muy fácil para elegir.',
body: `
## Paso 1: Adjetivo solo o delante del sustantivo
- Si el adjetivo va **detrás** del verbo (sein, werden, bleiben), **no cambia nunca**: [[Der Tisch ist neu.]] [[Die Lampe ist neu.]] [[Die Stühle sind neu.]]
- Si va **delante** del sustantivo, **lleva terminación**: [[der neu==e== Tisch]], [[die neu==e== Lampe]], [[die neu==en== Stühle]].

:::es
En español el adjetivo cambia siempre según el género y el número: «mesa nuev**a**», «sillas nuev**as**», y da igual dónde esté. En alemán, **detrás del verbo** el adjetivo es **siempre igual** (¡qué cómodo!), pero **delante** del sustantivo lleva una terminación.
:::

## Paso 2: Después de der, die, das: solo -e o -en
| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| nominativo | [[m:der neu==e== Tisch]] | [[f:die neu==e== Lampe]] | [[n:das neu==e== Bett]] | [[p:die neu==en== Stühle]] |
| acusativo | [[m:den neu==en== Tisch]] | [[f:die neu==e== Lampe]] | [[n:das neu==e== Bett]] | [[p:die neu==en== Stühle]] |
| dativo | [[m:dem neu==en== Tisch]] | [[f:der neu==en== Lampe]] | [[n:dem neu==en== Bett]] | [[p:den neu==en== Stühlen]] |

Solo hay **cinco** casillas con **-e**. Todas las demás llevan **-en**.

:::truco La regla del diccionario
Mira el artículo:
- Si el artículo es **igual que en el diccionario** (der, die, das en su forma normal, en singular) → el adjetivo lleva **-e**: [[der alte Mann]], [[die alte Frau]], [[das alte Haus]].
- Si el artículo **ha cambiado** (den, dem, der de dativo) **o es plural** → el adjetivo lleva **-en**: [[den alten Mann]], [[mit der alten Frau]], [[die alten Häuser]].

Es como si el adjetivo copiara el humor del artículo: si el artículo está «tranquilo» (forma normal), el adjetivo solo pone **-e**; si el artículo «se ha cambiado de ropa», el adjetivo también se arregla: **-en**.
:::

## Paso 3: dieser, welcher y jeder funcionan igual
Estas palabras se comportan como **der, die, das**, y el adjetivo lleva las mismas terminaciones:
- [[dieser]] / [[diese]] / [[dieses]] = este, esta, esto: [[Dieser blaue Pullover ist schön.]]
- [[welcher]] / [[welche]] / [[welches]] = ¿cuál?, ¿qué…?: [[Welche Farbe magst du?]]
- [[jeder]] / [[jede]] / [[jedes]] = cada: [[jeden Tag]], [[jede Woche]]

:::dialogo De compras
Lea: Wie findest du den blauen Pullover? = ¿Qué te parece el jersey azul?
Max: Den blauen? Ich finde den grünen schöner. = ¿El azul? A mí me parece más bonito el verde.
Lea: Und welche Hose nehme ich? = ¿Y qué pantalón me llevo?
Max: Die schwarze Hose passt gut zu dem grünen Pullover. = El pantalón negro va bien con el jersey verde.
Lea: Gut, dann nehme ich die schwarze Hose und den grünen Pullover. = Vale, entonces me llevo el pantalón negro y el jersey verde.
:::

:::nota Sin sustantivo
Si el sustantivo ya se sabe, se puede omitir, pero el adjetivo mantiene su terminación: [[Welcher Pullover? – Der blaue.]] (¿Qué jersey? – El azul.)
:::

:::vocab Adjetivos y colores
neu = nuevo
alt = viejo; antiguo
groß = grande
klein = pequeño
schön = bonito
hässlich = feo
billig = barato
teuer = caro
lang = largo
kurz = corto
rot = rojo
blau = azul
grün = verde
gelb = amarillo
schwarz = negro
weiß = blanco
grau = gris
braun = marrón
der Pullover | die Pullover = el jersey
die Hose | die Hosen = el pantalón
dieser, diese, dieses = este, esta, esto
:::

:::quiz
gap: Der ___ Tisch ist schön. (neu) || neue ## Nominativo masculino con der: -e.
gap: Ich kaufe den ___ Tisch. (neu) || neuen ## Acusativo masculino (den): -en.
:::

:::resumen
- Detrás del verbo: **sin terminación** (Der Tisch ist neu). Delante del sustantivo: **con terminación**.
- Después de der/die/das, dieser, welcher, jeder: **-e** o **-en**.
- **-e** si el artículo está en su forma de diccionario (der, die, das en singular); **-en** si ha cambiado (den, dem…) o es plural.
:::
`,
ex: `
gap: Die ___ Lampe ist teuer. (rot) || rote ## Nominativo femenino (die): -e.
gap: Das ___ Haus ist sehr alt. (groß) || große ## Nominativo neutro (das): -e.
gap: Ich nehme den ___ Pullover. (blau) || blauen ## Acusativo masculino (den): -en.
gap: Wir wohnen in dem ___ Haus. (gelb) || gelben ## Dativo (dem): -en.
gap: Die ___ Schuhe gefallen mir. (schwarz) || schwarzen ## Plural: -en.
gap: Ich spreche mit der ___ Kollegin. (neu) || neuen ## Dativo femenino (der): -en.
gap: Dieser ___ Rock kostet 30 Euro. (kurz) || kurze ## dieser = der; nominativo: -e.
gap: Welche ___ Jacke nimmst du? (warm) || warme ## welche (femenino, acusativo, forma normal): -e.
mc: ¿Cuál es correcta? || Der Tisch ist neu. || Der Tisch ist neue. || Der Tisch ist neuer. ## Detrás del verbo: sin terminación.
mc: ¿Cuál es correcta? || Ich mag das rote Kleid. || Ich mag das roten Kleid. || Ich mag das rot Kleid. ## Acusativo neutro (das, forma normal): -e.
mc: ¿Cuál es correcta? || mit den neuen Kollegen || mit den neue Kollegen || mit dem neuen Kollegen den ## Dativo plural: -en.
order: (Me llevo el pantalón negro.) ich nehme die schwarze Hose ## die Hose (acusativo femenino): schwarze.
write: El piso nuevo es muy bonito. || Die neue Wohnung ist sehr schön. ## die neue Wohnung (nominativo): -e. Detrás de ist: schön, sin terminación.
speak: Wie findest du den grünen Pullover? Ich finde ihn schön. = ¿Qué te parece el jersey verde? A mí me parece bonito.
`});

LES({t: 'Adjetivos después de ein, kein, mein', de: 'Adjektivdeklination nach ein, kein, mein · ohne Artikel', min: 25,
goal: 'Aprenderás las terminaciones del adjetivo después de **ein, kein y mein** (ein neu**er** Tisch, ein neu**es** Bett) y las de los adjetivos **sin artículo**, que verás en anuncios, cartas y menús (Liebe Grüße, frisches Brot).',
body: `
## Paso 1: La idea de la «señal»
El alemán quiere que **el género se vea en algún sitio**. Mira:
- [[der Tisch]] y [[das Bett]]: el artículo ya dice el género (d**er**, da**s**).
- [[ein Tisch]] y [[ein Bett]]: ¡el artículo es igual! No se ve si es masculino o neutro.

Por eso, después de **ein**, el **adjetivo** toma la «señal» que le falta al artículo:
- [[ein neu==er== Tisch]] → **-er**, como d**er**
- [[ein neu==es== Bett]] → **-es**, como da**s**
- [[eine neu==e== Lampe]] → **-e**, como di**e**

:::cuento La señal que viaja
Imagina que la letra final de **der / die / das** (r, e, s) es una **banderita**. Cuando el artículo la lleva puesta (der, das), el adjetivo no necesita llevarla. Cuando el artículo **no** la lleva (ein), la banderita **se pasa al adjetivo**: ein neu**er**, ein neu**es**. ¡La banderita siempre tiene que verse en algún sitio!
:::

## Paso 2: La tabla
| | masculino | femenino | neutro | plural (keine, meine) |
|---|---|---|---|---|
| nominativo | [[m:ein neu==er== Tisch]] | [[f:eine neu==e== Lampe]] | [[n:ein neu==es== Bett]] | [[p:meine neu==en== Stühle]] |
| acusativo | [[m:einen neu==en== Tisch]] | [[f:eine neu==e== Lampe]] | [[n:ein neu==es== Bett]] | [[p:meine neu==en== Stühle]] |
| dativo | [[m:einem neu==en== Tisch]] | [[f:einer neu==en== Lampe]] | [[n:einem neu==en== Bett]] | [[p:meinen neu==en== Stühlen]] |

¿Ves la buena noticia? Es **casi igual** que la tabla de la lección anterior. Solo cambian **tres casillas**: [[ein neuer]] (masculino nominativo) y [[ein neues]] (neutro nominativo y acusativo). Las demás, como siempre: **-e** o **-en**.

Funciona igual con **kein** y con los **posesivos**: [[mein neuer Job]], [[kein großes Problem]], [[unsere kleine Wohnung]], [[meine besten Freunde]].

## Paso 3: Adjetivos sin artículo
A veces no hay artículo: en anuncios, menús, cartas y con cosas que no se cuentan (café, leche, agua…). Entonces el adjetivo lleva **la terminación del artículo**:

| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| nominativo | [[m:frisch==er== Kaffee]] (der) | [[f:frisch==e== Milch]] (die) | [[n:frisch==es== Brot]] (das) | [[p:frisch==e== Brötchen]] (die) |
| acusativo | [[m:frisch==en== Kaffee]] (den) | [[f:frisch==e== Milch]] | [[n:frisch==es== Brot]] | [[p:frisch==e== Brötchen]] |
| dativo | [[m:mit frisch==em== Kaffee]] (dem) | [[f:mit frisch==er== Milch]] (der) | [[n:mit frisch==em== Brot]] (dem) | [[p:mit frisch==en== Brötchen]] |

:::nota Frases hechas que ya usan esto
- En las cartas: [[Lieber Paul]] (der Paul → -er), [[Liebe Anna]] (die Anna → -e), [[Liebe Grüße]] (plural → -e), [[Viele Grüße]].
- En anuncios de pisos: [[Schöne Wohnung mit großem Balkon]] (der Balkon → mit + dem → -em).
- En la comida: [[Ich trinke gern kaltes Wasser.]] [[Ich esse gern frisches Obst.]]
:::

:::truco Para el examen A2
No necesitas memorizar todas las tablas de golpe. Empieza por esto:
1. **ein + masculino** → [[ein großer]] · **ein + neutro** → [[ein großes]] · **eine + femenino** → [[eine große]].
2. Después de **einen, einem, einer** y en **plural** → **-en**.
3. Las frases hechas de las cartas: **Lieber… / Liebe… / Liebe Grüße**.
:::

:::ojo Errores típicos
- ~~ein neue Tisch~~ → [[ein neuer Tisch]]
- ~~ein kleine Kind~~ → [[ein kleines Kind]]
- ~~Liebe Paul~~ → [[Lieber Paul]] (Paul es hombre: -er)
:::

:::ejemplos
Ich habe einen neuen Job. = Tengo un trabajo nuevo.
Das ist ein großes Problem. = Es un gran problema.
Wir suchen eine helle Wohnung mit großem Balkon. = Buscamos un piso luminoso con un balcón grande.
Mein bester Freund wohnt in Graz. = Mi mejor amigo vive en Graz.
Sie hat ein kleines Kind und einen großen Hund. = Tiene un niño pequeño y un perro grande.
Lieber Herr Klein, vielen Dank für Ihre schnelle Antwort. = Estimado señor Klein, muchas gracias por su rápida respuesta.
:::

:::vocab Palabras de esta lección
frisch = fresco
hell = luminoso, claro
dunkel = oscuro
ruhig = tranquilo
laut = ruidoso
bequem = cómodo
modern = moderno
gemütlich = acogedor
der Balkon | die Balkone = el balcón
das Obst = la fruta
das Gemüse = la verdura
Liebe Grüße = un abrazo, saludos cariñosos (en cartas)
:::

:::quiz
gap: Das ist ein ___ Tisch. (neu) || neuer ## ein + masculino nominativo: -er.
gap: Wir haben ein ___ Auto. (klein) || kleines ## ein + neutro: -es.
:::

:::resumen
- Después de **ein / kein / mein**: el adjetivo lleva la «señal» que falta: **ein neuer** (m), **ein neues** (n), **eine neue** (f).
- Con einen, einem, einer y en plural: **-en**.
- Sin artículo: el adjetivo lleva la terminación del artículo: **frischer** Kaffee, **frische** Milch, **frisches** Brot.
- Cartas: **Lieber** Paul, **Liebe** Anna, **Liebe Grüße**.
:::
`,
ex: `
gap: Ich habe einen ___ Bruder. (klein) || kleinen ## einen (acusativo masculino): -en.
gap: Das ist eine ___ Idee! (gut) || gute ## eine + femenino: -e.
gap: Er hat ein ___ Auto gekauft. (teuer) || teures ## ein + neutro: -es (teuer pierde la e: teures).
gap: Mein ___ Freund heißt Leo. (best-) || bester ## mein + masculino nominativo: -er.
gap: Wir wohnen in einer ___ Wohnung. (klein) || kleinen ## einer (dativo): -en.
gap: ___ Paul, danke für deine Nachricht! (querido — lieb-) || Lieber ## Paul es hombre: Lieber.
gap: ___ Grüße, Ana (lieb-) || Liebe ## Plural sin artículo: -e.
gap: Ich trinke gern ___ Wasser. (kalt) || kaltes ## Sin artículo, neutro (das Wasser): -es.
mc: ¿Cuál es correcta? || Das ist ein neues Handy. || Das ist ein neue Handy. || Das ist ein neuer Handy. ## das Handy → ein neues.
mc: ¿Cuál es correcta? || Sie hat keine kleinen Kinder. || Sie hat keine kleine Kinder. || Sie hat keine kleines Kinder. ## Plural después de keine: -en.
mc: Anuncio de piso: «Wohnung mit ___ Balkon» || großem || großen || großer ## Sin artículo, dativo masculino (dem): -em.
order: (Busco un piso luminoso.) ich suche eine helle Wohnung ## eine + femenino: -e.
write: Tengo un perro grande. || Ich habe einen großen Hund. ## einen (acusativo masculino): -en.
speak: Wir suchen eine ruhige Wohnung mit einem kleinen Garten. = Buscamos un piso tranquilo con un jardín pequeño.
`});

LES({t: 'Comparar: más… que, el más…', de: 'Komparativ und Superlativ', min: 25,
goal: 'Podrás **comparar** cosas y personas (más barato que, tan alto como) y decir **cuál es el mejor** o **lo que más te gusta**. Es muy útil para el examen oral y para la vida diaria.',
body: `
## Paso 1: El comparativo: -er
En español decimos «**más** barato». En alemán se añade **-er** al adjetivo. ¡No se usa «mehr»!
- [[billig]] → [[billiger]] (más barato)
- [[schnell]] → [[schneller]] (más rápido)
- [[schön]] → [[schöner]] (más bonito)
- [[klein]] → [[kleiner]] (más pequeño)

Para decir «**que**», se usa [[als]]: [[Der Bus ist billiger als das Taxi.]] (El autobús es más barato que el taxi.)

:::ojo No digas «mehr»
~~Das ist mehr billig.~~ → [[Das ist billiger.]]
~~Berlin ist größer wie München.~~ → [[Berlin ist größer als München.]] (Con el comparativo, **als**.)
:::

## Paso 2: Muchos adjetivos cortos toman diéresis
Los adjetivos **cortos** con **a, o, u** suelen añadir **diéresis**:
| Adjetivo | Comparativo | Español |
|---|---|---|
| [[alt]] | [[älter]] | más viejo / mayor |
| [[jung]] | [[jünger]] | más joven |
| [[groß]] | [[größer]] | más grande, más alto |
| [[kalt]] | [[kälter]] | más frío |
| [[warm]] | [[wärmer]] | más caliente |
| [[lang]] | [[länger]] | más largo |
| [[kurz]] | [[kürzer]] | más corto |
| [[oft]] | [[öfter]] | más a menudo |

## Paso 3: Los irregulares (¡los más usados!)
| Adjetivo | Comparativo | Superlativo |
|---|---|---|
| [[gut]] (bueno, bien) | [[besser]] | [[am besten]] |
| [[viel]] (mucho) | [[mehr]] | [[am meisten]] |
| [[gern]] (con gusto) | [[lieber]] | [[am liebsten]] |
| [[hoch]] (alto) | [[höher]] | [[am höchsten]] |
| [[nah]] (cerca) | [[näher]] | [[am nächsten]] |

:::es Igual que en español
En español tampoco decimos «más bueno», sino «**mejor**». En alemán: [[gut]] → [[besser]] → [[am besten]]. ¡La misma idea!
:::

## Paso 4: so… wie = tan… como
Para decir que dos cosas son **iguales**: [[so]] + adjetivo + [[wie]].
- [[Ich bin so groß wie meine Schwester.]] (Soy tan alta como mi hermana.)
- [[Der Zug ist nicht so schnell wie das Flugzeug.]] (El tren no es tan rápido como el avión.)

:::truco als o wie
- **Diferentes** (comparativo -er) → **als**: größer **als**.
- **Iguales** (so… wie) → **wie**: so groß **wie**.
:::

## Paso 5: El superlativo: am …sten
Para decir «el más…», detrás del verbo se usa **am + adjetivo + -sten**:
- [[Der ICE ist am schnellsten.]] (El ICE es el más rápido.)
- [[Im Winter ist es am kältesten.]] (En invierno es cuando más frío hace.)
- Si el adjetivo termina en **-t, -d, -s, -ß, -z**, se añade una **e**: [[am ältesten]], [[am kürzesten]], [[am heißesten]].

Delante del sustantivo, con artículo y terminación: [[der schnellste Zug]], [[die beste Freundin]], [[das größte Zimmer]].

## Paso 6: gern, lieber, am liebsten
Es la forma perfecta para hablar de **gustos y preferencias**:
- [[Ich trinke gern Tee.]] (Me gusta beber té.)
- [[Ich trinke lieber Kaffee.]] (Prefiero el café.)
- [[Am liebsten trinke ich Wasser.]] (Lo que más me gusta beber es agua.)

:::ejemplos
Meine Wohnung ist kleiner als deine, aber sie ist heller. = Mi piso es más pequeño que el tuyo, pero es más luminoso.
Mein Bruder ist zwei Jahre älter als ich. = Mi hermano es dos años mayor que yo.
Mit dem Fahrrad bin ich schneller als mit dem Bus. = En bici soy más rápida que en autobús.
Im Sommer ist es in Sevilla viel heißer als in Hamburg. = En verano hace mucho más calor en Sevilla que en Hamburgo.
Was machst du am liebsten am Wochenende? = ¿Qué es lo que más te gusta hacer el fin de semana?
Das ist der beste Kuchen der Welt! = ¡Es la mejor tarta del mundo!
:::

:::vocab Palabras de esta lección
als = que (en comparaciones)
so… wie = tan… como
besser = mejor
am besten = lo mejor, el mejor
mehr = más
am meisten = lo que más
lieber = preferiblemente; preferir
am liebsten = lo que más me gusta
schnell = rápido
langsam = lento
heiß = muy caliente; caluroso
das Flugzeug | die Flugzeuge = el avión
die Welt = el mundo
viel = mucho
:::

:::quiz

:::

:::resumen
- Comparativo: **-er + als**: billiger als. Muchos cortos con diéresis: älter, größer, kälter.
- Irregulares: **gut – besser – am besten**, **viel – mehr – am meisten**, **gern – lieber – am liebsten**.
- Igualdad: **so… wie**.
- Superlativo: **am …sten** (am schnellsten) o con artículo: der schnellste Zug.
:::
`,
ex: `

`});
