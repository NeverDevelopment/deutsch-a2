LES({t: 'Presentarse: ich, du, er… y el verbo sein', de: 'Sich vorstellen · Personalpronomen · sein', min: 20,
goal: 'Aprenderás los **pronombres personales** (yo, tú, él…), el verbo más importante, **sein** (ser y estar), y podrás **presentarte**: nombre, país, ciudad, idiomas y trabajo.',
body: `
## Paso 1: Los pronombres personales
Son las palabras que dicen **quién** hace algo: yo, tú, él…

| Alemán | Español | Ejemplo |
|---|---|---|
| [[ich]] | yo | [[Ich bin Ana.]] |
| [[du]] | tú (informal) | [[Du bist nett.]] |
| [[er]] | él | [[Er ist Lehrer.]] |
| [[sie]] | ella | [[Sie ist Ärztin.]] |
| [[es]] | ello (para cosas y palabras neutras) | [[Es ist groß.]] |
| [[wir]] | nosotros, nosotras | [[Wir sind müde.]] |
| [[ihr]] | vosotros / ustedes (informal) | [[Ihr seid super!]] |
| [[sie]] | ellos, ellas | [[Sie sind aus Peru.]] |
| [[Sie]] | usted, ustedes (formal) | [[Sind Sie Frau Kim?]] |

:::es Diferencia nº 1: en alemán el sujeto nunca desaparece
En español puedes decir «Soy Ana» sin el «yo», porque el verbo ya lo dice todo. **En alemán el pronombre es obligatorio**: [[Ich bin Ana.]] Nunca ~~Bin Ana~~. Lo mismo con «es» para el tiempo: «Llueve» = [[Es regnet.]]
:::

:::nota ¿ihr es «vosotros» o «ustedes»?
**ihr** es el plural informal: para hablar a dos amigos o a tus hijos. En España equivale a «vosotros». En Latinoamérica, donde se dice «ustedes» a todos, piensa así: **ihr** = ustedes (amigos, familia) y **Sie** = ustedes (formal).
:::

### ¿Cómo distinguir sie, sie y Sie?
La misma palabra tiene tres significados. Te ayudan **la mayúscula** y **el verbo**:
- [[sie ist]] → ella es (verbo en singular)
- [[sie sind]] → ellos son (verbo en plural, minúscula)
- [[Sie sind]] → usted es / ustedes son (verbo en plural, **mayúscula**)

## Paso 2: El verbo sein (ser y estar a la vez)
En español tenemos «ser» y «estar». En alemán **los dos son un solo verbo: sein**. ¡Una cosa menos que aprender!

| Pronombre | sein | Español |
|---|---|---|
| ich | [[bin]] | soy, estoy |
| du | [[bist]] | eres, estás |
| er / sie / es | [[ist]] | es, está |
| wir | [[sind]] | somos, estamos |
| ihr | [[seid]] | sois, estáis / son, están |
| sie / Sie | [[sind]] | son, están / es, está (usted) |

:::ejemplos
Ich bin Lucía. = Soy Lucía.
Ich bin müde. = Estoy cansada.
Ich bin in Berlin. = Estoy en Berlín.
Er ist Koch. = Él es cocinero.
Wir sind verheiratet. = Estamos casados.
Seid ihr zu Hause? = ¿Estáis en casa? / ¿Están en casa?
:::

:::truco Ser y estar en alemán
Cuando quieras decir «soy» **o** «estoy», usa siempre [[bin]]. Cuando quieras decir «es» **o** «está», usa [[ist]]. No tienes que pensar si algo es permanente o temporal: el alemán no lo distingue.
:::

## Paso 3: Presentarte, frase por frase
Con estas frases puedes presentarte en un curso, en el trabajo o en el examen:

| Quieres decir… | En alemán |
|---|---|
| tu nombre | [[Ich heiße Lucía.]] / [[Mein Name ist Lucía Peña.]] |
| tu país | [[Ich komme aus Kolumbien.]] |
| dónde vives | [[Ich wohne in Hamburg.]] |
| tu edad | [[Ich bin 32 Jahre alt.]] |
| tus idiomas | [[Ich spreche Spanisch, Englisch und ein bisschen Deutsch.]] |
| tu trabajo | [[Ich bin Krankenpflegerin.]] / [[Ich arbeite als Verkäuferin.]] |
| tu familia | [[Ich bin verheiratet und habe zwei Kinder.]] |

:::es Profesiones sin «un, una»
Como en español («soy médica»), en alemán la profesión va **sin artículo**: [[Ich bin Ärztin.]] Nunca ~~Ich bin eine Ärztin~~ para decir tu profesión.
:::

### Países y nacionalidades
La mayoría de los países no llevan artículo: [[aus Spanien]], [[aus Mexiko]], [[aus Argentinien]], [[aus Chile]], [[aus Peru]], [[aus Venezuela]], [[aus Deutschland]]. Unos pocos sí, y entonces cambia la forma: [[aus der Schweiz]] (de Suiza), [[aus der Türkei]], [[aus den USA]]. Apréndelos como bloque.

Para las personas, el alemán tiene **una forma para hombre y otra para mujer**, casi siempre con **-in**:

| Hombre | Mujer | Español |
|---|---|---|
| [[der Spanier]] | [[die Spanierin]] | español / española |
| [[der Mexikaner]] | [[die Mexikanerin]] | mexicano / mexicana |
| [[der Kolumbianer]] | [[die Kolumbianerin]] | colombiano / colombiana |
| [[der Lehrer]] | [[die Lehrerin]] | profesor / profesora |
| [[der Arzt]] | [[die Ärztin]] | médico / médica |

Los idiomas se escriben con mayúscula: [[Spanisch]], [[Deutsch]], [[Englisch]], [[Französisch]], [[Italienisch]], [[Portugiesisch]], [[Arabisch]].

:::ojo Errores típicos al presentarse
- ~~Ich habe 32 Jahre.~~ → [[Ich bin 32 Jahre alt.]] En alemán la edad se dice con **sein** (ser), no con «tener».
- ~~Ich komme von Mexiko.~~ → [[Ich komme aus Mexiko.]] Para el país de origen: **aus**.
- ~~Bin aus Chile.~~ → [[Ich bin aus Chile.]] ¡No olvides el pronombre!
- ~~Ich spreche spanisch.~~ → [[Ich spreche Spanisch.]] Los idiomas, con mayúscula.
:::

:::dialogo El primer día del curso de alemán
Kursleiterin: Herzlich willkommen! Bitte stellen Sie sich vor. = ¡Bienvenidos! Por favor, preséntense.
Lucía: Hallo! Ich heiße Lucía. Ich komme aus Kolumbien. = ¡Hola! Me llamo Lucía. Soy de Colombia.
Kursleiterin: Und wo wohnen Sie, Lucía? = ¿Y dónde vive, Lucía?
Lucía: Ich wohne jetzt in Hamburg, mit meinem Mann. = Ahora vivo en Hamburgo, con mi marido.
Kursleiterin: Was sind Sie von Beruf? = ¿A qué se dedica?
Lucía: Ich bin Krankenpflegerin. = Soy enfermera.
Kursleiterin: Und welche Sprachen sprechen Sie? = ¿Y qué idiomas habla?
Lucía: Spanisch, Englisch und ein bisschen Deutsch. = Español, inglés y un poco de alemán.
:::

:::vocab Palabras de esta lección
sein | er ist = ser, estar
heißen | er heißt = llamarse
kommen aus | er kommt = venir de, ser de
wohnen in | er wohnt = vivir en
sprechen | er spricht = hablar
das Land | die Länder = el país
die Sprache | die Sprachen = el idioma
der Beruf | die Berufe = la profesión
alt = viejo; «Ich bin 30 Jahre alt» = tengo 30 años
verheiratet = casado, casada
ledig = soltero, soltera
geschieden = divorciado, divorciada
das Jahr | die Jahre = el año
jetzt = ahora
:::

:::quiz
gap: Wir ___ aus Peru. (sein) || sind ## wir sind = nosotros somos.
mc: ¿Cómo dices «tengo 30 años»? || Ich bin 30 Jahre alt. || Ich habe 30 Jahre. || Ich habe 30 Jahre alt. ## La edad se dice con sein: Ich bin… Jahre alt.
:::

:::resumen
- Pronombres: ich, du, er, sie, es, wir, ihr, sie, **Sie**. En alemán **siempre** hay sujeto.
- **sein** = ser y estar: bin, bist, ist, sind, seid, sind.
- Preséntate: [[Ich heiße…]], [[Ich komme aus…]], [[Ich wohne in…]], [[Ich bin … Jahre alt.]], [[Ich spreche…]], [[Ich bin…]] (profesión, sin artículo).
- Mujeres: casi siempre **-in**: Lehrerin, Spanierin, Ärztin.
:::
`,
ex: `
gap: Ich ___ Lucía. (sein) || bin ## ich bin.
gap: Du ___ sehr nett. (sein) || bist ## du bist.
gap: Er ___ Koch. (sein) || ist ## er ist.
gap: Ihr ___ heute müde. (sein) || seid ## ihr seid. ¡Ojo! Se escribe con d.
gap: ___ Sie Frau Kim? (sein) || Sind ## Sie sind → en la pregunta: Sind Sie…?
mc: ¿Qué significa «sie sind»? || ellos son || ella es || usted es ## Minúscula + verbo en plural = ellos. Usted sería «Sie» con mayúscula.
mc: ¿Cómo se dice «Soy de México»? || Ich komme aus Mexiko. || Ich komme von Mexiko. || Komme aus Mexiko. ## Origen: aus. Y siempre con ich.
mc: ¿Cuál es correcta? || Ich bin Ärztin. || Ich bin eine Ärztin. || Ich habe Ärztin. ## La profesión va sin artículo, como en español.
mc: «Ella es profesora» se dice… || Sie ist Lehrerin. || Sie ist Lehrer. || Sie sind Lehrerin. ## Mujer: Lehrerin. ella: sie ist.
match: ich = yo || du = tú || wir = nosotros || ihr = vosotros / ustedes informal || Sie = usted ## Los pronombres más importantes.
order: (Vivo en Hamburgo.) ich wohne in Hamburg ## Sujeto + verbo + lugar.
order: (Tengo 35 años.) ich bin 35 Jahre alt ## La edad: sein + número + Jahre alt.
write: Me llamo Ana y soy de Chile. || Ich heiße Ana und komme aus Chile. / Ich heiße Ana und ich komme aus Chile. / Mein Name ist Ana und ich komme aus Chile. ## heißen + nombre, kommen aus + país.
listen: Ich spreche Spanisch und ein bisschen Deutsch. = Hablo español y un poco de alemán. ## Los idiomas con mayúscula.
speak: Ich heiße Lucía, ich komme aus Kolumbien und wohne in Hamburg. = Me llamo Lucía, soy de Colombia y vivo en Hamburgo.
`});

LES({t: 'Verbos regulares en presente', de: 'Präsens: regelmäßige Verben', min: 20,
goal: 'Aprenderás a **conjugar cualquier verbo regular** en presente (wohnen, lernen, arbeiten…). Es el mismo sistema que en español, pero con menos formas distintas.',
body: `
## Paso 1: El verbo tiene una raíz y una terminación
En español, «hablar» tiene la raíz **habl-** y le pones terminaciones: habl**o**, habl**as**, habl**a**… En alemán es igual. El infinitivo termina casi siempre en **-en**: [[wohnen]] (vivir), [[lernen]] (aprender), [[machen]] (hacer). Quitas el **-en** y te queda la raíz: **wohn-**, **lern-**, **mach-**. Después pones la terminación de cada persona.

| Persona | Terminación | wohnen | lernen |
|---|---|---|---|
| ich | **-e** | [[ich wohn==e==]] | [[ich lern==e==]] |
| du | **-st** | [[du wohn==st==]] | [[du lern==st==]] |
| er / sie / es | **-t** | [[er wohn==t==]] | [[sie lern==t==]] |
| wir | **-en** | [[wir wohn==en==]] | [[wir lern==en==]] |
| ihr | **-t** | [[ihr wohn==t==]] | [[ihr lern==t==]] |
| sie / Sie | **-en** | [[sie wohn==en==]] | [[Sie lern==en==]] |

:::truco La canción de las terminaciones
Repite como una canción: **«e – st – t – en – t – en»**. Y fíjate en la buena noticia: **wir, sie y Sie** son iguales que el infinitivo. Si sabes «wohnen», ya sabes «wir wohnen», «sie wohnen» y «Sie wohnen».
:::

:::es
En español cada persona tiene su terminación propia (hablo, hablas, habla, hablamos, habláis, hablan). En alemán solo hay **cuatro** terminaciones distintas para seis personas. Tú ya sabes conjugar en español, así que la idea no es nueva: solo cambian las terminaciones.
:::

## Paso 2: Verbos que necesitan una «e» extra
Si la raíz termina en **-t** o **-d** (como [[arbeiten]], trabajar, o [[finden]], encontrar), sería imposible pronunciar «du arbeitst». Por eso se añade una **e** antes de -st y de -t:

| | arbeiten | finden |
|---|---|---|
| ich | [[ich arbeite]] | [[ich finde]] |
| du | [[du arbeit==e==st]] | [[du find==e==st]] |
| er / sie / es | [[er arbeit==e==t]] | [[es find==e==t]] |
| wir | [[wir arbeiten]] | [[wir finden]] |
| ihr | [[ihr arbeit==e==t]] | [[ihr find==e==t]] |
| sie / Sie | [[sie arbeiten]] | [[Sie finden]] |

Pasa lo mismo con [[warten]] (esperar): du wartest, er wartet; y con [[öffnen]] (abrir): du öffnest, er öffnet.

## Paso 3: Verbos que pierden una «s»
Si la raíz termina en **-s, -ß, -z** (como [[heißen]], [[tanzen]], [[reisen]]), en la forma **du** solo se añade **-t**, porque la s ya está ahí:
- [[du heißt]] (no ~~du heißst~~), [[du tanzt]], [[du reist]].

## Paso 4: El presente alemán sirve para mucho
Con el presente puedes decir tres cosas diferentes:
1. Lo que haces normalmente: [[Ich arbeite in einem Hotel.]] (Trabajo en un hotel.)
2. Lo que **estás haciendo** ahora: [[Ich lerne gerade Deutsch.]] (Estoy aprendiendo alemán.)
3. Lo que **vas a hacer** pronto: [[Morgen koche ich Paella.]] (Mañana voy a cocinar paella.)

:::ojo No existe «estar + gerundio»
En alemán no hay una forma como «estoy comiendo». Se usa el presente normal y, si quieres, la palabra [[gerade]] (justo ahora): «Estoy comiendo» = [[Ich esse gerade.]] Nunca ~~Ich bin essen~~.
:::

:::ejemplos
Was machst du heute? = ¿Qué haces hoy?
Ich koche und meine Tochter spielt. = Yo cocino y mi hija juega.
Wir wohnen seit zwei Jahren in Köln. = Vivimos en Colonia desde hace dos años.
Arbeitest du am Samstag? = ¿Trabajas el sábado?
Ihr lernt sehr schnell! = ¡Aprendéis muy rápido! / ¡Aprenden muy rápido!
Wie heißt du? – Ich heiße Paula. = ¿Cómo te llamas? – Me llamo Paula.
Sie kauft Brot und Milch. = Ella compra pan y leche.
:::

:::vocab Verbos regulares muy útiles
wohnen = vivir (en un sitio)
lernen = aprender, estudiar
machen = hacer
arbeiten | du arbeitest · er arbeitet = trabajar
kochen = cocinar
kaufen = comprar
spielen = jugar; tocar (un instrumento)
hören = oír, escuchar
brauchen = necesitar
suchen = buscar
fragen = preguntar
antworten | er antwortet = responder
warten | er wartet = esperar
finden | er findet = encontrar; opinar
tanzen | du tanzt = bailar
reisen | du reist = viajar
gerade = justo ahora
:::

:::quiz
gap: Du ___ in Berlin. (wohnen) || wohnst ## du + -st.
gap: Er ___ viel. (arbeiten) || arbeitet ## Raíz en -t: se añade e. er arbeitet.
:::

:::resumen
- Raíz + terminación: **-e, -st, -t, -en, -t, -en**.
- wir / sie / Sie = infinitivo.
- Raíz en -t / -d: **e extra** (du arbeitest, er findet). Raíz en -s / -ß / -z: du solo **-t** (du heißt).
- El presente sirve para «hago», «estoy haciendo» y «voy a hacer».
:::
`,
ex: `
gap: Ich ___ Deutsch. (lernen) || lerne ## ich + -e.
gap: Wir ___ in München. (wohnen) || wohnen ## wir = infinitivo.
gap: Was ___ ihr am Wochenende? (machen) || macht ## ihr + -t.
gap: ___ du Kaffee? (kaufen) || Kaufst ## En la pregunta de sí/no el verbo va primero: Kaufst du…?
gap: Sie ___ in einem Restaurant. (arbeiten — ella) || arbeitet ## Raíz en -t: sie arbeitet.
gap: Du ___ auf den Bus. (warten) || wartest ## Raíz en -t: du wartest.
gap: Wie ___ du? (heißen) || heißt ## Raíz en -ß: du heißt (sin otra s).
gap: Meine Kinder ___ im Park. (spielen) || spielen ## «Meine Kinder» = sie (plural): spielen.
mc: «Estoy cocinando» se dice… || Ich koche gerade. || Ich bin kochen. || Ich bin kochend. ## En alemán no existe estar + gerundio: presente + gerade.
mc: ¿Qué forma es correcta? || du tanzt || du tanzst || du tanzest ## Raíz en -z: du solo añade -t.
order: (Mañana trabajo en el hotel.) morgen arbeite ich im Hotel ## Si empiezas con «morgen», el verbo sigue en posición 2.
write: Compramos pan. || Wir kaufen Brot. ## wir kaufen = infinitivo.
listen: Was machst du heute Abend? = ¿Qué haces esta noche? ## machst: du + -st.
speak: Ich lerne jeden Tag Deutsch. = Aprendo alemán cada día.
`});

LES({t: 'Hacer preguntas', de: 'W-Fragen und Ja/Nein-Fragen', min: 20,
goal: 'Podrás hacer los **dos tipos de pregunta** del alemán: las que empiezan con una palabra interrogativa (¿dónde?, ¿cuándo?…) y las de **sí o no**. Sabrás dónde va el verbo en cada una.',
body: `
## Paso 1: Las palabras interrogativas (W-Wörter)
Casi todas empiezan por **W**, por eso los alemanes las llaman **W-Fragen** («preguntas W»). Recuerda: la W suena como una «v» de motor.

| Alemán | Español | Ejemplo |
|---|---|---|
| [[wer?]] | ¿quién? | [[Wer ist das?]] |
| [[was?]] | ¿qué? | [[Was machst du?]] |
| [[wo?]] | ¿dónde? | [[Wo wohnst du?]] |
| [[woher?]] | ¿de dónde? | [[Woher kommen Sie?]] |
| [[wohin?]] | ¿adónde? | [[Wohin fährst du?]] |
| [[wann?]] | ¿cuándo? | [[Wann beginnt der Kurs?]] |
| [[wie?]] | ¿cómo? | [[Wie heißt du?]] |
| [[wie viel?]] | ¿cuánto? | [[Wie viel kostet das?]] |
| [[wie viele?]] | ¿cuántos? | [[Wie viele Kinder haben Sie?]] |
| [[wie alt?]] | ¿qué edad? | [[Wie alt bist du?]] |
| [[warum?]] | ¿por qué? | [[Warum lernst du Deutsch?]] |
| [[welcher? welche? welches?]] | ¿cuál? ¿qué…? | [[Welche Sprachen sprichst du?]] |
| [[um wie viel Uhr?]] | ¿a qué hora? | [[Um wie viel Uhr kommst du?]] |

:::ojo ¡wer no es «where»!
Si sabes algo de inglés, cuidado: [[wer]] = **quién** (no «dónde»), y [[wo]] = **dónde**. Además [[wie]] = cómo y [[wir]] = nosotros: se parecen, pero no tienen nada que ver.
:::

### wo, woher y wohin
El alemán tiene tres palabras para lo que en español decimos con «dónde»:
- [[wo?]] = ¿dónde? (estar en un sitio, sin moverse): [[Wo bist du?]]
- [[woher?]] = ¿de dónde? (origen): [[Woher kommst du?]]
- [[wohin?]] = ¿adónde? (dirección, movimiento): [[Wohin gehst du?]]

:::truco
Imagina una flecha: **woher** es la flecha que **viene hacia ti** (de dónde), **wohin** es la flecha que **se va** (adónde) y **wo** es un punto quieto, sin flecha.
:::

## Paso 2: El orden en las W-Fragen
La palabra interrogativa va en la **posición 1**, el **verbo en la posición 2**, y después el sujeto:

| Posición 1 | Posición 2 (verbo) | Sujeto | Resto |
|---|---|---|---|
| Wo | [[wohnst]] | du? | |
| Woher | [[kommen]] | Sie? | |
| Was | [[machst]] | du | heute? |
| Wann | [[beginnt]] | der Kurs? | |

## Paso 3: Las preguntas de sí o no
Aquí no hay palabra interrogativa. El **verbo salta a la posición 1**, al principio de la frase:

| Afirmación | Pregunta |
|---|---|
| [[Du wohnst in Berlin.]] | [[Wohnst du in Berlin?]] |
| [[Sie sprechen Englisch.]] | [[Sprechen Sie Englisch?]] |
| [[Er ist verheiratet.]] | [[Ist er verheiratet?]] |

:::es
En español podemos preguntar solo con la entonación: «¿Vives en Berlín?» tiene el mismo orden que «Vives en Berlín.». **En alemán el orden tiene que cambiar**: el verbo pasa delante del sujeto. ~~Du wohnst in Berlin?~~ se entiende en una conversación relajada, pero lo correcto es [[Wohnst du in Berlin?]]
:::

### Responder: ja, nein… y doch
- [[Ja.]] = sí. [[Nein.]] = no.
- Si la pregunta es **negativa** y quieres decir que sí, se usa [[Doch!]]: [[Kommst du nicht? – Doch, ich komme!]] (¿No vienes? – ¡Sí, sí que vengo!)

## Paso 4: La melodía
- En las **W-Fragen** la voz **baja** al final: [[Wo wohnst du?]]
- En las preguntas de **sí o no** la voz **sube** al final: [[Wohnst du in Köln?]]

:::ojo Errores típicos
- ~~Wo du wohnst?~~ → [[Wo wohnst du?]] El verbo va en la posición 2, antes del sujeto.
- ~~Wo kommst du?~~ para preguntar el origen → [[Woher kommst du?]]
- ~~Du bist müde?~~ → [[Bist du müde?]]
:::

:::dialogo Conociéndose en una fiesta
Tom: Hallo! Ich bin Tom. Und wer bist du? = ¡Hola! Soy Tom. ¿Y tú quién eres?
Paula: Ich bin Paula. = Soy Paula.
Tom: Woher kommst du, Paula? = ¿De dónde eres, Paula?
Paula: Aus Argentinien. Und du? = De Argentina. ¿Y tú?
Tom: Ich komme aus Leipzig. Wohnst du hier in Dresden? = Yo soy de Leipzig. ¿Vives aquí en Dresde?
Paula: Ja, seit einem Jahr. = Sí, desde hace un año.
Tom: Und was machst du hier? = ¿Y qué haces aquí?
Paula: Ich studiere Musik. Spielst du ein Instrument? = Estudio música. ¿Tocas algún instrumento?
Tom: Nein, leider nicht. = No, por desgracia no.
:::

:::vocab Palabras de esta lección
wer? = ¿quién?
was? = ¿qué?
wo? = ¿dónde?
woher? = ¿de dónde?
wohin? = ¿adónde?
wann? = ¿cuándo?

warum? = ¿por qué?
welche? = ¿cuál?, ¿qué…?
die Frage | die Fragen = la pregunta
die Antwort | die Antworten = la respuesta
ja = sí
nein = no
doch = sí (para contradecir una pregunta negativa)
leider = por desgracia, lamentablemente
:::

MOD({id: 'm3', t: 'Números, horas y fechas', de: 'Zahlen, Uhrzeit, Datum',
  desc: 'Precios, teléfonos, citas, horarios y cumpleaños. Los números alemanes tienen una sorpresa (se dicen «al revés») y la hora tiene una trampa famosa: «halb drei».',
  can: ['Entiendo y digo números, precios y números de teléfono.', 'Puedo preguntar y decir la hora, de forma oficial y coloquial.', 'Sé decir días, meses, estaciones y fechas (am, im, um).', 'Puedo decir cuándo es mi cumpleaños.']});

LES({t: 'Los números', de: 'Die Zahlen', min: 20,
goal: 'Podrás **contar, decir precios, tu edad y tu número de teléfono**. Aprenderás el gran truco de los números alemanes: del 21 al 99 se dicen **al revés**.',
body: `
## Paso 1: Del 0 al 12, de memoria
Estos hay que aprenderlos uno a uno. Toca cada número para oírlo:

| | | | |
|---|---|---|---|
| 0 [[null]] | 1 [[eins]] | 2 [[zwei]] | 3 [[drei]] |
| 4 [[vier]] | 5 [[fünf]] | 6 [[sechs]] | 7 [[sieben]] |
| 8 [[acht]] | 9 [[neun]] | 10 [[zehn]] | 11 [[elf]] |
| 12 [[zwölf]] | | | |

:::nota zwei y zwo
Por teléfono o en anuncios muchos alemanes dicen [[zwo]] en vez de [[zwei]], para que no se confunda con [[drei]]. Significa lo mismo: 2.
:::

## Paso 2: Del 13 al 19: número + zehn
Fácil: el número pequeño + **zehn** (diez). Como en español «dieciséis», pero al revés:
[[dreizehn]] (13), [[vierzehn]] (14), [[fünfzehn]] (15), [[sechzehn]] (16), [[siebzehn]] (17), [[achtzehn]] (18), [[neunzehn]] (19).

:::ojo Dos números que pierden letras
- 16 es [[sechzehn]], no ~~sechszehn~~ (se pierde la s).
- 17 es [[siebzehn]], no ~~siebenzehn~~ (se pierde «en»).
Lo mismo pasa con 60 ([[sechzig]]) y 70 ([[siebzig]]).
:::

## Paso 3: Las decenas
| | | |
|---|---|---|
| 20 [[zwanzig]] | 30 [[dreißig]] | 40 [[vierzig]] |
| 50 [[fünfzig]] | 60 [[sechzig]] | 70 [[siebzig]] |
| 80 [[achtzig]] | 90 [[neunzig]] | 100 [[hundert]] |

Casi todas terminan en **-zig**. Solo el 30 termina en **-ßig**: [[dreißig]].

## Paso 4: Del 21 al 99: ¡al revés!
Este es el gran truco. En alemán se dice primero la **unidad**, luego **und** (y) y al final la **decena**. Todo junto, en una sola palabra:
- 21 = [[einundzwanzig]] → «uno-y-veinte»
- 34 = [[vierunddreißig]] → «cuatro-y-treinta»
- 58 = [[achtundfünfzig]] → «ocho-y-cincuenta»
- 99 = [[neunundneunzig]] → «nueve-y-noventa»

:::cuento
Imagina que vas a buscar un número a una caja con dos cajones. Los alemanes abren primero el **cajón pequeño** (las unidades) y después el **cajón grande** (las decenas). Si oyes «**vier**und**dreißig**», escribe primero el 4 a la derecha y luego el 3 delante: **34**.
:::

:::truco Para no equivocarte al escuchar
Cuando alguien te dicte un número largo, **escribe primero la unidad** dejando un hueco delante, y cuando oigas la decena, rellena el hueco. Así nunca escribirás 43 en vez de 34.
:::

## Paso 5: Números grandes
- 100 = [[hundert]] o [[einhundert]] · 200 = [[zweihundert]] · 101 = [[hunderteins]]
- 345 = [[dreihundertfünfundvierzig]] (trescientos + cinco-y-cuarenta)
- 1.000 = [[tausend]] · 2.500 = [[zweitausendfünfhundert]] · 1.000.000 = [[eine Million]]

**Los años** hasta 1999 se dicen en «centenas»: 1998 = [[neunzehnhundertachtundneunzig]] (diecinueve-cientos-ocho-y-noventa). Desde el 2000, normal: 2025 = [[zweitausendfünfundzwanzig]].

:::ojo Puntos y comas
Como en España, el alemán usa **coma para los decimales** y punto para los miles: 1.500 (mil quinientos), 2,5 (dos coma cinco). Si eres de México o Centroamérica, donde se escribe 2.5, ¡cuidado con los precios!
:::

## Paso 6: Precios, edad y teléfono
- **Precios**: 3,50 € = [[drei Euro fünfzig]] · 12,99 € = [[zwölf Euro neunundneunzig]] · 0,80 € = [[achtzig Cent]]. Para preguntar: [[Wie viel kostet das?]] o [[Was kostet das?]]
- **Edad**: [[Wie alt bist du?]] – [[Ich bin vierunddreißig.]]
- **Teléfono**: normalmente se dicen las cifras de una en una o de dos en dos: [[null eins sieben sechs, zwei drei, vier fünf]]. [[Wie ist Ihre Telefonnummer?]]

:::ejemplos
Das kostet 4,90 Euro. = Cuesta 4,90 euros.
Ich bin 27 Jahre alt. = Tengo 27 años.
Wir wohnen in der Goethestraße 48. = Vivimos en la calle Goethe, 48.
Meine Telefonnummer ist 0176 23 45 89. = Mi número de teléfono es el 0176 23 45 89.
Ich habe 3 Kinder. = Tengo 3 hijos.
Der Bus Nummer 61 fährt zum Bahnhof. = El autobús número 61 va a la estación.
:::

:::vocab Palabras de esta lección
die Zahl | die Zahlen = el número
die Nummer | die Nummern = el número (de teléfono, de casa…)
die Telefonnummer | die Telefonnummern = el número de teléfono
der Euro | die Euro = el euro
der Cent | die Cent = el céntimo
kosten | es kostet = costar
Wie viel kostet das? = ¿Cuánto cuesta?
billig = barato
teuer = caro
zählen = contar (números)
rechnen | er rechnet = calcular, hacer cuentas
die Hausnummer | die Hausnummern = el número de la casa
:::

:::quiz
listenmc: vierunddreißig || ¿Qué número oyes? || 34 || 43 || 33 ## Primero la unidad (vier = 4), después la decena (dreißig = 30).
mc: ¿Cómo se escribe 17? || siebzehn || siebenzehn || sibzehn ## 17 pierde «en»: siebzehn.
:::

:::resumen
- 0–12 de memoria; 13–19 = número + **zehn** (¡sechzehn, siebzehn!).
- Decenas en **-zig** (30 = dreißig).
- 21–99 **al revés**: unidad + **und** + decena: 34 = vierunddreißig.
- Coma para decimales: 3,50 € = drei Euro fünfzig.
:::
`,
ex: `
listenmc: dreiundfünfzig || ¿Qué número oyes? || 53 || 35 || 33 ## drei (3) und fünfzig (50) = 53.
listenmc: siebzehn || ¿Qué número oyes? || 17 || 70 || 7 ## siebzehn = 17. 70 sería siebzig.
listenmc: neunundneunzig || ¿Qué número oyes? || 99 || 19 || 90 ## neun und neunzig = 99.
listenmc: Das kostet zwölf Euro fünfzig. || ¿Cuánto cuesta? || 12,50 € || 20,15 € || 2,50 € ## zwölf Euro fünfzig = 12,50 €.
listenmc: Ich bin achtundvierzig Jahre alt. || ¿Cuántos años tiene? || 48 || 84 || 18 ## acht (8) und vierzig (40) = 48.
mc: ¿Cómo se dice 21? || einundzwanzig || zwanzigeins || zwanzigundeins ## Primero la unidad: ein-und-zwanzig.
mc: ¿Cómo se dice 30? || dreißig || dreizig || dreizehn ## 30 es el único con -ßig. dreizehn es 13.
mc: ¿Cómo se dice 66? || sechsundsechzig || sechsundsechszig || sechzigsechs ## 60 = sechzig (sin s). 6 = sechs. 66 = sechsundsechzig.
mc: «¿Cuánto cuesta?» se dice… || Wie viel kostet das? || Wie viele kostet das? || Was viel kostet das? ## Wie viel kostet das? o Was kostet das?

gap: 25 = fünf___zwanzig || und ## La unidad, und, la decena: fünfundzwanzig.
listen: Meine Telefonnummer ist null eins sieben sechs. ## Por teléfono se dicen las cifras una a una.
write: Tengo 40 años. || Ich bin 40 Jahre alt. / Ich bin vierzig Jahre alt. / Ich bin vierzig. / Ich bin 40. ## La edad con sein: Ich bin… Jahre alt.
speak: Das kostet neunzehn Euro neunundneunzig. = Cuesta 19,99 euros.
`});

LES({t: 'La hora', de: 'Die Uhrzeit', min: 20,
goal: 'Podrás **preguntar y decir la hora** de las dos formas que usan los alemanes (la oficial y la coloquial) y no caerás en la trampa de **«halb drei»**.',
body: `
## Paso 1: Preguntar la hora
- [[Wie spät ist es?]] (literalmente: «¿cómo de tarde es?») o [[Wie viel Uhr ist es?]] = ¿Qué hora es?
- La respuesta empieza con [[Es ist…]] = Son las… / Es la…
- Para preguntar **a qué hora** pasa algo: [[Um wie viel Uhr…?]] o simplemente [[Wann…?]]

## Paso 2: La hora oficial (24 horas)
Es la que oyes en la radio, en la estación, en el médico y en los documentos. Es muy fácil: **hora + Uhr + minutos**.

| Reloj | Se dice |
|---|---|
| 8:00 | [[acht Uhr]] |
| 8:15 | [[acht Uhr fünfzehn]] |
| 14:30 | [[vierzehn Uhr dreißig]] |
| 19:45 | [[neunzehn Uhr fünfundvierzig]] |
| 0:10 | [[null Uhr zehn]] |

:::nota Uhr y Stunde
[[die Uhr]] es el reloj y también la palabra para decir la hora: [[Es ist drei Uhr.]] Pero para hablar de **duración** se usa [[die Stunde]]: [[Der Film dauert zwei Stunden.]] (La película dura dos horas.)
:::

## Paso 3: La hora coloquial (12 horas)
Entre amigos y en la vida diaria se usa más esta forma:

| Reloj | Se dice | Literalmente |
|---|---|---|
| 3:00 | [[drei Uhr]] / [[drei]] | tres |
| 3:05 | [[fünf nach drei]] | cinco después de las tres |
| 3:15 | [[Viertel nach drei]] | cuarto después de las tres |
| 3:30 | [[halb vier]] | **media hacia las cuatro** |
| 3:45 | [[Viertel vor vier]] | cuarto antes de las cuatro |
| 3:50 | [[zehn vor vier]] | diez antes de las cuatro |

**nach** = después de (y cuarto, y cinco…) · **vor** = antes de (menos cuarto, menos diez…)

## Paso 4: La trampa de «halb»
[[halb drei]] **NO** son las 3:30. Son las **2:30**.

:::cuento
Los alemanes miran siempre **hacia la hora que viene**. A las 2:30 ya has recorrido la mitad del camino **hacia las tres**. Por eso dicen «halb drei»: «media (hora) hacia las tres». Imagina una tarta que se llama «Las tres»: a las 2:30 ya tienes **la mitad de la tarta de las tres**.

- 2:30 = [[halb drei]]
- 6:30 = [[halb sieben]]
- 12:30 = [[halb eins]]
:::

:::ojo El error más caro
Si quedas «um halb acht» y llegas a las 8:30, llegarás **una hora tarde**: la cita era a las **7:30**. Ante la duda, pregunta: [[Also um sieben Uhr dreißig?]] (¿O sea, a las 7:30?)
:::

:::nota Más expresiones
- [[kurz nach vier]] = las cuatro y poco · [[kurz vor vier]] = casi las cuatro
- [[fünf vor halb vier]] = 3:25 y [[fünf nach halb vier]] = 3:35. Se usan sobre todo en algunas regiones. Basta con que las entiendas.
- En algunas regiones del sur y del este se dice [[Viertel vier]] para las 3:15 y [[drei viertel vier]] para las 3:45. No las uses, pero no te asustes si las oyes.
:::

## Paso 5: Decir cuándo: um, von… bis, ab, gegen
- [[um]] + hora exacta = a las…: [[Der Kurs beginnt um neun Uhr.]]
- [[von]] … [[bis]] = de… a…: [[Ich arbeite von acht bis fünf.]]
- [[ab]] = a partir de: [[Die Bäckerei ist ab sechs Uhr offen.]]
- [[gegen]] = hacia, más o menos a: [[Ich komme gegen acht.]]

## Paso 6: Las partes del día
| | |
|---|---|
| [[der Morgen]] | la mañana (temprano) |
| [[der Vormittag]] | la mañana (hasta mediodía) |
| [[der Mittag]] | el mediodía |
| [[der Nachmittag]] | la tarde (hasta las 18 h) |
| [[der Abend]] | la tarde-noche |
| [[die Nacht]] | la noche |

Con todas se usa **am** (am Morgen, am Abend…), menos con la noche: [[in der Nacht]]. Y para hoy, mañana o ayer: [[heute Abend]] (esta noche), [[morgen früh]] (mañana por la mañana), [[gestern Nachmittag]] (ayer por la tarde).

:::ojo morgen y der Morgen
[[morgen]] con minúscula = **mañana** (el día siguiente). [[der Morgen]] con mayúscula = **la mañana** (parte del día). Por eso «mañana por la mañana» no es «morgen Morgen», sino [[morgen früh]].
:::

:::dialogo Quedar con una amiga
Ana: Hast du morgen Zeit? = ¿Tienes tiempo mañana?
Mia: Ja, am Nachmittag. Um wie viel Uhr? = Sí, por la tarde. ¿A qué hora?
Ana: Um halb vier? = ¿A las tres y media?
Mia: Halb vier, also fünfzehn Uhr dreißig? Perfekt! = Las tres y media, o sea, las 15:30. ¡Perfecto!
Ana: Super, bis morgen! = ¡Genial, hasta mañana!
:::

:::vocab Palabras de esta lección
die Uhr | die Uhren = el reloj; la hora (um 3 Uhr)
die Stunde | die Stunden = la hora (duración)
die Minute | die Minuten = el minuto
Wie spät ist es? = ¿Qué hora es?
halb = media; «halb drei» = 2:30
das Viertel = el cuarto
nach = después de; y (en la hora: fünf nach drei)
vor = antes de; menos (en la hora: zehn vor vier)
der Morgen = la mañana (temprano)
der Vormittag | die Vormittage = la mañana (hasta mediodía)
der Nachmittag | die Nachmittage = la tarde
der Abend | die Abende = la tarde-noche
die Nacht | die Nächte = la noche
morgen = mañana (el día siguiente)
gestern = ayer
früh = temprano
spät = tarde
beginnen = empezar
dauern | es dauert = durar
:::

:::quiz
mc: ¿Qué hora es [[halb sechs]]? || 5:30 || 6:30 || 6:00 ## halb sechs = media hacia las seis = 5:30.
listenmc: Es ist Viertel vor neun. || ¿Qué hora es? || 8:45 || 9:15 || 9:45 ## Viertel vor neun = cuarto antes de las nueve = 8:45.
:::

:::resumen
- [[Wie spät ist es?]] – [[Es ist…]]
- Oficial: hora + **Uhr** + minutos (14:30 = vierzehn Uhr dreißig).
- Coloquial: **nach** (después), **vor** (antes), **Viertel** (cuarto), **halb** (¡media hacia la hora siguiente!).
- **halb drei = 2:30**. **um** + hora, **von… bis**, **ab**, **gegen**.
- **am** Morgen / Abend… pero **in der** Nacht. **morgen früh** = mañana por la mañana.
:::
`,
ex: `
mc: ¿Qué hora es [[halb drei]]? || 2:30 || 3:30 || 3:00 ## halb drei = media hacia las tres = 2:30.
mc: ¿Qué hora es [[Viertel nach zehn]]? || 10:15 || 9:45 || 10:45 ## nach = después: cuarto después de las diez.
mc: 6:50 en la forma coloquial es… || zehn vor sieben || zehn nach sechs || zehn vor sechs ## Faltan diez minutos para las siete: zehn vor sieben.
mc: 12:30 en la forma coloquial es… || halb eins || halb zwölf || zwölf halb ## Media hacia la una: halb eins.
listenmc: Der Zug fährt um vierzehn Uhr zwanzig. || ¿A qué hora sale el tren? || 14:20 || 4:20 || 20:14 ## Hora oficial: vierzehn Uhr zwanzig = 14:20.
listenmc: Wir treffen uns um halb acht. || ¿A qué hora quedan? || 7:30 || 8:30 || 8:00 ## halb acht = 7:30.
listenmc: Die Praxis ist von acht bis zwölf Uhr geöffnet. || ¿Cuándo abre la consulta? || de 8 a 12 || de 8 a 2 || a las 8 y a las 12 ## von… bis = de… a.
gap: Der Kurs beginnt ___ neun Uhr. (a las) || um ## um + hora exacta.
gap: Ich arbeite ___ acht ___ vier. (de… a…) || von + bis ## von… bis… = de… a…
gap: Was machst du heute ___? (por la noche/tarde) || Abend ## heute Abend = esta tarde/noche.
mc: «Mañana por la mañana» se dice… || morgen früh || morgen Morgen || am Morgen morgen ## morgen = mañana (día). Por la mañana: früh.
match: 9:15 = Viertel nach neun || 8:45 = Viertel vor neun || 8:30 = halb neun || 9:05 = fünf nach neun ## Recuerda: halb = media hacia la hora siguiente.
write: ¿Qué hora es? || Wie spät ist es? / Wie viel Uhr ist es? ## Las dos son correctas.
speak: Es ist halb vier, also fünfzehn Uhr dreißig. = Son las tres y media, o sea, las 15:30.
`});

LES({t: 'Días, meses y fechas', de: 'Wochentage, Monate, Datum', min: 20,
goal: 'Sabrás los **días de la semana, los meses y las estaciones**, los **números ordinales** (primero, segundo…) y cómo decir una **fecha**: cumpleaños, citas y plazos. Y por fin entenderás cuándo se usa **am, im y um**.',
body: `
## Paso 1: Los días de la semana
Todos son masculinos (**der**) y se escriben con mayúscula:

| | |
|---|---|
| [[der Montag]] | lunes |
| [[der Dienstag]] | martes |
| [[der Mittwoch]] | miércoles (literalmente «mitad de la semana») |
| [[der Donnerstag]] | jueves |
| [[der Freitag]] | viernes |
| [[der Samstag]] | sábado (en el norte también [[Sonnabend]]) |
| [[der Sonntag]] | domingo |

- [[das Wochenende]] = el fin de semana · [[am Wochenende]] = el fin de semana (cuándo).
- **Un día concreto**: [[am Montag]] = el lunes. **Cada semana**: [[montags]] = los lunes (con minúscula y -s).

:::es
En español decimos «el lunes» sin preposición. En alemán se necesita **am**: [[Ich komme am Montag.]] (Vengo el lunes.) Y «los lunes» (siempre) se dice con una sola palabra: [[montags]], [[dienstags]], [[sonntags]].
:::

## Paso 2: Los meses y las estaciones
También son todos masculinos. Se parecen mucho al español:
[[Januar]], [[Februar]], [[März]], [[April]], [[Mai]], [[Juni]], [[Juli]], [[August]], [[September]], [[Oktober]], [[November]], [[Dezember]].

Las estaciones: [[der Frühling]] (primavera), [[der Sommer]] (verano), [[der Herbst]] (otoño), [[der Winter]] (invierno).

:::nota Juni y Juli
Como [[Juni]] y [[Juli]] suenan parecido, por teléfono muchos alemanes dicen [[Juno]] para junio y [[Julei]] para julio. En Austria, enero es [[Jänner]].
:::

## Paso 3: am, im, um: la tabla que lo resuelve todo
| Preposición | Se usa con | Ejemplos |
|---|---|---|
| [[am]] | días, fechas y partes del día | [[am Montag]], [[am 3. Mai]], [[am Abend]] |
| [[im]] | meses y estaciones | [[im Mai]], [[im Sommer]] |
| [[um]] | horas exactas | [[um 8 Uhr]] |

Y los años: [[2020]] o [[im Jahr 2020]], **nunca** ~~in 2020~~.

:::truco Del más corto al más largo
**um** para lo más pequeño (una hora), **am** para algo mediano (un día), **im** para lo más grande (un mes, una estación). Piensa en tres cajas de distinto tamaño: [[um]] es la cajita, [[am]] la caja mediana, [[im]] la caja grande.
:::

## Paso 4: Los números ordinales (primero, segundo…)
Para las fechas necesitas «el primero, el segundo…». Se forman así:
- Del **1 al 19**: número + **-te**: [[der zweite]] (2.º), [[der vierte]] (4.º), [[der neunzehnte]] (19.º).
- Desde el **20**: número + **-ste**: [[der zwanzigste]] (20.º), [[der einunddreißigste]] (31.º).
- Cuatro irregulares: [[der erste]] (1.º), [[der dritte]] (3.º), [[der siebte]] (7.º), [[der achte]] (8.º).

Se escriben con un **punto**: 3. = dritte, 25. = fünfundzwanzigste.

## Paso 5: Decir una fecha
- ¿Qué día es hoy? [[Der Wievielte ist heute?]] – [[Heute ist der dritte Mai.]] (der 3. Mai)
- ¿Cuándo? [[am]] + ordinal **+ -en**: [[am dritten Mai]] (el 3 de mayo), [[am ersten Januar]] (el 1 de enero).
- La fecha escrita: **día.mes.año**, igual que en España y Latinoamérica: 03.05.2026 = [[der dritte Mai zweitausendsechsundzwanzig]] o [[der dritte Fünfte]].

:::ojo -te o -ten
Fíjate en la terminación: «**der** dritt**e** Mai» (hoy es el 3 de mayo), pero «**am** dritt**en** Mai» (el día 3 de mayo, cuándo). Con **am** siempre **-en**.
:::

:::ejemplos
Wann hast du Geburtstag? – Am 12. August. = ¿Cuándo es tu cumpleaños? – El 12 de agosto.
Ich habe am Freitag einen Termin. = Tengo una cita el viernes.
Samstags arbeite ich nicht. = Los sábados no trabajo.
Im Winter ist es in Berlin sehr kalt. = En invierno hace mucho frío en Berlín.
Heute ist der erste März. = Hoy es el uno de marzo.
Der Kurs beginnt am 15. September. = El curso empieza el 15 de septiembre.
Ich bin 1991 geboren. = Nací en 1991.
:::

:::vocab Palabras de esta lección
der Montag = el lunes
der Dienstag = el martes
der Mittwoch = el miércoles
der Donnerstag = el jueves
der Freitag = el viernes
der Samstag = el sábado
der Sonntag = el domingo
das Wochenende | die Wochenenden = el fin de semana
die Woche | die Wochen = la semana
der Monat | die Monate = el mes
der Frühling = la primavera
der Sommer = el verano
der Herbst = el otoño
der Winter = el invierno
das Datum | die Daten = la fecha
der Geburtstag | die Geburtstage = el cumpleaños
der Termin | die Termine = la cita (con el médico, en una oficina)
geboren = nacido; «Ich bin 1991 geboren» = nací en 1991
:::

:::quiz
gap: Ich komme ___ Montag. || am ## Días: am.
gap: Wir fahren ___ Juli nach Spanien. || im ## Meses: im.
:::

:::resumen
- Días, meses y estaciones son **der**. «Los lunes» = **montags**.
- **um** + hora · **am** + día, fecha, parte del día · **im** + mes, estación.
- Ordinales: **-te** hasta 19, **-ste** desde 20; erste, dritte, siebte, achte.
- [[Heute ist der dritte Mai.]] · [[am dritten Mai]] (con am: **-en**).
:::
`,
ex: `

MOD({id: 'm4', t: 'Sustantivos y artículos', de: 'Nomen und Artikel',
  desc: 'El famoso der, die, das. Aprenderás por qué el alemán tiene tres géneros, las reglas que te ayudan a adivinarlos, el artículo indefinido, el negativo «kein» y cómo se forma el plural.',
  can: ['Sé que cada sustantivo se aprende con su artículo y su plural.', 'Conozco las reglas más útiles para adivinar si es der, die o das.', 'Uso bien ein, eine, kein, keine.', 'Reconozco los cinco tipos de plural.']});

LES({t: 'der, die, das: los tres géneros', de: 'Das Genus: der, die, das', min: 25,
goal: 'Entenderás **por qué** el alemán tiene tres artículos, aprenderás el **método de colores** para recordarlos y las **reglas** que te permiten adivinar el género de muchísimas palabras.',
body: `
## Paso 1: Tres «familias» de palabras
En español cada sustantivo es masculino o femenino: **el** libro, **la** mesa. El alemán tiene **tres** grupos:

| Artículo | Género | Ejemplo |
|---|---|---|
| [[m:der]] | masculino | [[m:der Tisch]] (la mesa) |
| [[f:die]] | femenino | [[f:die Lampe]] (la lámpara) |
| [[n:das]] | neutro (ni masculino ni femenino) | [[n:das Bett]] (la cama) |

Además, **todos los sustantivos se escriben con mayúscula**, no solo los nombres propios: [[m:der Tisch]], [[n:das Buch]], [[f:die Liebe]] (el amor).

:::ojo El género alemán no coincide con el español
Esta es la parte difícil: el género alemán **casi nunca sirve si lo traduces del español**.
- **la** mesa → [[m:der Tisch]] (masculino)
- **el** sol → [[f:die Sonne]] (femenino)
- **la** luna → [[m:der Mond]] (masculino)
- **la** chica → [[n:das Mädchen]] (¡neutro!)
Por eso hay una sola regla de oro: **nunca aprendas una palabra sin su artículo**. No aprendas «Tisch = mesa», aprende «**der** Tisch = la mesa».
:::

## Paso 2: El método de los colores
En esta app (y en muchos libros alemanes) cada género tiene su color. Tu memoria visual te ayudará mucho:
- **azul** = [[m:der]] (masculino)
- **rojo** = [[f:die]] (femenino)
- **verde** = [[n:das]] (neutro)
- **naranja** = [[p:die]] (plural)

:::truco Imagínalo
Para recordar el género, **imagina la cosa con su color**: una mesa azul ([[m:der Tisch]]), una lámpara roja ([[f:die Lampe]]), una cama verde ([[n:das Bett]]). Cuanto más rara y divertida sea la imagen, mejor la recordarás. Si quieres, pon pegatinas de colores en las cosas de tu casa.
:::

## Paso 3: Reglas que te ayudan (¡y funcionan!)
No todo es memoria. Muchas palabras dan una pista por su **significado** o por su **terminación**.

### Casi siempre der (masculino)
- Hombres y animales macho: [[m:der Mann]], [[m:der Vater]], [[m:der Bruder]].
- Días, meses y estaciones: [[m:der Montag]], [[m:der Mai]], [[m:der Sommer]].
- El tiempo atmosférico: [[m:der Regen]] (la lluvia), [[m:der Schnee]] (la nieve), [[m:der Wind]].
- Personas que terminan en **-er**: [[m:der Lehrer]], [[m:der Bäcker]] (el panadero).
- Terminaciones **-ling, -ismus, -ent**: [[m:der Frühling]], [[m:der Tourismus]], [[m:der Student]].

### Casi siempre die (femenino)
- Mujeres: [[f:die Frau]], [[f:die Mutter]], [[f:die Lehrerin]].
- Palabras que terminan en **-e** (¡más del 90 %!): [[f:die Lampe]], [[f:die Tasche]] (el bolso), [[f:die Straße]], [[f:die Schule]].
- Terminaciones **-ung, -heit, -keit, -ion, -tät, -schaft, -ei, -ie, -ik**: [[f:die Wohnung]] (el piso), [[f:die Gesundheit]] (la salud), [[f:die Information]], [[f:die Universität]], [[f:die Bäckerei]] (la panadería), [[f:die Familie]], [[f:die Musik]].

### Casi siempre das (neutro)
- Diminutivos en **-chen** y **-lein**: [[n:das Mädchen]], [[n:das Brötchen]] (el panecillo). ¡Siempre neutros, aunque sea una chica!
- Verbos usados como sustantivo: [[n:das Essen]] (la comida), [[n:das Leben]] (la vida).
- Terminaciones **-um, -ment, -o**: [[n:das Museum]], [[n:das Zentrum]], [[n:das Dokument]], [[n:das Auto]], [[n:das Kino]].
- Muchos sitios «extranjeros»: [[n:das Hotel]], [[n:das Café]], [[n:das Restaurant]].

:::truco Las tres terminaciones de oro
Si solo puedes recordar tres reglas, que sean estas:
1. **-e** → casi siempre **die**: [[f:die Lampe]].
2. **-ung / -heit / -keit / -ion** → **siempre die**: [[f:die Zeitung]].
3. **-chen** → **siempre das**: [[n:das Mädchen]].
:::

## Paso 4: Palabras compuestas: manda la última
El alemán junta palabras para crear otras nuevas. El género lo decide **siempre la última palabra**:
- [[f:die Küche]] (la cocina) + [[m:der Tisch]] = [[m:der Küchentisch]] (la mesa de cocina)
- [[n:das Haus]] (la casa) + [[f:die Tür]] (la puerta) = [[f:die Haustür]] (la puerta de casa)
- [[m:der Kaffee]] + [[f:die Tasse]] (la taza) = [[f:die Kaffeetasse]]

:::cuento
Piensa en un tren: la **última** palabra es la locomotora que decide adónde va todo el tren. Las palabras de delante son vagones que solo añaden información.
:::

## Paso 5: Los nombres de personas y de países
- Las personas, sin artículo: [[Maria ist hier.]] (en algunas regiones dicen «die Maria», pero no hace falta).
- La mayoría de los países, sin artículo: [[Deutschland]], [[Spanien]], [[Mexiko]]. Algunos sí lo llevan: [[f:die Schweiz]], [[f:die Türkei]], [[p:die USA]] (plural).

:::es
En español el artículo te ayuda poco a poco con «-o» (masculino) y «-a» (femenino). En alemán las pistas son **otras terminaciones** (-e, -ung, -chen…). Al principio parece mucho, pero en pocas semanas empezarás a «sentir» el género. Los alemanes también se equivocan a veces: ¡[[n:das Nutella]] o [[f:die Nutella]]! Es un chiste famoso en Alemania.
:::

:::vocab Palabras de esta lección
der Tisch | die Tische = la mesa
der Stuhl | die Stühle = la silla
die Lampe | die Lampen = la lámpara
das Bett | die Betten = la cama
die Sonne = el sol
der Mond = la luna
das Mädchen | die Mädchen = la chica, la niña
der Junge | die Jungen = el chico, el niño
die Tasche | die Taschen = el bolso, la bolsa
die Wohnung | die Wohnungen = el piso, el apartamento
die Zeitung | die Zeitungen = el periódico
das Brötchen | die Brötchen = el panecillo
das Fenster | die Fenster = la ventana
die Küche | die Küchen = la cocina
das Auto | die Autos = el coche
:::

:::quiz
mc: ¿Qué artículo tiene [[Zeitung]]? || die || der || das ## -ung siempre es femenino: die Zeitung.
mc: ¿Qué artículo tiene [[Brötchen]]? || das || der || die ## -chen siempre es neutro.
:::

:::resumen
- Tres géneros: **der** (masculino, azul), **die** (femenino, rojo), **das** (neutro, verde). Plural: **die** (naranja).
- El género **no se traduce** del español: aprende siempre **artículo + palabra**.
- Pistas: hombres, días, meses → der; **-e, -ung, -heit, -keit, -ion** → die; **-chen**, verbos sustantivados, **-um** → das.
- En las palabras compuestas manda **la última**.
:::
`,
ex: `
mc: ¿Qué artículo tiene [[Lampe]]? || die || der || das ## Termina en -e: casi siempre die.
mc: ¿Qué artículo tiene [[Montag]]? || der || die || das ## Días de la semana: der.
mc: ¿Qué artículo tiene [[Information]]? || die || der || das ## -ion: siempre die.
mc: ¿Qué artículo tiene [[Mädchen]]? || das || die || der ## -chen siempre es das, aunque sea una chica.
mc: ¿Qué artículo tiene [[Lehrer]]? || der || die || das ## Persona masculina en -er: der Lehrer. Ella: die Lehrerin.
mc: ¿Qué artículo tiene [[Freiheit]] (la libertad)? || die || der || das ## -heit: siempre die.
mc: ¿Qué artículo tiene [[Museum]]? || das || der || die ## -um: das.
mc: [[Haus]] es das y [[Tür]] es die. ¿Y [[Haustür]]? || die Haustür || das Haustür || der Haustür ## En las compuestas manda la última palabra: die Tür → die Haustür.
mc: «el sol» en alemán es… || die Sonne || der Sonne || das Sonne ## ¡Al revés que en español! die Sonne. Y la luna: der Mond.
tf: En alemán todos los sustantivos se escriben con mayúscula. || r ## der Tisch, das Buch, die Liebe: siempre con mayúscula.
tf: Si una palabra es femenina en español, también es femenina en alemán. || f ## No: la mesa = der Tisch, el sol = die Sonne.
match: der Tisch = la mesa || die Sonne = el sol || das Mädchen = la chica || der Mond = la luna || das Bett = la cama ## Fíjate: casi ningún género coincide con el español.
gap: ___ Wohnung ist schön. (artículo determinado) || Die ## -ung: die Wohnung. Al principio de la frase, con mayúscula.
speak: der Tisch, die Lampe, das Bett. = la mesa, la lámpara, la cama.
`});

LES({t: 'ein, eine, kein', de: 'Unbestimmter Artikel und Negativartikel', min: 20,
goal: 'Aprenderás el artículo indefinido (**un, una**) y el artículo negativo **kein** (ningún, no… un), que se usa muchísimo en alemán y no existe en español.',
body: `
## Paso 1: der o ein, como el o un
Igual que en español:
- **ein / eine** (un, una) para algo **nuevo** o cualquiera de muchos: [[Da ist ein Hund.]] (Ahí hay un perro.)
- **der / die / das** (el, la) para algo **conocido** o del que ya hablamos: [[Der Hund ist sehr groß.]] (El perro es muy grande.)

## Paso 2: Las formas de ein
| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| determinado | [[m:der Tisch]] | [[f:die Lampe]] | [[n:das Bett]] | [[p:die Tische]] |
| indefinido | [[m:ein Tisch]] | [[f:eine Lampe]] | [[n:ein Bett]] | [[p:Tische]] |

Fíjate en dos cosas:
1. **Masculino y neutro** usan la misma forma: **ein**. Solo el femenino tiene **-e**: **eine**.
2. **En plural no hay artículo indefinido.** «Unos libros» es simplemente [[p:Bücher]].

:::es «unos, unas» no existe
En español decimos «Tengo **unas** manzanas». En alemán: [[Ich habe Äpfel.]] Sin nada delante. Nunca ~~eine Äpfel~~.
:::

## Paso 3: kein, el artículo que dice «no»
En español, para negar un sustantivo decimos «no tengo coche», «no hay pan». En alemán se usa un artículo especial: **kein** (literalmente «ningún»).

| | masculino | femenino | neutro | plural |
|---|---|---|---|---|
| negativo | [[m:kein Tisch]] | [[f:keine Lampe]] | [[n:kein Bett]] | [[p:keine Tische]] |

Es facilísimo: **kein = k + ein**. Se declina igual que ein, y además **sí tiene plural**: [[p:keine]].

:::ejemplos
Ist das ein Stuhl? – Nein, das ist kein Stuhl. Das ist ein Tisch. = ¿Es eso una silla? – No, no es una silla. Es una mesa.
Hier ist keine Bank. = Aquí no hay ningún banco.
Ich habe kein Auto. = No tengo coche.
Wir haben keine Kinder. = No tenemos hijos.
Ich habe keine Zeit. = No tengo tiempo.
Das ist kein Problem! = ¡No es ningún problema!
:::

:::truco ¿Cuándo se usa kein?
Haz esta prueba: si en la frase **positiva** hay **ein/eine** o **ningún artículo**, la negas con **kein**.
- [[Ich habe ein Auto.]] → [[Ich habe kein Auto.]]
- [[Ich habe Zeit.]] → [[Ich habe keine Zeit.]]
- [[Ich trinke Milch.]] → [[Ich trinke keine Milch.]]
Para todo lo demás (verbos, adjetivos, der/die/das…) se usa [[nicht]]. Lo verás en la lección 5.3.
:::

:::nota Un adelanto del módulo 6
Cuando la palabra masculina es el **objeto** de la frase, **ein** y **kein** se convierten en **einen** y **keinen**: [[Ich habe einen Bruder.]] [[Ich habe keinen Hunger.]] Lo aprenderás con calma en el módulo del acusativo. Por ahora, apréndelo como frase hecha.
:::

## Paso 4: «¿Qué es eso?»
Con estas frases puedes preguntar el nombre de cualquier cosa, también en una tienda:
- [[Was ist das?]] – [[Das ist ein Kuli.]] (¿Qué es eso? – Es un bolígrafo.)
- [[Wie heißt das auf Deutsch?]] (¿Cómo se dice eso en alemán?)
- [[Ist das eine Tasse?]] – [[Ja, das ist eine Tasse.]] / [[Nein, das ist keine Tasse, das ist ein Glas.]]

:::dialogo En la tienda de muebles
Verkäufer: Kann ich Ihnen helfen? = ¿Puedo ayudarla?
Kundin: Ja, ich suche einen Schreibtisch. Ist das ein Schreibtisch? = Sí, busco un escritorio. ¿Es eso un escritorio?
Verkäufer: Nein, das ist kein Schreibtisch, das ist ein Esstisch. = No, no es un escritorio, es una mesa de comedor.
Kundin: Ah! Und was kostet die Lampe da? = ¡Ah! ¿Y cuánto cuesta esa lámpara?
Verkäufer: Die Lampe kostet 39 Euro. = La lámpara cuesta 39 euros.
:::

:::vocab Palabras de esta lección
der Kuli | die Kulis = el bolígrafo
der Bleistift | die Bleistifte = el lápiz
das Heft | die Hefte = el cuaderno
die Tasse | die Tassen = la taza
das Glas | die Gläser = el vaso; el cristal
der Schlüssel | die Schlüssel = la llave
das Handy | die Handys = el teléfono móvil
die Bank | die Banken = el banco (dinero)
das Problem | die Probleme = el problema
der Schreibtisch | die Schreibtische = el escritorio
suchen = buscar
kein, keine = ningún, ninguna; no… (un)
:::

:::quiz
gap: Das ist ___ Lampe. (una) || eine ## die Lampe → eine Lampe.
gap: Ich habe ___ Zeit. (no… ningún) || keine ## die Zeit → keine Zeit.
:::

:::resumen
- **ein** (masculino y neutro), **eine** (femenino). En plural no hay: [[p:Bücher]].
- **kein, keine** = ningún/ninguna. Niega sustantivos con **ein** o **sin artículo**. Plural: [[p:keine]].
- [[Das ist kein Problem!]]
:::
`,
ex: `
gap: Das ist ___ Tisch. (un) || ein ## der Tisch → ein Tisch.
gap: Das ist ___ Tasche. (una) || eine ## die Tasche → eine Tasche.
gap: Das ist ___ Handy. (un) || ein ## das Handy → ein Handy (neutro = ein).
gap: Das ist kein Stuhl, das ist ___ Sessel. (un) || ein ## der Sessel (el sillón) → ein Sessel.
gap: Hier gibt es ___ Bäckerei. (ninguna) || keine ## die Bäckerei → keine Bäckerei.
gap: Ich habe ___ Auto. (ningún) || kein ## das Auto → kein Auto.
gap: Wir haben ___ Kinder. (ningún, plural) || keine ## Plural: keine.
mc: «Tengo unas preguntas» se dice… || Ich habe Fragen. || Ich habe eine Fragen. || Ich habe einige Frage. ## En plural no hay artículo indefinido.
mc: ¿Cómo niegas «Ich trinke Kaffee»? || Ich trinke keinen Kaffee. || Ich trinke nicht Kaffee. || Ich nicht trinke Kaffee. ## Sustantivo sin artículo → kein (masculino objeto: keinen).
mc: «¡No es ningún problema!» || Das ist kein Problem! || Das ist nicht Problem! || Das ist keine Problem! ## das Problem → kein Problem.
order: (¿Cómo se dice eso en alemán?) wie heißt das auf Deutsch ## Una frase muy útil para aprender vocabulario.
write: No tengo tiempo. || Ich habe keine Zeit. ## die Zeit → keine Zeit.
listen: Das ist keine Tasse, das ist ein Glas. = No es una taza, es un vaso. ## keine Tasse (die), ein Glas (das).
speak: Was ist das? Das ist ein Schlüssel. = ¿Qué es eso? Es una llave.
`});

LES({t: 'El plural', de: 'Der Plural', min: 20,
goal: 'Conocerás los **cinco tipos de plural** del alemán y sus pistas. Y aprenderás a leer la forma en que los diccionarios lo escriben (der Tisch, -e).',
body: `
## Paso 1: Una buena noticia: en plural siempre es die
Da igual si la palabra es der, die o das: **en plural el artículo es siempre** [[p:die]].
- [[m:der Tisch]] → [[p:die Tische]]
- [[f:die Lampe]] → [[p:die Lampen]]
- [[n:das Bett]] → [[p:die Betten]]

## Paso 2: La mala noticia: hay cinco formas de hacer el plural
En español casi siempre basta con **-s** o **-es**. En alemán hay cinco grupos. No te asustes: cada grupo tiene sus pistas.

| Tipo | Pista | Ejemplos |
|---|---|---|
| **-e** (a veces con ¨) | muchas palabras **der** | [[m:der Tisch]] → [[p:die Tische]], [[m:der Stuhl]] → [[p:die Stühle]] |
| **-(e)n** | casi todas las palabras **die** | [[f:die Lampe]] → [[p:die Lampen]], [[f:die Frau]] → [[p:die Frauen]] |
| **-er** (con ¨ si se puede) | muchas palabras **das** | [[n:das Kind]] → [[p:die Kinder]], [[n:das Buch]] → [[p:die Bücher]] |
| **-s** | palabras extranjeras y las que acaban en vocal (-a, -o, -i, -y) | [[n:das Auto]] → [[p:die Autos]], [[n:das Handy]] → [[p:die Handys]] |
| **sin cambio** (a veces con ¨) | der y das que acaban en **-er, -el, -en** | [[m:der Lehrer]] → [[p:die Lehrer]], [[m:der Vater]] → [[p:die Väter]] |

:::truco Las dos reglas más seguras
1. Las palabras **femeninas** hacen el plural casi siempre con **-n** o **-en**: [[p:die Wohnungen]], [[p:die Zeitungen]], [[p:die Straßen]]. Y las que acaban en **-in** doblan la n: [[f:die Lehrerin]] → [[p:die Lehrerinnen]].
2. Las palabras en **-er, -el, -en** (masculinas o neutras) casi **no cambian**: [[p:die Lehrer]], [[p:die Zimmer]], [[p:die Löffel]] (las cucharas). Solo cambia el artículo, y a veces aparece una diéresis: [[p:die Äpfel]].
:::

## Paso 3: La diéresis que aparece
En muchos plurales la vocal se convierte en **ä, ö, ü**. Escucha la diferencia:
- [[m:der Apfel]] → [[p:die Äpfel]] (manzanas)
- [[n:das Haus]] → [[p:die Häuser]] (casas)
- [[f:die Stadt]] → [[p:die Städte]] (ciudades)
- [[f:die Mutter]] → [[p:die Mütter]] (madres)
- [[m:der Bruder]] → [[p:die Brüder]] (hermanos)

## Paso 4: Cómo lo escribe el diccionario
Los diccionarios y las listas de vocabulario (¡también la del examen!) usan este código:

| Escrito así | Significa | Plural |
|---|---|---|
| der Tisch, -e | añade -e | die Tische |
| der Stuhl, ¨-e | diéresis + -e | die Stühle |
| die Lampe, -n | añade -n | die Lampen |
| das Buch, ¨-er | diéresis + -er | die Bücher |
| das Auto, -s | añade -s | die Autos |
| der Lehrer, - | sin cambio | die Lehrer |

En esta app te escribimos siempre el plural completo, por ejemplo **der Tisch | die Tische**, para que lo veas y lo oigas.

:::ojo Errores típicos
- Poner **-s** a todo, como en español o inglés: ~~die Tischs~~ → [[p:die Tische]]. La -s solo es para palabras extranjeras y las que acaban en vocal.
- Olvidar la diéresis: ~~die Mutter~~ → [[p:die Mütter]] (cuando son varias).
- Usar **der** o **das** con el plural: ~~der Kinder~~ → [[p:die Kinder]].
:::

:::ejemplos
Ich habe zwei Brüder und eine Schwester. = Tengo dos hermanos y una hermana.
Die Kinder spielen im Garten. = Los niños juegan en el jardín.
Die Äpfel kosten zwei Euro. = Las manzanas cuestan dos euros.
In Berlin gibt es viele Museen. = En Berlín hay muchos museos.
Wie viele Zimmer hat die Wohnung? = ¿Cuántas habitaciones tiene el piso?
Hier sind keine Stühle. = Aquí no hay sillas.
:::

:::vocab Palabras de esta lección
der Apfel | die Äpfel = la manzana
der Bruder | die Brüder = el hermano
die Schwester | die Schwestern = la hermana
das Zimmer | die Zimmer = la habitación
der Löffel | die Löffel = la cuchara
das Ei | die Eier = el huevo
der Garten | die Gärten = el jardín
die Lehrerin | die Lehrerinnen = la profesora
das Museum | die Museen = el museo
das Foto | die Fotos = la foto
viele = muchos
wie viele? = ¿cuántos?
:::

:::quiz
mc: El plural de [[f:die Frau]] es… || die Frauen || die Fraus || die Fräuen ## Femenino: -en.
mc: El plural de [[n:das Kind]] es… || die Kinder || die Kinds || die Kinden ## Muchos neutros: -er.
:::

:::resumen
- En plural, **siempre die**.
- Cinco tipos: **-e**, **-(e)n**, **-er**, **-s** y **sin cambio** (a veces con diéresis).
- Femeninas → casi siempre **-(e)n**. Palabras en **-er, -el, -en** → casi sin cambio. Extranjeras y en vocal → **-s**.
- Aprende cada palabra así: **der Tisch | die Tische**.
:::
`,

LES({t: 'haben y los verbos irregulares', de: 'haben · unregelmäßige Verben im Präsens', min: 20,

body: `
## Paso 1: haben, el segundo verbo más importante
| | haben |
|---|---|
| ich | [[habe]] |
| du | [[hast]] |
| er / sie / es | [[hat]] |
| wir | [[haben]] |
| ihr | [[habt]] |
| sie / Sie | [[haben]] |

Con **haben** se dicen muchas cosas que en español también van con «tener»:
- [[Ich habe Hunger.]] (Tengo hambre.) · [[Ich habe Durst.]] (Tengo sed.)
- [[Ich habe Zeit.]] (Tengo tiempo.) · [[Ich habe Angst.]] (Tengo miedo.)
- [[Ich habe Kopfschmerzen.]] (Me duele la cabeza.) · [[Ich habe Lust.]] (Tengo ganas.)

:::ojo La edad NO se dice con haben
«Tengo 30 años» = [[Ich bin 30 Jahre alt.]] Con **sein**. Decir ~~Ich habe 30 Jahre~~ es el error más típico de los hispanohablantes. Y «tengo frío» = [[Mir ist kalt.]] (lo verás más adelante).
:::

## Paso 2: Verbos que cambian la vocal
Algunos verbos cambian la vocal de la raíz, **pero solo en dos personas: du y er/sie/es**. Las demás son normales. Hay tres grupos:

### e → i
| | sprechen (hablar) | essen (comer) | geben (dar) |
|---|---|---|---|
| ich | spreche | esse | gebe |
| du | [[spr==i==chst]] | [[==i==sst]] | [[g==i==bst]] |
| er / sie / es | [[spr==i==cht]] | [[==i==sst]] | [[g==i==bt]] |
| wir | sprechen | essen | geben |

Otros del grupo: [[helfen]] (ayudar) → hilft, [[treffen]] (quedar con) → trifft, [[vergessen]] (olvidar) → vergisst, [[nehmen]] (tomar) → du **nimmst**, er **nimmt** (¡cambia también la consonante!).

### e → ie
[[lesen]] (leer) → du liest, er liest · [[sehen]] (ver) → du siehst, er sieht · [[empfehlen]] (recomendar) → er empfiehlt.

### a → ä (y au → äu)
| | fahren (ir en vehículo) | schlafen (dormir) | laufen (correr, andar) |
|---|---|---|---|
| ich | fahre | schlafe | laufe |
| du | [[f==ä==hrst]] | [[schl==ä==fst]] | [[l==äu==fst]] |
| er / sie / es | [[f==ä==hrt]] | [[schl==ä==ft]] | [[l==äu==ft]] |
| wir | fahren | schlafen | laufen |

Otros: [[tragen]] (llevar) → trägt, [[waschen]] (lavar) → wäscht, [[halten]] (parar, sostener) → hält, [[einladen]] (invitar) → lädt … ein.

:::es ¡Esto ya lo conoces!
En español también hay verbos que cambian la vocal: «pedir → p**i**do», «dormir → d**ue**rmo», «poder → p**ue**do». En español cambian en casi todas las personas. **En alemán solo en du y er/sie/es**, así que es más fácil.
:::

:::truco ¿Cómo saber qué verbos cambian?
No hay forma de adivinarlo: hay que aprenderlo con el verbo. Por eso en las listas de vocabulario verás siempre la forma de **er**: **fahren | er fährt**. Si aprendes las dos formas juntas, tu cabeza lo guarda de una vez. En la sección **Más → Verbos importantes** tienes la lista completa con audio.
:::

## Paso 3: wissen, un verbo especial
[[wissen]] (saber un dato) es irregular en **ich, du y er**: [[ich weiß]], [[du weißt]], [[er weiß]], pero [[wir wissen]], [[ihr wisst]], [[sie wissen]]. La frase más útil: [[Ich weiß es nicht.]] (No lo sé.)

:::ejemplos
Sprichst du Englisch? = ¿Hablas inglés?
Er fährt jeden Tag mit dem Bus. = Él va cada día en autobús.
Was isst du gern? = ¿Qué te gusta comer?
Mein Sohn schläft noch. = Mi hijo todavía duerme.
Sie liest ein Buch. = Ella lee un libro.
Nimmst du den Zug oder das Auto? = ¿Coges el tren o el coche?
Hilfst du mir, bitte? = ¿Me ayudas, por favor?
Weißt du, wo die Post ist? = ¿Sabes dónde está Correos?
:::

:::vocab Verbos de esta lección
haben | er hat = tener
sprechen | er spricht = hablar
essen | er isst = comer
geben | er gibt = dar
helfen | er hilft = ayudar
nehmen | er nimmt = tomar, coger
treffen | er trifft = quedar con, encontrarse con
vergessen | er vergisst = olvidar
lesen | er liest = leer
sehen | er sieht = ver
fahren | er fährt = ir (en vehículo), conducir
schlafen | er schläft = dormir
laufen | er läuft = correr, andar
tragen | er trägt = llevar (ropa, cosas)
wissen | er weiß = saber (un dato)
der Hunger = el hambre
der Durst = la sed
die Angst | die Ängste = el miedo
:::

:::resumen
- **haben**: habe, hast, hat, haben, habt, haben. Pero la edad va con **sein**.
- Cambian la vocal solo en **du** y **er/sie/es**: **e → i** (spricht), **e → ie** (liest), **a → ä** (fährt).
- **nehmen**: du nimmst, er nimmt. **wissen**: ich weiß, du weißt, er weiß.
- Aprende siempre el verbo con la forma de **er**.
:::

LES({t: 'La regla de oro: el verbo en posición 2', de: 'Die Verbposition: Position 2', min: 25,
goal: 'Dominarás **la regla más importante de la gramática alemana**: en una frase normal, el verbo conjugado va **siempre en la posición 2**. Es el error número uno de los hispanohablantes, y después de esta lección ya no lo cometerás.',
body: `
:::cuento
Imagina que cada frase alemana es **un tren**. El primer vagón lo eliges tú: puede ser «yo», «hoy», «en Berlín»… Pero **el segundo vagón es siempre la locomotora: el verbo**. Nunca, nunca cambia de sitio. Y si en el primer vagón pones otra cosa que no sea el sujeto, el sujeto tiene que subirse al **tercer vagón**, justo detrás del verbo.
:::

## Paso 1: La regla
En una frase principal (afirmativa) el **verbo conjugado** está en la **posición 2**. Lo que va en la posición 1 puede cambiar:

| Posición 1 | Posición 2 (verbo) | Posición 3 | Resto |
|---|---|---|---|
| Ich | [[gehe]] | heute | ins Kino. |
| Heute | [[gehe]] | **ich** | ins Kino. |
| Ins Kino | [[gehe]] | **ich** | heute. |

Las tres frases significan «Hoy voy al cine». Fíjate en lo que pasa cuando la posición 1 no es «ich»: **el sujeto salta detrás del verbo**. A esto se le llama **inversión**.

## Paso 2: ¿Qué cuenta como «una posición»?
Una posición no es una palabra: es **un bloque de información**. Todos estos son **un solo bloque** y ocupan la posición 1:
- [[Am Montag]] · [[Am Montag um acht Uhr]] · [[Nächste Woche]]
- [[Meine Schwester und ich]] · [[Der neue Kollege]]
- [[In Deutschland]] · [[Zum Frühstück]]

:::ejemplos
Am Wochenende besuche ich meine Eltern. = El fin de semana visito a mis padres.
Morgen habe ich einen Termin. = Mañana tengo una cita.
In Spanien ist es jetzt warm. = En España ahora hace calor.
Meine Schwester und ich wohnen zusammen. = Mi hermana y yo vivimos juntas.
Um 7 Uhr frühstücken wir. = A las 7 desayunamos.
Leider habe ich keine Zeit. = Por desgracia no tengo tiempo.
Zum Frühstück trinke ich Tee. = En el desayuno bebo té.
:::

:::es Por qué nos cuesta tanto
En español el orden es muy libre: «Hoy yo voy al cine» o «Hoy voy yo al cine» están bien. Por eso los hispanohablantes dicen ~~Heute ich gehe ins Kino~~. En alemán eso **está mal**: hay **dos cosas** antes del verbo (heute + ich). Correcto: [[Heute gehe ich ins Kino.]]
:::

:::truco La prueba de los dedos
Cuando escribas una frase, cuenta con los dedos los **bloques** que hay **antes del verbo**. Tiene que haber **exactamente uno**. Si cuentas dos, mueve el sujeto detrás del verbo.
:::

## Paso 3: Lo que NO cuenta: las palabras de la posición 0
Hay cinco palabritas que unen frases y **no ocupan ninguna posición**. Están «fuera del tren»: [[und]] (y), [[aber]] (pero), [[oder]] (o), [[denn]] (porque) y [[sondern]] (sino).
- [[Ich lerne Deutsch, ==und== ==ich== ==wohne== in Bremen.]]
- [[Ich komme gern, ==aber== heute ==habe== ich keine Zeit.]]
Después de ellas, la frase empieza de cero: posición 1, verbo en posición 2. Lo verás con detalle en el módulo 10.

## Paso 4: El orden del resto: primero el tiempo
Detrás del verbo, los alemanes suelen poner la información en este orden: **cuándo – por qué – cómo – dónde** (en Alemania lo llaman **TeKaMoLo**: temporal, kausal, modal, lokal). Lo más importante para ti: **el tiempo va antes que el lugar**.
- [[Ich fahre ==morgen== ==mit dem Bus== ==nach Köln==.]] (Mañana voy a Colonia en autobús.)
- En español solemos decir «Voy a Colonia mañana», pero en alemán suena mejor: primero **morgen**, después **nach Köln**.

:::ojo Errores típicos
- ~~Heute ich arbeite.~~ → [[Heute arbeite ich.]]
- ~~Am Samstag wir gehen tanzen.~~ → [[Am Samstag gehen wir tanzen.]]
- ~~In Deutschland man spricht Deutsch.~~ → [[In Deutschland spricht man Deutsch.]]
- ~~Dann ich koche.~~ → [[Dann koche ich.]]
:::

:::vocab Palabras de tiempo que suelen ir en la posición 1
heute = hoy
morgen = mañana
gestern = ayer
jetzt = ahora
dann = luego, entonces
danach = después
zuerst = primero
später = más tarde
leider = por desgracia
vielleicht = quizás
oft = a menudo
manchmal = a veces
nächste Woche = la semana que viene
zusammen = juntos
:::

:::quiz
order: (Mañana trabajo.) morgen arbeite ich ## Posición 1: morgen. Posición 2: el verbo. Después, el sujeto.
mc: ¿Cuál es correcta? || Am Abend koche ich. || Am Abend ich koche. || Ich am Abend koche. ## El verbo, siempre en la posición 2.
:::

:::resumen
- En la frase principal, el **verbo conjugado** va **siempre en la posición 2**.
- Si la posición 1 no es el sujeto, el **sujeto va justo detrás del verbo**.
- Un bloque como [[am Montag um acht Uhr]] cuenta como **una** posición.
- **und, aber, oder, denn, sondern** no cuentan (posición 0).
- Orden del resto: primero **cuándo**, después **dónde**.
:::
`,
ex: `
order: (Hoy voy al cine.) heute gehe ich ins Kino || ich gehe heute ins Kino ## Si empiezas con heute: heute + verbo + ich.
order: (El sábado visitamos a mi abuela.) am Samstag besuchen wir meine Oma || wir besuchen am Samstag meine Oma ## am Samstag es un solo bloque.
order: (Por desgracia no tengo tiempo.) leider habe ich keine Zeit || ich habe leider keine Zeit ## leider en la posición 1 → verbo → sujeto.
order: (En Alemania se habla alemán.) in Deutschland spricht man Deutsch || man spricht in Deutschland Deutsch ## man es el sujeto: va detrás del verbo.
order: (Después cocino yo.) danach koche ich || ich koche danach ## danach (después) en la posición 1.
mc: ¿Cuál es correcta? || Morgen fahre ich nach Hamburg. || Morgen ich fahre nach Hamburg. || Morgen nach Hamburg ich fahre. ## Una sola cosa antes del verbo.
mc: ¿Cuál es correcta? || Um acht Uhr beginnt der Kurs. || Um acht Uhr der Kurs beginnt. || Um acht beginnt Uhr der Kurs. ## «Um acht Uhr» es un bloque; luego el verbo y el sujeto.
mc: ¿Cuál es correcta? || Ich lerne Deutsch, aber ich spreche noch nicht gut. || Ich lerne Deutsch, aber spreche ich noch nicht gut. || Ich lerne Deutsch, aber ich noch nicht gut spreche. ## «aber» no cuenta: después viene ich + verbo.
mc: ¿Qué orden suena más natural? || Ich fahre morgen nach Berlin. || Ich fahre nach Berlin morgen. ## Primero el tiempo (morgen), después el lugar (nach Berlin).
gap: Heute ___ ich keine Lust. (haben) || habe ## heute + verbo (posición 2) + ich.
gap: Am Abend ___ wir fern. (ver la tele — sehen) || sehen ## am Abend + verbo + wir.
write: Hoy trabajo en casa. || Heute arbeite ich zu Hause. / Ich arbeite heute zu Hause. ## Heute + verbo + ich.
listen: Am Wochenende besuche ich meine Eltern. = El fin de semana visito a mis padres. ## Am Wochenende (1), besuche (2), ich (3).
speak: Morgen habe ich einen Termin beim Arzt. = Mañana tengo cita con el médico.
`});

LES({t: 'La negación: nicht y kein', de: 'Negation: nicht und kein', min: 20,
goal: 'Sabrás **cuándo** se dice **nicht** y cuándo **kein**, y **dónde** se coloca **nicht** en la frase. También aprenderás «nada», «nunca» y «nadie».',
body: `
## Paso 1: Dos formas de decir «no»
En español basta con poner «no» delante del verbo. En alemán hay dos herramientas:
- **kein** niega **sustantivos** que llevarían **ein** o **ningún artículo** (lo viste en la lección 4.2).
- **nicht** niega **todo lo demás**: verbos, adjetivos, adverbios, nombres y sustantivos con der/die/das o con mein, dein…

| Frase positiva | Negativa | Por qué |
|---|---|---|
| [[Ich habe ein Auto.]] | [[Ich habe kein Auto.]] | ein → kein |
| [[Ich habe Zeit.]] | [[Ich habe keine Zeit.]] | sin artículo → kein |
| [[Ich arbeite heute.]] | [[Ich arbeite heute nicht.]] | verbo → nicht |
| [[Das ist gut.]] | [[Das ist nicht gut.]] | adjetivo → nicht |
| [[Das ist mein Auto.]] | [[Das ist nicht mein Auto.]] | posesivo → nicht |
| [[Ich kenne den Mann.]] | [[Ich kenne den Mann nicht.]] | der/den → nicht |

## Paso 2: ¿Dónde va nicht?
Esta es la parte que más cuesta, porque en español «no» va siempre delante del verbo. En alemán:
1. Si niegas **toda la frase**, **nicht** va **al final**: [[Ich verstehe dich nicht.]] (No te entiendo.) [[Er kommt heute nicht.]]
2. **nicht** va **delante** de un adjetivo o adverbio: [[nicht gut]], [[nicht oft]], [[nicht so schnell]].
3. **nicht** va **delante** de un lugar con preposición: [[Ich wohne nicht in Berlin.]]
4. **nicht** va **delante** de la segunda parte del verbo (infinitivo, prefijo, participio): [[Ich kann nicht kommen.]] [[Ich stehe nicht auf.]]

:::truco Nicht va lo más tarde posible
Piensa en **nicht** como alguien que siempre llega tarde a la fiesta: se coloca **lo más al final posible**, pero tiene que entrar **antes** de las cosas que «cierran» la frase (un adjetivo, un lugar, un infinitivo o un prefijo).
:::

:::es La doble negación española
En español decimos «**No** veo **nada**», «**No** viene **nadie**», «**No** voy **nunca**». En alemán **solo se niega una vez**:
- [[Ich sehe nichts.]] (No veo nada.) Nunca ~~Ich sehe nicht nichts~~.
- [[Niemand kommt.]] (No viene nadie.)
- [[Ich gehe nie ins Fitnessstudio.]] (No voy nunca al gimnasio.)
:::

## Paso 3: nichts, nie, niemand
| Alemán | Español | Ejemplo |
|---|---|---|
| [[nichts]] | nada | [[Ich verstehe nichts.]] |
| [[nie]] / [[niemals]] | nunca | [[Er ist nie pünktlich.]] |
| [[niemand]] | nadie | [[Niemand ist zu Hause.]] |
| [[noch nicht]] | todavía no | [[Ich bin noch nicht fertig.]] |
| [[nicht mehr]] | ya no | [[Ich rauche nicht mehr.]] |
| [[kein … mehr]] | ya no… más | [[Ich habe kein Geld mehr.]] |

## Paso 4: Responder «yo también» y «yo tampoco»
- [[Ich auch.]] = yo también.
- [[Ich auch nicht.]] = yo tampoco.
- [[Ich nicht.]] = yo no.

:::ejemplos
Ich trinke keinen Alkohol. = No bebo alcohol.
Das ist nicht teuer. = No es caro.
Wir fahren nicht nach Spanien, sondern nach Portugal. = No vamos a España, sino a Portugal.
Ich habe keine Geschwister. = No tengo hermanos.
Heute regnet es nicht. = Hoy no llueve.
Ich kann am Montag nicht kommen. = El lunes no puedo venir.
Das weiß ich nicht. = Eso no lo sé.
:::

:::ojo Errores típicos
- ~~Ich nicht verstehe.~~ → [[Ich verstehe nicht.]] o [[Ich verstehe das nicht.]]
- ~~Ich habe nicht ein Auto.~~ → [[Ich habe kein Auto.]]
- ~~Ich habe nicht Zeit.~~ → [[Ich habe keine Zeit.]]
- ~~Ich sehe nicht nichts.~~ → [[Ich sehe nichts.]]
:::

:::vocab Palabras de esta lección
nicht = no
kein, keine = ningún, ninguna
nichts = nada
nie = nunca
niemand = nadie
noch nicht = todavía no
nicht mehr = ya no
sondern = sino
verstehen | er versteht = entender
kennen = conocer
rauchen = fumar
das Geld = el dinero
pünktlich = puntual
fertig = terminado, listo
:::

:::quiz
mc: ¿Cómo niegas «Ich habe Geschwister»? || Ich habe keine Geschwister. || Ich habe nicht Geschwister. || Ich nicht habe Geschwister. ## Sustantivo sin artículo → kein.
order: (No te entiendo.) ich verstehe dich nicht ## Si niegas toda la frase, nicht va al final.
:::

:::resumen
- **kein**: niega sustantivos con **ein** o **sin artículo**. **nicht**: todo lo demás.
- **nicht** va al final… o **delante** de adjetivos, lugares, infinitivos y prefijos.
- Solo **una** negación: [[Ich sehe nichts.]] [[Niemand kommt.]]
- [[Ich auch.]] = yo también · [[Ich auch nicht.]] = yo tampoco.
:::
`,

LES({t: 'Verbos separables', de: 'Trennbare Verben', min: 20,
goal: 'Entenderás los **verbos que se parten en dos** (aufstehen → Ich stehe um 7 Uhr **auf**). Son muy comunes en la vida diaria: levantarse, hacer la compra, llamar por teléfono, ver la tele…',
body: `
:::cuento
Imagina una **pinza de la ropa**. Un verbo separable como [[aufstehen]] (levantarse) tiene dos partes: la parte principal [[stehen]] y un prefijo [[auf]]. Cuando lo usas en una frase, **la pinza se abre**: el verbo va a la **posición 2** y el prefijo se va **al final** de la frase. En medio, como la ropa en la pinza, va todo lo demás.

[[Ich ==stehe== jeden Tag um sieben Uhr ==auf==.]]
:::

## Paso 1: Cómo funcionan
| Infinitivo | Frase | Español |
|---|---|---|
| [[aufstehen]] | [[Ich ==stehe== um 7 Uhr ==auf==.]] | Me levanto a las 7. |
| [[einkaufen]] | [[Wir ==kaufen== heute ==ein==.]] | Hoy hacemos la compra. |
| [[anrufen]] | [[Ich ==rufe== dich morgen ==an==.]] | Te llamo mañana. |
| [[fernsehen]] | [[Er ==sieht== am Abend ==fern==.]] | Él ve la tele por la noche. |
| [[mitkommen]] | [[==Kommst== du ==mit==?]] | ¿Vienes conmigo? |

Los alemanes llaman a esta estructura **Satzklammer**: «el paréntesis de la frase». El verbo abre el paréntesis y el prefijo lo cierra.

## Paso 2: ¿Cómo sé si un verbo es separable?
Por el **prefijo**. Estos son los separables más comunes. Fíjate que muchos son preposiciones:
[[ab]], [[an]], [[auf]], [[aus]], [[ein]], [[mit]], [[nach]], [[vor]], [[weg]], [[zu]], [[zurück]], [[fern]], [[los]].

Y estos **nunca** se separan: **be-, ver-, ent-, er-, ge-, zer-, emp-, miss-**. Por ejemplo: [[bezahlen]] (pagar) → [[Ich bezahle.]]; [[verstehen]] (entender) → [[Ich verstehe.]]; [[besuchen]] (visitar) → [[Ich besuche meine Oma.]]

:::truco Escucha dónde va la fuerza
En los verbos separables, el acento cae **en el prefijo**: **AUF**stehen, **EIN**kaufen, **AN**rufen. En los inseparables, el acento va en el verbo: be**ZAH**len, ver**STE**hen. ¡Tu oído te puede avisar!
:::

## Paso 3: El prefijo cambia el significado
Muchas veces el prefijo cambia totalmente el sentido del verbo. Apréndelos como verbos distintos:

| Verbo | Significa | Con prefijo | Significa |
|---|---|---|---|
| [[kommen]] | venir | [[ankommen]] | llegar |
| [[kommen]] | venir | [[mitkommen]] | venir con alguien |
| [[stehen]] | estar de pie | [[aufstehen]] | levantarse |
| [[hören]] | oír | [[aufhören]] | dejar de, terminar |
| [[machen]] | hacer | [[aufmachen]] / [[zumachen]] | abrir / cerrar |
| [[fangen]] | atrapar | [[anfangen]] | empezar |

## Paso 4: Con los verbos modales, todo junto al final
Cuando hay un verbo modal (puedo, tengo que…), el separable **no se separa**: va entero al final, en infinitivo.
- [[Ich ==muss== morgen früh ==aufstehen==.]] (Mañana tengo que levantarme temprano.)
- [[==Kannst== du mich ==anrufen==?]] (¿Me puedes llamar?)

:::ejemplos
Der Zug kommt um 15 Uhr an. = El tren llega a las 15 h.
Der Film fängt um 20 Uhr an. = La película empieza a las 20 h.
Ich lade dich zum Essen ein. = Te invito a comer.
Wann hörst du mit der Arbeit auf? = ¿Cuándo terminas de trabajar?
Mach bitte das Fenster zu! = ¡Cierra la ventana, por favor!
Ich hole die Kinder um vier Uhr ab. = Recojo a los niños a las cuatro.
Steigen Sie in Hannover um! = ¡Haga transbordo en Hannover!
:::

:::ojo Errores típicos
- Olvidar el prefijo al final: ~~Ich stehe um 7 Uhr.~~ significa «Estoy de pie a las 7». Correcto: [[Ich stehe um 7 Uhr auf.]]
- Dejar el verbo unido: ~~Ich aufstehe um 7 Uhr.~~ → [[Ich stehe um 7 Uhr auf.]]
- Separar un inseparable: ~~Ich zahle be.~~ → [[Ich bezahle.]]
:::

:::vocab Verbos separables muy útiles
aufstehen | er steht auf = levantarse
einkaufen | er kauft ein = hacer la compra
anrufen | er ruft an = llamar por teléfono
fernsehen | er sieht fern = ver la tele
mitkommen | er kommt mit = venir (con alguien)
ankommen | er kommt an = llegar
abfahren | er fährt ab = salir (un tren, un bus)
anfangen | er fängt an = empezar
aufhören | er hört auf = terminar, dejar de
aufmachen | er macht auf = abrir
zumachen | er macht zu = cerrar
einladen | er lädt ein = invitar
abholen | er holt ab = recoger (a alguien)
aufräumen | er räumt auf = ordenar, recoger
umsteigen | er steigt um = hacer transbordo
zurückkommen | er kommt zurück = volver
:::

:::quiz
order: (Hago la compra el sábado.) ich kaufe am Samstag ein || am Samstag kaufe ich ein ## El prefijo «ein» va al final.
gap: Ich ___ dich heute Abend ___. (anrufen) || rufe + an ## rufe en posición 2, an al final.
:::

:::resumen
- Verbos separables: verbo en **posición 2**, prefijo **al final** (la «pinza»).
- Prefijos separables: ab, an, auf, aus, ein, mit, nach, vor, weg, zu, zurück, fern, los. El acento va en el prefijo.
- **be-, ver-, ent-, er-, ge-, zer-, emp-, miss-** nunca se separan.
- Con un modal, el verbo va **entero al final**: [[Ich muss früh aufstehen.]]
:::
`,
